<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أقنعني! | المزاد</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800;900&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5FAFF; --bg-2:#EEF6FB; --panel:#FFFFFF; --panel-2:#FFFFFF; --line:#C9DDEE; --line-soft:#DCEAF5;
  --text:#0F2233; --muted:#5B7186; --blue:#2F80ED; --cyan:#1E6FD9; --gold:#13924A; --gold-ink:#FFFFFF; --ink:#FFFFFF;
  --ok:#17935A; --bad:#D32F2F; --warn:#D97706;
  --grad:linear-gradient(135deg,#22C55E 0%,#14A44D 40%,#1E6FD9 100%);
  --r:16px;
  --font-d:'Alexandria','Readex Pro',Tahoma,sans-serif;
  --font-b:'Readex Pro','Alexandria','Segoe UI',Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  background-color:var(--bg);
  background-image:radial-gradient(900px 420px at 50% -8%,rgba(34,197,94,.16),transparent 70%);
  color:var(--text); font-family:var(--font-b); font-size:16px; line-height:1.65; direction:rtl;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px; min-height:100%;
}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--font-d);font-weight:700;text-wrap:balance;line-height:1.3}
.wrap{max-width:880px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 4px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--font-d);font-size:1.35rem;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:.85rem;letter-spacing:.08em}
.top-r{display:flex;align-items:center;gap:10px}
.saved{color:var(--muted);font-size:.8rem;white-space:nowrap}
@media(max-width:480px){.brand span,.saved{display:none}}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;
  border:1px solid var(--line);border-radius:14px;background:var(--panel-2);color:var(--text);
  font-weight:600;font-size:1rem;cursor:pointer;text-align:center;transition:transform .08s,border-color .15s,background .15s;
}
.btn:hover{border-color:var(--cyan)}
.btn:active{transform:scale(.985)}
.btn:focus-visible,.chipbtn:focus-visible,.perk:focus-visible,.vopt:focus-visible,.seg button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(30,111,217,.28)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.xl{min-height:62px;font-size:1.12rem;width:100%}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.9rem;border-radius:12px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}
.btn-row>.btn{flex:1 1 200px}

/* surfaces */
.card{background:var(--panel);box-shadow:0 10px 30px rgba(20,80,140,.07);border:1px solid var(--line-soft);border-radius:var(--r);padding:20px;min-width:0}
.card h2{font-size:1.35rem;margin-bottom:6px}
.card h3{font-size:1.1rem}
.sect-title{font-family:var(--font-d);font-size:1.05rem;color:var(--cyan);margin-bottom:10px}
.alert{border:1px solid var(--bad);background:rgba(211,47,47,.1);color:#9E1219;border-radius:12px;padding:12px 16px}
.note{border:1px solid var(--line);background:var(--bg-2);border-radius:12px;padding:12px 16px;color:var(--muted);font-size:.93rem}
.note b{color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);font-size:.82rem;font-weight:600;white-space:nowrap}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.chip.live{border-color:var(--cyan);color:var(--cyan)}
.chip.ok{border-color:var(--ok);color:var(--ok)}

/* stepper */
.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.steps li{padding:2px 12px;border-radius:99px;border:1px solid var(--line-soft);color:var(--muted);font-size:.82rem}
.steps li.on{border-color:var(--cyan);color:var(--cyan);background:rgba(30,111,217,.08)}
.steps li.done{color:var(--text)}

/* home */
.hero{padding:34px 22px 26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.hero h1{font-size:clamp(2.6rem,9vw,4rem);font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .en{font-family:var(--font-d);letter-spacing:.32em;color:var(--cyan);font-size:.95rem}
.hero p.lead{max-width:34rem;color:var(--muted);font-size:1.08rem}
.hero .btn-row{width:100%;max-width:520px;margin-top:6px}
.howto{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:12px}
.howto li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.howto li::before{counter-increment:s;content:counter(s);width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:700}

/* players */
.prow{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;padding:12px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}
.prow .fields{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.prow input{flex:1 1 150px;min-width:0}
.field{background:var(--bg);border:1px solid var(--line);border-radius:12px;min-height:50px;padding:8px 14px;width:100%}
textarea.field{min-height:92px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 16px;min-height:46px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--blue);color:#fff}
.seg-wide{display:flex;flex-wrap:wrap;gap:10px}
.seg-wide button{flex:1 1 90px;min-height:50px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);cursor:pointer;font-weight:600}
.seg-wide button.on{border-color:var(--cyan);color:var(--ink);background:var(--cyan)}
.x{width:46px;height:46px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;font-size:1.3rem;line-height:1}
.x:hover{border-color:var(--bad);color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.opt-card{border:1px solid var(--line);border-radius:14px;background:var(--bg-2);padding:14px 16px;cursor:pointer;text-align:start;min-height:70px}
.opt-card.on{border-color:var(--cyan);background:rgba(30,111,217,.1)}
.opt-card b{display:block}
.labelled{display:flex;flex-direction:column;gap:8px}
.labelled>label,.lbl{font-weight:600;color:var(--text)}

/* pass-the-device */
.pass{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 20px}
.pass h2{font-size:2rem;margin:0}
.pass .kick{color:var(--cyan);font-weight:600}
.pass .btn{max-width:420px}

/* perk picking */
.perk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.perk-pick{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:start;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);padding:14px 16px;cursor:pointer;min-height:92px}
.perk-pick b{font-family:var(--font-d);font-size:1.05rem}
.perk-pick span.d{grid-column:1/-1;color:var(--muted);font-size:.9rem}
.perk-pick.on{border-color:var(--gold);background:rgba(20,164,77,.09)}
.perk-pick.off{opacity:.5}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.on .tick{border-color:var(--gold);background:var(--gold);color:var(--gold-ink)}

/* answers */
.qa{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}
.qa .qt{font-weight:600}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.qlist li{padding:12px 16px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg-2)}

/* case */
.casehead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.qcard{text-align:center;padding:24px 18px}
.qcard .qlabel{color:var(--gold);font-weight:600;font-size:.9rem;letter-spacing:.04em}
.qcard h2{font-size:clamp(1.4rem,4.6vw,2rem);margin-top:6px}
.parties{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.parties{grid-template-columns:1fr 1fr}}
.party{border:1px solid var(--line-soft);background:var(--panel);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.party.speaking{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.ptop{display:flex;gap:8px;flex-wrap:wrap}
.pid{display:flex;align-items:center;gap:12px;min-width:0}
.pid h3{overflow-wrap:anywhere}
.defend{border-radius:12px;background:var(--bg-2);padding:10px 14px;border:1px dashed var(--line)}
.defend strong{display:block;font-size:1.15rem;color:var(--gold);overflow-wrap:anywhere}
.helper{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--muted)}
.perks{display:flex;flex-wrap:wrap;gap:8px}
.perk{min-height:44px;padding:6px 14px;border-radius:12px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-weight:600;font-size:.92rem;cursor:pointer}
.perk.na{border-color:var(--line);color:var(--muted)}
.perk.used{border-color:var(--line-soft);color:var(--muted);text-decoration:line-through;cursor:not-allowed}
.perk.set{background:var(--gold);color:var(--gold-ink)}
.witness{border:1px solid var(--blue);border-radius:14px;background:rgba(47,128,237,.1);padding:14px 16px}
.witness b{color:var(--cyan)}
.timerbox{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media(max-width:520px){.timerbox{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .bg{stroke:var(--line-soft)}
.ring .fg{stroke:var(--cyan);transition:stroke-dashoffset .25s linear}
.ring.low .fg{stroke:var(--bad)}
.ring.ended .fg{stroke:var(--bad)}
.clock{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-size:2.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.tcontrols{display:flex;flex-direction:column;gap:10px;min-width:0;width:100%}
.timeup{border:1px solid var(--bad);color:#9E1219;background:rgba(211,47,47,.12);border-radius:12px;padding:10px 14px;font-weight:700;text-align:center}
.notes{display:grid;gap:6px;font-size:.92rem;color:var(--muted)}

/* voting */
.vkind{display:flex;flex-direction:column;gap:6px;border-radius:14px;padding:14px 16px;border:1px solid var(--cyan);background:rgba(30,111,217,.08)}
.vkind.appeal{border-color:var(--gold);background:rgba(20,164,77,.09)}
.vkind b{font-family:var(--font-d);font-size:1.15rem}
.vopts{display:grid;gap:14px}
.vopt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;min-height:78px;padding:12px 16px;border:2px solid var(--line);border-radius:16px;background:var(--bg-2);cursor:pointer;text-align:start}
.vopt.on{border-color:var(--cyan);background:rgba(30,111,217,.12)}
.vopt .vt{display:flex;flex-direction:column;min-width:0}
.vopt .vt b{font-size:1.1rem;overflow-wrap:anywhere}
.vopt .vt span{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.vopt.none{grid-template-columns:1fr auto;border-style:dashed}
.radio{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.on .radio{border-color:var(--cyan);background:var(--cyan);color:var(--ink)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:130px 1fr 36px;align-items:center;gap:10px}
@media(max-width:520px){.bar{grid-template-columns:90px 1fr 30px}}
.bar .track{height:16px;border-radius:99px;background:var(--bg);border:1px solid var(--line-soft);overflow:hidden}
.bar .fill{height:100%;background:var(--blue);border-radius:99px}
.bar.lead .fill{background:var(--gold)}
.bar .nm{overflow-wrap:anywhere;font-weight:600}
.verdict{text-align:center;padding:22px 16px;border:1px solid var(--gold);background:rgba(20,164,77,.08);border-radius:var(--r)}
.verdict h2{color:var(--gold);font-size:1.6rem}
.jrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg-2)}

/* scoreboard */
.rank{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank li{display:grid;grid-template-columns:40px auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}
.rank li.win{border-color:var(--gold);background:rgba(20,164,77,.1)}
.rank .pos{font-family:var(--font-d);font-size:1.3rem;color:var(--muted);text-align:center}
.rank .win .pos{color:var(--gold)}
.rank .pts{font-family:var(--font-d);font-size:1.4rem;color:var(--gold);font-variant-numeric:tabular-nums}
.winner{text-align:center;padding:26px 16px;border:1px solid var(--gold);border-radius:var(--r);background:rgba(20,164,77,.09);display:flex;flex-direction:column;align-items:center;gap:8px}
.winner h2{font-size:clamp(1.8rem,6vw,2.6rem);color:var(--gold)}
.cases{display:grid;gap:12px}
.cr{border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2);padding:14px 16px;display:grid;gap:6px}
.cr .q{font-weight:700}
.cr .v{display:flex;flex-wrap:wrap;gap:8px}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(15,34,51,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0;overflow:auto}
@media(min-width:640px){.ov{align-items:center;padding:20px}}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px;direction:rtl}
@media(min-width:640px){.dlg{border-radius:20px}}
.dlg h2{font-size:1.4rem}
.cands{display:grid;gap:10px}
.cand{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);cursor:pointer;text-align:start;width:100%}
.cand:hover{border-color:var(--cyan)}
#toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50;padding-inline:16px}
#toast span{background:#0F2233;color:#fff!important;border:1px solid var(--cyan);color:var(--text);padding:12px 18px;border-radius:14px;max-width:520px;box-shadow:0 8px 30px rgba(15,34,51,.25);opacity:0;transform:translateY(8px);transition:.2s}
#toast.show span{opacity:1;transform:none}
/* splash */
.splash{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:40px 8px;position:relative}
.splash .blob{position:fixed;inset:auto;width:520px;height:520px;border-radius:50%;filter:blur(70px);opacity:.32;z-index:-1;pointer-events:none}
.splash .b1{background:#22C55E;top:-180px;inset-inline-start:-160px}
.splash .b2{background:#1E6FD9;bottom:-200px;inset-inline-end:-180px}
.splash .lg{animation:up .7s ease both;margin-bottom:8px}
.splash .big{font-family:var(--font-d);font-weight:900;font-size:clamp(4rem,19vw,8rem);line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-inline:.1em;animation:up .7s .1s ease both}
.splash .ar{font-family:var(--font-d);font-weight:700;font-size:clamp(1.6rem,6vw,2.2rem);color:var(--text);margin-top:6px;animation:up .7s .25s ease both}
.splash .en{font-family:var(--font-d);font-weight:600;letter-spacing:.42em;color:var(--cyan);font-size:.95rem;padding-inline-start:.42em;animation:up .7s .35s ease both}
.splash .go{margin-top:34px;width:100%;max-width:320px;min-height:64px;font-size:1.3rem;font-weight:800;border-radius:99px;animation:up .7s .5s ease both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* online rooms */
.bigcode{font-family:var(--font-d);font-weight:900;font-size:clamp(2.6rem,13vw,3.6rem);letter-spacing:.18em;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-inline-start:.18em}
.roomcard{text-align:center;display:grid;gap:8px;justify-items:center}
.linkrow{display:flex;gap:8px;width:100%;flex-wrap:wrap}
.linkrow .field{flex:1 1 220px;font-size:.85rem;min-height:46px;text-align:left}
.linkrow .btn{flex:0 0 auto;min-height:46px}
.code-in{font-family:var(--font-d);font-size:1.4rem;letter-spacing:.3em;text-align:center;text-transform:uppercase}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 4px;border-radius:99px;border:1px solid var(--line-soft);background:var(--bg-2);color:var(--muted);font-size:.9rem}
.pchip.ok{border-color:var(--ok);color:var(--ok);background:rgba(23,147,90,.07)}
.party.mine{box-shadow:0 0 0 2px var(--gold) inset}
.card.action{border:2px solid var(--cyan);background:#F2F8FF}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line-soft);border-top-color:var(--cyan);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
input.field{font-size:16px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}



.hero .sub{font-family:var(--font-d);font-weight:700;font-size:1.5rem;color:var(--gold);margin-top:-6px}
.wallet{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wallet div{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(20,80,140,.06)}
.wallet span{font-size:.78rem;color:var(--muted)}
.wallet b{font-family:var(--font-d);font-size:1.05rem;color:var(--cyan)}
.wallet div:last-child b{color:var(--gold)}
.parties .price{font-family:var(--font-d);font-size:1.5rem;font-weight:800;color:var(--gold)}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper .btn{width:64px;min-height:64px;font-size:1.8rem;padding:0;border-radius:50%}
.bigprice{font-family:var(--font-d);font-weight:900;font-size:4rem;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;min-width:120px}
.bigprice small{font-size:1rem;margin-inline-start:6px;-webkit-text-fill-color:var(--muted)}
.tbl{display:grid;gap:6px}
.tr{display:grid;grid-template-columns:18px minmax(0,1fr) 36px 42px 38px 46px;gap:4px;align-items:center;padding:8px 10px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg-2);font-size:.92rem}
.tr.th{background:transparent;border-color:transparent;color:var(--muted);font-size:.78rem;padding-block:0}
.tr span{text-align:center}
.tr .nm{display:flex;align-items:center;gap:6px;text-align:start;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.tr .tot{font-family:var(--font-d);font-weight:800;color:var(--gold)}
.tr.win{border-color:var(--gold);background:rgba(20,164,77,.08)}
.tr.me{box-shadow:0 0 0 2px var(--cyan) inset}
.award{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.award b{font-family:var(--font-d);font-size:1.3rem;color:var(--cyan)}
.qcard h2{color:var(--cyan)}

.perk-pick{grid-template-columns:1fr}
.perk-pick span{color:var(--muted);font-size:.9rem;line-height:1.5}
.perk-pick em{font-style:normal;font-size:.78rem;color:var(--cyan);font-weight:600}
.perk-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:56px;padding:8px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);cursor:pointer;text-align:start;font:inherit}
.perk-btn b{font-family:var(--font-d);font-size:.98rem;color:var(--text)}
.perk-btn span{font-size:.8rem}
.perk-btn.ready{border-color:var(--gold);background:rgba(20,164,77,.09);color:var(--gold)}
.perk-btn.ready b{color:var(--gold)}
.perk-btn.used{opacity:.55;text-decoration:line-through}
.perk-btn[aria-disabled=true]{cursor:not-allowed}
.perk-btn:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.perklog{display:grid;gap:6px;border:1px solid var(--cyan);background:rgba(30,111,217,.07);border-radius:14px;padding:10px 14px;font-size:.92rem;font-weight:600;color:var(--text)}
.chip.bad{border-color:var(--bad);color:var(--bad);background:rgba(211,47,47,.08)}

/* ===== unified أقنعني theme: white, simple, one game colour ===== */
:root{--bg:#FFFFFF;--bg-2:#F5F7FA;--panel:#FFFFFF;--panel-2:#FFFFFF;--line:#E1E6EE;--line-soft:#ECEFF4;--text:#12203A;--muted:#5E6B80;--bad:#DE0921}
html,body{background:#FFFFFF!important;background-image:none!important}
.splash .blob{display:none!important}
.fulllogo{width:min(72vw,300px);height:auto;display:block;margin-inline:auto}
.hero .fulllogo{width:min(60vw,230px)}
.splash .lg{margin-bottom:4px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.splash .ar{font-size:clamp(2rem,9vw,2.8rem)!important;font-weight:800!important;color:var(--p)!important}
.hero h1{background:none!important;color:var(--text)!important;-webkit-text-fill-color:currentColor}
.hero .sub{color:var(--p-text)!important}
.btn.primary{background:var(--p)!important;color:var(--p-ink)!important;border-color:var(--p)!important;box-shadow:0 6px 16px rgba(18,32,58,.12)!important}
.card{box-shadow:0 2px 10px rgba(18,32,58,.05)}
.top .brand b{color:var(--text)}
.top .brand span{background:var(--p);color:var(--p-ink);padding:0 10px;border-radius:8px;font-weight:700}
.ring .fg{stroke:var(--p)}
.ring.low .fg{stroke:#DE0921}
@media(max-width:480px){.top .brand span{display:inline-block!important}}
.top .brand span{letter-spacing:0;font-size:.85rem}
:root{--p:#0554A4;--p-ink:#FFFFFF;--p-text:#0554A4;--cyan:#0554A4;--blue:#0554A4;--gold:#0554A4;--grad:linear-gradient(#0554A4,#0554A4)}
.top:has(.top-r .chip) .brand span{display:none!important}
.intro .fulllogo{width:min(36vw,140px)!important}
.intro .ar{margin-top:2px}
.introtx{max-width:34ch;color:var(--muted);font-size:1rem;line-height:1.9;margin:6px auto 0}
.intro .go{margin-top:22px}
.notice{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 4px;background:#fff}
.notice .nbox{background:#fff;border:3px solid #DE0921;border-radius:22px;padding:24px 20px;max-width:520px;display:grid;gap:12px;color:#111}
.notice h2{color:#111;font-size:1.35rem;text-align:center}
.notice p{color:#111;line-height:1.85;font-size:1rem}
.notice .nbtn{margin-top:8px;background:#DE0921;color:#fff;border:0;border-radius:99px;min-height:58px;font:800 1.15rem var(--font-d);cursor:pointer}
.stepper2{display:flex;align-items:center;justify-content:center;gap:16px}
.stepper2 b{font-family:var(--font-d);font-size:1.8rem;min-width:2.5ch;text-align:center}
.stepper2 .btn{width:58px;min-height:52px;font-size:1.6rem;font-weight:800;padding:0}

  function startGame() {
    G.gameNo = (G.gameNo || 0) + 1;
    G.econ = {}; G.sold = {};
    G.players.forEach(p => { G.econ[p.id] = { w: G.settings.start, p: 0, items: [] }; G.sold[p.id] = 0; });
    G.total = Math.ceil(G.players.length * Math.max(1, G.settings.rounds) / 2);
    G.roundNo = 0; G.pool = []; G.used = []; G.history = []; G.cur = null; G.lastPair = '';
    G.itemsRound = 1; G.needMore = false; G.phase = 'perks'; G.prog = []; G.perks = {}; G.pused = {};
  }
  function lockPerks() {
    G.players.forEach(p => {
      const x = inp(p.id).perks;
      G.perks[p.id] = x && x.g === G.gameNo && x.done ? (x.list || []).filter(id => PERKS.some(k => k.id === id)).slice(0, 3) : [];
      G.pused[p.id] = [];
    });
    if (G.settings.src === 'ready') { addReady(); G.prog = []; startRound(); return; }
    G.phase = 'items'; G.prog = [];
  }
  function collectItems() {
    const seen = new Set(G.pool.map(x => norm(x.t)));
    G.players.forEach(p => {
      const x = inp(p.id).items;
      if (!x || x.g !== G.gameNo || x.r !== G.itemsRound) return;
      (x.list || []).forEach(t => {
        t = String(t || '').trim().slice(0, 40);
        if (!t || seen.has(norm(t))) return;
        seen.add(norm(t));
        G.pool.push({ id: uid('i'), t, by: p.id });
      });
    });
  }
  function pickSellers() {
    const ids = shuffle(G.players.map(p => p.id)).sort((x, y) => (G.sold[x] || 0) - (G.sold[y] || 0));
    const a = ids[0];
    let rest = ids.slice(1);
    const pk = (x, y) => [x, y].sort().join('|');
    const alt = rest.filter(id => pk(a, id) !== G.lastPair && (G.sold[id] || 0) === (G.sold[rest[0]] || 0));
    const b = alt.length ? alt[0] : rest[0];
    G.lastPair = pk(a, b);
    G.sold[a] = (G.sold[a] || 0) + 1; G.sold[b] = (G.sold[b] || 0) + 1;
    return [a, b];
  }
  function startRound() {
    if (G.roundNo >= G.total) { G.phase = 'final'; G.cur = null; G.prog = []; return; }
    const avail = G.pool.filter(x => !G.used.includes(x.id));
    if (!avail.length && G.settings.src === 'ready') { G.used = []; G.pool = []; addReady(); return startRound(); }
    if (!avail.length) { G.phase = 'items'; G.itemsRound++; G.needMore = true; G.prog = []; G.cur = null; return; }
    const [a, b] = pickSellers();
    const cands = shuffle(avail).slice(0, 6).map(x => x.id);
    G.phase = 'round'; G.prog = [];
    G.cur = { key: uid('r'), no: G.roundNo + 1, a, b, cands, item: null, votes: null, stage: 'vote', endsAt: Date.now() + SEC('voteSec') * 1000, dur: SEC('voteSec'), prices: null, auto: {}, first: 'a', speaker: null, buys: null, pv: { a: 0, b: 0 }, help: {}, log: [], cancel: {}, sales: { a: [], b: [] }, paid: {} };

  function chooseItem(t) {
    const c = G.cur;
    const max = Math.max(0, ...c.cands.map(id => t[id] || 0));
    const top = c.cands.filter(id => (t[id] || 0) === max);
    c.item = top[Math.floor(Math.random() * top.length)];
    c.votes = t; c.tie = top.length > 1 && max > 0;

  function setStage(s, sec) { const c = G.cur; c.stage = s; c.dur = sec || 0; c.endsAt = sec ? Date.now() + sec * 1000 : 0; G.prog = []; }

  /* advances the current round when everyone is in, the clock ran out, or force */
  function roundStep(force) {
    if (G.phase !== 'round' || !G.cur) return false;
    const c = G.cur;
    const timeUp = c.endsAt && Date.now() >= c.endsAt;
    const go = force || timeUp;
    if (c.stage === 'vote') {
      const done = G.players.map(p => p.id).filter(id => { const x = inp(id).vote; return x && x.key === c.key; });
      if (!go && done.length < G.players.length) return false;
      const t = {};
      done.forEach(id => { const v = inp(id).vote.v; if (c.cands.includes(v)) t[v] = (t[v] || 0) + 1; });
      chooseItem(t);
      return true;
    }
    if (c.stage === 'price') {
      const pa = priceIn('a'), pb = priceIn('b');
      if (!go && (pa == null || pb == null)) return false;
      c.prices = { a: pa == null ? G.settings.val : pa, b: pb == null ? G.settings.val : pb };
      c.auto = { a: pa == null, b: pb == null };
      c.first = Math.random() < .5 ? 'a' : 'b';
      setStage('reveal', G.settings.think);
      return true;
    }
    if (!go) {
      if (c.stage === 'buy') {
        const bs = buyers();
        if (bs.every(id => { const x = inp(id).buy; return x && x.key === c.key; })) { settle(); return true; }
      }
      return false;
    }
    if (c.stage === 'reveal') { setStage('pitch1', G.settings.pitch); c.speaker = c.first; return true; }
    if (c.stage === 'pitch1') { setStage('pitch2', G.settings.pitch); c.speaker = other(c.first); return true; }
    if (c.stage === 'pitch2') { setStage('buy', SEC('buySec')); c.speaker = null; return true; }
    if (c.stage === 'buy') { settle(); return true; }
    return false;
  }
  function settle() {
    const c = G.cur, name = itemText(c.item);
    c.buys = {}; const n = { a: 0, b: 0 };
    buyers().forEach(id => {
      const x = inp(id).buy, e = G.econ[id];
      let v = x && x.key === c.key ? x.v : '-';
      if ((v === 'a' || v === 'b') && e && c.prices[v] <= e.w) {

    G.roundNo++;
    setStage('result', 0);
  }

      '<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px"><h2 style="margin:0">اللاعبون</h2><span class="chip num">' + n + ' من 25</span></div><div style="display:grid;gap:10px">' + rows + '</div>' +
      '<p class="muted small" style="margin-top:10px">دخل ' + real + ' من ' + tgt + ' لاعبين' + (s.hostPlays === 0 ? ' (غير المضيف)' : '') + '. ' + (real > tgt ? 'العدد أكثر من المحدد. زد عدد اللاعبين أو أزل لاعب.' : real < tgt ? 'بانتظار ' + (tgt - real) + ' لاعبين.' : 'العدد كامل.') + '</p></section>' + settings + errBox() +

  }

  const perN = () => Math.min(10, Math.max(1, Math.ceil((+(G && G.settings.products) || 6) / Math.max(1, G ? G.players.length : 3))));
  const IDX3 = () => Array.from({ length: perN() }, (_, i) => i);
  function itemsView() {

  function perksView() {
    const x = inp(ME_ID).perks, done = x && x.g === G.gameNo && x.done;

    else {

      body = '<section class="card action"><h2>اختر مزاياك سرًّا</h2><p class="muted" style="margin-bottom:12px">٣ مزايا من ٧ · <b class="num" style="color:var(--gold)">' + U.perks.length + '</b> من ٣ · كل ميزة تستخدمها مرة وحدة باللعبة، ولما تكون بائع بس.</p>' +

  function perkPanel() {

  function clockBox(label, nxt) {

  }
  const remain = () => (G && G.cur && G.cur.endsAt ? Math.max(0, (G.cur.endsAt - nowH()) / 1000) : 0);
  function sellersBox(showPrice) {

  function roundView() {

    const pp = perkPanel();
    if (c.stage === 'vote') {
      const v = inp(ME_ID).vote, voted = v && v.key === c.key;
      if (U.pickKey !== c.key) { U.pickKey = c.key; U.pick = null; }
      let body;
      if (!inRoom(ME_ID)) body = '<section class="card"><h3 style="margin-bottom:8px">الأغراض المرشحة</h3><p class="muted">' + c.cands.map(id => esc(itemText(id))).join(' · ') + '</p></section>';
      else if (!voted) {
        body = '<section class="card action" style="display:grid;gap:14px"><h2 style="margin:0">صوّت: شنو نبيع؟</h2><p class="muted">اختار الغرض اللي تبي البائعين يحاولون يبيعونه.</p><div class="vopts">' +
          c.cands.map(id => '<button class="vopt none ' + (U.pick === id ? 'on' : '') + '" data-act="pick" data-v="' + id + '"><span class="vt"><b>' + esc(itemText(id)) + '</b></span><span class="radio">' + (U.pick === id ? '✓' : '') + '</span></button>').join('') +
          '</div><button class="btn xl primary" data-act="sendVote">تأكيد صوتي</button></section>';
      } else body = '<section class="card pass"><h2>وصل صوتك ✓</h2><p class="muted">بانتظار الباقين.</p></section>';
      return head + '<section class="card"><h3 style="margin-bottom:10px">البائعين بهالجولة</h3>' + sellersBox(false) + '</section>' + body + clockBox('وقت التصويت', 'الذهاب للتسعير') + progBox('مين صوّت');
    }
    if (c.stage === 'price') {

        const pk = c.key + mySide + c.pv[mySide];

        body = '<section class="card action" style="display:grid;gap:14px;text-align:center"><h2 style="margin:0">حط سعرك سرًّا</h2><p class="muted">خصمك ما يشوف سعرك لين ينكشف للكل. رخيص يبيع أكثر، وغالي يربح أكثر بكل بيعة.</p>' +
          '<div class="stepper"><button class="btn" data-act="pm" data-v="1" aria-label="زيادة">+</button><div class="bigprice num">' + U.price + '<small>د.ك</small></div><button class="btn" data-act="pm" data-v="-1" aria-label="نقص">−</button></div>' +

        pp + clockBox(c.stage === 'pitch1' ? 'العرض الأول' : 'العرض الثاني', c.stage === 'pitch1' ? 'الذهاب لدور ' + P(c[other(c.first)]).name : 'الذهاب لقرار الشراء');

      let body;

          opt('a') + opt('b') + '<button class="vopt none ' + (U.pick === 'x' ? 'on' : '') + '" data-act="pick" data-v="x"><span class="vt"><b>أرفض</b><span>ما أبي أشتري بهالجولة</span></span><span class="radio">' + (U.pick === 'x' ? '✓' : '') + '</span></button></div>' +

      } else body = '<section class="card pass"><h2>وصل قرارك ✓</h2><p class="muted">' + (b.v === 'x' ? 'رفضت الشراء.' : 'اخترت تشتري من ' + esc(P(c[b.v]).name) + '.') + '</p></section>';
      return head + itemCard() + sellersBox(true) + body + clockBox('وقت القرار', 'الذهاب للنتيجة') + progBox('مين قرر', buyers());

    if (c.stage === 'result') {

      const ref = buyers().filter(id => c.buys[id] === 'x'), abst = buyers().filter(id => c.buys[id] === '-');
      const rev = s => c.n[s] * c.prices[s];
      const win = rev('a') === rev('b') ? null : (rev('a') > rev('b') ? 'a' : 'b');
      const col = s => '<div class="party' + (win === s ? ' speaking' : '') + '"><div class="pid">' + avatar(P(c[s]), 48) + '<div><h3>' + esc(P(c[s]).name) + '</h3><span class="muted small">بـ ' + kd(c.prices[s]) + '</span></div></div>' +
        '<div class="price num">' + (c.cancel && c.cancel[s] ? 'انلغت ' + c.cancel[s] + ' بيعات' : 'باع ' + c.n[s] + ' · ربح ' + kd(rev(s))) + '</div>' +
        (c.cancel && c.cancel[s] ? '<span class="chip bad">اعتراض: انلغت البيعة</span>' : '') +
        '<div class="plist">' + (list(s).map(id => '<span class="pchip ok">' + avatar(P(id), 24) + esc(P(id).name) + '</span>').join('') || '<span class="muted small">محد اشترى منه</span>') + '</div>' +
        (win === s ? '<span class="chip gold">أشطر بائع بالجولة</span>' : '') + '</div>';
      let mine = '';
      if (mySide) mine = 'بعت ' + c.n[mySide] + ' وربحت ' + kd(rev(mySide)) + '.';
      else if (c.buys[ME_ID] === 'a' || c.buys[ME_ID] === 'b') mine = 'اشتريت ' + esc(itemText(c.item)) + ' بـ ' + kd(c.prices[c.buys[ME_ID]]) + '.';
      else if (c.buys[ME_ID] === 'x') mine = 'رفضت الشراء.';

      else if (helpFor) mine = 'كنت مسؤول مبيعات ' + esc(P(c[helpFor]).name) + '.';
      else if (inRoom(ME_ID)) mine = 'ما اخترت، انحسبت ممتنع.';
      const last = G.roundNo >= G.total;
      return head + '<section class="verdict"><h2>' + (win ? esc(P(c[win]).name) + ' ' + gv(P(c[win]), 'كسب الجولة', 'كسبت الجولة') : (c.n.a + c.n.b ? 'تعادل بالأرباح!' : 'محد اشترى شي!')) + '</h2><p>' + mine + '</p></section>' +
        itemCard() + '<div class="parties">' + col('a') + col('b') + '</div>' +
        (cx.length ? '<section class="card small muted">انلغت شروتهم ورجعت فلوسهم: ' + cx.map(id => esc(P(id).name)).join('، ') + '</section>' : '') + pp +
        (ref.length || abst.length ? '<section class="card small muted">' + (ref.length ? 'رفضوا: ' + ref.map(id => esc(P(id).name)).join('، ') : '') + (ref.length && abst.length ? ' · ' : '') + (abst.length ? 'امتنعوا: ' + abst.map(id => esc(P(id).name)).join('، ') : '') + '</section>' : '') +
        standings(false) +
        (isHost() ? '<button class="btn xl primary" data-act="nextRound">' + (last ? 'النتيجة النهائية' : 'الجولة التالية') + '</button>' : waitHost());
    }
    return head;
  }

  function standings(full) {
    const r = ranking();
    return '<section class="card"><h2 style="margin-bottom:12px">' + (full ? 'الترتيب النهائي' : 'الترتيب الحين') + '</h2><div class="tbl" role="table">' +
      '<div class="tr th" role="row"><span>#</span><span>اللاعب</span><span>أغراض</span><span>محفظة</span><span>أرباح</span><span>المجموع</span></div>' +
      r.map((p, i) => { const e = E(p.id); return '<div class="tr' + (i === 0 ? ' win' : '') + (p.id === ME_ID ? ' me' : '') + '" role="row"><span class="num">' + (i + 1) + '</span><span class="nm">' + esc(p.name) + '</span><span class="num">' + e.items.length + '</span><span class="num">' + e.w + '</span><span class="num">' + e.p + '</span><span class="num tot">' + score(p.id) + '</span></div>'; }).join('') +
      '</div><p class="muted small" style="margin-top:10px">المجموع = (الأغراض × ' + G.settings.val + ') + المحفظة + الأرباح</p></section>';
  }
  function finalView() {
    const r = ranking(), w = r[0];
    const topSeller = G.players.slice().sort((x, y) => E(y.id).p - E(x.id).p)[0];
    const topBuyer = G.players.slice().sort((x, y) => (E(y.id).items.length - E(x.id).items.length) || (E(y.id).w - E(x.id).w))[0];
    const tie = r.length > 1 && score(r[1].id) === score(w.id);
    return podiumCard(r.map(p => ({ name: esc(p.name), pts: score(p.id) }))) +
      '<div class="grid2"><section class="card award"><span class="muted small">أشطر بائع</span><b>' + esc(topSeller.name) + '</b><span class="num">أرباح ' + kd(E(topSeller.id).p) + '</span></section>' +
      '<section class="card award"><span class="muted small">أشطر مشتري</span><b>' + esc(topBuyer.name) + '</b><span class="num">' + E(topBuyer.id).items.length + ' أغراض</span></section></div>' +
      standings(true) +
      '<section class="card"><h2 style="margin-bottom:12px">الجولات</h2><div class="cases">' + G.history.map(h => '<div class="cr"><span class="q">' + h.no + '. ' + esc(h.item) + '</span><div class="v"><span class="chip">' + esc(P(h.a).name) + ': ' + kd(h.pa) + ' · باع ' + h.na + ((h.cx || '').includes('a') ? ' (انلغت)' : '') + '</span><span class="chip">' + esc(P(h.b).name) + ': ' + kd(h.pb) + ' · باع ' + h.nb + ((h.cx || '').includes('b') ? ' (انلغت)' : '') + '</span></div></div>').join('') + '</div></section>' +
      (inRoom(ME_ID) ? '<section class="card"><h3>أغراضك</h3><p class="muted">' + (E(ME_ID).items.map(esc).join('، ') || 'ما اشتريت شي') + '</p></section>' : '') +
      (isHost() ? '<div class="btn-row"><button class="btn xl primary" data-act="rematch">مزاد جديد بنفس اللاعبين</button><button class="btn xl" data-act="toLobby">رجوع للردهة</button></div>' : waitHost());
  }

  function modalView() {
    const m = U.modal;
    if (!m) return '';
    let body = '';
    if (m.type === 'menu') {
      const host = isHost(), others = G ? G.players.filter(p => p.id !== ME_ID) : [];
      body = '<h2>القائمة</h2><p class="muted">الغرفة <b dir="ltr">' + esc(U.code) + '</b>' + (G ? ' · المضيف: ' + esc(P(G.host).name) : '') + '</p>' +
        (!host && G && inRoom(ME_ID) ? '<button class="btn" data-act="askTake">المضيف ما يرد؟ استلم الاستضافة</button>' : '') +
        (host && others.length ? '<button class="btn" data-act="askHand">نقل الاستضافة للاعب آخر</button>' : '') +
        (isGuest() && G && G.phase === 'final' ? '' : '<button class="btn danger" data-act="askLeave">الخروج من الغرفة</button>') + '<button class="btn ghost" data-act="closeModal">إغلاق</button>';
    } else if (m.type === 'perk') {
      const k = PERKS.find(x => x.id === m.id), c = G.cur, st = G.cur ? perkState(ME_ID, m.id) : { ok: false };
      if (!st.ok) { U.modal = null; return ''; }
      const os = other(st.side);
      let act;
      if (m.id === 'up' || m.id === 'down') act = '<p class="muted">سعر ' + esc(P(c[os]).name) + ' الحين ' + kd(c.prices[os]) + '. كم ' + (m.id === 'up' ? 'تزيده' : 'تنقصه') + '؟</p><div class="seg-wide">' + [1, 2, 3].map(a => '<button data-act="perkGo" data-amt="' + a + '">' + (m.id === 'up' ? '+' : '−') + a + ' د.ك</button>').join('') + '</div>';
      else if (m.id === 'rep') act = '<p class="muted">اختر مين يصير مسؤول مبيعاتك:</p><div class="cands">' + buyers().map(id => '<button class="cand" data-act="perkGo" data-target="' + id + '">' + avatar(P(id), 40) + '<b>' + esc(P(id).name) + '</b></button>').join('') + '</div>';
      else act = (m.id === 'half' ? '<p class="muted">سعرك يصير ' + kd(half(c.prices[st.side] / 2)) + ' بدل ' + kd(c.prices[st.side]) + '.</p>' : '') + '<button class="btn xl primary" data-act="perkGo">استخدم الميزة</button>';
      body = '<h2>' + k.name + '</h2><p class="muted">' + k.desc + ' تنستخدم مرة وحدة باللعبة.</p>' + act + '<button class="btn ghost" data-act="closeModal">إلغاء</button>';
    } else if (m.type === 'take') {
      body = '<h2>استلام الاستضافة؟</h2><p class="muted">استخدمها فقط إذا المضيف طلع أو تلفونه فصل. بتصير أنت اللي ينقل اللعبة بين المراحل.</p><div class="btn-row"><button class="btn primary" data-act="takeHost">استلام</button><button class="btn" data-act="closeModal">إلغاء</button></div>';
    } else if (m.type === 'hand') {
      body = '<h2>اختر المضيف الجديد</h2><div class="cands">' + G.players.filter(p => p.id !== ME_ID).map(p => '<button class="cand" data-act="handTo" data-id="' + p.id + '">' + avatar(p, 40) + '<b>' + esc(p.name) + '</b></button>').join('') + '</div><button class="btn ghost" data-act="closeModal">إلغاء</button>';
    } else if (m.type === 'leave') {
      const warn = isHost() && G && G.players.length > 1 ? 'أنت المضيف. بننقل الاستضافة تلقائيًا للاعب ثاني.' : 'تقدر ترجع للغرفة بنفس الرمز.';
      body = '<h2>الخروج من الغرفة؟</h2><p class="muted">' + warn + '</p><div class="btn-row"><button class="btn danger" data-act="leave">خروج</button><button class="btn" data-act="closeModal">إلغاء</button></div>';
    }
    return '<div class="ov" data-act="ovClose"><div class="dlg" role="dialog" aria-modal="true">' + body + '</div></div>';
  }
  function hostOnlyView() {
    const note = '<section class="card pass"><h2>أنت المضيف</h2><p class="muted">ما تلعب بهذي اللعبة. تتابع اللاعبين وتنقل اللعبة بين المراحل.</p></section>';
    if (G.phase === 'perks') return note + progBox('مين اختار مزاياه') + '<button class="btn xl primary" data-act="perksNext">' + ((G.prog || []).length >= G.players.length ? (G.settings.src === 'ready' ? 'ابدأ المزاد' : 'التالي: كتابة الأغراض') : 'كمّل بدون الباقين') + '</button>';
    if (G.phase === 'items') return note + progBox('مين كتب أغراضه') + '<button class="btn xl primary" data-act="itemsNext">' + ((G.prog || []).length >= G.players.length ? 'يلا نبدأ البيع' : 'نبدأ بدون اللي ما كتب') + '</button>';
    return '';
  }
  function gameView() {
    if (!inRoom(ME_ID) && isHost() && (G.phase === 'perks' || G.phase === 'items')) return hostOnlyView();
    switch (G.phase) {
      case 'lobby': return lobbyView();
      case 'perks': return perksView();
      case 'items': return itemsView();
      case 'round': return G.cur ? roundView() : '';
      case 'final': return finalView();
    }
    return '';
  }

  /* ---------- render ---------- */
  function render() {
    let html;
    if (U.notice) html = noticeView();
    else if (U.splash) html = splashView();
    else {
      html = topbar();
      if (!U.code || U.view === 'home') html += homeView();
      else if (!G) html += '<section class="card pass"><div class="spin" aria-hidden="true"></div><h2>جاري الاتصال بالغرفة ' + esc(U.code) + '</h2></section><button class="btn ghost" data-act="leaveNow">إلغاء</button>';
      else if (U.view === 'join') html += joinView();
      else if (U.view === 'wait') html += waitView();
      else if (U.view === 'spect') html += spectView();
      else if (U.view === 'kicked') html += kickedView();
      else html += gameView();
      html += modalView();
    }
    if (G && G.cur && G.cur.log) {
      if (U.logSeen !== G.cur.key) { U.logSeen = G.cur.key; U.logN = 0; }
      if (G.cur.log.length > U.logN) { U.logN = G.cur.log.length; toast(G.cur.log[G.cur.log.length - 1]); }
    }
    if (html === U.lastHtml) { tickUI(); return; }
    const key = U.splash ? 'splash' : (G ? U.view + G.phase + G.roundNo + (G.cur ? G.cur.key + G.cur.stage : '') : U.view);
    const ae = document.activeElement, fid = ae && ae.id && app.contains(ae) ? ae.id : null;
    let ss = null, se = null;
    try { if (fid && ae.setSelectionRange) { ss = ae.selectionStart; se = ae.selectionEnd; } } catch (e) { }
    const y = window.scrollY;
    app.innerHTML = '<div class="wrap">' + html + '</div>';
    U.lastHtml = html;
    if (fid) { const el = document.getElementById(fid); if (el) { try { el.focus({ preventScroll: true }); if (ss != null) el.setSelectionRange(ss, se); } catch (e) { } } }
    if (key !== U.lastKey) { window.scrollTo(0, 0); U.lastKey = key; } else window.scrollTo(0, y);
    tickUI();
  }
  function tickUI() {
    if (!G || !G.cur || !G.cur.endsAt) return;
    const r = remain(), d = G.cur.dur || 1;
    document.querySelectorAll('[data-clock]').forEach(el => { el.textContent = fmt(r); });
    document.querySelectorAll('[data-ring]').forEach(el => {
      const fg = el.querySelector('.fg'); if (fg) fg.style.strokeDashoffset = String(326.7 * (1 - Math.min(1, r / d)));
      el.classList.toggle('low', r <= 10);
    });
  }
  setInterval(tickUI, 250);

  /* ---------- actions ---------- */
  const ACT = {};
  const H = fn => (...a) => { if (!isHost()) return false; const r = fn(...a); if (r !== false) publish(); return r; };

  ACT.enter = () => { U.splash = false; };
  ACT.noticeOk = () => { U.notice = false; try { const m = (location.hash || '').match(/^#room-([A-Za-z0-9]{4,6})$/); if (m) sessionStorage.setItem('aq.notice.' + m[1].toUpperCase(), '1'); } catch (e) { } window.scrollTo(0, 0); };
  ACT.myGender = d => { U.gender = d.g; lsSet({ gender: d.g }); };
  ACT.closeModal = () => { U.modal = null; U.err = ''; };
  ACT.ovClose = (d, el, ev) => { if (ev.target !== el) return false; U.modal = null; U.err = ''; };
  ACT.menu = () => { U.modal = { type: 'menu' }; };
  ACT.askLeave = () => { U.modal = { type: 'leave' }; };
  ACT.askTake = () => { U.modal = { type: 'take' }; };
  ACT.askHand = () => { U.modal = { type: 'hand' }; };
  ACT.leaveNow = () => { leaveLocal(); U.err = ''; };
  ACT.leave = async () => {
    U.modal = null;
    if (isHost() && G) {
      const next = G.players.find(p => p.id !== ME_ID);
      if (G.phase === 'lobby') G.players = G.players.filter(p => p.id !== ME_ID);
      if (next) { G.host = next.id; hostOn = false; await flushDirect(); }
    } else if (G && G.phase === 'lobby' && ME) { ME.room = ''; ME.name = ''; await saveMe(); }
    leaveLocal(); render();
  };
  async function flushDirect() { try { G.rev = (G.rev || 0) + 1; G.sentAt = Date.now(); await db.doc(roomPath(G.code)).set(clone(G)); nudge('v'); } catch (e) { writeFailed(e); } }
  ACT.handTo = async d => { if (!isHost()) return; U.modal = null; G.host = d.id; hostOn = false; stopHost(); await flushDirect(); toast('انتقلت الاستضافة.'); render(); };
  ACT.takeHost = async () => {
    U.modal = null;
    try { const s = await db.doc(roomPath(U.code)).get(); if (s.exists) G = clone(s.data()); } catch (e) { }
    if (!G || !inRoom(ME_ID)) return;
    G.host = ME_ID; await flushDirect(); becomeHost(); toast('صرت المضيف.'); render();
  };

  ACT.create = async () => {
    if (U.fromLink || isGuest()) return false;
    const name = U.name.trim();
    if (!name) { U.err = 'اكتب اسمك أو لقبك أول.'; return; }
    if (U.busy) return false;
    U.busy = true; U.err = ''; render();
    try {
      let code = '';
      for (let i = 0; i < 6; i++) {
        code = Array.from({ length: 4 }, () => CODE_CH[Math.floor(Math.random() * CODE_CH.length)]).join('');
        const s = await db.doc(roomPath(code)).get();
        if (!s.exists) break;
      }
      G = freshRoom(code);
      G.players.push({ id: ME_ID, name, gender: U.gender, at: Date.now() });
      ME = blankMe(code);
      U.code = code;
      await db.doc(inpPath(code, ME_ID)).set(clone(ME));
      G.rev = 1; G.sentAt = Date.now();
      await db.doc(roomPath(code)).set(clone(G));
      hostOn = false;
      await subscribe(code);
      U.view = 'game';
      becomeHost();
    } catch (e) { G = null; U.code = ''; writeFailed(e); }
    U.busy = false;
  };
  ACT.join = async () => {
    const code = String(U.draft.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 4) { U.err = 'اكتب رمز الغرفة (4 أحرف).'; return; }
    if (!U.name.trim()) { U.err = 'اكتب اسمك أو لقبك أول.'; return; }
    U.err = ''; U.busy = true; render();
    await openRoom(code, true);
    U.busy = false;
  };
  async function openRoom(code, autoJoin) {
    G = null; ME = null; U.view = 'connecting';
    U.code = code;
    await loadMe(code);
    await subscribe(code);
    if (autoJoin && U.name.trim()) {
      const waitG = () => new Promise(res => { let n = 0; const t = setInterval(() => { if (G || !U.code || ++n > 40) { clearInterval(t); res(); } }, 250); });
      await waitG();
      if (G && !inRoom(ME_ID) && G.phase === 'lobby') await sendJoin();
    }
  }
  async function sendJoin() {
    ME = Object.assign(ME && ME.room === U.code ? ME : blankMe(U.code), { room: U.code, name: U.name.trim(), gender: U.gender, at: Date.now() });
    lsSet({ name: U.name.trim(), gender: U.gender });
    U.view = 'wait';
    await saveMe();
    render();
  }
  ACT.sendJoin = async () => { if (!U.name.trim()) { U.err = 'اكتب اسمك أو لقبك.'; return; } U.err = ''; await sendJoin(); };
  ACT.copyLink = () => {
    const link = ART_URL + '#room-' + G.code;
    try { navigator.clipboard.writeText(link).then(() => toast('نسخنا رابط الدعوة.'), () => selectLink()); } catch (e) { selectLink(); }
    return false;
  };
  function selectLink() { const i = document.getElementById('lnk'); if (i) { i.focus(); i.select(); } toast('انسخ الرابط من الخانة.'); }

  /* host controls */
  ACT.kick = H(d => { G.players = G.players.filter(p => p.id !== d.id); G.kicked[d.id] = true; });
  ACT.set = H(d => { G.settings[d.k] = +d.v; });
  ACT.step = H(d => {
    const s = G.settings; if (G.phase !== 'lobby') return false;
    const L = { players: [3, 25], rounds: [1, 5], products: [3, (s.src || 'players') === 'ready' ? READY.length : 100] }[d.k]; if (!L) return false;
    s[d.k] = Math.min(L[1], Math.max(L[0], (+s[d.k] || L[0]) + (+d.v)));
    s.products = Math.max(s.products || 0, (s.players || 3) * (s.rounds || 1));
  });
  ACT.setSrc = H(d => { if (G.phase !== 'lobby' || !SRC[d.v]) return false; G.settings.src = d.v; });
  ACT.startGame = H(() => {
    const tgt = G.settings.players || 3, real = G.players.length - (G.settings.hostPlays === 0 ? 1 : 0);
    if (real !== tgt) { U.err = real > tgt ? 'دخل لاعبين أكثر من العدد المحدد. زد عدد اللاعبين أو أزل لاعب.' : 'بانتظار ' + (tgt - real) + ' لاعبين.'; return false; }
    U.err = '';
    if (G.settings.hostPlays === 0) { G.hostP = G.players.find(p => p.id === ME_ID) || G.hostP; G.players = G.players.filter(p => p.id !== ME_ID); }
    startGame();
  });
  ACT.itemsNext = H(() => {
    collectItems();
    if (!G.pool.some(x => !G.used.includes(x.id))) { toast('ما فيه أغراض للحين.'); return false; }
    G.needMore = false; startRound();
  });
  ACT.perksNext = H(() => { if (G.phase !== 'perks') return false; lockPerks(); });
  ACT.togglePerk = d => {
    const i = U.perks.indexOf(d.id);
    if (i >= 0) U.perks.splice(i, 1); else if (U.perks.length < 3) U.perks.push(d.id); else { toast('٣ مزايا بس. شيل وحدة أول.'); return false; }
  };
  ACT.sendPerks = async () => { mine().perks = { g: G.gameNo, list: U.perks.slice(), done: true }; render(); await saveMe(); };
  ACT.perk = d => { if (!perkState(ME_ID, d.id).ok) return false; U.modal = { type: 'perk', id: d.id }; };
  ACT.perkGo = d => {
    const m = U.modal, c = G.cur; if (!m || !c) return false;
    U.modal = null;
    sendReq({ type: 'perk', id: m.id, key: c.key, amt: d.amt ? +d.amt : 0, target: d.target || '' });
  };
  ACT.skip = H(() => { if (!roundStep(true)) return false; });
  ACT.nextRound = H(() => { if (!G.cur || G.cur.stage !== 'result') return false; startRound(); });
  ACT.rematch = H(() => { startGame(); });
  ACT.toLobby = H(() => { if (G.hostP && !inRoom(G.hostP.id) && G.hostP.id === ME_ID) G.players.unshift(G.hostP); G.hostP = null; G.phase = 'lobby'; G.cur = null; G.prog = []; });

  /* my inputs */
  function mine() { ME = ME || blankMe(U.code); return ME; }
  ACT.sendItems = async () => {
    const list = IDX3().map(k => String(U.draft['it' + k] || '').trim()).filter(Boolean);
    if (!list.length) { U.err = 'اكتب غرض واحد على الأقل.'; return; }
    U.err = ''; mine().items = { g: G.gameNo, r: G.itemsRound, list };
    IDX3().forEach(k => { U.draft['it' + k] = ''; });
    render(); await saveMe();
  };
  ACT.pick = d => { U.pick = d.v; };
  ACT.sendVote = async () => {
    const c = G.cur; if (!c || c.stage !== 'vote') return false;
    if (!U.pick) { toast('اختر غرض أول.'); return false; }
    mine().vote = { key: c.key, v: U.pick }; render(); await saveMe();
  };
  ACT.pm = d => { U.price = Math.min(PMAX, Math.max(PMIN, (U.price || G.settings.val) + (+d.v))); };
  ACT.pset = d => { U.price = +d.v; };
  ACT.sendPrice = async () => {
    const c = G.cur; if (!c || c.stage !== 'price' || (c.a !== ME_ID && c.b !== ME_ID)) return false;
    const side = c.a === ME_ID ? 'a' : 'b';
    mine().price = { key: c.key, side, ver: c.pv[side], v: U.price }; render(); await saveMe();
  };
  ACT.pitchDone = () => { const c = G.cur; if (!c) return false; sendReq({ type: 'done', key: c.key }); };
  ACT.sendBuy = async () => {
