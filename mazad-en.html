<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aqnieni! | Almazad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800;900&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5FAFF; --bg-2:#EEF6FB; --panel:#FFFFFF; --panel-2:#FFFFFF; --line:#C9DDEE; --line-soft:#DCEAF5;
  --text:#0F2233; --muted:#5B7186; --blue:#2F80ED; --cyan:#1E6FD9; --gold:#13924A; --gold-ink:#FFFFFF; --ink:#FFFFFF;
  --ok:#17935A; --bad:#D32F2F; --warn:#D97706;
  --grad:linear-gradient(135deg,#22C55E 0%,#14A44D 40%,#1E6FD9 100%);
  --r:16px;
  --font-d:'Alexandria','Readex Pro',Tahoma,sans-serif;
  --font-b:'Readex Pro','Alexandria','Segoe UI',Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  background-color:var(--bg);
  background-image:radial-gradient(900px 420px at 50% -8%,rgba(34,197,94,.16),transparent 70%);
  color:var(--text); font-family:var(--font-b); font-size:16px; line-height:1.65; direction:ltr;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px; min-height:100%;
}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--font-d);font-weight:700;text-wrap:balance;line-height:1.3}
.wrap{max-width:880px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 4px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--font-d);font-size:1.35rem;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:.85rem;letter-spacing:.08em}
.top-r{display:flex;align-items:center;gap:10px}
.saved{color:var(--muted);font-size:.8rem;white-space:nowrap}
@media(max-width:480px){.brand span,.saved{display:none}}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;
  border:1px solid var(--line);border-radius:14px;background:var(--panel-2);color:var(--text);
  font-weight:600;font-size:1rem;cursor:pointer;text-align:center;transition:transform .08s,border-color .15s,background .15s;
}
.btn:hover{border-color:var(--cyan)}
.btn:active{transform:scale(.985)}
.btn:focus-visible,.chipbtn:focus-visible,.perk:focus-visible,.vopt:focus-visible,.seg button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(30,111,217,.28)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.xl{min-height:62px;font-size:1.12rem;width:100%}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.9rem;border-radius:12px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}
.btn-row>.btn{flex:1 1 200px}

/* surfaces */
.card{background:var(--panel);box-shadow:0 10px 30px rgba(20,80,140,.07);border:1px solid var(--line-soft);border-radius:var(--r);padding:20px;min-width:0}
.card h2{font-size:1.35rem;margin-bottom:6px}
.card h3{font-size:1.1rem}
.sect-title{font-family:var(--font-d);font-size:1.05rem;color:var(--cyan);margin-bottom:10px}
.alert{border:1px solid var(--bad);background:rgba(211,47,47,.1);color:#9E1219;border-radius:12px;padding:12px 16px}
.note{border:1px solid var(--line);background:var(--bg-2);border-radius:12px;padding:12px 16px;color:var(--muted);font-size:.93rem}
.note b{color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);font-size:.82rem;font-weight:600;white-space:nowrap}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.chip.live{border-color:var(--cyan);color:var(--cyan)}
.chip.ok{border-color:var(--ok);color:var(--ok)}

/* stepper */
.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.steps li{padding:2px 12px;border-radius:99px;border:1px solid var(--line-soft);color:var(--muted);font-size:.82rem}
.steps li.on{border-color:var(--cyan);color:var(--cyan);background:rgba(30,111,217,.08)}
.steps li.done{color:var(--text)}

/* home */
.hero{padding:34px 22px 26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.hero h1{font-size:clamp(2.6rem,9vw,4rem);font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .en{font-family:var(--font-d);letter-spacing:.32em;color:var(--cyan);font-size:.95rem}
.hero p.lead{max-width:34rem;color:var(--muted);font-size:1.08rem}
.hero .btn-row{width:100%;max-width:520px;margin-top:6px}
.howto{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:12px}
.howto li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.howto li::before{counter-increment:s;content:counter(s);width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:700}

/* players */
.prow{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;padding:12px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}
.prow .fields{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.prow input{flex:1 1 150px;min-width:0}
.field{background:var(--bg);border:1px solid var(--line);border-radius:12px;min-height:50px;padding:8px 14px;width:100%}
textarea.field{min-height:92px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 16px;min-height:46px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--blue);color:#fff}
.seg-wide{display:flex;flex-wrap:wrap;gap:10px}
.seg-wide button{flex:1 1 90px;min-height:50px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);cursor:pointer;font-weight:600}
.seg-wide button.on{border-color:var(--cyan);color:var(--ink);background:var(--cyan)}
.x{width:46px;height:46px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;font-size:1.3rem;line-height:1}
.x:hover{border-color:var(--bad);color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.opt-card{border:1px solid var(--line);border-radius:14px;background:var(--bg-2);padding:14px 16px;cursor:pointer;text-align:start;min-height:70px}
.opt-card.on{border-color:var(--cyan);background:rgba(30,111,217,.1)}
.opt-card b{display:block}
.labelled{display:flex;flex-direction:column;gap:8px}
.labelled>label,.lbl{font-weight:600;color:var(--text)}

/* pass-the-device */
.pass{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 20px}
.pass h2{font-size:2rem;margin:0}
.pass .kick{color:var(--cyan);font-weight:600}
.pass .btn{max-width:420px}

/* perk picking */
.perk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.perk-pick{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:start;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);padding:14px 16px;cursor:pointer;min-height:92px}
.perk-pick b{font-family:var(--font-d);font-size:1.05rem}
.perk-pick span.d{grid-column:1/-1;color:var(--muted);font-size:.9rem}
.perk-pick.on{border-color:var(--gold);background:rgba(20,164,77,.09)}
.perk-pick.off{opacity:.5}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.on .tick{border-color:var(--gold);background:var(--gold);color:var(--gold-ink)}

/* answers */
.qa{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}
.qa .qt{font-weight:600}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.qlist li{padding:12px 16px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg-2)}

/* case */
.casehead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.qcard{text-align:center;padding:24px 18px}
.qcard .qlabel{color:var(--gold);font-weight:600;font-size:.9rem;letter-spacing:.04em}
.qcard h2{font-size:clamp(1.4rem,4.6vw,2rem);margin-top:6px}
.parties{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.parties{grid-template-columns:1fr 1fr}}
.party{border:1px solid var(--line-soft);background:var(--panel);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.party.speaking{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.ptop{display:flex;gap:8px;flex-wrap:wrap}
.pid{display:flex;align-items:center;gap:12px;min-width:0}
.pid h3{overflow-wrap:anywhere}
.defend{border-radius:12px;background:var(--bg-2);padding:10px 14px;border:1px dashed var(--line)}
.defend strong{display:block;font-size:1.15rem;color:var(--gold);overflow-wrap:anywhere}
.helper{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--muted)}
.perks{display:flex;flex-wrap:wrap;gap:8px}
.perk{min-height:44px;padding:6px 14px;border-radius:12px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-weight:600;font-size:.92rem;cursor:pointer}
.perk.na{border-color:var(--line);color:var(--muted)}
.perk.used{border-color:var(--line-soft);color:var(--muted);text-decoration:line-through;cursor:not-allowed}
.perk.set{background:var(--gold);color:var(--gold-ink)}
.witness{border:1px solid var(--blue);border-radius:14px;background:rgba(47,128,237,.1);padding:14px 16px}
.witness b{color:var(--cyan)}
.timerbox{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media(max-width:520px){.timerbox{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .bg{stroke:var(--line-soft)}
.ring .fg{stroke:var(--cyan);transition:stroke-dashoffset .25s linear}
.ring.low .fg{stroke:var(--bad)}
.ring.ended .fg{stroke:var(--bad)}
.clock{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-size:2.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.tcontrols{display:flex;flex-direction:column;gap:10px;min-width:0;width:100%}
.timeup{border:1px solid var(--bad);color:#9E1219;background:rgba(211,47,47,.12);border-radius:12px;padding:10px 14px;font-weight:700;text-align:center}
.notes{display:grid;gap:6px;font-size:.92rem;color:var(--muted)}

/* voting */
.vkind{display:flex;flex-direction:column;gap:6px;border-radius:14px;padding:14px 16px;border:1px solid var(--cyan);background:rgba(30,111,217,.08)}
.vkind.appeal{border-color:var(--gold);background:rgba(20,164,77,.09)}
.vkind b{font-family:var(--font-d);font-size:1.15rem}
.vopts{display:grid;gap:14px}
.vopt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;min-height:78px;padding:12px 16px;border:2px solid var(--line);border-radius:16px;background:var(--bg-2);cursor:pointer;text-align:start}
.vopt.on{border-color:var(--cyan);background:rgba(30,111,217,.12)}
.vopt .vt{display:flex;flex-direction:column;min-width:0}
.vopt .vt b{font-size:1.1rem;overflow-wrap:anywhere}
.vopt .vt span{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.vopt.none{grid-template-columns:1fr auto;border-style:dashed}
.radio{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.on .radio{border-color:var(--cyan);background:var(--cyan);color:var(--ink)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:130px 1fr 36px;align-items:center;gap:10px}
@media(max-width:520px){.bar{grid-template-columns:90px 1fr 30px}}
.bar .track{height:16px;border-radius:99px;background:var(--bg);border:1px solid var(--line-soft);overflow:hidden}
.bar .fill{height:100%;background:var(--blue);border-radius:99px}
.bar.lead .fill{background:var(--gold)}
.bar .nm{overflow-wrap:anywhere;font-weight:600}
.verdict{text-align:center;padding:22px 16px;border:1px solid var(--gold);background:rgba(20,164,77,.08);border-radius:var(--r)}
.verdict h2{color:var(--gold);font-size:1.6rem}
.jrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg-2)}

/* scoreboard */
.rank{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank li{display:grid;grid-template-columns:40px auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}
.rank li.win{border-color:var(--gold);background:rgba(20,164,77,.1)}
.rank .pos{font-family:var(--font-d);font-size:1.3rem;color:var(--muted);text-align:center}
.rank .win .pos{color:var(--gold)}
.rank .pts{font-family:var(--font-d);font-size:1.4rem;color:var(--gold);font-variant-numeric:tabular-nums}
.winner{text-align:center;padding:26px 16px;border:1px solid var(--gold);border-radius:var(--r);background:rgba(20,164,77,.09);display:flex;flex-direction:column;align-items:center;gap:8px}
.winner h2{font-size:clamp(1.8rem,6vw,2.6rem);color:var(--gold)}
.cases{display:grid;gap:12px}
.cr{border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2);padding:14px 16px;display:grid;gap:6px}
.cr .q{font-weight:700}
.cr .v{display:flex;flex-wrap:wrap;gap:8px}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(15,34,51,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0;overflow:auto}
@media(min-width:640px){.ov{align-items:center;padding:20px}}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px;direction:ltr}
@media(min-width:640px){.dlg{border-radius:20px}}
.dlg h2{font-size:1.4rem}
.cands{display:grid;gap:10px}
.cand{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);cursor:pointer;text-align:start;width:100%}
.cand:hover{border-color:var(--cyan)}
#toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50;padding-inline:16px}
#toast span{background:#0F2233;color:#fff!important;border:1px solid var(--cyan);color:var(--text);padding:12px 18px;border-radius:14px;max-width:520px;box-shadow:0 8px 30px rgba(15,34,51,.25);opacity:0;transform:translateY(8px);transition:.2s}
#toast.show span{opacity:1;transform:none}
/* splash */
.splash{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:40px 8px;position:relative}
.splash .blob{position:fixed;inset:auto;width:520px;height:520px;border-radius:50%;filter:blur(70px);opacity:.32;z-index:-1;pointer-events:none}
.splash .b1{background:#22C55E;top:-180px;inset-inline-start:-160px}
.splash .b2{background:#1E6FD9;bottom:-200px;inset-inline-end:-180px}
.splash .lg{animation:up .7s ease both;margin-bottom:8px}
.splash .big{font-family:var(--font-d);font-weight:900;font-size:clamp(4rem,19vw,8rem);line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-inline:.1em;animation:up .7s .1s ease both}
.splash .ar{font-family:var(--font-d);font-weight:700;font-size:clamp(1.6rem,6vw,2.2rem);color:var(--text);margin-top:6px;animation:up .7s .25s ease both}
.splash .en{font-family:var(--font-d);font-weight:600;letter-spacing:.42em;color:var(--cyan);font-size:.95rem;padding-inline-start:.42em;animation:up .7s .35s ease both}
.splash .go{margin-top:34px;width:100%;max-width:320px;min-height:64px;font-size:1.3rem;font-weight:800;border-radius:99px;animation:up .7s .5s ease both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* online rooms */
.bigcode{font-family:var(--font-d);font-weight:900;font-size:clamp(2.6rem,13vw,3.6rem);letter-spacing:.18em;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-inline-start:.18em}
.roomcard{text-align:center;display:grid;gap:8px;justify-items:center}
.linkrow{display:flex;gap:8px;width:100%;flex-wrap:wrap}
.linkrow .field{flex:1 1 220px;font-size:.85rem;min-height:46px;text-align:left}
.linkrow .btn{flex:0 0 auto;min-height:46px}
.code-in{font-family:var(--font-d);font-size:1.4rem;letter-spacing:.3em;text-align:center;text-transform:uppercase}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 4px;border-radius:99px;border:1px solid var(--line-soft);background:var(--bg-2);color:var(--muted);font-size:.9rem}
.pchip.ok{border-color:var(--ok);color:var(--ok);background:rgba(23,147,90,.07)}
.party.mine{box-shadow:0 0 0 2px var(--gold) inset}
.card.action{border:2px solid var(--cyan);background:#F2F8FF}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line-soft);border-top-color:var(--cyan);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
input.field{font-size:16px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}



.hero .sub{font-family:var(--font-d);font-weight:700;font-size:1.5rem;color:var(--gold);margin-top:-6px}
.wallet{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wallet div{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(20,80,140,.06)}
.wallet span{font-size:.78rem;color:var(--muted)}
.wallet b{font-family:var(--font-d);font-size:1.05rem;color:var(--cyan)}
.wallet div:last-child b{color:var(--gold)}
.parties .price{font-family:var(--font-d);font-size:1.5rem;font-weight:800;color:var(--gold)}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper .btn{width:64px;min-height:64px;font-size:1.8rem;padding:0;border-radius:50%}
.bigprice{font-family:var(--font-d);font-weight:900;font-size:4rem;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;min-width:120px}
.bigprice small{font-size:1rem;margin-inline-start:6px;-webkit-text-fill-color:var(--muted)}
.tbl{display:grid;gap:6px}
.tr{display:grid;grid-template-columns:18px minmax(0,1fr) 36px 42px 38px 46px;gap:4px;align-items:center;padding:8px 10px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg-2);font-size:.92rem}
.tr.th{background:transparent;border-color:transparent;color:var(--muted);font-size:.78rem;padding-block:0}
.tr span{text-align:center}
.tr .nm{display:flex;align-items:center;gap:6px;text-align:start;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.tr .tot{font-family:var(--font-d);font-weight:800;color:var(--gold)}
.tr.win{border-color:var(--gold);background:rgba(20,164,77,.08)}
.tr.me{box-shadow:0 0 0 2px var(--cyan) inset}
.award{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.award b{font-family:var(--font-d);font-size:1.3rem;color:var(--cyan)}
.qcard h2{color:var(--cyan)}

.perk-pick{grid-template-columns:1fr}
.perk-pick span{color:var(--muted);font-size:.9rem;line-height:1.5}
.perk-pick em{font-style:normal;font-size:.78rem;color:var(--cyan);font-weight:600}
.perk-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:56px;padding:8px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);cursor:pointer;text-align:start;font:inherit}
.perk-btn b{font-family:var(--font-d);font-size:.98rem;color:var(--text)}
.perk-btn span{font-size:.8rem}
.perk-btn.ready{border-color:var(--gold);background:rgba(20,164,77,.09);color:var(--gold)}
.perk-btn.ready b{color:var(--gold)}
.perk-btn.used{opacity:.55;text-decoration:line-through}
.perk-btn[aria-disabled=true]{cursor:not-allowed}
.perk-btn:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.perklog{display:grid;gap:6px;border:1px solid var(--cyan);background:rgba(30,111,217,.07);border-radius:14px;padding:10px 14px;font-size:.92rem;font-weight:600;color:var(--text)}
.chip.bad{border-color:var(--bad);color:var(--bad);background:rgba(211,47,47,.08)}

/* ===== unified Aqnieni theme: white, simple, one game colour ===== */
:root{--bg:#FFFFFF;--bg-2:#F5F7FA;--panel:#FFFFFF;--panel-2:#FFFFFF;--line:#E1E6EE;--line-soft:#ECEFF4;--text:#12203A;--muted:#5E6B80;--bad:#DE0921}
html,body{background:#FFFFFF!important;background-image:none!important}
.splash .blob{display:none!important}
.fulllogo{width:min(72vw,300px);height:auto;display:block;margin-inline:auto}
.hero .fulllogo{width:min(60vw,230px)}
.splash .lg{margin-bottom:4px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.splash .ar{font-size:clamp(2rem,9vw,2.8rem)!important;font-weight:800!important;color:var(--p)!important}
.hero h1{background:none!important;color:var(--text)!important;-webkit-text-fill-color:currentColor}
.hero .sub{color:var(--p-text)!important}
.btn.primary{background:var(--p)!important;color:var(--p-ink)!important;border-color:var(--p)!important;box-shadow:0 6px 16px rgba(18,32,58,.12)!important}
.card{box-shadow:0 2px 10px rgba(18,32,58,.05)}
.top .brand b{color:var(--text)}
.top .brand span{background:var(--p);color:var(--p-ink);padding:0 10px;border-radius:8px;font-weight:700}
.ring .fg{stroke:var(--p)}
.ring.low .fg{stroke:#DE0921}
@media(max-width:480px){.top .brand span{display:inline-block!important}}
.top .brand span{letter-spacing:0;font-size:.85rem}
:root{--p:#0554A4;--p-ink:#FFFFFF;--p-text:#0554A4;--cyan:#0554A4;--blue:#0554A4;--gold:#0554A4;--grad:linear-gradient(#0554A4,#0554A4)}
.top:has(.top-r .chip) .brand span{display:none!important}
</style>

<script>
/* ===== Aqnieni! Almazad: one phone per player, rooms synced through the artifact db ===== */
(function () {
  'use strict';
  const EXT = !(typeof window.claude !== 'undefined' && window.claude && window.claude.use);

  const LS = 'aqnieni.mazad.v1';

  const PMIN = 1, PMAX = 20;
  const CODE_CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const PERKS = [
    { id: 'half', name: '50% Sale', desc: 'Once prices are revealed, cut your price in half.', when: 'After prices are revealed' },

    { id: 'opp', name: 'Change rival', desc: 'Your rival is replaced by a random player from the crowd.', when: 'Pricing time' },

  const perkName = id => (PERKS.find(x => x.id === id) || {}).name || id;

  try { document.documentElement.dir = 'rtl'; document.documentElement.lang = 'ar'; } catch (e) { }

  let db = null, roomCap = null, rt = null, ME_ID = null, canWrite = null;
  let G = null, ME = null, INP = {};
  let skew = null, hostOn = false, unsubRoom = null, unsubInp = null, hostTick = null;
  let seq = 0, toastT = null;
  const U = {
    splash: true, ready: false, view: 'home', modal: null, draft: {}, err: '', lastKey: '', lastHtml: '',

  /* ---------- helpers ---------- */

  const inRoom = id => !!(G && G.players.some(p => p.id === id));
  const gv = (p, m, f) => (p && p.gender === 'f' ? f : m);
  const gLabel = p => (p.gender === 'f' ? 'Woman' : 'Man');
  const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const kd = v => (Math.round((+v || 0) * 100) / 100) + ' KD';
  const isHost = () => !!(G && ME_ID && G.host === ME_ID);
  const nowH = () => (isHost() ? Date.now() : Date.now() - (skew || 0));
  const inp = id => (id === ME_ID ? ME : INP[id]) || {};
  const norm = s => String(s || '').trim().replace(/\s+/g, ' ').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').toLowerCase();
  const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
  const other = s => (s === 'a' ? 'b' : 'a');
  function lsGet() { try { return JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) { return {}; } }
  function lsSet(o) { try { localStorage.setItem(LS, JSON.stringify(Object.assign(lsGet(), o))); } catch (e) { } }
  function toast(msg) {
    toastEl.innerHTML = '<span>' + esc(msg) + '</span>';
    toastEl.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove('show'), 3200);
  }
  function beep() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const a = new AC(), o = a.createOscillator(), g = a.createGain();
      o.connect(g); g.connect(a.destination); o.frequency.value = 660; g.gain.value = .08; o.start(); o.stop(a.currentTime + .35);
    } catch (e) { }
  }

  /* ---------- economy ---------- */
  const E = id => (G && G.econ && G.econ[id]) || { w: 0, p: 0, items: [] };
  const score = id => { const e = E(id); return e.items.length * G.settings.val + e.w + e.p; };
  function ranking() {
    return G.players.slice().sort((x, y) => (score(y.id) - score(x.id)) || (E(y.id).items.length - E(x.id).items.length) || (E(y.id).w - E(x.id).w));
  }
  const itemText = id => { const it = (G.pool || []).find(x => x.id === id); return it ? it.t : '?'; };

  /* ---------- avatars & logo ---------- */
  const AVC = ['#1E6FD9', '#14A44D', '#2F80ED', '#0E9F6E', '#0B5CAD', '#22C55E', '#3B82F6', '#15803D', '#0284C7', '#16A34A', '#1D4ED8', '#059669'];
  function avatar(p, size) {
    size = size || 48;
    const i = Math.max(0, G ? G.players.findIndex(x => x.id === p.id) : 0);
    const c = AVC[i % AVC.length];
    const fem = p.gender === 'f';
    const hair = fem ? '<path d="M18 30c0-14 6-22 14-22s14 8 14 22c0 9-2 14-5 17H23c-3-3-5-8-5-17z" fill="' + c + '" opacity=".55"/>' : '';
    const cap = fem ? '' : '<path d="M22 22c1-8 6-12 11-12s10 4 10 12c-4-4-9-5-14-5s-5 2-7 5z" fill="' + c + '" opacity=".75"/>';
    return '<svg class="avt" width="' + size + '" height="' + size + '" viewBox="0 0 64 64" role="img" aria-label="' + gLabel(p) + '" style="flex:none">' +
      '<circle cx="32" cy="32" r="31" fill="#EEF6FB" stroke="' + c + '" stroke-width="2"/>' +
      '<clipPath id="c' + i + size + '"><circle cx="32" cy="32" r="30"/></clipPath><g clip-path="url(#c' + i + size + ')">' + hair +
      '<path d="M10 66c2-14 10-21 22-21s20 7 22 21z" fill="' + c + '"/>' +
      '<circle cx="32" cy="28" r="11" fill="#FFD8C2"/>' + cap + '</g></svg>';
  }
  const LOGO = '<img src="' + (window.__BRAND_ICON || '') + '" width="34" height="34" alt="" style="flex:none;border-radius:22%">';
  const FULL = '<img class="fulllogo" src="' + (window.__BRAND_LOGO || '') + '" alt="Aqnieni">';

  /* ---------- storage ---------- */
  const roomPath = c => 'mazad/' + c;
  const inpPath = (c, id) => 'mazad/' + c + '/inputs/' + id;

  let pubBusy = false, pubDirty = false, pubT = null;
  function publish() { if (!isHost() || !db) return; clearTimeout(pubT); pubT = setTimeout(flushRoom, 40); }
  async function flushRoom() {
    if (!isHost() || !db) return;
    if (pubBusy) { pubDirty = true; return; }
    pubBusy = true;
    try {
      G.rev = (G.rev || 0) + 1; G.sentAt = Date.now();
      await db.doc(roomPath(G.code)).set(clone(G));
      nudge('v');
      U.offline = '';
    } catch (e) { writeFailed(e); }
    pubBusy = false;
    if (pubDirty) { pubDirty = false; flushRoom(); }
  }
  let meBusy = false, meDirty = false;
  async function saveMe() {
    if (!db || !ME || !U.code) return;
    if (meBusy) { meDirty = true; return; }
    meBusy = true;
    try { await db.doc(inpPath(U.code, ME_ID)).set(clone(ME)); nudge('i'); U.offline = ''; }
    catch (e) { writeFailed(e); }
    meBusy = false;
    if (meDirty) { meDirty = false; saveMe(); }
    if (isHost()) hostStep();
  }
  function writeFailed(e) {
    const code = e && e.code;
    if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked') {
      U.offline = 'perm';
      toast('You don’t have write access on this page. Ask the game owner to invite you by email with Editor.');
    } else {
      U.offline = 'net';
      toast('Couldn’t save. Check your connection.');
    }
    render();
  }
  function nudge(topic) { try { if (rt) rt.emit(topic, { rev: G ? G.rev : 0 }); } catch (e) { } }

  /* ---------- room lifecycle ---------- */
  function freshRoom(code) {
    return {
      v: 1, code, host: ME_ID, rev: 0, sentAt: 0, gameNo: 0, phase: 'lobby', players: [], kicked: {}, reqSeen: {},
      settings: { rounds: 2, start: 20, val: 5, think: 60, pitch: 60 },
      perks: {}, pused: {}, pool: [], used: [], itemsRound: 0, needMore: false, prog: [], econ: {}, sold: {}, roundNo: 0, total: 0, cur: null, history: [], lastPair: ''
    };
  }
  function blankMe(code) { return { room: code, name: U.name.trim(), gender: U.gender, at: Date.now(), reqN: 0, reqs: [] }; }

  async function subscribe(code) {
    unsubscribe();
    U.code = code;
    try { location.hash = 'room-' + code; } catch (e) { }
    lsSet({ code });
    try { rt = roomCap && roomCap.join ? roomCap.join('mazad-' + code) : null; } catch (e) { rt = null; }
    if (rt) {
      try {
        rt.on('v', d => { if (!isHost() && d && G && d.rev > G.rev) db.doc(roomPath(code)).get().then(onRoomSnap).catch(() => { }); });
        rt.on('i', () => { if (isHost()) db.collection('mazad/' + code + '/inputs').get().then(onInputs).catch(() => { }); });
      } catch (e) { }
    }
    const loading = setTimeout(() => { if (!G) { U.offline = 'net'; render(); } }, 10000);
    unsubRoom = db.doc(roomPath(code)).onSnapshot(s => { clearTimeout(loading); onRoomSnap(s); }, () => { clearTimeout(loading); U.offline = 'net'; render(); });
  }
  function unsubscribe() {
    if (unsubRoom) { try { unsubRoom(); } catch (e) { } unsubRoom = null; }
    if (unsubInp) { try { unsubInp(); } catch (e) { } unsubInp = null; }
    if (rt) { try { rt.leave(); } catch (e) { } rt = null; }
    if (hostTick) { clearInterval(hostTick); hostTick = null; }
    hostOn = false; INP = {};
  }
  function onRoomSnap(s) {
    if (!s || !s.exists) {
      if (!G) { U.err = 'No room found with this code. Check the code.'; leaveLocal(); render(); }
      return;
    }
    const d = s.data();
    if (!d || d.code !== U.code) return;
    if (s.metadata && !s.metadata.fromCache && !s.metadata.hasPendingWrites && d.sentAt && d.host !== ME_ID) {
      const o = Date.now() - d.sentAt;
      if (skew === null || o < skew) skew = o;
    }
    if (hostOn && G && G.host === ME_ID) {
      if (d.host !== ME_ID && d.rev > G.rev) { hostOn = false; G = clone(d); stopHost(); }
      else return;
    } else {
      if (G && G.code === d.code && (d.rev || 0) < (G.rev || 0)) return;

  }
  function spectView() {
    return '<section class="card pass"><h2>The game has started</h2><p class="muted">This room started without you. You can join when the host goes back to the lobby.</p><button class="btn xl" data-act="leaveNow">Leave</button></section>';
  }
  function kickedView() {
    return '<section class="card pass"><h2>You left the room</h2><p class="muted">The host removed you from this room.</p><button class="btn xl" data-act="leaveNow">Back</button></section>';
  }
  function progBox(label, ids) {
    const done = G.prog || [];
    ids = ids || G.players.map(p => p.id);
    return '<section class="card" style="display:grid;gap:10px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h3>' + label + '</h3><span class="chip num">' + done.filter(id => ids.includes(id)).length + ' from ' + ids.length + '</span></div><div class="plist">' +
      ids.map(id => P(id)).map(p => '<span class="pchip ' + (done.includes(p.id) ? 'ok' : '') + '">' + avatar(p, 28) + esc(p.name) + (done.includes(p.id) ? ' ✓' : ' …') + '</span>').join('') + '</div></section>';
  }
  const waitHost = () => '<p class="muted small" style="text-align:center">Waiting for the host ' + esc(P(G.host).name) + ' to move the game to the next stage.</p>';
  function walletBar() {
    if (!inRoom(ME_ID) || !G.econ[ME_ID]) return '';
    const e = E(ME_ID);
    return '<section class="wallet"><div><span>Your wallet</span><b class="num">' + kd(e.w) + '</b></div><div><span>Your profits</span><b class="num">' + kd(e.p) + '</b></div><div><span>Your items</span><b class="num">' + e.items.length + '</b></div><div><span>Your total</span><b class="num">' + score(ME_ID) + '</b></div></section>';
  }

  function lobbyView() {
    const s = G.settings, host = isHost(), n = G.players.length;
    const link = ART_URL + '#room-' + G.code;
    const seg = (k, vals, unit) => '<div class="seg-wide" role="group">' + vals.map(v => '<button data-act="set" data-k="' + k + '" data-v="' + v + '" class="' + (s[k] === v ? 'on' : '') + '" aria-pressed="' + (s[k] === v) + '">' + v + (unit || '') + '</button>').join('') + '</div>';
    const rows = G.players.map(p => '<div class="prow"><div>' + avatar(p, 46) + '</div><div class="fields"><b style="flex:1">' + esc(p.name) + (p.id === ME_ID ? ' <span class="muted small">(you)</span>' : '') + '</b>' +
      (p.id === G.host ? '<span class="chip gold">Host</span>' : '') + '<span class="muted small">' + gLabel(p) + '</span>' +
      (host && p.id !== ME_ID ? '<button class="x" data-act="kick" data-id="' + p.id + '" aria-label="Remove ' + esc(p.name) + '">×</button>' : '') + '</div></div>').join('');
    const total = Math.ceil(Math.max(n, 3) * s.rounds / 2);
    const settings = host ? '<section class="card" style="display:grid;gap:18px"><h2>Auction settings</h2>' +
      '<div class="labelled"><span class="lbl">How many times each player sells</span>' + seg('rounds', [2, 3, 4], ' times') + '<span class="muted small">That’s about ' + total + ' rounds with ' + Math.max(n, 3) + ' players.</span></div>' +
      '<div class="labelled"><span class="lbl">Starting wallet</span>' + seg('start', [10, 20, 30], ' KD') + '</div>' +
      '<div class="labelled"><span class="lbl">Points per item</span>' + seg('val', [3, 5, 7], ' pts') + '</div>' +
      '<div class="labelled"><span class="lbl">Thinking time</span>' + seg('think', [30, 60, 90], ' s') + '</div>' +
      '<div class="labelled"><span class="lbl">Pitch time per seller</span>' + seg('pitch', [30, 60, 90], ' s') + '</div></section>'
      : '<section class="card"><h3>Settings</h3><p class="muted">Each player sells ' + s.rounds + ' times · wallet ' + kd(s.start) + ' · item = ' + s.val + ' pts · thinking ' + s.think + ' s · pitch ' + s.pitch + ' s</p></section>';
    return '<section class="card roomcard"><span class="muted">Room code</span><div class="bigcode" dir="ltr">' + esc(G.code) + '</div>' +
      '<p class="muted small">Players open the game link and type this code, or open the invite link directly.</p>' +
      '<div class="linkrow"><input class="field" id="lnk" readonly value="' + esc(link) + '" dir="ltr" aria-label="Invite link"><button class="btn" data-act="copyLink">Copy link</button></div></section>' +
      '<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px"><h2 style="margin:0">Players</h2><span class="chip num">' + n + ' from 12</span></div><div style="display:grid;gap:10px">' + rows + '</div>' +
      (n < 3 ? '<p class="muted small" style="margin-top:10px">You need at least 3 players: two sellers and a buyer.</p>' : '') + '</section>' + settings + errBox() +
      (host ? '<button class="btn xl primary" data-act="startGame"' + (n < 3 ? ' aria-disabled="true"' : '') + '>Start the auction</button>' : '<p class="muted" style="text-align:center">Waiting for the host to start the game…</p>');
  }

  function itemsView() {
    const mine = inp(ME_ID).items, sent = mine && mine.g === G.gameNo && mine.r === G.itemsRound;
    const head = G.needMore ? '<div class="note"><b>Out of items!</b> Write more things around the room so we can keep going.</div>' : '';
    let body;
    if (!sent) {
      body = '<section class="card action" style="display:grid;gap:14px"><h2 style="margin:0">What’s around you?</h2><p class="muted">Write up to 3 things around the room. Anything: a tissue box, a remote, a mug, a charger…</p>' +
        [0, 1, 2].map(k => '<input class="field" id="it' + k + '" data-bind="item" data-k="' + k + '" value="' + esc(U.draft['it' + k] || '') + '" maxlength="40" autocomplete="off" placeholder="item ' + (k + 1) + '">').join('') +
        errBox() + '<button class="btn xl primary" data-act="sendItems">Send</button></section>';
    } else {
      body = '<section class="card pass"><h2>Your items are in ✓</h2><p class="muted">' + (mine.list || []).map(esc).join(' · ') + '</p></section>';
    }
    const all = (G.prog || []).length >= G.players.length, any = (G.prog || []).length > 0;
    const next = isHost() ? '<button class="btn xl primary" data-act="itemsNext"' + (any || G.pool.some(x => !G.used.includes(x.id)) ? '' : ' aria-disabled="true"') + '>' + (all ? 'Let’s start selling' : 'Start without those who didn’t write') + '</button>' : waitHost();
    return head + body + progBox('Who wrote their items') + next;
  }

  function perksView() {
    const x = inp(ME_ID).perks, done = x && x.g === G.gameNo && x.done;
    let body;
    if (done) body = '<section class="card pass"><h2>You picked your perks ✓</h2><p class="muted">' + ((x.list || []).map(perkName).join(', ') || 'No perks') + '</p></section>';
    else {
      const key = G.code + G.gameNo;
      if (U.perksKey !== key) { U.perksKey = key; U.perks = []; }
      const full = U.perks.length >= 3;
      body = '<section class="card action"><h2>Pick your perks secretly</h2><p class="muted" style="margin-bottom:12px">3 perks out of 7 · <b class="num" style="color:var(--gold)">' + U.perks.length + '</b> of 3 · each perk can be used once per game, and only when you’re a seller.</p>' +
        '<div class="perk-grid">' + PERKS.map(k => { const on = U.perks.includes(k.id); return '<button class="perk-pick ' + (on ? 'on' : (full ? 'off' : '')) + '" data-act="togglePerk" data-id="' + k.id + '" aria-pressed="' + on + '"><b>' + k.name + '</b><span>' + k.desc + '</span><em>' + k.when + '</em></button>'; }).join('') + '</div>' +
        '<button class="btn xl primary" data-act="sendPerks" style="margin-top:14px">' + (U.perks.length ? 'Confirm perks' : 'Continue without perks') + '</button></section>';
    }
    const all = (G.prog || []).length >= G.players.length;
    return body + progBox('Who picked perks') + (isHost() ? '<button class="btn xl primary" data-act="perksNext">' + (all ? 'Next: write items' : 'Continue without the rest') + '</button>' : waitHost());
  }
  function perkPanel() {
    const c = G.cur;
    if (c.a !== ME_ID && c.b !== ME_ID) return '';
    const mine = G.perks[ME_ID] || [];
    if (!mine.length) return '';
    return '<section class="card"><h3 style="margin-bottom:10px">Your perks</h3><div class="perks">' + mine.map(id => {
      const used = (G.pused[ME_ID] || []).includes(id), st = perkState(ME_ID, id);
      return '<button class="perk-btn ' + (used ? 'used' : (st.ok ? 'ready' : '')) + '" data-act="perk" data-id="' + id + '"' + (st.ok ? '' : ' aria-disabled="true"') + '><b>' + perkName(id) + '</b><span>' + (used ? 'Used' : (st.ok ? 'Use it now' : esc(st.why))) + '</span></button>';
    }).join('') + '</div></section>';
  }
  function logBox() {
    const l = (G.cur && G.cur.log) || [];
    return l.length ? '<section class="perklog">' + l.slice(-3).map(m => '<div>⚡ ' + esc(m) + '</div>').join('') + '</section>' : '';
  }
  function clockBox(label) {
    const c = G.cur;
    return '<section class="card timerbox"><div class="ring" data-ring="' + (c.dur || 0) + '"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52" fill="none" stroke-width="10"/><circle class="fg" cx="60" cy="60" r="52" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg><div class="clock num" data-clock>' + fmt(remain()) + '</div></div>' +
      '<div class="tcontrols"><h3>' + label + '</h3>' + (isHost() ? '<button class="btn" data-act="skip">Skip timer</button>' : '') + '</div></section>';
  }
  const remain = () => (G && G.cur && G.cur.endsAt ? Math.max(0, (G.cur.endsAt - nowH()) / 1000) : 0);
  function sellersBox(showPrice) {
    const c = G.cur;
    const one = s => {
      const p = P(c[s]), sp = c.speaker === s, me = c[s] === ME_ID;
      return '<div class="party ' + (sp ? 'speaking' : '') + (me ? ' mine' : '') + '"><div class="pid">' + avatar(p, 52) + '<div><span class="muted small">Seller ' + (s === c.first || !c.prices ? (s === 'a' ? 'first' : 'second') : (s === 'a' ? 'first' : 'second')) + '</span><h3>' + esc(p.name) + (me ? ' <span class="muted small">(you)</span>' : '') + '</h3></div></div>' +
        (showPrice && c.prices ? '<div class="price num">' + kd(c.prices[s]) + (c.auto[s] ? '<span class="muted small"> (didn’t set a price, got the default)</span>' : '') + '</div>' : '') +
        (c.help && c.help[s] ? '<span class="muted small">Sales rep: <b>' + esc(P(c.help[s]).name) + '</b></span>' : '') +
        (c.cancel && c.cancel[s] ? '<span class="chip bad">Sales cancelled by objection</span>' : '') +
        (sp ? '<span class="chip live">Pitching now</span>' : '') + '<span class="muted small">Perks left: ' + ((G.perks[c[s]] || []).length - (G.pused[c[s]] || []).length) + '</span></div>';
    };
    return '<div class="parties">' + one('a') + one('b') + '</div>';
  }
  function itemCard() {
    const c = G.cur;
    return '<section class="card qcard"><div class="qlabel">Item for sale</div><h2>' + esc(itemText(c.item)) + '</h2>' + (c.tie ? '<p class="muted small">Votes were tied, so the game picked one at random.</p>' : '') + '</section>';
  }

  function roundView() {
    const c = G.cur, seller = c.a === ME_ID || c.b === ME_ID, mySide = c.a === ME_ID ? 'a' : (c.b === ME_ID ? 'b' : null);
    const helpFor = c.help ? Object.keys(c.help).find(k => c.help[k] === ME_ID) : null;
    const head = '<div class="casehead"><span class="chip gold num">Round ' + c.no + ' of ' + G.total + '</span>' + (seller ? '<span class="chip live">You’re a seller this round</span>' : '') + (helpFor ? '<span class="chip live">Sales rep</span>' : '') + '</div>' + walletBar() + logBox() +
      (helpFor && c.stage !== 'result' ? '<section class="note"><b>You’re the sales rep for ' + esc(P(c[helpFor]).name) + '!</b> ' + 'Help them convince everyone. You can’t buy this round.</section>' : '');
    const pp = perkPanel();
    if (c.stage === 'vote') {
      const v = inp(ME_ID).vote, voted = v && v.key === c.key;
      if (U.pickKey !== c.key) { U.pickKey = c.key; U.pick = null; }
      let body;
      if (!voted) {
        body = '<section class="card action" style="display:grid;gap:14px"><h2 style="margin:0">Vote: what do we sell?</h2><p class="muted">Pick the item you want the sellers to try to sell.</p><div class="vopts">' +
          c.cands.map(id => '<button class="vopt none ' + (U.pick === id ? 'on' : '') + '" data-act="pick" data-v="' + id + '"><span class="vt"><b>' + esc(itemText(id)) + '</b></span><span class="radio">' + (U.pick === id ? '✓' : '') + '</span></button>').join('') +
          '</div><button class="btn xl primary" data-act="sendVote">Confirm my vote</button></section>';
      } else body = '<section class="card pass"><h2>Vote received ✓</h2><p class="muted">Waiting for the others.</p></section>';
      return head + '<section class="card"><h3 style="margin-bottom:10px">Sellers this round</h3>' + sellersBox(false) + '</section>' + body + clockBox('Voting time') + progBox('Who voted');
    }
    if (c.stage === 'price') {
      const pr = inp(ME_ID).price, sent = !!(mySide && pr && pr.key === c.key && pr.side === mySide && pr.ver === c.pv[mySide]);
      let body;
      if (seller && !sent) {
        const pk = c.key + mySide + c.pv[mySide];
        if (U.priceKey !== pk) { U.priceKey = pk; U.price = G.settings.val; }
        const quick = [1, 2, 3, 5, 10, 15, 20];
        body = '<section class="card action" style="display:grid;gap:14px;text-align:center"><h2 style="margin:0">Set your price secretly</h2><p class="muted">Your rival can’t see your price until it’s revealed to everyone. Cheap sells more; expensive earns more per sale.</p>' +
          '<div class="stepper"><button class="btn" data-act="pm" data-v="1" aria-label="Increase">+</button><div class="bigprice num">' + U.price + '<small>KD</small></div><button class="btn" data-act="pm" data-v="-1" aria-label="Decrease">−</button></div>' +
          '<div class="seg-wide">' + quick.map(q => '<button data-act="pset" data-v="' + q + '" class="' + (U.price === q ? 'on' : '') + '">' + q + '</button>').join('') + '</div>' +
          '<button class="btn xl primary" data-act="sendPrice">Lock price</button></section>';
      } else if (seller) body = '<section class="card pass"><h2>Price locked ✓</h2><p class="muted">Waiting for the other seller.</p></section>';
      else body = '<section class="card pass"><div class="spin" aria-hidden="true"></div><h2>Sellers are setting their prices secretly…</h2></section>';
      return head + itemCard() + sellersBox(false) + body + pp + clockBox('Pricing time') + progBox('Who locked their price', [c.a, c.b]);
    }
    if (c.stage === 'reveal') {
      return head + itemCard() + '<section class="vkind"><b>Prices revealed!</b><span class="muted">Think it over. Then each seller gets ' + G.settings.pitch + ' seconds to convince you. ' + esc(P(c[c.first]).name) + ' goes first.</span></section>' +
        sellersBox(true) + pp + clockBox('Thinking time');
    }
    if (c.stage === 'pitch1' || c.stage === 'pitch2') {
      const mine = mySide === c.speaker;
      return head + itemCard() + sellersBox(true) +
        (mine ? '<section class="card action pass"><h2>Your turn! Convince them to buy from you</h2><p class="muted">Your price ' + kd(c.prices[mySide]) + '. Say why your item is worth it.</p><button class="btn xl" data-act="pitchDone">I’m done</button></section>'
          : '<section class="card pass"><h2>' + esc(P(c[c.speaker]).name) + ' is pitching now</h2><p class="muted">Listen closely, then decide.</p></section>') +
        pp + clockBox(c.stage === 'pitch1' ? 'Offer one' : 'Offer two');
    }
    if (c.stage === 'buy') {
      const b = inp(ME_ID).buy, sent = b && b.key === c.key;
      if (U.pickKey !== c.key + 'b') { U.pickKey = c.key + 'b'; U.pick = null; }
      let body;
      if (seller || helpFor) body = '<section class="card pass"><div class="spin" aria-hidden="true"></div><h2>People are deciding…</h2><p class="muted">' + (seller ? 'Let’s see how many bought from you.' : 'You’re a sales rep, you don’t buy this round.') + '</p></section>';
      else if (!sent) {
        const w = E(ME_ID).w;
        const opt = s => {
          const can = c.prices[s] <= w;
          return '<button class="vopt ' + (U.pick === s ? 'on' : '') + '" data-act="pick" data-v="' + s + '"' + (can ? '' : ' aria-disabled="true"') + '>' + avatar(P(c[s]), 44) +
            '<span class="vt"><b>Buy from ' + esc(P(c[s]).name) + '</b><span>' + (can ? 'for ' + kd(c.prices[s]) : 'Price ' + kd(c.prices[s]) + ' is more than your wallet') + '</span></span><span class="radio">' + (U.pick === s ? '✓' : '') + '</span></button>';
        };
        body = '<section class="card action" style="display:grid;gap:14px"><h2 style="margin:0">Buy ' + esc(itemText(c.item)) + '?</h2><p class="muted">Left in your wallet: ' + kd(w) + '. Each item is worth ' + G.settings.val + ' points at the end.</p><div class="vopts">' +
          opt('a') + opt('b') + '<button class="vopt none ' + (U.pick === 'x' ? 'on' : '') + '" data-act="pick" data-v="x"><span class="vt"><b>Pass</b><span>I don’t want to buy this round</span></span><span class="radio">' + (U.pick === 'x' ? '✓' : '') + '</span></button></div>' +
          '<button class="btn xl primary" data-act="sendBuy">Confirm</button><p class="muted small">If time runs out and you haven’t chosen, you count as abstaining.</p></section>';
      } else body = '<section class="card pass"><h2>Decision received ✓</h2><p class="muted">' + (b.v === 'x' ? 'You passed.' : 'You chose to buy from ' + esc(P(c[b.v]).name) + '.') + '</p></section>';
      return head + itemCard() + sellersBox(true) + body + clockBox('Decision time') + progBox('Who decided', buyers());
    }
    if (c.stage === 'result') {
      const list = s => buyers().filter(id => c.buys[id] === s);
      const cx = buyers().filter(id => c.buys[id] === 'c');
      const ref = buyers().filter(id => c.buys[id] === 'x'), abst = buyers().filter(id => c.buys[id] === '-');
      const rev = s => c.n[s] * c.prices[s];
      const win = rev('a') === rev('b') ? null : (rev('a') > rev('b') ? 'a' : 'b');
      const col = s => '<div class="party' + (win === s ? ' speaking' : '') + '"><div class="pid">' + avatar(P(c[s]), 48) + '<div><h3>' + esc(P(c[s]).name) + '</h3><span class="muted small">for ' + kd(c.prices[s]) + '</span></div></div>' +
        '<div class="price num">' + (c.cancel && c.cancel[s] ? 'Cancelled ' + c.cancel[s] + ' sales' : 'sold ' + c.n[s] + ' · earned ' + kd(rev(s))) + '</div>' +
        (c.cancel && c.cancel[s] ? '<span class="chip bad">Objection: sale cancelled</span>' : '') +
        '<div class="plist">' + (list(s).map(id => '<span class="pchip ok">' + avatar(P(id), 24) + esc(P(id).name) + '</span>').join('') || '<span class="muted small">Nobody bought from them</span>') + '</div>' +
        (win === s ? '<span class="chip gold">Best seller this round</span>' : '') + '</div>';
      let mine = '';
      if (mySide) mine = 'You sold ' + c.n[mySide] + ' and earned ' + kd(rev(mySide)) + '.';
      else if (c.buys[ME_ID] === 'a' || c.buys[ME_ID] === 'b') mine = 'You bought ' + esc(itemText(c.item)) + ' for ' + kd(c.prices[c.buys[ME_ID]]) + '.';
      else if (c.buys[ME_ID] === 'x') mine = 'You passed.';
      else if (c.buys[ME_ID] === 'c') mine = 'Your purchase was cancelled by objection, and your money refunded.';
      else if (helpFor) mine = 'You were a sales rep ' + esc(P(c[helpFor]).name) + '.';
      else mine = 'You didn’t choose, counted as abstaining.';
      const last = G.roundNo >= G.total;
      return head + '<section class="verdict"><h2>' + (win ? esc(P(c[win]).name) + ' wins the round' : (c.n.a + c.n.b ? 'Tied on profits!' : 'Nobody bought anything!')) + '</h2><p>' + mine + '</p></section>' +
        itemCard() + '<div class="parties">' + col('a') + col('b') + '</div>' +
        (cx.length ? '<section class="card small muted">Purchases cancelled and refunded: ' + cx.map(id => esc(P(id).name)).join(', ') + '</section>' : '') + pp +
        (ref.length || abst.length ? '<section class="card small muted">' + (ref.length ? 'Passed: ' + ref.map(id => esc(P(id).name)).join(', ') : '') + (ref.length && abst.length ? ' · ' : '') + (abst.length ? 'Abstained: ' + abst.map(id => esc(P(id).name)).join(', ') : '') + '</section>' : '') +
        standings(false) +
        (isHost() ? '<button class="btn xl primary" data-act="nextRound">' + (last ? 'Final result' : 'Next round') + '</button>' : waitHost());
    }
    return head;
  }

  function standings(full) {
    const r = ranking();
    return '<section class="card"><h2 style="margin-bottom:12px">' + (full ? 'Final standings' : 'Standings now') + '</h2><div class="tbl" role="table">' +
      '<div class="tr th" role="row"><span>#</span><span>Player</span><span>Items</span><span>Wallet</span><span>Profits</span><span>Total</span></div>' +
      r.map((p, i) => { const e = E(p.id); return '<div class="tr' + (i === 0 ? ' win' : '') + (p.id === ME_ID ? ' me' : '') + '" role="row"><span class="num">' + (i + 1) + '</span><span class="nm">' + esc(p.name) + '</span><span class="num">' + e.items.length + '</span><span class="num">' + e.w + '</span><span class="num">' + e.p + '</span><span class="num tot">' + score(p.id) + '</span></div>'; }).join('') +
      '</div><p class="muted small" style="margin-top:10px">Total = (items × ' + G.settings.val + ') + wallet + profits</p></section>';
  }
  function finalView() {
    const r = ranking(), w = r[0];
    const topSeller = G.players.slice().sort((x, y) => E(y.id).p - E(x.id).p)[0];
    const topBuyer = G.players.slice().sort((x, y) => (E(y.id).items.length - E(x.id).items.length) || (E(y.id).w - E(x.id).w))[0];
    const tie = r.length > 1 && score(r[1].id) === score(w.id);
    return '<section class="winner">' + avatar(w, 84) + '<span class="muted">' + (tie ? 'Tied on total, won with more items' : 'Winner') + '</span><h2>' + esc(w.name) + '</h2><span class="chip gold num">' + score(w.id) + ' pts</span></section>' +
      '<div class="grid2"><section class="card award"><span class="muted small">Best seller</span><b>' + esc(topSeller.name) + '</b><span class="num">Profits ' + kd(E(topSeller.id).p) + '</span></section>' +
      '<section class="card award"><span class="muted small">Best buyer</span><b>' + esc(topBuyer.name) + '</b><span class="num">' + E(topBuyer.id).items.length + ' Items</span></section></div>' +
      standings(true) +
      '<section class="card"><h2 style="margin-bottom:12px">Rounds</h2><div class="cases">' + G.history.map(h => '<div class="cr"><span class="q">' + h.no + '. ' + esc(h.item) + '</span><div class="v"><span class="chip">' + esc(P(h.a).name) + ': ' + kd(h.pa) + ' · sold ' + h.na + ((h.cx || '').includes('a') ? ' (cancelled)' : '') + '</span><span class="chip">' + esc(P(h.b).name) + ': ' + kd(h.pb) + ' · sold ' + h.nb + ((h.cx || '').includes('b') ? ' (cancelled)' : '') + '</span></div></div>').join('') + '</div></section>' +
      (inRoom(ME_ID) ? '<section class="card"><h3>Your items</h3><p class="muted">' + (E(ME_ID).items.map(esc).join(', ') || 'You didn’t buy anything') + '</p></section>' : '') +
      (isHost() ? '<div class="btn-row"><button class="btn xl primary" data-act="rematch">New auction, same players</button><button class="btn xl" data-act="toLobby">Back to lobby</button></div>' : waitHost());
  }

  function modalView() {
    const m = U.modal;
    if (!m) return '';
    let body = '';
    if (m.type === 'menu') {
      const host = isHost(), others = G ? G.players.filter(p => p.id !== ME_ID) : [];
      body = '<h2>Menu</h2><p class="muted">Room <b dir="ltr">' + esc(U.code) + '</b>' + (G ? ' · Host: ' + esc(P(G.host).name) : '') + '</p>' +
        (!host && G && inRoom(ME_ID) ? '<button class="btn" data-act="askTake">Host not responding? Take over hosting</button>' : '') +
        (host && others.length ? '<button class="btn" data-act="askHand">Hand hosting to another player</button>' : '') +
        '<button class="btn danger" data-act="askLeave">Leave the room</button><button class="btn ghost" data-act="closeModal">Close</button>';
    } else if (m.type === 'perk') {
      const k = PERKS.find(x => x.id === m.id), c = G.cur, st = G.cur ? perkState(ME_ID, m.id) : { ok: false };
      if (!st.ok) { U.modal = null; return ''; }
      const os = other(st.side);
      let act;
      if (m.id === 'up' || m.id === 'down') act = '<p class="muted">' + esc(P(c[os]).name) + '’s price is now ' + kd(c.prices[os]) + '. ' + (m.id === 'up' ? 'Raise it by' : 'Lower it by') + ' how much?</p><div class="seg-wide">' + [1, 2, 3].map(a => '<button data-act="perkGo" data-amt="' + a + '">' + (m.id === 'up' ? '+' : '−') + a + ' KD</button>').join('') + '</div>';
      else if (m.id === 'rep') act = '<p class="muted">Choose who becomes your sales rep:</p><div class="cands">' + buyers().map(id => '<button class="cand" data-act="perkGo" data-target="' + id + '">' + avatar(P(id), 40) + '<b>' + esc(P(id).name) + '</b></button>').join('') + '</div>';
      else act = (m.id === 'half' ? '<p class="muted">Your price becomes ' + kd(half(c.prices[st.side] / 2)) + ' instead of ' + kd(c.prices[st.side]) + '.</p>' : '') + '<button class="btn xl primary" data-act="perkGo">Use perk</button>';
      body = '<h2>' + k.name + '</h2><p class="muted">' + k.desc + ' Can be used once per game.</p>' + act + '<button class="btn ghost" data-act="closeModal">Cancel</button>';
    } else if (m.type === 'take') {
      body = '<h2>Take over hosting?</h2><p class="muted">Only use this if the host left or their phone disconnected. You’ll be the one moving the game between stages.</p><div class="btn-row"><button class="btn primary" data-act="takeHost">Take over</button><button class="btn" data-act="closeModal">Cancel</button></div>';
    } else if (m.type === 'hand') {
      body = '<h2>Choose the new host</h2><div class="cands">' + G.players.filter(p => p.id !== ME_ID).map(p => '<button class="cand" data-act="handTo" data-id="' + p.id + '">' + avatar(p, 40) + '<b>' + esc(p.name) + '</b></button>').join('') + '</div><button class="btn ghost" data-act="closeModal">Cancel</button>';
    } else if (m.type === 'leave') {
      const warn = isHost() && G && G.players.length > 1 ? 'You’re the host. We’ll pass hosting to another player automatically.' : 'You can come back with the same code.';
      body = '<h2>Leave the room?</h2><p class="muted">' + warn + '</p><div class="btn-row"><button class="btn danger" data-act="leave">Leave</button><button class="btn" data-act="closeModal">Cancel</button></div>';
    }
    return '<div class="ov" data-act="ovClose"><div class="dlg" role="dialog" aria-modal="true">' + body + '</div></div>';
  }
  function gameView() {
    switch (G.phase) {
      case 'lobby': return lobbyView();
      case 'perks': return perksView();
      case 'items': return itemsView();
      case 'round': return G.cur ? roundView() : '';
      case 'final': return finalView();
    }
    return '';
  }

  /* ---------- render ---------- */
  function render() {
    let html;
    if (U.splash) html = splashView();
    else {
      html = topbar();
      if (!U.code || U.view === 'home') html += homeView();
      else if (!G) html += '<section class="card pass"><div class="spin" aria-hidden="true"></div><h2>Connecting to room ' + esc(U.code) + '</h2></section><button class="btn ghost" data-act="leaveNow">Cancel</button>';
      else if (U.view === 'join') html += joinView();
      else if (U.view === 'wait') html += waitView();
      else if (U.view === 'spect') html += spectView();
      else if (U.view === 'kicked') html += kickedView();
      else html += gameView();
      html += modalView();
    }
    if (G && G.cur && G.cur.log) {
      if (U.logSeen !== G.cur.key) { U.logSeen = G.cur.key; U.logN = 0; }
      if (G.cur.log.length > U.logN) { U.logN = G.cur.log.length; toast(G.cur.log[G.cur.log.length - 1]); }
    }
    if (html === U.lastHtml) { tickUI(); return; }
    const key = U.splash ? 'splash' : (G ? U.view + G.phase + G.roundNo + (G.cur ? G.cur.key + G.cur.stage : '') : U.view);
    const ae = document.activeElement, fid = ae && ae.id && app.contains(ae) ? ae.id : null;
    let ss = null, se = null;
    try { if (fid && ae.setSelectionRange) { ss = ae.selectionStart; se = ae.selectionEnd; } } catch (e) { }
    const y = window.scrollY;
    app.innerHTML = '<div class="wrap">' + html + '</div>';
    U.lastHtml = html;
    if (fid) { const el = document.getElementById(fid); if (el) { try { el.focus({ preventScroll: true }); if (ss != null) el.setSelectionRange(ss, se); } catch (e) { } } }
    if (key !== U.lastKey) { window.scrollTo(0, 0); U.lastKey = key; } else window.scrollTo(0, y);
    tickUI();
  }
  function tickUI() {
    if (!G || !G.cur || !G.cur.endsAt) return;
    const r = remain(), d = G.cur.dur || 1;
    document.querySelectorAll('[data-clock]').forEach(el => { el.textContent = fmt(r); });
    document.querySelectorAll('[data-ring]').forEach(el => {
      const fg = el.querySelector('.fg'); if (fg) fg.style.strokeDashoffset = String(326.7 * (1 - Math.min(1, r / d)));
      el.classList.toggle('low', r <= 10);
    });
  }
  setInterval(tickUI, 250);

  /* ---------- actions ---------- */
  const ACT = {};
  const H = fn => (...a) => { if (!isHost()) return false; const r = fn(...a); if (r !== false) publish(); return r; };

  ACT.enter = () => { U.splash = false; };
  ACT.myGender = d => { U.gender = d.g; lsSet({ gender: d.g }); };
  ACT.closeModal = () => { U.modal = null; U.err = ''; };
  ACT.ovClose = (d, el, ev) => { if (ev.target !== el) return false; U.modal = null; U.err = ''; };
  ACT.menu = () => { U.modal = { type: 'menu' }; };
  ACT.askLeave = () => { U.modal = { type: 'leave' }; };
  ACT.askTake = () => { U.modal = { type: 'take' }; };
  ACT.askHand = () => { U.modal = { type: 'hand' }; };
  ACT.leaveNow = () => { leaveLocal(); U.err = ''; };
  ACT.leave = async () => {
    U.modal = null;
    if (isHost() && G) {
      const next = G.players.find(p => p.id !== ME_ID);
      if (G.phase === 'lobby') G.players = G.players.filter(p => p.id !== ME_ID);
      if (next) { G.host = next.id; hostOn = false; await flushDirect(); }
    } else if (G && G.phase === 'lobby' && ME) { ME.room = ''; ME.name = ''; await saveMe(); }
    leaveLocal(); render();
  };
  async function flushDirect() { try { G.rev = (G.rev || 0) + 1; G.sentAt = Date.now(); await db.doc(roomPath(G.code)).set(clone(G)); nudge('v'); } catch (e) { writeFailed(e); } }
  ACT.handTo = async d => { if (!isHost()) return; U.modal = null; G.host = d.id; hostOn = false; stopHost(); await flushDirect(); toast('Hosting handed over.'); render(); };
  ACT.takeHost = async () => {
    U.modal = null;
    try { const s = await db.doc(roomPath(U.code)).get(); if (s.exists) G = clone(s.data()); } catch (e) { }
    if (!G || !inRoom(ME_ID)) return;
    G.host = ME_ID; await flushDirect(); becomeHost(); toast('You’re the host now.'); render();
  };

  ACT.create = async () => {
    const name = U.name.trim();
    if (!name) { U.err = 'Type your name or nickname first.'; return; }
    if (U.busy) return false;
    U.busy = true; U.err = ''; render();
    try {
      let code = '';
      for (let i = 0; i < 6; i++) {
        code = Array.from({ length: 4 }, () => CODE_CH[Math.floor(Math.random() * CODE_CH.length)]).join('');
        const s = await db.doc(roomPath(code)).get();
        if (!s.exists) break;
      }
      G = freshRoom(code);
      G.players.push({ id: ME_ID, name, gender: U.gender, at: Date.now() });
      ME = blankMe(code);
      U.code = code;
      await db.doc(inpPath(code, ME_ID)).set(clone(ME));
      G.rev = 1; G.sentAt = Date.now();
      await db.doc(roomPath(code)).set(clone(G));
      hostOn = false;
      await subscribe(code);
      U.view = 'game';
      becomeHost();
    } catch (e) { G = null; U.code = ''; writeFailed(e); }
    U.busy = false;
  };
  ACT.join = async () => {
    const code = String(U.draft.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 4) { U.err = 'Type the room code (4 characters).'; return; }
    if (!U.name.trim()) { U.err = 'Type your name or nickname first.'; return; }
    U.err = ''; U.busy = true; render();
    await openRoom(code, true);
    U.busy = false;
  };
  async function openRoom(code, autoJoin) {
    G = null; ME = null; U.view = 'connecting';
    U.code = code;
    await loadMe(code);
    await subscribe(code);
    if (autoJoin && U.name.trim()) {
      const waitG = () => new Promise(res => { let n = 0; const t = setInterval(() => { if (G || !U.code || ++n > 40) { clearInterval(t); res(); } }, 250); });
      await waitG();
      if (G && !inRoom(ME_ID) && G.phase === 'lobby') await sendJoin();
    }
  }
  async function sendJoin() {
    ME = Object.assign(ME && ME.room === U.code ? ME : blankMe(U.code), { room: U.code, name: U.name.trim(), gender: U.gender, at: Date.now() });
    lsSet({ name: U.name.trim(), gender: U.gender });
    U.view = 'wait';
    await saveMe();
    render();
  }
  ACT.sendJoin = async () => { if (!U.name.trim()) { U.err = 'Type your name or nickname.'; return; } U.err = ''; await sendJoin(); };
  ACT.copyLink = () => {
    const link = ART_URL + '#room-' + G.code;
    try { navigator.clipboard.writeText(link).then(() => toast('Invite link copied.'), () => selectLink()); } catch (e) { selectLink(); }
    return false;
  };
  function selectLink() { const i = document.getElementById('lnk'); if (i) { i.focus(); i.select(); } toast('Copy the link from the box.'); }

  /* host controls */
  ACT.kick = H(d => { G.players = G.players.filter(p => p.id !== d.id); G.kicked[d.id] = true; });
  ACT.set = H(d => { G.settings[d.k] = +d.v; });
  ACT.startGame = H(() => {
    if (G.players.length < 3) { U.err = 'You need at least 3 players.'; return false; }
    U.err = ''; startGame();
  });
  ACT.itemsNext = H(() => {
    collectItems();
    if (!G.pool.some(x => !G.used.includes(x.id))) { toast('No items yet.'); return false; }
    G.needMore = false; startRound();
  });
  ACT.perksNext = H(() => { if (G.phase !== 'perks') return false; lockPerks(); });
  ACT.togglePerk = d => {
    const i = U.perks.indexOf(d.id);
    if (i >= 0) U.perks.splice(i, 1); else if (U.perks.length < 3) U.perks.push(d.id); else { toast('Only 3 perks. Remove one first.'); return false; }
  };
  ACT.sendPerks = async () => { mine().perks = { g: G.gameNo, list: U.perks.slice(), done: true }; render(); await saveMe(); };
  ACT.perk = d => { if (!perkState(ME_ID, d.id).ok) return false; U.modal = { type: 'perk', id: d.id }; };
  ACT.perkGo = d => {
    const m = U.modal, c = G.cur; if (!m || !c) return false;
    U.modal = null;
    sendReq({ type: 'perk', id: m.id, key: c.key, amt: d.amt ? +d.amt : 0, target: d.target || '' });
  };
  ACT.skip = H(() => { if (!roundStep(true)) return false; });
  ACT.nextRound = H(() => { if (!G.cur || G.cur.stage !== 'result') return false; startRound(); });
  ACT.rematch = H(() => { startGame(); });
  ACT.toLobby = H(() => { G.phase = 'lobby'; G.cur = null; G.prog = []; });

  /* my inputs */
  function mine() { ME = ME || blankMe(U.code); return ME; }
  ACT.sendItems = async () => {
    const list = [0, 1, 2].map(k => String(U.draft['it' + k] || '').trim()).filter(Boolean);
    if (!list.length) { U.err = 'Write at least one item.'; return; }
    U.err = ''; mine().items = { g: G.gameNo, r: G.itemsRound, list };
    [0, 1, 2].forEach(k => { U.draft['it' + k] = ''; });
    render(); await saveMe();
  };
  ACT.pick = d => { U.pick = d.v; };
  ACT.sendVote = async () => {
    const c = G.cur; if (!c || c.stage !== 'vote') return false;
    if (!U.pick) { toast('Pick an item first.'); return false; }
    mine().vote = { key: c.key, v: U.pick }; render(); await saveMe();
  };
  ACT.pm = d => { U.price = Math.min(PMAX, Math.max(PMIN, (U.price || G.settings.val) + (+d.v))); };
  ACT.pset = d => { U.price = +d.v; };
  ACT.sendPrice = async () => {
    const c = G.cur; if (!c || c.stage !== 'price' || (c.a !== ME_ID && c.b !== ME_ID)) return false;
    const side = c.a === ME_ID ? 'a' : 'b';
    mine().price = { key: c.key, side, ver: c.pv[side], v: U.price }; render(); await saveMe();
  };
  ACT.pitchDone = () => { const c = G.cur; if (!c) return false; sendReq({ type: 'done', key: c.key }); };
  ACT.sendBuy = async () => {
    const c = G.cur; if (!c || c.stage !== 'buy') return false;
    if (!U.pick) { toast('Choose: who to buy from, or pass.'); return false; }
    if ((U.pick === 'a' || U.pick === 'b') && c.prices[U.pick] > E(ME_ID).w) { toast('Not enough money in your wallet.'); return false; }
    mine().buy = { key: c.key, v: U.pick }; render(); await saveMe();
  };

  /* ---------- events ---------- */
  app.addEventListener('click', async e => {
    const el = e.target.closest('[data-act]');
    if (!el || !ACT[el.dataset.act]) return;
    if (el.dataset.act === 'ovClose' && e.target !== el) return;
    if (el.getAttribute('aria-disabled') === 'true' && el.dataset.act !== 'ovClose') return;
    const r = await ACT[el.dataset.act](el.dataset, el, e);
    if (r !== false) render();
  });
  app.addEventListener('input', e => {
    const el = e.target, b = el.dataset && el.dataset.bind;
    if (!b) return;
    if (b === 'name') { U.name = el.value; lsSet({ name: el.value.trim() }); }
    else if (b === 'code') U.draft.code = el.value.toUpperCase();
    else if (b === 'item') U.draft['it' + el.dataset.k] = el.value;
  });
  window.addEventListener('hashchange', () => {
    const h = (location.hash || '').match(/^#room-([A-Za-z0-9]{4,6})$/);
    if (h && h[1].toUpperCase() !== U.code && db && U.ready) { U.draft.code = h[1].toUpperCase(); U.fromLink = true; if (!U.code) render(); }
  });

  /* ---------- start ---------- */
  async function init() {
    const saved = lsGet();
    U.name = saved.name || ''; U.gender = saved.gender === 'f' ? 'f' : 'm';
    const h = (location.hash || '').match(/^#room-([A-Za-z0-9]{4,6})$/);
    if (h) { U.draft.code = h[1].toUpperCase(); U.fromLink = true; }
    render();
    const cl = typeof window.claude !== 'undefined' && window.claude && window.claude.use ? window.claude : null;
    let user = null;
    if (cl) {
      try { db = await cl.use('db'); } catch (e) { db = null; }
      try { user = await cl.use('user'); } catch (e) { user = null; }
      try { roomCap = await cl.use('room'); } catch (e) { roomCap = null; }
    }
    if (!db && window.__MZ_DB) db = window.__MZ_DB;
    let id = null;
    try { id = user && user.id ? await user.id() : null; } catch (e) { id = null; }
    if (!id) { id = saved.uid || ('l' + Math.random().toString(36).slice(2, 12)); lsSet({ uid: id }); }
    ME_ID = 'u' + String(id).replace(/[^A-Za-z0-9_\-~:@+]/g, '_').slice(0, 120);
    try { canWrite = user && user.can ? await user.can('data.write') : null; } catch (e) { canWrite = null; }
    if (canWrite === false) U.offline = 'perm';
    U.ready = true;
    const code = h ? h[1].toUpperCase() : (saved.code || '');
    if (db && code) {
      await loadMe(code);
      if (!h || (ME && ME.room === code)) await subscribe(code);
      else U.code = '';
    }
    render();
  }
  if (TEST) window.__mz = () => ({ G, ME, ME_ID, U, host: isHost(), skew, INP, ACT, roundStep, setInputs: m => { INP = m; hostStep(); } });
  init();
})();

</script>
