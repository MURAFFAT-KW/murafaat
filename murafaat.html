/* buttons */

  font-weight:600;font-size:1rem;cursor:pointer;text-align:center;transition:transform .08s,border-color .15s,background .15s;
}
.btn:hover{border-color:var(--cyan)}
.btn:active{transform:scale(.985)}

.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(222,9,33,.28)}

.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}

.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}

/* surfaces */
.card{background:var(--panel);box-shadow:0 10px 30px rgba(18,32,58,.07);border:1px solid var(--line-soft);border-radius:var(--r);padding:20px;min-width:0}
.card h2{font-size:1.35rem;margin-bottom:6px}
.card h3{font-size:1.1rem}
.sect-title{font-family:var(--font-d);font-size:1.05rem;color:var(--cyan);margin-bottom:10px}
.alert{border:1px solid var(--bad);background:rgba(192,22,31,.1);color:#9E1219;border-radius:12px;padding:12px 16px}
.note{border:1px solid var(--line);background:var(--bg-2);border-radius:12px;padding:12px 16px;color:var(--muted);font-size:.93rem}
.note b{color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);font-size:.82rem;font-weight:600;white-space:nowrap}
.chip.gold{border-color:var(--gold);color:var(--gold)}

.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}

/* home */
.hero{padding:34px 22px 26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}

.hero h1 em{font-style:normal;color:var(--gold)}
.hero .en{font-family:var(--font-d);letter-spacing:.32em;color:var(--cyan);font-size:.95rem}

.hero .btn-row{width:100%;max-width:520px;margin-top:6px}
.howto{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:12px}
.howto li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.howto li::before{counter-increment:s;content:counter(s);width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:700}

/* players */
.prow{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;padding:12px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}
.prow .fields{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.prow input{flex:1 1 150px;min-width:0}
.field{background:var(--bg);border:1px solid var(--line);border-radius:12px;min-height:50px;padding:8px 14px;width:100%}
textarea.field{min-height:92px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 16px;min-height:46px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--blue);color:#fff}
.seg-wide{display:flex;flex-wrap:wrap;gap:10px}
.seg-wide button{flex:1 1 90px;min-height:50px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);cursor:pointer;font-weight:600}
.seg-wide button.on{border-color:var(--cyan);color:var(--ink);background:var(--cyan)}
.x{width:46px;height:46px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;font-size:1.3rem;line-height:1}
.x:hover{border-color:var(--bad);color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.opt-card{border:1px solid var(--line);border-radius:14px;background:var(--bg-2);padding:14px 16px;cursor:pointer;text-align:start;min-height:70px}
.opt-card.on{border-color:var(--cyan);background:rgba(222,9,33,.1)}
.opt-card b{display:block}
.labelled{display:flex;flex-direction:column;gap:8px}
.labelled>label,.lbl{font-weight:600;color:var(--text)}

/* pass-the-device */
.pass{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 20px}
.pass h2{font-size:2rem;margin:0}
.pass .kick{color:var(--cyan);font-weight:600}
.pass .btn{max-width:420px}

/* perk picking */
.perk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.perk-pick{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:start;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);padding:14px 16px;cursor:pointer;min-height:92px}
.perk-pick b{font-family:var(--font-d);font-size:1.05rem}
.perk-pick span.d{grid-column:1/-1;color:var(--muted);font-size:.9rem}
.perk-pick.on{border-color:var(--gold);background:rgba(222,9,33,.09)}
.perk-pick.off{opacity:.5}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.on .tick{border-color:var(--gold);background:var(--gold);color:var(--gold-ink)}

/* answers */
.qa{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}
.qa .qt{font-weight:600}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.qlist li{padding:12px 16px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg-2)}

/* case */
.casehead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.qcard{text-align:center;padding:24px 18px}
.qcard .qlabel{color:var(--gold);font-weight:600;font-size:.9rem;letter-spacing:.04em}
.qcard h2{font-size:clamp(1.4rem,4.6vw,2rem);margin-top:6px}
.parties{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.parties{grid-template-columns:1fr 1fr}}
.party{border:1px solid var(--line-soft);background:var(--panel);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.party.speaking{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.ptop{display:flex;gap:8px;flex-wrap:wrap}
.pid{display:flex;align-items:center;gap:12px;min-width:0}
.pid h3{overflow-wrap:anywhere}
.defend{border-radius:12px;background:var(--bg-2);padding:10px 14px;border:1px dashed var(--line)}
.defend strong{display:block;font-size:1.15rem;color:var(--gold);overflow-wrap:anywhere}
.helper{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--muted)}
.perks{display:flex;flex-wrap:wrap;gap:8px}
.perk{min-height:44px;padding:6px 14px;border-radius:12px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-weight:600;font-size:.92rem;cursor:pointer}
.perk.na{border-color:var(--line);color:var(--muted)}
.perk.used{border-color:var(--line-soft);color:var(--muted);text-decoration:line-through;cursor:not-allowed}
.perk.set{background:var(--gold);color:var(--gold-ink)}
.witness{border:1px solid var(--blue);border-radius:14px;background:rgba(222,9,33,.1);padding:14px 16px}
.witness b{color:var(--cyan)}
.timerbox{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media(max-width:520px){.timerbox{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .bg{stroke:var(--line-soft)}
.ring .fg{stroke:var(--cyan);transition:stroke-dashoffset .25s linear}
.ring.low .fg{stroke:var(--bad)}
.ring.ended .fg{stroke:var(--bad)}
.clock{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-size:2.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.tctl>.btn{flex:1 1 120px;min-height:50px}
.tcontrols{display:flex;flex-direction:column;gap:10px;min-width:0;width:100%}
.timeup{border:1px solid var(--bad);color:#9E1219;background:rgba(192,22,31,.12);border-radius:12px;padding:10px 14px;font-weight:700;text-align:center}
.notes{display:grid;gap:6px;font-size:.92rem;color:var(--muted)}

/* voting */
.vkind{display:flex;flex-direction:column;gap:6px;border-radius:14px;padding:14px 16px;border:1px solid var(--cyan);background:rgba(222,9,33,.08)}
.vkind.appeal{border-color:var(--gold);background:rgba(222,9,33,.09)}
.vkind b{font-family:var(--font-d);font-size:1.15rem}
.vopts{display:grid;gap:14px}
.vopt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;min-height:78px;padding:12px 16px;border:2px solid var(--line);border-radius:16px;background:var(--bg-2);cursor:pointer;text-align:start}
.vopt.on{border-color:var(--cyan);background:rgba(222,9,33,.12)}
.vopt .vt{display:flex;flex-direction:column;min-width:0}
.vopt .vt b{font-size:1.1rem;overflow-wrap:anywhere}
.vopt .vt span{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.vopt.none{grid-template-columns:1fr auto;border-style:dashed}
.radio{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.on .radio{border-color:var(--cyan);background:var(--cyan);color:var(--ink)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:130px 1fr 36px;align-items:center;gap:10px}
@media(max-width:520px){.bar{grid-template-columns:90px 1fr 30px}}
.bar .track{height:16px;border-radius:99px;background:var(--bg);border:1px solid var(--line-soft);overflow:hidden}
.bar .fill{height:100%;background:var(--blue);border-radius:99px}
.bar.lead .fill{background:var(--gold)}
.bar .nm{overflow-wrap:anywhere;font-weight:600}
.verdict{text-align:center;padding:22px 16px;border:1px solid var(--gold);background:rgba(222,9,33,.08);border-radius:var(--r)}
.verdict h2{color:var(--gold);font-size:1.6rem}
.jrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg-2)}

/* scoreboard */
.rank{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank li{display:grid;grid-template-columns:40px auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}
.rank li.win{border-color:var(--gold);background:rgba(222,9,33,.1)}
.rank .pos{font-family:var(--font-d);font-size:1.3rem;color:var(--muted);text-align:center}
.rank .win .pos{color:var(--gold)}
.rank .pts{font-family:var(--font-d);font-size:1.4rem;color:var(--gold);font-variant-numeric:tabular-nums}
.winner{text-align:center;padding:26px 16px;border:1px solid var(--gold);border-radius:var(--r);background:rgba(222,9,33,.09);display:flex;flex-direction:column;align-items:center;gap:8px}
.winner h2{font-size:clamp(1.8rem,6vw,2.6rem);color:var(--gold)}
.cases{display:grid;gap:12px}
.cr{border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2);padding:14px 16px;display:grid;gap:6px}
.cr .q{font-weight:700}
.cr .v{display:flex;flex-wrap:wrap;gap:8px}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(18,32,58,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0;overflow:auto}

.dlg{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px;direction:rtl}

.cands{display:grid;gap:10px}

.cand:hover{border-color:var(--cyan)}

.splash{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:40px 8px;position:relative}

.bigcode{font-family:var(--font-d);font-weight:900;font-size:clamp(2.6rem,13vw,3.6rem);letter-spacing:.18em;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-inline-start:.18em}

.linkrow .btn{flex:0 0 auto;min-height:46px}
.code-in{font-family:var(--font-d);font-size:1.4rem;letter-spacing:.3em;text-align:center;text-transform:uppercase}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 4px;border-radius:99px;border:1px solid var(--line-soft);background:var(--bg-2);color:var(--muted);font-size:.9rem}
.pchip.ok{border-color:var(--ok);color:var(--ok);background:rgba(23,147,90,.07)}
.party.mine{box-shadow:0 0 0 2px var(--gold) inset}
.card.action{border:2px solid var(--cyan);background:#FFF5F6}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line-soft);border-top-color:var(--cyan);animation:spin 1s linear infinite}

  function hostStep() {

  /* ---------- game setup (host) ---------- */
  function buildPool() {

    const n = Math.min(list.length, Math.max(G.settings.questions || 3, G.players.length * (G.settings.rounds || 1)));

    G.pool = pool.map(x => x.id);

  function startAnswers(qids, ret) {

  }
  function collectAnswers() {

  /* ---------- case logic (host) ---------- */
  const IDX = { intro: 0, prep: 1, plea1: 2, plea2: 3, reply1: 4, reply2: 5 };
  function newCase(qid, pair, keepUsed) {
    const used = {};
    if (keepUsed) Object.keys(keepUsed).forEach(k => { if (k.endsWith(':swap')) used[k] = true; });
    G.appear[pair.A] = (G.appear[pair.A] || 0) + 1;
    G.appear[pair.B] = (G.appear[pair.B] || 0) + 1;
    return {
      qid, A: pair.A, B: pair.B, defA: ansOf(qid, pair.B), defB: ansOf(qid, pair.A), stage: 'intro', helper: { A: null, B: null }, witness: null,
      used, doubles: { A: false, B: false }, bonus: { A: 0, B: 0 }, penalty: { A: 0, B: 0 }, notes: [], spk: { A: 'main', B: 'main' },
      timer: { total: 1, remaining: 0, running: false, done: false, started: false, endsAt: 0 }, jurors: [], vote: null, v1: null, o1: null,
      appeal: null, appealUsed: false, rounds: [], lastT: null, final: null, obj: null, pk: null, teamCands: null, witCands: [], jurorsNow: []

  }
  function pairFor(qid) { return formPair(G.players, ANS[qid] || {}, G.appear); }
  function startCase() {
    G.nocase = null;

    const qid = G.order[G.caseNo];
    const pair = pairFor(qid);
    if (!pair) {
      const vals = G.players.map(p => norm(ansOf(qid, p.id))).filter(Boolean);
      G.cur = null; G.phase = 'nocase'; G.nocase = { n: vals.length, d: new Set(vals).size }; return;
    }
    G.cur = newCase(qid, pair); G.phase = 'case';

  function jurorsNow() {
    const c = G.cur, ex = [c.A, c.B, c.helper.A, c.helper.B];

  }
  function helperCands(side) {
    const c = G.cur, other = side === 'A' ? 'B' : 'A';
    const mine = norm(ansOf(c.qid, c[side])), defended = norm(ansOf(c.qid, c[other]));
    if (jurorsNow().length < 2) return [];
    const taken = [c.A, c.B, c.helper.A, c.helper.B, c.witness && c.witness.pid];
    return G.players.filter(p => !taken.includes(p.id)).filter(p => { const a = norm(ansOf(c.qid, p.id)); return a && a !== mine && a !== defended; });
  }
  function witnessCands() {

  /* swap keeps the same two players: the new question must have different answers from both of them */

  }
  const no = r => ({ ok: false, reason: r });
  function speakerSide() { const s = G.cur.stage; return s === 'plea1' || s === 'reply1' ? 'A' : (s === 'plea2' || s === 'reply2' ? 'B' : null); }
  function perkState(side, id) {
    const c = G.cur, pid = c[side], p = P(pid);
    if (!p.perks.includes(id)) return null;
    if (c.used[pid + ':' + id]) return no('استُخدمت هذه الميزة في هذا السؤال.');
    if (c.obj || (c.witness && c.witness.pending)) return no('انتظر انتهاء الإجراء الحالي.');
    const i = IDX[c.stage];
    if (i === undefined) return no('لا تُستخدم المزايا في هذه المرحلة.');
    switch (id) {
      case 'team':
        if (i > 1) return no('تُستخدم قبل بدء المرافعات.');
        if (c.helper[side]) return no('اخترت مساعدًا بالفعل.');
        if (!helperCands(side).length) return no('لا يوجد لاعب مؤهل: يجب أن تختلف إجابته عن إجابتك وعن الرأي الذي تدافع عنه، ويبقى محلف واحد على الأقل.');

        break;
      case 'double':

        break;

  function enterStage(st) {

    else if (st === 'plea2') { total = s.plead; side = 'B'; }
    else if (st === 'reply1') { total = SEC('replySec') + c.bonus.A; side = 'A'; }
    else if (st === 'reply2') { total = SEC('replySec') + c.bonus.B; side = 'B'; }
    if (side && c.penalty[side]) { total = Math.max(15, total - c.penalty[side]); c.penalty[side] = 0; }

  }
  function startVote(kind, round) {

  function voteStep() {

        c.notes.push('اعتراض ' + P(c[side]).name + ' مقبول (' + yes + '-' + nay + '): خُصمت 15 ثانية من ' + P(c[other]).name + '.');
      } else {

        c.notes.push('اعتراض ' + P(c[side]).name + ' مرفوض (' + yes + '-' + nay + '): تُخصم 15 ثانية من وقته القادم.');

  /* Every in-case request from a player's phone lands here (the host's own too). */
  function applyReq(id, r) {

    }

      case 'reply':
        c.used[key] = true;
        if (c.stage === (side === 'A' ? 'reply1' : 'reply2')) addT(BONUS); else c.bonus[side] += BONUS;
        c.notes.push(who.name + ' ' + gv(who, 'سيحصل', 'ستحصل') + ' على 30 ثانية إضافية في الرد.'); break;
      case 'double': c.used[key] = true; c.doubles[side] = true; c.notes.push('نقاط ' + who.name + ' مضاعفة إن ' + gv(who, 'فاز', 'فازت') + '.'); break;
      case 'team': {
        if (!helperCands(side).some(p => p.id === r.pid)) return false;
        const h = P(r.pid);
        c.helper[side] = r.pid; c.used[key] = true;
        c.notes.push(h.name + ' ' + gv(h, 'انضم', 'انضمت') + ' إلى فريق ' + who.name + ' ' + gv(h, 'وخرج', 'وخرجت') + ' من هيئة المحلفين.'); break;
      }

  /* ---------- views ---------- */

            (host ? '<button class="btn" data-act="noAppeal">المتابعة دون استئناف</button>' : (ms ? '' : '<p class="muted small">بانتظار قرار الطرفين والمضيف.</p>')) + '</section>';
        }
      }
      return '<div class="vkind"><b>نتيجة التصويت الأول</b><span class="muted">هذه أصوات هيئة المحلفين.</span></div>' +
        '<section class="card" style="display:grid;gap:16px">' + bars(c.v1, ['A', 'B', 'none'], labels, o.leader) + '<p><b>' + msg + '</b></p></section>' + appealBox +
        (o.appealable ? '' : (host ? '<button class="btn xl primary" data-act="noAppeal">اعتماد النتيجة واحتساب النقاط</button>' : '<p class="muted" style="text-align:center">بانتظار المضيف يعتمد النتيجة.</p>'));
    }
    const out = appealOutcome(c.lastT);
    const last = c.rounds[c.rounds.length - 1];
    const ttl = last.kind === 'appeal' ? 'نتيجة تصويت الاستئناف' : 'نتيجة الجولة الفاصلة';
    return '<div class="vkind appeal"><b>' + ttl + '</b><span class="muted">اكتمل التصويت.</span></div>' +
      '<section class="card" style="display:grid;gap:16px">' + bars(c.lastT, ['A', 'B'], labels, out === 'tie' ? null : out) + '<p><b>' + (out === 'tie' ? 'تعادل الطرفان. تُفتح جولة تصويت فاصلة بخيارين فقط.' : 'فاز ' + esc(P(c[out]).name) + ' بتصويت الاستئناف.') + '</b></p></section>' +
      (!host ? '<p class="muted" style="text-align:center">بانتظار المضيف.</p>' : (out === 'tie' ? '<button class="btn xl gold" data-act="tiebreak">بدء الجولة الفاصلة</button>' : '<button class="btn xl primary" data-act="finalAppeal">اعتماد الحكم النهائي واحتساب النقاط</button>'));
  }
  function outcomeText(o, A, B) {
    if (o === 'A' || o === 'B') return 'فاز ' + esc((o === 'A' ? A : B).name);
    if (o === 'none') return 'لا أحد: لم يقتنع المحلفون بأي طرف';
    return 'تعادل دون استئناف';
  }
  function scoreMini() {
    return '<div class="seg-wide" style="gap:8px">' + G.players.slice().sort((a, b) => b.score - a.score).map(p => '<span class="chip' + (p.score ? ' gold' : '') + '">' + esc(p.name) + ' <b class="num">' + p.score + '</b></span>').join('') + '</div>';
  }
  function doneView() {
    const c = G.cur, f = c.final, A = P(c.A), B = P(c.B);
    const last = G.caseNo + 1 >= G.order.length;
    return '<div class="verdict"><p class="muted">حكم السؤال ' + (G.caseNo + 1) + '</p><h2>' + outcomeText(f.outcome, A, B) + '</h2>' +
      '<p>' + (f.by === 'appeal' ? 'انتهت بتصويت الاستئناف (الحكم النهائي).' : 'انتهت بالتصويت الأول.') + '</p>' +
      '<p style="margin-top:8px">' + (f.pts ? '<span class="chip gold">' + f.pts + ' نقاط' + (f.doubled ? ' (مضاعفة)' : '') + '</span>' : '<span class="chip">لا نقاط في هذا السؤال</span>') + '</p></div>' +
      '<section class="card" style="display:grid;gap:10px"><h3>الترتيب الحالي</h3>' + scoreMini() + '</section>' +
      (isHost() ? '<button class="btn xl primary" data-act="nextCase">' + (last ? 'عرض النتيجة النهائية' : 'السؤال التالي') + '</button>' : '<p class="muted" style="text-align:center">بانتظار المضيف.</p>');
  }
  function caseTopSmall() {
    const c = G.cur;
    return '<div class="casehead"><span class="chip gold">السؤال ' + (G.caseNo + 1) + ' من ' + G.order.length + '</span><span class="chip">' + esc(P(c.A).name) + ' ضد ' + esc(P(c.B).name) + '</span></div>';
  }
  function caseView() {
    const st = G.cur.stage;
    if (st === 'vote') return caseTopSmall() + voteView();

    if (st === 'done') return caseTopSmall() + doneView();
    return speakingView();
  }
  function finalView() {
    const ps = G.players.slice().sort((a, b) => b.score - a.score);
    const top = ps.length ? ps[0].score : 0;
    let pos = 0, prev = null;
    const rows = ps.map((p, i) => { if (p.score !== prev) { pos = i + 1; prev = p.score; } return { p, pos }; });
    const winners = ps.filter(p => p.score === top && top > 0);
    const head = !winners.length ? '<div class="winner"><h2>لا فائز</h2><p class="muted">انتهت الأسئلة بلا نقاط.</p></div>' :
      '<div class="winner">' + (winners.length === 1 ? avatar(winners[0], 84) : '') + '<span class="chip gold">' + (winners.length === 1 ? 'الفائز بالمباراة' : 'تعادل في الصدارة') + '</span><h2>' + winners.map(w => esc(w.name)).join(' و ') + '</h2><p class="muted num">' + top + ' نقاط</p></div>';
    const cases = G.results.map(r => {
      if (r.skipped) return '<div class="cr"><div class="q">السؤال ' + r.no + ': ' + esc(r.qText) + '</div><span class="muted small">أُلغيت لعدم وجود إجابتين مختلفتين.</span></div>';
      const v1 = r.v1;
      const oc = r.outcome === 'A' || r.outcome === 'B' ? 'فاز ' + esc(r[r.outcome].name) : (r.outcome === 'none' ? 'لا أحد' : 'تعادل');
      return '<div class="cr"><div class="q">السؤال ' + r.no + ': ' + esc(r.qText) + '</div>' +
        '<div>' + esc(r.A.name) + ' <span class="muted">ضد</span> ' + esc(r.B.name) + (r.helperA || r.helperB ? ' <span class="muted small">· فريق: ' + [r.helperA, r.helperB].filter(Boolean).map(esc).join('، ') + '</span>' : '') + '</div>' +
        '<div class="v"><span class="chip">التصويت الأول: ' + esc(r.A.name) + ' ' + v1.A + ' · ' + esc(r.B.name) + ' ' + v1.B + ' · لا أحد ' + v1.none + '</span>' +
        r.rounds.map(x => '<span class="chip gold">' + (x.kind === 'appeal' ? 'الاستئناف' : 'جولة فاصلة') + ': ' + x.A + ' - ' + x.B + '</span>').join('') + '</div>' +
        '<div class="v"><span class="chip ' + (r.pts ? 'ok' : '') + '">' + oc + '</span><span class="chip">' + (r.by === 'appeal' ? 'انتهت بالاستئناف' : 'انتهت بالتصويت الأول') + '</span>' + (r.pts ? '<span class="chip gold">' + r.pts + ' نقاط' + (r.doubled ? ' (مضاعفة)' : '') + '</span>' : '') + '</div></div>';
    }).join('');
    return podiumCard(ps.map(p => ({ name: esc(p.name), pts: p.score }))) +
      '<section class="card" style="display:grid;gap:12px"><h2>نتائج الأسئلة</h2><div class="cases">' + (cases || '<p class="muted">لا توجد أسئلة.</p>') + '</div></section>' +
      (isHost() ? '<div class="btn-row"><button class="btn primary" data-act="rematch">إعادة اللعب بنفس اللاعبين</button><button class="btn" data-act="toLobby">الرجوع للردهة</button></div>' : '<p class="muted" style="text-align:center">المضيف يقدر يبدأ جولة جديدة.</p>');
  }

  function modalView() {
    const m = U.modal;

        (!host && G && inRoom(ME_ID) ? '<button class="btn" data-act="askTake">المضيف ما يرد؟ استلم الاستضافة</button>' : '') +

    } else if (m.type === 'hand') {
      body = '<h2>اختر المضيف الجديد</h2><div class="cands">' + G.players.filter(p => p.id !== ME_ID).map(p => '<button class="cand" data-act="handTo" data-id="' + p.id + '">' + avatar(p, 40) + '<b>' + esc(p.name) + '</b></button>').join('') + '</div><button class="btn ghost" data-act="closeModal">إلغاء</button>';
    } else if (m.type === 'leave') {
      const warn = isHost() && G && G.players.length > 1 ? 'أنت المضيف. بننقل الاستضافة تلقائيًا للاعب ثاني.' : 'تقدر ترجع للغرفة بنفس الرمز.';
      body = '<h2>الخروج من الغرفة؟</h2><p class="muted">' + warn + '</p><div class="btn-row"><button class="btn danger" data-act="leave">خروج</button><button class="btn" data-act="closeModal">إلغاء</button></div>';
    } else if (m.type === 'force') {
      body = '<h2>متابعة بدون الباقين؟</h2><p class="muted">اللي ما أكمل بيُعتبر بدون ' + (G.phase === 'perks' ? 'مزايا' : (G.phase === 'qwrite' ? 'أسئلة' : 'إجابات')) + ' في هذه المرحلة.</p><div class="btn-row"><button class="btn primary" data-act="forceGo">متابعة</button><button class="btn" data-act="closeModal">إلغاء</button></div>';
    } else if (m.type === 'team') {
      const cands = (G.cur.teamCands || {})[m.side] || [];
      body = '<h2>اختر المساعد</h2><p class="muted">اللاعبون اللي إجابتهم تختلف عن إجابتك وعن الرأي اللي تدافع عنه. المساعد يطلع من هيئة المحلفين.</p><div class="cands">' + cands.map(id => '<button class="cand" data-act="pickHelper" data-pid="' + id + '">' + avatar(P(id), 44) + '<b>' + esc(P(id).name) + '</b></button>').join('') + '</div><button class="btn ghost" data-act="closeModal">إلغاء</button>';
    } else if (m.type === 'wit') {

  }

  function hostOnlyView() {
    const note = '<section class="card pass"><h2>أنت المضيف</h2><p class="muted">ما تلعب بهذي اللعبة. تتابع اللاعبين وتنقل اللعبة بين المراحل.</p></section>';

    if (G.phase === 'qwrite') return note + progBox('كتابة الأسئلة') + hostNext('عرض أسئلة المجموعة', 'qwriteNext');
    if (G.phase === 'answers') return note + progBox('الإجابات السرية') + hostNext(G.ansReturn === 'start' ? 'بدء الأسئلة' : 'متابعة السؤال', 'answersNext');

  }
  function gameView() {

      case 'lobby': return lobbyView();
      case 'perks': return perksView();
      case 'qwrite': return qwriteView();

  }

  /* ---------- render ---------- */
  function render() {

      else if (U.view === 'join') html += joinView();

    U.lastHtml = html;
    if (fid) { const el = document.getElementById(fid); if (el) { try { el.focus({ preventScroll: true }); if (ss != null) el.setSelectionRange(ss, se); } catch (e) { } } }
    if (key !== U.lastKey) { window.scrollTo(0, 0); U.lastKey = key; } else window.scrollTo(0, y);
  }

  /* ---------- actions ---------- */
  const ACT = {};
  const H = fn => (...a) => { if (!isHost()) return false; const r = fn(...a); if (r !== false) publish(); return r; };

  ACT.enter = () => { U.splash = false; };
  ACT.noticeOk = () => { U.notice = false; try { const m = (location.hash || '').match(/^#room-([A-Za-z0-9]{4,6})$/); if (m) sessionStorage.setItem('aq.notice.' + m[1].toUpperCase(), '1'); } catch (e) { } window.scrollTo(0, 0); };
  ACT.myGender = d => { U.gender = d.g; lsSet({ gender: d.g }); };

  ACT.ovClose = (d, el, ev) => { if (ev.target !== el) return false; U.modal = null; U.err = ''; };
  ACT.menu = () => { U.modal = { type: 'menu' }; };
  ACT.askLeave = () => { U.modal = { type: 'leave' }; };
  ACT.askTake = () => { U.modal = { type: 'take' }; };

  ACT.leave = async () => {

  };
  async function flushDirect() { try { G.rev = (G.rev || 0) + 1; G.sentAt = Date.now(); await db.doc(roomPath(G.code)).set(clone(G)); nudge('v'); } catch (e) { writeFailed(e); } }
  ACT.handTo = async d => { if (!isHost()) return; U.modal = null; G.host = d.id; hostOn = false; stopHost(); await flushDirect(); toast('انتقلت الاستضافة.'); render(); };
  ACT.takeHost = async () => {
    U.modal = null;
    try { const s = await db.doc(roomPath(U.code)).get(); if (s.exists) G = clone(s.data()); } catch (e) { }
    if (!G || !inRoom(ME_ID)) return;
    G.host = ME_ID; await flushDirect(); becomeHost(); toast('صرت المضيف.'); render();
  };

  ACT.create = async () => {
    if (U.fromLink || isGuest()) return false;
    const name = U.name.trim();
    if (!name) { U.err = 'اكتب اسمك أو لقبك أول.'; return; }
    if (U.busy) return false;
    U.busy = true; U.err = ''; render();
    try {
      let code = '';
      for (let i = 0; i < 6; i++) {
        code = Array.from({ length: 4 }, () => CODE_CH[Math.floor(Math.random() * CODE_CH.length)]).join('');
        const s = await db.doc(roomPath(code)).get();
        if (!s.exists) break;
      }
      G = freshRoom(code);
      G.players.push({ id: ME_ID, name, gender: U.gender, perks: [], score: 0, at: Date.now() });
      ME = blankMe(code);
      U.code = code;
      await db.doc(inpPath(code, ME_ID)).set(clone(ME));
      G.rev = 1; G.sentAt = Date.now();

    U.busy = false;
  };
  ACT.join = async () => {

    U.busy = false;
  };
  async function openRoom(code, autoJoin) {

    await loadMe(code);
    await subscribe(code);
    if (autoJoin && U.name.trim()) {

  }
  async function sendJoin() {
    ME = Object.assign(ME && ME.room === U.code ? ME : blankMe(U.code), { room: U.code, name: U.name.trim(), gender: U.gender, at: Date.now() });

  ACT.sendJoin = async () => { if (!U.name.trim()) { U.err = 'اكتب اسمك أو لقبك.'; return; } U.err = ''; await sendJoin(); };
  ACT.copyLink = (d, el) => {
    const link = ART_URL + '#room-' + G.code;
    try { navigator.clipboard.writeText(link).then(() => toast('نسخنا رابط الدعوة.'), () => selectLink()); } catch (e) { selectLink(); }
    return false;
  };
  function selectLink() { const i = document.getElementById('lnk'); if (i) { i.focus(); i.select(); } toast('انسخ الرابط من الخانة.'); }

  /* lobby (host) */
  ACT.kick = H(d => { G.players = G.players.filter(p => p.id !== d.id); G.kicked[d.id] = true; });
  ACT.step = H(d => {
    const s = G.settings; if (G.phase !== 'lobby') return false;
    const L = { players: [3, 25], rounds: [1, 5], questions: [3, s.source === 'preset' ? PACKN : 60] }[d.k]; if (!L) return false;
    const old = s[d.k];
    s[d.k] = Math.min(L[1], Math.max(L[0], (+s[d.k] || L[0]) + (+d.v)));
    const need = (s.players || 3) * (s.rounds || 1);
    if (s.source === 'preset' && need > PACKN) { s[d.k] = old; toast('الأسئلة الجاهزة ' + PACKN + ' بس لكل مجموعة. قلّل اللاعبين أو الجولات، أو اختر «أسئلة اللاعبين».'); return false; }
    s.questions = Math.max(s.questions || 0, need);
  });
  ACT.endVote = H(() => { const c = G.cur; if (!c || c.stage !== 'vote' || !c.vote) return false; c.vote.endsAt = Date.now() - 1; });
  ACT.endObj = H(() => { const c = G.cur; if (!c || !c.obj) return false; c.obj.endsAt = Date.now() - 1; });
  ACT.set = H(d => { const v = d.k === 'source' || d.k === 'pack' ? d.v : +d.v; G.settings[d.k] = v; if (d.k === 'source' && v === 'preset') { const s = G.settings; if ((s.players || 3) * (s.rounds || 1) > PACKN) s.rounds = Math.max(1, Math.floor(PACKN / (s.players || 3))); s.questions = Math.min(Math.max(s.questions, (s.players || 3) * s.rounds), PACKN); } });
  ACT.startGame = H(() => {
    const tgt = G.settings.players || 3, real = G.players.length - (G.settings.hostPlays === 0 ? 1 : 0);
    if (real !== tgt) { U.err = real > tgt ? 'دخل لاعبين أكثر من العدد المحدد. زد عدد اللاعبين أو أزل لاعب.' : 'بانتظار ' + (tgt - real) + ' لاعبين.'; return; }
    U.err = '';
    if (G.settings.hostPlays === 0) { G.hostP = G.players.find(p => p.id === ME_ID) || G.hostP; G.players = G.players.filter(p => p.id !== ME_ID); }
    G.gameNo = (G.gameNo || 0) + 1; G.phase = 'perks'; G.prog = []; G.cur = null; G.results = [];
    G.players.forEach(p => { p.perks = []; p.score = 0; });
  });

  ACT.confirmPerks = async () => { ME = ME || blankMe(U.code); ME.perks = { g: G.gameNo, list: U.perks.slice(0, 3), done: true }; await saveMe(); };

    G.players.forEach(p => { const x = inp(p.id).perks; p.perks = x && x.g === G.gameNo && x.done ? (x.list || []).filter(id => PERKS.some(k => k.id === id)).slice(0, 3) : []; });
    G.prog = [];
    if (G.settings.source === 'custom') { G.questions = []; G.phase = 'qwrite'; }

    if (new Set(list.map(norm)).size !== list.length) { U.err = 'اكتب أسئلة مختلفة.'; return; }
    U.err = ''; ME = ME || blankMe(U.code); ME.qs = { g: G.gameNo, list: list.map(t => t.slice(0, 90)) }; for (let k = 0; k < 10; k++) U.draft['q' + k] = '';
    await saveMe();
  };
  function qwriteProceed() {
    const qs = [], seen = [];
    G.players.forEach(p => { const x = inp(p.id).qs; if (x && x.g === G.gameNo) (x.list || []).forEach(t => { t = String(t).trim(); if (t.length >= 4 && !seen.includes(norm(t))) { seen.push(norm(t)); qs.push({ id: uid('q'), text: t }); } }); });
    G.questions = qs; G.qmap = {};
    qs.forEach(q => (G.qmap[q.id] = { id: q.id, text: q.text, opts: null }));
    G.qShown = shuffle(qs.map(q => q.id)); G.phase = 'qreview'; G.prog = [];
  }
  ACT.qwriteNext = H(() => { if ((G.prog || []).length < G.players.length) return false; qwriteProceed(); });
  ACT.startAnswers = H(() => { buildPool(); });

  /* answers */
  ACT.submitAnswers = async () => {
    const a = {};
    G.ansQueue.forEach(qid => (a[qid] = String(U.draft[qid] || '').trim().slice(0, 40)));
    ME = ME || blankMe(U.code); ME.ans = { r: G.ansRound, a };
    G.ansQueue.forEach(qid => delete U.draft[qid]);
    await saveMe();
  };
  function answersProceed() {

    G.prog = [];
    if (G.ansReturn === 'start') G.caseNo = 0;
