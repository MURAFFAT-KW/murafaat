<title>أقنعني! | مرافعات</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one centred column; the two parties sit side by side from 720px; every phase is a single focused screen. */
:root{
  --bg:#FFF8F4; --bg-2:#FFF3EC; --panel:#FFFFFF; --panel-2:#FFFFFF; --line:#F4CDB5; --line-soft:#F8E2D4;
  --text:#2B1510; --muted:#86675C; --blue:#FF8A3D; --cyan:#F2601D; --gold:#DC1F2B; --gold-ink:#FFFFFF; --ink:#FFFFFF;
  --ok:#17935A; --bad:#C0161F; --warn:#F2601D;
  --grad:linear-gradient(135deg,#FF8A1F 0%,#F2601D 45%,#DC1F2B 100%);
  --r:16px;
  --font-d:'Alexandria','Readex Pro',Tahoma,sans-serif;
  --font-b:'Readex Pro','Alexandria','Segoe UI',Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  background-color:var(--bg);
  background-image:radial-gradient(900px 420px at 50% -8%,rgba(255,138,31,.16),transparent 70%);
  color:var(--text); font-family:var(--font-b); font-size:16px; line-height:1.65; direction:rtl;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px; min-height:100%;
}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--font-d);font-weight:700;text-wrap:balance;line-height:1.3}
.wrap{max-width:880px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 4px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--font-d);font-size:1.35rem;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:.85rem;letter-spacing:.08em}
.top-r{display:flex;align-items:center;gap:10px}
.saved{color:var(--muted);font-size:.8rem;white-space:nowrap}
@media(max-width:480px){.brand span,.saved{display:none}}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;
  border:1px solid var(--line);border-radius:14px;background:var(--panel-2);color:var(--text);
  font-weight:600;font-size:1rem;cursor:pointer;text-align:center;transition:transform .08s,border-color .15s,background .15s;
}
.btn:hover{border-color:var(--cyan)}
.btn:active{transform:scale(.985)}
.btn:focus-visible,.chipbtn:focus-visible,.perk:focus-visible,.vopt:focus-visible,.seg button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(242,96,29,.28)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}

/* surfaces */

.sect-title{font-family:var(--font-d);font-size:1.05rem;color:var(--cyan);margin-bottom:10px}
.alert{border:1px solid var(--bad);background:rgba(192,22,31,.1);color:#9E1219;border-radius:12px;padding:12px 16px}
.note{border:1px solid var(--line);background:var(--bg-2);border-radius:12px;padding:12px 16px;color:var(--muted);font-size:.93rem}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);font-size:.82rem;font-weight:600;white-space:nowrap}

.chip.live{border-color:var(--cyan);color:var(--cyan)}

/* stepper */
.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.steps li{padding:2px 12px;border-radius:99px;border:1px solid var(--line-soft);color:var(--muted);font-size:.82rem}
.steps li.on{border-color:var(--cyan);color:var(--cyan);background:rgba(242,96,29,.08)}

/* home */
.hero{padding:34px 22px 26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.hero h1{font-size:clamp(2.6rem,9vw,4rem);font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .en{font-family:var(--font-d);letter-spacing:.32em;color:var(--cyan);font-size:.95rem}
.hero p.lead{max-width:34rem;color:var(--muted);font-size:1.08rem}

.howto{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:12px}
.howto li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.howto li::before{counter-increment:s;content:counter(s);width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:700}

/* players */
.prow{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;padding:12px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}
.prow .fields{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}

.field{background:var(--bg);border:1px solid var(--line);border-radius:12px;min-height:50px;padding:8px 14px;width:100%}
textarea.field{min-height:92px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 16px;min-height:46px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--blue);color:#fff}
.seg-wide{display:flex;flex-wrap:wrap;gap:10px}
.seg-wide button{flex:1 1 90px;min-height:50px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);cursor:pointer;font-weight:600}
.seg-wide button.on{border-color:var(--cyan);color:var(--ink);background:var(--cyan)}
.x{width:46px;height:46px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;font-size:1.3rem;line-height:1}
.x:hover{border-color:var(--bad);color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.opt-card{border:1px solid var(--line);border-radius:14px;background:var(--bg-2);padding:14px 16px;cursor:pointer;text-align:start;min-height:70px}
.opt-card.on{border-color:var(--cyan);background:rgba(242,96,29,.1)}
.opt-card b{display:block}
.labelled{display:flex;flex-direction:column;gap:8px}
.labelled>label,.lbl{font-weight:600;color:var(--text)}

/* pass-the-device */
.pass{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 20px}
.pass h2{font-size:2rem;margin:0}
.pass .kick{color:var(--cyan);font-weight:600}
.pass .btn{max-width:420px}

/* perk picking */
.perk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}

.perk-pick span.d{grid-column:1/-1;color:var(--muted);font-size:.9rem}

.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}

/* answers */
.qa{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}

.timerbox{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}

.ring{position:relative;width:150px;height:150px}

.clock{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-size:2.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.tcontrols{display:flex;flex-direction:column;gap:10px;min-width:0;width:100%}
.timeup{border:1px solid var(--bad);color:#9E1219;background:rgba(192,22,31,.12);border-radius:12px;padding:10px 14px;font-weight:700;text-align:center}
.notes{display:grid;gap:6px;font-size:.92rem;color:var(--muted)}

.vopts{display:grid;gap:14px}
.vopt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;min-height:78px;padding:12px 16px;border:2px solid var(--line);border-radius:16px;background:var(--bg-2);cursor:pointer;text-align:start}
.vopt.on{border-color:var(--cyan);background:rgba(242,96,29,.12)}
.vopt .vt{display:flex;flex-direction:column;min-width:0}
.vopt .vt b{font-size:1.1rem;overflow-wrap:anywhere}
.vopt .vt span{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.vopt.none{grid-template-columns:1fr auto;border-style:dashed}
.radio{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.on .radio{border-color:var(--cyan);background:var(--cyan);color:var(--ink)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:130px 1fr 36px;align-items:center;gap:10px}

.bar.lead .fill{background:var(--gold)}
.bar .nm{overflow-wrap:anywhere;font-weight:600}
.verdict{text-align:center;padding:22px 16px;border:1px solid var(--gold);background:rgba(220,31,43,.08);border-radius:var(--r)}

.jrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg-2)}

/* scoreboard */
.rank{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank li{display:grid;grid-template-columns:40px auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}

.ov{position:fixed;inset:0;background:rgba(43,21,16,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0;overflow:auto}

.splash .b1{background:#FF8A1F;top:-180px;inset-inline-start:-160px}

.party.mine{box-shadow:0 0 0 2px var(--gold) inset}
.card.action{border:2px solid var(--cyan);background:#FFF6F0}

    if (unsubInp) { try { unsubInp(); } catch (e) { } }
    unsubInp = db.collection('rooms/' + G.code + '/inputs').onSnapshot(onInputs, () => { });
    if (!hostTick) hostTick = setInterval(hostTickFn, 300);

    publish();
  }
  function stopHost() {

  function onInputs(snap) {

  }
  function leaveLocal() {

    lsSet({ code: '' });
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { try { location.hash = ''; } catch (e2) { } }
  }

  /* ---------- host: derived data, joins, requests, progress ---------- */
  function hostDerive() {
    const c = G.cur;

      c.pk = { A: {}, B: {} };
      ['A', 'B'].forEach(side => P(c[side]).perks.forEach(id => { const st = perkState(side, id); c.pk[side][id] = st ? { ok: st.ok, r: st.reason || '' } : null; }));
      c.teamCands = { A: helperCands('A').map(p => p.id), B: helperCands('B').map(p => p.id) };
      c.witCands = witnessCands().map(p => p.id);

    }
  }
  function hostStep() {
    if (!isHost() || !G) return;

    Object.keys(INP).forEach(id => {
      const d = INP[id];
      if (!d || id === ME_ID) return;
      const p = G.players.find(x => x.id === id);
      if (G.phase === 'lobby' && p && (d.room !== G.code || !d.name)) { G.players = G.players.filter(x => x.id !== id); ch = true; return; }
      if (d.room !== G.code) return;
      if (G.phase === 'lobby' && !p && !G.kicked[id] && d.name && G.players.length < 12) {
        G.players.push({ id, name: uniqueName(d.name, id), gender: d.gender === 'f' ? 'f' : 'm', perks: [], score: 0, at: d.at || 0 });
        ch = true;
      } else if (G.phase === 'lobby' && p && d.at && d.at > (p.at || 0)) {
        p.name = uniqueName(d.name, id); p.gender = d.gender === 'f' ? 'f' : 'm'; p.at = d.at; ch = true;
      }
    });
    Object.keys(INP).forEach(id => {
      if (id === ME_ID || !inRoom(id)) return;
      (INP[id].reqs || []).forEach(r => {
        if (!r || !(r.n > (G.reqSeen[id] || 0))) return;
        G.reqSeen[id] = r.n; ch = true;
        if (r.g === G.gameNo) applyReq(id, r);
      });
    });
    const pr = progList();
    if (JSON.stringify(pr) !== JSON.stringify(G.prog || [])) { G.prog = pr; ch = true; }
    if (voteStep()) ch = true;
    if (objStep()) ch = true;
    if (witStep()) ch = true;
    if (ch) publish();
    render();
  }
  function uniqueName(n, id) {
    let base = String(n || '').trim().slice(0, 20) || 'لاعب', name = base, k = 2;
    while (G.players.some(p => p.id !== id && norm(p.name) === norm(name))) name = base + ' ' + (k++);
    return name;
  }
  function progList() {
    const ids = G.players.map(p => p.id);

    if (G.phase === 'qwrite') return ids.filter(id => { const x = inp(id).qs; return x && x.g === G.gameNo; });
    if (G.phase === 'answers') return ids.filter(id => { const x = inp(id).ans; return x && x.r === G.ansRound; });

  }
  function hostTickFn() {
    if (!isHost() || !G) return;
    const c = G.cur;
    if (G.phase !== 'case' || !c) return;
    const t = c.timer;
    if (t && t.running && left() <= 0) { t.running = false; t.remaining = 0; t.done = true; beep(); publish(); render(); }
    if ((c.stage === 'vote' && c.vote && Date.now() >= c.vote.endsAt) || (c.obj && Date.now() >= c.obj.endsAt)) hostStep();
  }

  /* ---------- timer (host clock) ---------- */
  function left() {
    const t = G && G.cur && G.cur.timer;
    if (!t) return 0;
    return t.running ? Math.max(0, (t.endsAt - nowH()) / 1000) : t.remaining;
  }
  function startT() { const t = G.cur.timer; if (t.running || t.done) return; t.running = true; t.started = true; t.endsAt = Date.now() + t.remaining * 1000; }
  function pauseT() { const t = G && G.cur && G.cur.timer; if (!t || !t.running) return; t.remaining = left(); t.running = false; }
  function addT(sec) { const t = G.cur.timer; if (t.running) t.endsAt += sec * 1000; else { t.remaining += sec; t.done = false; } t.total += sec; }
  function paintClocks() {
    if (!G || !G.cur) return;
    const t = G.cur.timer, c = document.getElementById('clock'), r = document.getElementById('ring'), f = document.getElementById('ringfg');
    if (t && c) {
      const l = left();
      c.textContent = fmt(l);
      if (f) f.style.strokeDashoffset = String(377 * (1 - Math.max(0, Math.min(1, l / t.total))));
      if (r) r.classList.toggle('low', l <= 10);
    }
    const vc = document.getElementById('vclock');
    const end = G.cur.obj ? G.cur.obj.endsAt : (G.cur.vote ? G.cur.vote.endsAt : 0);
    if (vc && end) vc.textContent = fmt((end - nowH()) / 1000);
  }
  setInterval(paintClocks, 250);

  /* ---------- game setup (host) ---------- */
  function buildPool() {
    const swaps = G.players.filter(p => p.perks.includes('swap')).length;
    let list;
    if (G.settings.source === 'custom') list = shuffle(G.questions || []);
    else list = shuffle(PACKS[G.settings.pack].qs.map((x, i) => ({ id: 'k' + G.settings.pack + i, text: x.t, opts: x.o })));
    const n = Math.min(list.length, G.settings.cases + swaps);
    const pool = list.slice(0, n);
    G.qmap = {};
    pool.forEach(x => (G.qmap[x.id] = { id: x.id, text: x.text, opts: x.opts || null }));
    G.pool = pool.map(x => x.id);
    const nc = Math.min(G.settings.cases, n);
    G.order = G.pool.slice(0, nc);
    G.spares = G.pool.slice(nc);
    ANS = {}; saveAns();
    G.results = []; G.caseNo = 0; G.cur = null; G.appear = {};
    startAnswers(G.pool.slice(), 'start');
    G.players.forEach(p => (p.score = 0));
  }
  function startAnswers(qids, ret) {
    G.ansRound = (G.ansRound || 0) + 1; G.ansQueue = qids; G.ansReturn = ret; G.phase = 'answers'; G.prog = [];
  }
  function collectAnswers() {
    G.players.forEach(p => {
      const x = inp(p.id).ans;
      if (!x || x.r !== G.ansRound) return;
      G.ansQueue.forEach(qid => { if (!ANS[qid]) ANS[qid] = {}; ANS[qid][p.id] = String((x.a || {})[qid] || '').trim().slice(0, 40); });
    });
    saveAns();
  }

  /* ---------- case logic (host) ---------- */
  const IDX = { intro: 0, prep: 1, plea1: 2, plea2: 3, reply1: 4, reply2: 5 };
  function newCase(qid, pair, keepUsed) {
    const used = {};
    if (keepUsed) Object.keys(keepUsed).forEach(k => { if (k.endsWith(':swap')) used[k] = true; });
    G.appear[pair.A] = (G.appear[pair.A] || 0) + 1;
    G.appear[pair.B] = (G.appear[pair.B] || 0) + 1;
    return {
      qid, A: pair.A, B: pair.B, defA: ansOf(qid, pair.B), defB: ansOf(qid, pair.A), stage: 'intro', helper: { A: null, B: null }, witness: null,
      used, doubles: { A: false, B: false }, bonus: { A: 0, B: 0 }, penalty: { A: 0, B: 0 }, notes: [], spk: { A: 'main', B: 'main' },
      timer: { total: 1, remaining: 0, running: false, done: false, started: false, endsAt: 0 }, jurors: [], vote: null, v1: null, o1: null,
      appeal: null, appealUsed: false, rounds: [], lastT: null, final: null, obj: null, pk: null, teamCands: null, witCands: [], jurorsNow: []
    };
  }
  function pairFor(qid) { return formPair(G.players, ANS[qid] || {}, G.appear); }
  function startCase() {
    G.nocase = null;
    if (G.caseNo >= G.order.length) { G.phase = 'final'; G.cur = null; return; }
    const qid = G.order[G.caseNo];
    const pair = pairFor(qid);
    if (!pair) {
      const vals = G.players.map(p => norm(ansOf(qid, p.id))).filter(Boolean);
      G.cur = null; G.phase = 'nocase'; G.nocase = { n: vals.length, d: new Set(vals).size }; return;
    }
    G.cur = newCase(qid, pair); G.phase = 'case';
  }
  function jurorsNow() {
    const c = G.cur, ex = [c.A, c.B, c.helper.A, c.helper.B];
    return G.players.filter(p => !ex.includes(p.id)).map(p => p.id);
  }
  function helperCands(side) {
    const c = G.cur, other = side === 'A' ? 'B' : 'A';
    const mine = norm(ansOf(c.qid, c[side])), defended = norm(ansOf(c.qid, c[other]));
    if (jurorsNow().length < 2) return [];
    const taken = [c.A, c.B, c.helper.A, c.helper.B, c.witness && c.witness.pid];
    return G.players.filter(p => !taken.includes(p.id)).filter(p => { const a = norm(ansOf(c.qid, p.id)); return a && a !== mine && a !== defended; });
  }
  function witnessCands() {
    const c = G.cur, taken = [c.A, c.B, c.helper.A, c.helper.B];
    return G.players.filter(p => !taken.includes(p.id));
  }
  function spareFor() { for (const qid of G.spares) if (pairFor(qid)) return qid; return null; }
  const no = r => ({ ok: false, reason: r });
  function speakerSide() { const s = G.cur.stage; return s === 'plea1' || s === 'reply1' ? 'A' : (s === 'plea2' || s === 'reply2' ? 'B' : null); }
  function perkState(side, id) {
    const c = G.cur, pid = c[side], p = P(pid);
    if (!p.perks.includes(id)) return null;
    if (c.used[pid + ':' + id]) return no('استُخدمت هذه الميزة في هذه القضية.');
    if (c.obj || (c.witness && c.witness.pending)) return no('انتظر انتهاء الإجراء الحالي.');
    const i = IDX[c.stage];
    if (i === undefined) return no('لا تُستخدم المزايا في هذه المرحلة.');
    switch (id) {
      case 'team':
        if (i > 1) return no('تُستخدم قبل بدء المرافعات.');
        if (c.helper[side]) return no('اخترت مساعدًا بالفعل.');
        if (!helperCands(side).length) return no('لا يوجد لاعب مؤهل: يجب أن تختلف إجابته عن إجابتك وعن الرأي الذي تدافع عنه، ويبقى محلف واحد على الأقل.');
        break;
      case 'swap':
        if (i > 1) return no('تُستخدم قبل بدء المرافعات.');
        if (!spareFor()) return no('لا توجد قضية بديلة صالحة.');
        break;
      case 'witness':
        if (i > 1) return no('تُستخدم قبل بدء المرافعات.');
        if (c.witness) return no('يوجد شاهد في هذه القضية بالفعل.');
        if (!witnessCands().length) return no('لا يوجد لاعب محايد متاح.');
        break;
      case 'extend':
        if (!((side === 'A' && c.stage === 'plea1') || (side === 'B' && c.stage === 'plea2'))) return no('تُستخدم أثناء مرافعتك.');
        break;
      case 'reply':
        if (i > (side === 'A' ? 4 : 5)) return no('انتهى وقت ردك.');
        break;
      case 'double':
        if (i > 5) return no('لا تُستخدم في هذه المرحلة.');
        break;
      case 'objection': {
        const sp = speakerSide();
        if (!sp || sp === side) return no('يُستخدم أثناء حديث خصمك.');
        break;
      }
    }
    return { ok: true };
  }
  function enterStage(st) {
    const c = G.cur, s = G.settings;
    c.stage = st;
    let total = 0, side = null;
    if (st === 'prep') total = s.prep;
    else if (st === 'plea1') { total = s.plead; side = 'A'; }
    else if (st === 'plea2') { total = s.plead; side = 'B'; }
    else if (st === 'reply1') { total = REPLY_SEC + c.bonus.A; side = 'A'; }
    else if (st === 'reply2') { total = REPLY_SEC + c.bonus.B; side = 'B'; }
    if (side && c.penalty[side]) { total = Math.max(15, total - c.penalty[side]); c.penalty[side] = 0; }
    c.timer = { total: Math.max(1, total), remaining: total, running: false, done: false, started: false, endsAt: 0 };
  }
  function startVote(kind, round) {
    const c = G.cur;
    c.jurors = jurorsNow();
    c.vote = { kind, round: round || 1, key: 'g' + G.gameNo + 'c' + G.caseNo + kind + (round || 1) + '-' + uid('v'), endsAt: Date.now() + VOTE_SEC * 1000, done: [] };
    c.stage = 'vote';
  }
  function voteStep() {
    const c = G.cur;
    if (G.phase !== 'case' || !c || c.stage !== 'vote' || !c.vote) return false;
    const v = c.vote, allowed = v.kind === 'first' ? ['A', 'B', 'none'] : ['A', 'B'];
    const picks = {};
    c.jurors.forEach(j => { const x = inp(j).vote; if (x && x.key === v.key && allowed.includes(x.pick)) picks[j] = x.pick; });
    const done = Object.keys(picks);
    let ch = false;
    if (done.length !== v.done.length) { v.done = done; ch = true; }
    if (done.length >= c.jurors.length || Date.now() >= v.endsAt) {
      if (v.kind === 'first') { c.v1 = tally(picks, ['A', 'B', 'none']); c.o1 = firstVoteOutcome(c.v1); c.appeal = null; c.stage = 'tally1'; }
      else { const t = tally(picks, ['A', 'B']); c.rounds.push({ kind: v.kind, A: t.A, B: t.B }); c.lastT = t; c.stage = 'tally2'; }
      c.vote = null; ch = true;
    }
    return ch;
  }
  function objStep() {
    const c = G.cur;
    if (G.phase !== 'case' || !c || !c.obj) return false;
    const o = c.obj, votes = {};
    o.jurors.forEach(j => { const x = inp(j).obj; if (x && x.key === o.key && (x.v === 'yes' || x.v === 'no')) votes[j] = x.v; });
    const done = Object.keys(votes);
    let ch = false;
    if (done.length !== o.done.length) { o.done = done; ch = true; }
    if (done.length >= o.jurors.length || Date.now() >= o.endsAt) {
      const yes = done.filter(j => votes[j] === 'yes').length, nay = done.length - yes;
      const acc = yes > nay, side = o.side, other = side === 'A' ? 'B' : 'A';
      c.used[c[side] + ':objection'] = true;
      if (acc) {
        const t = c.timer, l = left(); t.remaining = Math.max(0, l - PEN); t.running = false; if (t.remaining <= 0) { t.done = true; t.remaining = 0; }
        c.notes.push('اعتراض ' + P(c[side]).name + ' مقبول (' + yes + '-' + nay + '): خُصمت 15 ثانية من ' + P(c[other]).name + '.');
      } else {
        c.penalty[side] += PEN;
        c.notes.push('اعتراض ' + P(c[side]).name + ' مرفوض (' + yes + '-' + nay + '): تُخصم 15 ثانية من وقته القادم.');
      }
      c.obj = null; ch = true;
    }
    return ch;
  }
  function witStep() {
    const c = G.cur;
    if (G.phase !== 'case' || !c || !c.witness || !c.witness.pending) return false;
    const x = inp(c.witness.pid).wit;
    if (x && x.key === c.witness.key && String(x.text || '').trim().length >= 3) {
      c.witness.text = String(x.text).trim().slice(0, 220); c.witness.pending = false;
      c.notes.push('سجّل الشاهد ' + P(c.witness.pid).name + ' شهادته.');
      return true;
    }
    return false;
  }
  function finalize(outcome, by) {
    const c = G.cur, a = award(outcome, c.doubles);
    if (a.pts) { const w = G.players.find(p => p.id === c[outcome]); if (w) w.score += a.pts; }
    const pa = P(c.A), pb = P(c.B);
    const snap = (p, def) => ({ id: p.id, name: p.name, gender: p.gender, defends: def });
    G.results.push({
      no: G.caseNo + 1, skipped: false, qText: G.qmap[c.qid].text, A: snap(pa, c.defA), B: snap(pb, c.defB),
      helperA: c.helper.A ? P(c.helper.A).name : null, helperB: c.helper.B ? P(c.helper.B).name : null,
      witness: c.witness && !c.witness.pending ? { name: P(c.witness.pid).name, text: c.witness.text } : null,
      v1: c.v1, appeal: c.appealUsed, rounds: c.rounds.slice(), outcome, by, pts: a.pts, doubled: a.doubled

  function doSwap(side) {

    const prev = c.used, by = P(c[side]).name;
    G.order[G.caseNo] = qid;
    G.cur = newCase(qid, pairFor(qid), prev);
    G.cur.notes.push('بُدّلت القضية بطلب من ' + by + '.');
  }

  /* Every in-case request from a player's phone lands here (the host's own too). */
  function applyReq(id, r) {
    const c = G.cur;
    if (G.phase !== 'case' || !c) return false;
    const side = r.side === 'B' ? 'B' : 'A';
    if (c[side] !== id && !(r.type === 'spk' && id === G.host)) return false;
    if (r.type === 'spk') { if (!c.helper[side]) return false; c.spk[side] = c.spk[side] === 'main' ? 'helper' : 'main'; return true; }
    if (r.type === 'appeal') {
      if (c.stage !== 'tally1' || !c.o1 || !c.o1.appealable || c.appeal) return false;
      c.appeal = { by: side }; c.notes.push(P(id).name + ' ' + gv(P(id), 'طلب', 'طلبت') + ' الاستئناف.'); return true;
    }
    if (r.type !== 'perk') return false;
    const st = perkState(side, r.id);
    if (!st || !st.ok) return false;
    const pid = c[side], who = P(pid), key = pid + ':' + r.id;
    switch (r.id) {
      case 'extend': c.used[key] = true; addT(BONUS); c.notes.push(who.name + ' ' + gv(who, 'استخدم', 'استخدمت') + ' تمديد الوقت: +30 ثانية.'); break;
      case 'reply':
        c.used[key] = true;
        if (c.stage === (side === 'A' ? 'reply1' : 'reply2')) addT(BONUS); else c.bonus[side] += BONUS;
        c.notes.push(who.name + ' ' + gv(who, 'سيحصل', 'ستحصل') + ' على 30 ثانية إضافية في الرد.'); break;
      case 'double': c.used[key] = true; c.doubles[side] = true; c.notes.push('نقاط ' + who.name + ' مضاعفة إن ' + gv(who, 'فاز', 'فازت') + '.'); break;
      case 'team': {
        if (!helperCands(side).some(p => p.id === r.pid)) return false;
        const h = P(r.pid);
        c.helper[side] = r.pid; c.used[key] = true;
        c.notes.push(h.name + ' ' + gv(h, 'انضم', 'انضمت') + ' إلى فريق ' + who.name + ' ' + gv(h, 'وخرج', 'وخرجت') + ' من هيئة المحلفين.'); break;
      }
      case 'witness': {
        if (!witnessCands().some(p => p.id === r.pid)) return false;
        pauseT();
        c.witness = { pid: r.pid, by: side, text: '', pending: true, key: uid('w') }; c.used[key] = true;
        c.notes.push(who.name + ' ' + gv(who, 'استدعى', 'استدعت') + ' ' + P(r.pid).name + ' شاهدًا.'); break;
      }
      case 'swap': doSwap(side); break;
      case 'objection':
        pauseT();
        c.obj = { side, key: uid('o'), endsAt: Date.now() + OBJ_SEC * 1000, jurors: jurorsNow(), done: [] };
        c.notes.push(who.name + ' ' + gv(who, 'اعترض', 'اعترضت') + ' على كلام ' + P(c[side === 'A' ? 'B' : 'A']).name + '.'); break;
    }
    return true;
  }
  function sendReq(r) {
    if (!G) return;
    ME = ME || blankMe(G.code);
    r.n = (ME.reqN || 0) + 1; r.g = G.gameNo; ME.reqN = r.n;
    if (isHost()) { G.reqSeen[ME_ID] = r.n; if (applyReq(ME_ID, r)) publish(); return; }
    ME.reqs = (ME.reqs || []).concat([r]).slice(-12);
    saveMe();
    toast('أُرسل طلبك.');
  }

  /* ---------- views ---------- */
  function topbar() {
    const inG = !!G && !!U.code;
    return '<header class="top"><div class="brand">' + LOGO + '<b>مرافعات</b><span>MURAFAAT</span></div><div class="top-r">' +
      (inG ? '<span class="chip live num">غرفة ' + esc(U.code) + '</span><button class="btn sm ghost" data-act="menu">القائمة</button>' : '') + '</div></header>' +

    const c = G.cur, p = P(c[side]), mine = c[side] === ME_ID;
    if (!p.perks.length) return '<span class="muted small">لم ' + gv(p, 'يختر', 'تختر') + ' مزايا.</span>';
    return '<div class="perks">' + p.perks.map(id => {

      return '<button class="perk ' + cls + '" data-act="perk" data-side="' + side + '" data-id="' + id + '"' + (used ? ' aria-disabled="true"' : '') + '>' + perkName(id) + (used ? ' · مستخدمة' : '') + '</button>';

      body = '<h2>استلام الاستضافة؟</h2><p class="muted">استخدمها فقط إذا المضيف طلع أو تلفونه فصل. بتصير أنت اللي ينقل اللعبة بين المراحل.</p><div class="btn-row"><button class="btn primary" data-act="takeHost">استلام</button><button class="btn" data-act="closeModal">إلغاء</button></div>';
    } else if (m.type === 'hand') {
      body = '<h2>اختر المضيف الجديد</h2><div class="cands">' + G.players.filter(p => p.id !== ME_ID).map(p => '<button class="cand" data-act="handTo" data-id="' + p.id + '">' + avatar(p, 40) + '<b>' + esc(p.name) + '</b></button>').join('') + '</div><button class="btn ghost" data-act="closeModal">إلغاء</button>';
    } else if (m.type === 'leave') {
      const warn = isHost() && G && G.players.length > 1 ? 'أنت المضيف. بننقل الاستضافة تلقائيًا للاعب ثاني.' : 'تقدر ترجع للغرفة بنفس الرمز.';
      body = '<h2>الخروج من الغرفة؟</h2><p class="muted">' + warn + '</p><div class="btn-row"><button class="btn danger" data-act="leave">خروج</button><button class="btn" data-act="closeModal">إلغاء</button></div>';
    } else if (m.type === 'force') {
      body = '<h2>متابعة بدون الباقين؟</h2><p class="muted">اللي ما أكمل بيُعتبر بدون ' + (G.phase === 'perks' ? 'مزايا' : (G.phase === 'qwrite' ? 'أسئلة' : 'إجابات')) + ' في هذه المرحلة.</p><div class="btn-row"><button class="btn primary" data-act="forceGo">متابعة</button><button class="btn" data-act="closeModal">إلغاء</button></div>';
    } else if (m.type === 'team') {
      const cands = (G.cur.teamCands || {})[m.side] || [];
      body = '<h2>اختر المساعد</h2><p class="muted">اللاعبون اللي إجابتهم تختلف عن إجابتك وعن الرأي اللي تدافع عنه. المساعد يطلع من هيئة المحلفين.</p><div class="cands">' + cands.map(id => '<button class="cand" data-act="pickHelper" data-pid="' + id + '">' + avatar(P(id), 44) + '<b>' + esc(P(id).name) + '</b></button>').join('') + '</div><button class="btn ghost" data-act="closeModal">إلغاء</button>';
    } else if (m.type === 'wit') {
      body = '<h2>استدعاء شاهد</h2><p class="muted">اختر لاعبًا محايدًا يكتب رأيه من تلفونه. يبقى ضمن هيئة المحلفين.</p><div class="cands">' + (G.cur.witCands || []).map(id => '<button class="cand" data-act="pickWitness" data-pid="' + id + '">' + avatar(P(id), 44) + '<b>' + esc(P(id).name) + '</b></button>').join('') + '</div><button class="btn ghost" data-act="closeModal">إلغاء</button>';
    }
    return '<div class="ov" data-act="ovClose"><div class="dlg" role="dialog" aria-modal="true">' + body + '</div></div>';
  }

  function gameView() {
    switch (G.phase) {
      case 'lobby': return lobbyView();
      case 'perks': return perksView();
      case 'qwrite': return qwriteView();
      case 'qreview': return qreviewView();
      case 'answers': return answersView();
      case 'nocase': return nocaseView();
      case 'addq': return addqView();
      case 'case': return caseView();
      case 'final': return finalView();
    }
    return '';
  }

  /* ---------- render ---------- */
  function render() {
    let html;
    if (U.splash) html = splashView();
    else {
      html = topbar();
      if (!U.code || U.view === 'home') html += homeView();
      else if (!G) html += '<section class="card pass"><div class="spin" aria-hidden="true"></div><h2>جاري الاتصال بالغرفة ' + esc(U.code) + '</h2></section><button class="btn ghost" data-act="leaveNow">إلغاء</button>';
      else if (U.view === 'join') html += joinView();
      else if (U.view === 'wait') html += waitView();
      else if (U.view === 'spect') html += spectView();
      else if (U.view === 'kicked') html += kickedView();
      else html += gameView();
      html += modalView();
    }
    if (html === U.lastHtml) return;
    const key = U.splash ? 'splash' : (G ? U.view + G.phase + G.caseNo + (G.cur ? G.cur.stage + (G.cur.vote ? G.cur.vote.key : '') : '') : U.view);
    const ae = document.activeElement, fid = ae && ae.id && app.contains(ae) ? ae.id : null;
    let ss = null, se = null;
    try { if (fid && ae.setSelectionRange) { ss = ae.selectionStart; se = ae.selectionEnd; } } catch (e) { }
    const y = window.scrollY;
    app.innerHTML = '<div class="wrap">' + html + '</div>';
    U.lastHtml = html;
    if (fid) { const el = document.getElementById(fid); if (el) { try { el.focus({ preventScroll: true }); if (ss != null) el.setSelectionRange(ss, se); } catch (e) { } } }
    if (key !== U.lastKey) { window.scrollTo(0, 0); U.lastKey = key; } else window.scrollTo(0, y);
  }

  /* ---------- actions ---------- */
  const ACT = {};
  const H = fn => (...a) => { if (!isHost()) return false; const r = fn(...a); if (r !== false) publish(); return r; };

  ACT.enter = () => { U.splash = false; };
  ACT.myGender = d => { U.gender = d.g; lsSet({ gender: d.g }); };
  ACT.closeModal = () => { U.modal = null; U.err = ''; };
  ACT.ovClose = (d, el, ev) => { if (ev.target !== el) return false; U.modal = null; U.err = ''; };
  ACT.menu = () => { U.modal = { type: 'menu' }; };
  ACT.askLeave = () => { U.modal = { type: 'leave' }; };
  ACT.askTake = () => { U.modal = { type: 'take' }; };
  ACT.askHand = () => { U.modal = { type: 'hand' }; };
  ACT.leaveNow = () => { leaveLocal(); U.err = ''; };
  ACT.leave = async () => {
    U.modal = null;
    if (isHost() && G) {
      const next = G.players.find(p => p.id !== ME_ID);
      if (G.phase === 'lobby') G.players = G.players.filter(p => p.id !== ME_ID);
      if (next) { G.host = next.id; hostOn = false; await flushDirect(); }
    } else if (G && G.phase === 'lobby' && ME) { ME.room = ''; ME.name = ''; await saveMe(); }
    leaveLocal(); render();
  };
  async function flushDirect() { try { G.rev = (G.rev || 0) + 1; G.sentAt = Date.now(); await db.doc(roomPath(G.code)).set(clone(G)); nudge('v'); } catch (e) { writeFailed(e); } }
  ACT.handTo = async d => { if (!isHost()) return; U.modal = null; G.host = d.id; hostOn = false; stopHost(); await flushDirect(); toast('انتقلت الاستضافة.'); render(); };
  ACT.takeHost = async () => {
    U.modal = null;
    try { const s = await db.doc(roomPath(U.code)).get(); if (s.exists) G = clone(s.data()); } catch (e) { }
    if (!G || !inRoom(ME_ID)) return;
    G.host = ME_ID; await flushDirect(); becomeHost(); toast('صرت المضيف.'); render();
  };

  ACT.create = async () => {
    const name = U.name.trim();
    if (!name) { U.err = 'اكتب اسمك أو لقبك أول.'; return; }
    if (U.busy) return false;
    U.busy = true; U.err = ''; render();
    try {
      let code = '';
      for (let i = 0; i < 6; i++) {
        code = Array.from({ length: 4 }, () => CODE_CH[Math.floor(Math.random() * CODE_CH.length)]).join('');
        const s = await db.doc(roomPath(code)).get();
        if (!s.exists) break;
      }
      G = freshRoom(code);
      G.players.push({ id: ME_ID, name, gender: U.gender, perks: [], score: 0, at: Date.now() });
      ME = blankMe(code);
      U.code = code;
      await db.doc(inpPath(code, ME_ID)).set(clone(ME));
      G.rev = 1; G.sentAt = Date.now();
      await db.doc(roomPath(code)).set(clone(G));
      hostOn = false;
      await subscribe(code);
      U.view = 'game';
      becomeHost();
    } catch (e) { G = null; U.code = ''; writeFailed(e); }
    U.busy = false;
  };
  ACT.join = async () => {
    const code = String(U.draft.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 4) { U.err = 'اكتب رمز الغرفة (4 أحرف).'; return; }
    if (!U.name.trim()) { U.err = 'اكتب اسمك أو لقبك أول.'; return; }
    U.err = ''; U.busy = true; render();
    await openRoom(code, true);
    U.busy = false;
  };
  async function openRoom(code, autoJoin) {
    G = null; ME = null; U.view = 'connecting';
    U.code = code;
    await loadMe(code);
    await subscribe(code);
    if (autoJoin && U.name.trim()) {
      const waitG = () => new Promise(res => { let n = 0; const t = setInterval(() => { if (G || !U.code || ++n > 40) { clearInterval(t); res(); } }, 250); });
      await waitG();
      if (G && !inRoom(ME_ID) && G.phase === 'lobby') await sendJoin();
    }
  }
  async function sendJoin() {
    ME = Object.assign(ME && ME.room === U.code ? ME : blankMe(U.code), { room: U.code, name: U.name.trim(), gender: U.gender, at: Date.now() });
    lsSet({ name: U.name.trim(), gender: U.gender });
    U.view = 'wait';
    await saveMe();
    render();
  }
  ACT.sendJoin = async () => { if (!U.name.trim()) { U.err = 'اكتب اسمك أو لقبك.'; return; } U.err = ''; await sendJoin(); };
  ACT.copyLink = (d, el) => {
    const link = ART_URL + '#room-' + G.code;
    try { navigator.clipboard.writeText(link).then(() => toast('نسخنا رابط الدعوة.'), () => selectLink()); } catch (e) { selectLink(); }
    return false;
  };
  function selectLink() { const i = document.getElementById('lnk'); if (i) { i.focus(); i.select(); } toast('انسخ الرابط من الخانة.'); }

  /* lobby (host) */
  ACT.kick = H(d => { G.players = G.players.filter(p => p.id !== d.id); G.kicked[d.id] = true; });
  ACT.set = H(d => { const v = d.k === 'source' || d.k === 'pack' ? d.v : +d.v; G.settings[d.k] = v; });
  ACT.startGame = H(() => {
    if (G.players.length < 3) { U.err = 'تحتاج 3 لاعبين على الأقل.'; return; }
    U.err = '';
    G.gameNo = (G.gameNo || 0) + 1; G.phase = 'perks'; G.prog = []; G.cur = null; G.results = [];
    G.players.forEach(p => { p.perks = []; p.score = 0; });
  });

  /* perks */
  ACT.togglePerk = d => {
    const i = U.perks.indexOf(d.id);
    if (i >= 0) U.perks.splice(i, 1);
    else if (U.perks.length >= 3) { toast('الحد الأقصى 3 مزايا. أزل ميزة لاختيار غيرها.'); return false; }
    else U.perks.push(d.id);
  };
  ACT.confirmPerks = async () => { ME = ME || blankMe(U.code); ME.perks = { g: G.gameNo, list: U.perks.slice(0, 3), done: true }; await saveMe(); };
  function perksProceed() {
    G.players.forEach(p => { const x = inp(p.id).perks; p.perks = x && x.g === G.gameNo && x.done ? (x.list || []).filter(id => PERKS.some(k => k.id === id)).slice(0, 3) : []; });
    G.prog = [];
    if (G.settings.source === 'custom') { G.questions = []; G.phase = 'qwrite'; }
    else buildPool();
  }
  ACT.perksNext = H(() => { if ((G.prog || []).length < G.players.length) return false; perksProceed(); });

  /* custom questions */
  ACT.submitQs = async () => {
    const a = (U.draft.q0 || '').trim(), b = (U.draft.q1 || '').trim();
    if (a.length < 4 || b.length < 4) { U.err = 'اكتب سؤالين كاملين (4 أحرف على الأقل لكل سؤال).'; return; }
    if (norm(a) === norm(b)) { U.err = 'اكتب سؤالين مختلفين.'; return; }
    U.err = ''; ME = ME || blankMe(U.code); ME.qs = { g: G.gameNo, list: [a.slice(0, 90), b.slice(0, 90)] }; U.draft.q0 = ''; U.draft.q1 = '';
    await saveMe();
  };
  function qwriteProceed() {
    const qs = [], seen = [];
    G.players.forEach(p => { const x = inp(p.id).qs; if (x && x.g === G.gameNo) (x.list || []).forEach(t => { t = String(t).trim(); if (t.length >= 4 && !seen.includes(norm(t))) { seen.push(norm(t)); qs.push({ id: uid('q'), text: t }); } }); });
    G.questions = qs; G.qmap = {};
    qs.forEach(q => (G.qmap[q.id] = { id: q.id, text: q.text, opts: null }));
    G.qShown = shuffle(qs.map(q => q.id)); G.phase = 'qreview'; G.prog = [];
  }
  ACT.qwriteNext = H(() => { if ((G.prog || []).length < G.players.length) return false; qwriteProceed(); });
  ACT.startAnswers = H(() => { buildPool(); });

  /* answers */
  ACT.submitAnswers = async () => {
    const a = {};
    G.ansQueue.forEach(qid => (a[qid] = String(U.draft[qid] || '').trim().slice(0, 40)));
    ME = ME || blankMe(U.code); ME.ans = { r: G.ansRound, a };
    G.ansQueue.forEach(qid => delete U.draft[qid]);
    await saveMe();
  };
  function answersProceed() {
    collectAnswers();
    G.prog = [];
    if (G.ansReturn === 'start') G.caseNo = 0;
    startCase();
  }
  ACT.answersNext = H(() => { if ((G.prog || []).length < G.players.length) return false; answersProceed(); });
  ACT.force = d => { if (!isHost()) return false; U.modal = { type: 'force', next: d.next }; };
  ACT.forceGo = H(() => {
    const nx = U.modal && U.modal.next; U.modal = null;
    if (nx === 'perksNext') perksProceed(); else if (nx === 'qwriteNext') qwriteProceed(); else if (nx === 'answersNext') answersProceed();
  });

  /* no-case recovery (host) */
  ACT.redoAnswers = H(() => { const qid = G.order[G.caseNo]; ANS[qid] = {}; startAnswers([qid], 'case'); });
  ACT.addQ = H(() => { U.draft.addq = ''; U.err = ''; G.phase = 'addq'; });
  ACT.cancelAddQ = H(() => { U.err = ''; G.phase = 'nocase'; });
  ACT.presetQ = () => {
    if (!isHost()) return false;
    const used = Object.keys(G.qmap).map(k => norm(G.qmap[k].text)), all = [];
    Object.keys(PACKS).forEach(k => PACKS[k].qs.forEach(x => { if (!used.includes(norm(x.t))) all.push(x); }));
    if (!all.length) { U.err = 'لا توجد أسئلة جاهزة إضافية.'; return; }
    U.draft.addq = shuffle(all)[0].t;
  };
  ACT.submitAddQ = H(() => {
    const t = (U.draft.addq || '').trim();
    if (t.length < 4) { U.err = 'اكتب سؤالًا كاملًا أو اختر سؤالًا جاهزًا.'; return false; }
    const id = uid('q');
    G.qmap[id] = { id, text: t.slice(0, 90), opts: null };
    G.order[G.caseNo] = id; U.err = ''; U.draft.addq = '';
    startAnswers([id], 'case');
  });
  ACT.skipCase = H(() => {
    if (G.spares.length) { G.order[G.caseNo] = G.spares.shift(); startCase(); return; }
    G.results.push({ no: G.caseNo + 1, skipped: true, qText: G.qmap[G.order[G.caseNo]].text });
    G.caseNo++; startCase();
  });

  /* case flow (host) */
  ACT.timer = H(() => { const c = G.cur, t = c.timer; if (c.obj || (c.witness && c.witness.pending)) return false; if (t.running) pauseT(); else if (!t.done) startT(); });
  ACT.next = H(() => {
    const c = G.cur;
    if (c.obj || (c.witness && c.witness.pending)) return false;
    pauseT();
    const s = c.stage;
    if (s === 'intro') enterStage('prep');
    else if (s === 'prep') enterStage('plea1');
    else if (s === 'plea1') enterStage('plea2');
    else if (s === 'plea2') enterStage('reply1');
    else if (s === 'reply1') enterStage('reply2');
    else if (s === 'reply2') startVote('first', 1);
  });
  ACT.cancelWit = H(() => { const c = G.cur; if (!c.witness || !c.witness.pending) return false; c.notes.push('أُلغي استدعاء الشاهد ' + P(c.witness.pid).name + '.'); c.witness = null; });
  ACT.confirmAppeal = H(() => { const c = G.cur; if (!c.appeal) return false; c.appealUsed = true; startVote('appeal', 1); });
  ACT.cancelAppeal = H(() => { G.cur.appeal = null; });
  ACT.noAppeal = H(() => { const c = G.cur; finalize(c.o1.leader === null ? 'tie' : c.o1.leader, 'first'); });
  ACT.tiebreak = H(() => { const c = G.cur; startVote('tiebreak', c.rounds.length + 1); });
  ACT.finalAppeal = H(() => { const c = G.cur; finalize(appealOutcome(c.lastT), 'appeal'); });
  ACT.nextCase = H(() => { G.cur = null; G.caseNo++; startCase(); });
  ACT.rematch = H(() => { G.gameNo++; G.phase = 'perks'; G.prog = []; G.cur = null; G.results = []; G.players.forEach(p => { p.perks = []; p.score = 0; }); });
  ACT.toLobby = H(() => { G.phase = 'lobby'; G.cur = null; G.results = []; G.prog = []; G.players.forEach(p => { p.perks = []; p.score = 0; }); });

  /* in-case requests from the parties */
  ACT.perk = d => {
    const c = G.cur, st = c.pk && c.pk[d.side] ? c.pk[d.side][d.id] : null;
    if (c[d.side] !== ME_ID || !st) return false;
    if (!st.ok) { toast(st.r); return false; }
    if (d.id === 'team') { U.modal = { type: 'team', side: d.side }; return; }
    if (d.id === 'witness') { U.modal = { type: 'wit', side: d.side }; return; }
    sendReq({ type: 'perk', side: d.side, id: d.id });
  };
  ACT.pickHelper = d => { const side = U.modal.side; U.modal = null; sendReq({ type: 'perk', side, id: 'team', pid: d.pid }); };
  ACT.pickWitness = d => { const side = U.modal.side; U.modal = null; sendReq({ type: 'perk', side, id: 'witness', pid: d.pid }); };
  ACT.spk = d => { sendReq({ type: 'spk', side: d.side }); };
  ACT.reqAppeal = d => { if (mySide() !== d.side) return false; sendReq({ type: 'appeal', side: d.side }); };

  /* my answers to things the room asks of me */
  ACT.witSubmit = async () => {
    const c = G.cur, t = String(U.draft.wtext || '').trim();
    if (!c.witness || c.witness.pid !== ME_ID) return false;
    if (t.length < 3) { U.err = 'اكتب رأيًا قصيرًا (3 أحرف على الأقل).'; return; }
    U.err = ''; ME = ME || blankMe(U.code); ME.wit = { key: c.witness.key, text: t.slice(0, 220) }; U.draft.wtext = '';
    await saveMe();
  };
  ACT.objVote = async d => { const o = G.cur.obj; if (!o || !o.jurors.includes(ME_ID)) return false; ME = ME || blankMe(U.code); ME.obj = { key: o.key, v: d.v }; render(); await saveMe(); };
  ACT.pick = d => { U.pick = d.v; };
  ACT.confirmVote = async () => {
    const v = G.cur.vote;
    if (!v || !G.cur.jurors.includes(ME_ID)) return false;
    if (!U.pick) { toast('اختر أحد الخيارات أولًا.'); return false; }
    ME = ME || blankMe(U.code); ME.vote = { key: v.key, pick: U.pick };
    render(); await saveMe();
  };

  /* ---------- events ---------- */
  app.addEventListener('click', async e => {
    const el = e.target.closest('[data-act]');
    if (!el || !ACT[el.dataset.act]) return;
    if (el.dataset.act === 'ovClose' && e.target !== el) return;
    if (el.getAttribute('aria-disabled') === 'true' && el.dataset.act !== 'ovClose') return;
    const r = await ACT[el.dataset.act](el.dataset, el, e);
    if (r !== false) render();
  });
  app.addEventListener('input', e => {
    const el = e.target, b = el.dataset && el.dataset.bind;
    if (!b) return;
    if (b === 'name') { U.name = el.value; lsSet({ name: el.value.trim() }); }
    else if (b === 'code') U.draft.code = el.value.toUpperCase();
    else if (b === 'qw') U.draft['q' + el.dataset.k] = el.value;
    else if (b === 'ans') U.draft[el.dataset.q] = el.value;
    else if (b === 'addq') U.draft.addq = el.value;
    else if (b === 'wtext') U.draft.wtext = el.value;
  });
  window.addEventListener('hashchange', () => {
    const h = (location.hash || '').match(/^#room-([A-Za-z0-9]{4,6})$/);
    if (h && h[1].toUpperCase() !== U.code && db && U.ready) { U.draft.code = h[1].toUpperCase(); U.fromLink = true; if (!U.code) render(); }
  });

  /* ---------- start ---------- */
  async function init() {
    const saved = lsGet();
    U.name = saved.name || ''; U.gender = saved.gender === 'f' ? 'f' : 'm';
    const h = (location.hash || '').match(/^#room-([A-Za-z0-9]{4,6})$/);
    if (h) { U.draft.code = h[1].toUpperCase(); U.fromLink = true; }
    render();
    const cl = typeof window.claude !== 'undefined' && window.claude && window.claude.use ? window.claude : null;
    let user = null;
    if (EXT) { db = window.__MZ_DB; }
    else if (cl) {
      try { db = await cl.use('db'); } catch (e) { db = null; }
      try { user = await cl.use('user'); } catch (e) { user = null; }
      try { roomCap = await cl.use('room'); } catch (e) { roomCap = null; }
    }
    let id = null;
    try { id = user && user.id ? await user.id() : null; } catch (e) { id = null; }
    if (!id) { id = saved.uid || ('l' + Math.random().toString(36).slice(2, 12)); lsSet({ uid: id }); }
    ME_ID = 'u' + String(id).replace(/[^A-Za-z0-9_\-~:@+]/g, '_').slice(0, 120);
    try { canWrite = user && user.can ? await user.can('data.write') : null; } catch (e) { canWrite = null; }
    if (canWrite === false) U.offline = 'perm';
    U.ready = true;
    const code = h ? h[1].toUpperCase() : (saved.code || '');
    if (db && code) {
      await loadMe(code);
      if (!h || (ME && ME.room === code)) {
        await subscribe(code);
      } else { U.code = ''; }
    }
    render();
  }
  if (TEST) window.__mz = () => ({ G, ME, ME_ID, U, host: isHost(), skew });
  init();
})();

</script>

</body></html>
