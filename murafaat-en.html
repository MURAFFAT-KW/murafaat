}

.sect-title{font-family:var(--font-d);font-size:1.05rem;color:var(--cyan);margin-bottom:10px}
.alert{border:1px solid var(--bad);background:rgba(192,22,31,.1);color:#9E1219;border-radius:12px;padding:12px 16px}
.note{border:1px solid var(--line);background:var(--bg-2);border-radius:12px;padding:12px 16px;color:var(--muted);font-size:.93rem}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);font-size:.82rem;font-weight:600;white-space:nowrap}

.howto{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:12px}

.howto li::before{counter-increment:s;content:counter(s);width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:700}

.prow{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;padding:12px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}

.prow input{flex:1 1 150px;min-width:0}

textarea.field{min-height:92px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 16px;min-height:46px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--blue);color:#fff}
.seg-wide{display:flex;flex-wrap:wrap;gap:10px}
.seg-wide button{flex:1 1 90px;min-height:50px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);cursor:pointer;font-weight:600}
.seg-wide button.on{border-color:var(--cyan);color:var(--ink);background:var(--cyan)}
.x{width:46px;height:46px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;font-size:1.3rem;line-height:1}
.x:hover{border-color:var(--bad);color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.opt-card{border:1px solid var(--line);border-radius:14px;background:var(--bg-2);padding:14px 16px;cursor:pointer;text-align:start;min-height:70px}

.opt-card b{display:block}
.labelled{display:flex;flex-direction:column;gap:8px}
.labelled>label,.lbl{font-weight:600;color:var(--text)}

/* pass-the-device */
.pass{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 20px}
.pass h2{font-size:2rem;margin:0}
.pass .kick{color:var(--cyan);font-weight:600}
.pass .btn{max-width:420px}

/* perk picking */
.perk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}

.perk-pick b{font-family:var(--font-d);font-size:1.05rem}
.perk-pick span.d{grid-column:1/-1;color:var(--muted);font-size:.9rem}
.perk-pick.on{border-color:var(--gold);background:rgba(222,9,33,.09)}
.perk-pick.off{opacity:.5}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.on .tick{border-color:var(--gold);background:var(--gold);color:var(--gold-ink)}

/* answers */
.qa{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}

.qlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}

/* case */
.casehead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

.qcard .qlabel{color:var(--gold);font-weight:600;font-size:.9rem;letter-spacing:.04em}

.parties{display:grid;grid-template-columns:1fr;gap:14px}

.party{border:1px solid var(--line-soft);background:var(--panel);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.party.speaking{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.ptop{display:flex;gap:8px;flex-wrap:wrap}
.pid{display:flex;align-items:center;gap:12px;min-width:0}
.pid h3{overflow-wrap:anywhere}
.defend{border-radius:12px;background:var(--bg-2);padding:10px 14px;border:1px dashed var(--line)}
.defend strong{display:block;font-size:1.15rem;color:var(--gold);overflow-wrap:anywhere}
.helper{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--muted)}
.perks{display:flex;flex-wrap:wrap;gap:8px}
.perk{min-height:44px;padding:6px 14px;border-radius:12px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-weight:600;font-size:.92rem;cursor:pointer}
.perk.na{border-color:var(--line);color:var(--muted)}
.perk.used{border-color:var(--line-soft);color:var(--muted);text-decoration:line-through;cursor:not-allowed}
.perk.set{background:var(--gold);color:var(--gold-ink)}
.witness{border:1px solid var(--blue);border-radius:14px;background:rgba(222,9,33,.1);padding:14px 16px}
.witness b{color:var(--cyan)}
.timerbox{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media(max-width:520px){.timerbox{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}

.ring.low .fg{stroke:var(--bad)}
.ring.ended .fg{stroke:var(--bad)}
.clock{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-size:2.3rem;font-weight:700;font-variant-numeric:tabular-nums}

/* voting */
.vkind{display:flex;flex-direction:column;gap:6px;border-radius:14px;padding:14px 16px;border:1px solid var(--cyan);background:rgba(222,9,33,.08)}
.vkind.appeal{border-color:var(--gold);background:rgba(222,9,33,.09)}

.vopts{display:grid;gap:14px}
.vopt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;min-height:78px;padding:12px 16px;border:2px solid var(--line);border-radius:16px;background:var(--bg-2);cursor:pointer;text-align:start}
.vopt.on{border-color:var(--cyan);background:rgba(222,9,33,.12)}
.vopt .vt{display:flex;flex-direction:column;min-width:0}
.vopt .vt b{font-size:1.1rem;overflow-wrap:anywhere}
.vopt .vt span{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.vopt.none{grid-template-columns:1fr auto;border-style:dashed}
.radio{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.on .radio{border-color:var(--cyan);background:var(--cyan);color:var(--ink)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:130px 1fr 36px;align-items:center;gap:10px}
@media(max-width:520px){.bar{grid-template-columns:90px 1fr 30px}}
.bar .track{height:16px;border-radius:99px;background:var(--bg);border:1px solid var(--line-soft);overflow:hidden}
.bar .fill{height:100%;background:var(--blue);border-radius:99px}
.bar.lead .fill{background:var(--gold)}
.bar .nm{overflow-wrap:anywhere;font-weight:600}
.verdict{text-align:center;padding:22px 16px;border:1px solid var(--gold);background:rgba(222,9,33,.08);border-radius:var(--r)}
.verdict h2{color:var(--gold);font-size:1.6rem}
.jrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg-2)}

/* scoreboard */
.rank{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank li{display:grid;grid-template-columns:40px auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}
.rank li.win{border-color:var(--gold);background:rgba(222,9,33,.1)}
.rank .pos{font-family:var(--font-d);font-size:1.3rem;color:var(--muted);text-align:center}

.winner h2{font-size:clamp(1.8rem,6vw,2.6rem);color:var(--gold)}
.cases{display:grid;gap:12px}
.cr{border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2);padding:14px 16px;display:grid;gap:6px}

.cr .v{display:flex;flex-wrap:wrap;gap:8px}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(18,32,58,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0;overflow:auto}

.dlg{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px;direction:ltr}

.cand:hover{border-color:var(--cyan)}

.linkrow .btn{flex:0 0 auto;min-height:46px}

.plist{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 4px;border-radius:99px;border:1px solid var(--line-soft);background:var(--bg-2);color:var(--muted);font-size:.9rem}

.party.mine{box-shadow:0 0 0 2px var(--gold) inset}
.card.action{border:2px solid var(--cyan);background:#FFF5F6}

      case 'team':
        if (i > 1) return no('Use before the arguments start.');
        if (c.helper[side]) return no('You already picked a helper.');
        if (!helperCands(side).length) return no('No eligible player: their answer must differ from yours and from the view you’re defending, and at least one juror must remain.');
        break;
      case 'swap':
        if (i > 1) return no('Use before the arguments start.');
        if (!spareFor()) return no('No replacement question fits the same two players (their answers to it must differ).');
        break;
      case 'witness':
        if (i > 1) return no('Use before the arguments start.');
        if (c.witness) return no('There’s already a witness in this question.');
        if (!witnessCands().length) return no('No neutral player available.');
        break;
      case 'extend':
        if (!((side === 'A' && c.stage === 'plea1') || (side === 'B' && c.stage === 'plea2'))) return no('Use during your argument.');
        break;
      case 'reply':
        if (i > (side === 'A' ? 4 : 5)) return no('Your reply time is over.');
        break;
      case 'double':
        if (i > 5) return no('Can’t be used at this stage.');
        break;
      case 'objection': {
        const sp = speakerSide();
        if (!sp || sp === side) return no('Use while your opponent is speaking.');
        break;
      }
    }
    return { ok: true };
  }
  function enterStage(st) {
    const c = G.cur, s = G.settings;
    c.stage = st;
    let total = 0, side = null;
    if (st === 'prep') total = s.prep;
    else if (st === 'plea1') { total = s.plead; side = 'A'; }
    else if (st === 'plea2') { total = s.plead; side = 'B'; }
    else if (st === 'reply1') { total = SEC('replySec') + c.bonus.A; side = 'A'; }
    else if (st === 'reply2') { total = SEC('replySec') + c.bonus.B; side = 'B'; }
    if (side && c.penalty[side]) { total = Math.max(15, total - c.penalty[side]); c.penalty[side] = 0; }
    c.timer = { total: Math.max(1, total), remaining: total, running: false, done: false, started: false, endsAt: 0 };
  }
  function startVote(kind, round) {
    const c = G.cur;
    c.jurors = jurorsNow();
    c.vote = { kind, round: round || 1, key: 'g' + G.gameNo + 'c' + G.caseNo + kind + (round || 1) + '-' + uid('v'), endsAt: Date.now() + SEC('voteSec') * 1000, dur: SEC('voteSec'), done: [] };
    c.stage = 'vote';
  }
  function voteStep() {
    const c = G.cur;
    if (G.phase !== 'case' || !c || c.stage !== 'vote' || !c.vote) return false;
    const v = c.vote, allowed = v.kind === 'first' ? ['A', 'B', 'none'] : ['A', 'B'];
    const picks = {};
    c.jurors.forEach(j => { const x = inp(j).vote; if (x && x.key === v.key && allowed.includes(x.pick)) picks[j] = x.pick; });
    const done = Object.keys(picks);
    let ch = false;
    if (done.length !== v.done.length) { v.done = done; ch = true; }
    if (done.length >= c.jurors.length || v.force) {
      if (!done.length && c.jurors.length) { v.force = 0; v.tu = 0; v.endsAt = Date.now() + (v.dur || SEC('voteSec')) * 1000; v.retry = (v.retry || 0) + 1; return true; }
      if (v.kind === 'first') { c.v1 = tally(picks, ['A', 'B', 'none']); c.o1 = firstVoteOutcome(c.v1); c.appeal = null; c.stage = 'tally1'; }
      else { const t = tally(picks, ['A', 'B']); c.rounds.push({ kind: v.kind, A: t.A, B: t.B }); c.lastT = t; c.stage = 'tally2'; }
      c.vote = null; ch = true;

  }
  function objStep() {
    const c = G.cur;
    if (G.phase !== 'case' || !c || !c.obj) return false;
    const o = c.obj, votes = {};
    o.jurors.forEach(j => { const x = inp(j).obj; if (x && x.key === o.key && (x.v === 'yes' || x.v === 'no')) votes[j] = x.v; });
    const done = Object.keys(votes);
    let ch = false;
    if (done.length !== o.done.length) { o.done = done; ch = true; }
    if (done.length >= o.jurors.length || o.force) {
      const yes = done.filter(j => votes[j] === 'yes').length, nay = done.length - yes;
      const acc = yes > nay, side = o.side, other = side === 'A' ? 'B' : 'A';
      c.used[c[side] + ':objection'] = true;
      if (acc) {
        const t = c.timer, l = left(); t.remaining = Math.max(0, l - PEN); t.running = false; if (t.remaining <= 0) { t.done = true; t.remaining = 0; }
        c.notes.push(P(c[side]).name + '’s objection sustained (' + yes + '-' + nay + '): 15 seconds taken from ' + P(c[other]).name + '.');
      } else {
        c.penalty[side] += PEN;
        c.notes.push(P(c[side]).name + '’s objection overruled (' + yes + '-' + nay + '): 15 seconds off their next turn.');

  }
  function witStep() {
    const c = G.cur;
    if (G.phase !== 'case' || !c || !c.witness || !c.witness.pending) return false;
    const x = inp(c.witness.pid).wit;
    if (x && x.key === c.witness.key && String(x.text || '').trim().length >= 3) {
      c.witness.text = String(x.text).trim().slice(0, 220); c.witness.pending = false;

  function finalize(outcome, by) {
    const c = G.cur, a = award(outcome, c.doubles);
    if (a.pts) { const w = G.players.find(p => p.id === c[outcome]); if (w) w.score += a.pts; }
    const pa = P(c.A), pb = P(c.B);
    const snap = (p, def) => ({ id: p.id, name: p.name, gender: p.gender, defends: def });
    G.results.push({
      no: G.caseNo + 1, skipped: false, qText: G.qmap[c.qid].text, A: snap(pa, c.defA), B: snap(pb, c.defB),
      helperA: c.helper.A ? P(c.helper.A).name : null, helperB: c.helper.B ? P(c.helper.B).name : null,
      witness: c.witness && !c.witness.pending ? { name: P(c.witness.pid).name, text: c.witness.text } : null,

  function doSwap(side) {
    const c = G.cur, qid = spareFor();
    if (!qid) return;

    c.used[c[side] + ':swap'] = true;

    G.appear[pair.B] = Math.max(0, (G.appear[pair.B] || 1) - 1);
    G.cur = newCase(qid, pair, prev);

  }

  /* Every in-case request from a player's phone lands here (the host's own too). */
  function applyReq(id, r) {
    const c = G.cur;
    if (G.phase !== 'case' || !c) return false;
    const side = r.side === 'B' ? 'B' : 'A';
    if (c[side] !== id && !(r.type === 'spk' && id === G.host)) return false;
    if (r.type === 'spk') { if (!c.helper[side]) return false; c.spk[side] = c.spk[side] === 'main' ? 'helper' : 'main'; return true; }
    if (r.type === 'appeal') {
      if (c.stage !== 'tally1' || !c.o1 || !c.o1.appealable) return false;
      const by = (c.appeal && c.appeal.by) || [];
      if (by.includes(side)) return false;
      c.appeal = { by: by.concat(side) }; c.notes.push(P(id).name + ' requested an appeal.'); return true;
    }
    if (r.type !== 'perk') return false;
    const st = perkState(side, r.id);
    if (!st || !st.ok) return false;
    const pid = c[side], who = P(pid), key = pid + ':' + r.id;
    switch (r.id) {
      case 'extend': c.used[key] = true; addT(BONUS); c.notes.push(who.name + ' used Extra Time: +30 seconds.'); break;
      case 'reply':
        c.used[key] = true;
        if (c.stage === (side === 'A' ? 'reply1' : 'reply2')) addT(BONUS); else c.bonus[side] += BONUS;
        c.notes.push(who.name + ' gets 30 extra seconds in the reply.'); break;
      case 'double': c.used[key] = true; c.doubles[side] = true; c.notes.push(who.name + '’s points are doubled if they win.'); break;
      case 'team': {
        if (!helperCands(side).some(p => p.id === r.pid)) return false;
        const h = P(r.pid);
        c.helper[side] = r.pid; c.used[key] = true;
        c.notes.push(h.name + ' joined ' + who.name + '’s team and left the jury.'); break;
      }
      case 'witness': {
        if (!witnessCands().some(p => p.id === r.pid)) return false;
        pauseT();
        c.witness = { pid: r.pid, by: side, text: '', pending: true, key: uid('w') }; c.used[key] = true;
        c.notes.push(who.name + ' called ' + P(r.pid).name + ' as a witness.'); break;
      }
      case 'swap': doSwap(side); break;
      case 'objection':
        pauseT();
        c.obj = { side, key: uid('o'), endsAt: Date.now() + SEC('objSec') * 1000, jurors: jurorsNow(), done: [] };

  function voteView0() {

    const opt = (key, p, def) => '<button class="vopt ' + (U.pick === key ? 'on' : '') + '" data-act="pick" data-v="' + key + '" aria-pressed="' + (U.pick === key) + '">' + avatar(p, 50) + '<span class="vt"><b>' + esc(p.name) + '</b><span>' + (key === 'A' ? 'Side one' : 'Side two') + ' · ' + gv(p, 'Defends', 'Defends') + ' for “' + esc(def) + '”</span></span><span class="radio">' + (U.pick === key ? '✓' : '') + '</span></button>';
    return head + '<div class="vkind ' + (first ? '' : 'appeal') + '" style="border-style:dashed"><span>' + expl + '</span></div>' +
      '<section class="card" style="display:grid;gap:12px"><div class="muted small">Question: “' + esc(G.qmap[c.qid].text) + '”</div>' +
      '<div class="vopts">' + opt('A', A, c.defA) + opt('B', B, c.defB) + (first ? '<button class="vopt none ' + (U.pick === 'none' ? 'on' : '') + '" data-act="pick" data-v="none" aria-pressed="' + (U.pick === 'none') + '"><span class="vt"><b>Nobody</b><span>Neither side convinced me</span></span><span class="radio">' + (U.pick === 'none' ? '✓' : '') + '</span></button>' : '') + '</div></section>' +
      '<button class="btn xl primary" data-act="confirmVote"' + (U.pick ? '' : ' aria-disabled="true"') + '>Confirm vote</button>';

  function bars(t, keys, labels, leader) {
    const tot = keys.reduce((s, k) => s + t[k], 0) || 1;
    return '<div class="bars">' + keys.map(k => '<div class="bar ' + (leader === k ? 'lead' : '') + '"><span class="nm">' + labels[k] + '</span><div class="track"><div class="fill" style="width:' + Math.round(t[k] / tot * 100) + '%"></div></div><b class="num">' + t[k] + '</b></div>').join('') + '</div>';
  }
  function tallyView() {
    const c = G.cur, A = P(c.A), B = P(c.B), host = isHost(), ms = mySide();
    const labels = { A: esc(A.name), B: esc(B.name), none: 'Nobody' };
    if (c.stage === 'tally1') {
      const o = c.o1;
      let msg;
      if (o.zero) msg = 'Nobody voted, so there’s no winner for this question.';
      else if (o.tie) msg = 'The top two options are tied.';
      else if (o.leader === 'none') msg = '“Nobody” is ahead: the jury wasn’t convinced by either side.';
      else msg = esc(P(c[o.leader]).name) + ' leads after the first vote.';
      let appealBox = '';
      if (o.appealable) {
        const why = o.tie ? 'Tied at the top' : o.margin === 1 ? 'Margin of just one vote' : 'Appeals are allowed on every question';
        const card = (h, body) => '<section class="card" style="display:grid;gap:12px;border-color:var(--gold)"><h2>' + h + '</h2>' + body + '</section>';
        if (c.appeal) {
          const by = c.appeal.by, names = by.map(k => esc(P(c[k]).name)).join(' and ');
          const meToo = ms && !by.includes(ms) ? '<button class="btn gold" data-act="reqAppeal" data-side="' + ms + '">I request an appeal too</button>' : '';
          appealBox = card('Appeal requested by ' + names,
            (host ? '<p>Accept to start a second vote with just two options (no “Nobody”), or reject and the first vote stands.</p><div class="btn-row"><button class="btn gold" data-act="confirmAppeal">Accept: start the appeal vote</button><button class="btn ghost" data-act="cancelAppeal">Reject: confirm the first vote</button></div>'
              : '<p class="muted">Waiting for the host ' + esc(P(G.host).name) + ' to accept or reject.</p>') + meToo);
        } else {
          appealBox = card('Appeal available', '<p class="muted">Reason: ' + why + '. Either side, or both, can request an appeal from their phone and the host accepts or rejects. The host can also open an appeal directly.</p>' +
            (ms ? '<button class="btn xl gold" data-act="reqAppeal" data-side="' + ms + '">Request an appeal</button>' : '') +
            (host ? '<div class="btn-row"><button class="btn gold" data-act="hostAppeal">Host: open an appeal</button><button class="btn" data-act="noAppeal">Continue without appeal</button></div>' : (ms ? '' : '<p class="muted small">Waiting for the sides and the host to decide.</p>')));
        }
      }
      return '<div class="vkind"><b>First vote result</b><span class="muted">These are the jury’s votes.</span></div>' +
        '<section class="card" style="display:grid;gap:16px">' + bars(c.v1, ['A', 'B', 'none'], labels, o.leader) + '<p><b>' + msg + '</b></p></section>' + appealBox +
        (o.appealable ? '' : (host ? '<button class="btn xl primary" data-act="noAppeal">Confirm the result and award points</button>' : '<p class="muted" style="text-align:center">Waiting for the host to confirm the result.</p>'));
    }
    const out = appealOutcome(c.lastT);
    const last = c.rounds[c.rounds.length - 1];
    const ttl = last.kind === 'appeal' ? 'Appeal vote result' : 'Tie-break result';
    return '<div class="vkind appeal"><b>' + ttl + '</b><span class="muted">Voting complete.</span></div>' +
      '<section class="card" style="display:grid;gap:16px">' + bars(c.lastT, ['A', 'B'], labels, out === 'tie' || out === 'none' ? null : out) + '<p><b>' + (out === 'none' ? 'Nobody voted in the appeal, so there’s no winner for this question.' : out === 'tie' ? 'The two sides are tied. A tie-break round opens with just two options.' : esc(P(c[out]).name) + ' won the appeal vote.') + '</b></p></section>' +
      (!host ? '<p class="muted" style="text-align:center">Waiting for the host.</p>' : (out === 'tie' ? '<button class="btn xl gold" data-act="tiebreak">Start the tie-break</button>' : '<button class="btn xl primary" data-act="finalAppeal">Confirm the final verdict and award points</button>'));
  }
  function outcomeText(o, A, B) {
    if (o === 'A' || o === 'B') return esc((o === 'A' ? A : B).name) + ' wins';
    if (o === 'none') return 'Nobody: the jury wasn’t convinced by either side';
    return 'Tie, no appeal';
  }
  function scoreMini() {
    return '<div class="seg-wide" style="gap:8px">' + G.players.slice().sort((a, b) => b.score - a.score).map(p => '<span class="chip' + (p.score ? ' gold' : '') + '">' + esc(p.name) + ' <b class="num">' + p.score + '</b></span>').join('') + '</div>';
  }
  function doneView() {
    const c = G.cur, f = c.final, A = P(c.A), B = P(c.B);
    const last = G.caseNo + 1 >= G.order.length;
    return '<div class="verdict"><p class="muted">Verdict of question ' + (G.caseNo + 1) + '</p><h2>' + outcomeText(f.outcome, A, B) + '</h2>' +
      '<p>' + (f.by === 'appeal' ? 'Decided by the appeal vote (final verdict).' : 'Decided by the first vote.') + '</p>' +
      '<p style="margin-top:8px">' + (f.pts ? '<span class="chip gold">' + f.pts + ' Points of' + (f.doubled ? ' (doubled)' : '') + '</span>' : '<span class="chip">No points in this question</span>') + '</p></div>' +
      '<section class="card" style="display:grid;gap:10px"><h3>Current standings</h3>' + scoreMini() + '</section>' +
      (isHost() ? '<button class="btn xl primary" data-act="nextCase">' + (last ? 'Show the final result' : 'Next question') + '</button>' : '<p class="muted" style="text-align:center">Waiting for the host.</p>');
  }
  function caseTopSmall() {
    const c = G.cur;
    return '<div class="casehead"><span class="chip gold">Question ' + (G.caseNo + 1) + ' of ' + G.order.length + '</span><span class="chip">' + esc(P(c.A).name) + ' vs ' + esc(P(c.B).name) + '</span></div>';
  }
  function caseView() {
    const st = G.cur.stage;
    if (st === 'vote') return caseTopSmall() + voteView();
    if (st === 'tally1' || st === 'tally2') return caseTopSmall() + tallyView();
    if (st === 'done') return caseTopSmall() + doneView();
    return speakingView();
  }
  function finalView() {
    const ps = G.players.slice().sort((a, b) => b.score - a.score);
    const top = ps.length ? ps[0].score : 0;
    let pos = 0, prev = null;
    const rows = ps.map((p, i) => { if (p.score !== prev) { pos = i + 1; prev = p.score; } return { p, pos }; });
    const winners = ps.filter(p => p.score === top && top > 0);
    const head = !winners.length ? '<div class="winner"><h2>No winner</h2><p class="muted">The questions ended with no points.</p></div>' :
      '<div class="winner">' + (winners.length === 1 ? avatar(winners[0], 84) : '') + '<span class="chip gold">' + (winners.length === 1 ? 'Match winner' : 'Tied at the top') + '</span><h2>' + winners.map(w => esc(w.name)).join(' & ') + '</h2><p class="muted num">' + top + ' Points of</p></div>';
    const cases = G.results.map(r => {
      if (r.skipped) return '<div class="cr"><div class="q">Question ' + r.no + ': ' + esc(r.qText) + '</div><span class="muted small">Cancelled: there weren’t two different answers.</span></div>';
      const v1 = r.v1;
      const oc = r.outcome === 'A' || r.outcome === 'B' ? esc(r[r.outcome].name) + ' won' : (r.outcome === 'none' ? 'Nobody' : 'Tie');
      return '<div class="cr"><div class="q">Question ' + r.no + ': ' + esc(r.qText) + '</div>' +
        '<div>' + esc(r.A.name) + ' <span class="muted">vs</span> ' + esc(r.B.name) + (r.helperA || r.helperB ? ' <span class="muted small">· Team: ' + [r.helperA, r.helperB].filter(Boolean).map(esc).join(', ') + '</span>' : '') + '</div>' +
        '<div class="v"><span class="chip">First vote: ' + esc(r.A.name) + ' ' + v1.A + ' · ' + esc(r.B.name) + ' ' + v1.B + ' · Nobody ' + v1.none + '</span>' +
        r.rounds.map(x => '<span class="chip gold">' + (x.kind === 'appeal' ? 'Appeal' : 'Tie-break') + ': ' + x.A + ' - ' + x.B + '</span>').join('') + '</div>' +
        '<div class="v"><span class="chip ' + (r.pts ? 'ok' : '') + '">' + oc + '</span><span class="chip">' + (r.by === 'appeal' ? 'Decided on appeal' : 'Decided by the first vote') + '</span>' + (r.pts ? '<span class="chip gold">' + r.pts + ' Points of' + (r.doubled ? ' (doubled)' : '') + '</span>' : '') + '</div></div>';
    }).join('');
    return podiumCard(ps.map(p => ({ name: esc(p.name), pts: p.score }))) +
      '<section class="card" style="display:grid;gap:12px"><h2>Question results</h2><div class="cases">' + (cases || '<p class="muted">No questions.</p>') + '</div></section>' +
      (isHost() ? '<div class="btn-row"><button class="btn primary" data-act="rematch">Play again with the same players</button><button class="btn" data-act="toLobby">Back to lobby</button></div>' : '<p class="muted" style="text-align:center">The host can start a new round.</p>');
  }

  function modalView() {
    const m = U.modal;
    if (!m) return '';
    let body = '';
    if (m.type === 'menu') {
      const host = isHost(), others = G ? G.players.filter(p => p.id !== ME_ID) : [];
      body = '<h2>Menu</h2><p class="muted">Room <b dir="ltr">' + esc(U.code) + '</b>' + (G ? ' · Host: ' + esc(P(G.host).name) : '') + '</p>' +
        (!host && G && inRoom(ME_ID) ? '<button class="btn" data-act="askTake">Host not responding? Take over hosting</button>' : '') +
        (host && others.length ? '<button class="btn" data-act="askHand">Hand hosting to another player</button>' : '') +
        (isGuest() && G && G.phase === 'final' ? '' : '<button class="btn danger" data-act="askLeave">Leave the room</button>') + '<button class="btn ghost" data-act="closeModal">Close</button>';
    } else if (m.type === 'take') {
      body = '<h2>Take over hosting?</h2><p class="muted">Only use this if the host left or their phone disconnected. You’ll be the one moving the game between stages.</p><div class="btn-row"><button class="btn primary" data-act="takeHost">Take over</button><button class="btn" data-act="closeModal">Cancel</button></div>';
    } else if (m.type === 'hand') {
      body = '<h2>Choose the new host</h2><div class="cands">' + G.players.filter(p => p.id !== ME_ID).map(p => '<button class="cand" data-act="handTo" data-id="' + p.id + '">' + avatar(p, 40) + '<b>' + esc(p.name) + '</b></button>').join('') + '</div><button class="btn ghost" data-act="closeModal">Cancel</button>';
    } else if (m.type === 'leave') {
      const warn = isHost() && G && G.players.length > 1 ? 'You’re the host. We’ll pass hosting to another player automatically.' : 'You can come back with the same code.';
      body = '<h2>Leave the room?</h2><p class="muted">' + warn + '</p><div class="btn-row"><button class="btn danger" data-act="leave">Leave</button><button class="btn" data-act="closeModal">Cancel</button></div>';
    } else if (m.type === 'force') {
      body = '<h2>Continue without the rest?</h2><p class="muted">Anyone who hasn’t finished counts as having no ' + (G.phase === 'perks' ? 'perks' : (G.phase === 'qwrite' ? 'questions' : 'answers')) + ' at this stage.</p><div class="btn-row"><button class="btn primary" data-act="forceGo">Continue</button><button class="btn" data-act="closeModal">Cancel</button></div>';
    } else if (m.type === 'team') {
      const cands = (G.cur.teamCands || {})[m.side] || [];
      body = '<h2>Pick your helper</h2><p class="muted">Players whose answer differs from yours and from the view you’re defending. The helper leaves the jury.</p><div class="cands">' + cands.map(id => '<button class="cand" data-act="pickHelper" data-pid="' + id + '">' + avatar(P(id), 44) + '<b>' + esc(P(id).name) + '</b></button>').join('') + '</div><button class="btn ghost" data-act="closeModal">Cancel</button>';
    } else if (m.type === 'wit') {
      body = '<h2>Call a witness</h2><p class="muted">Pick a neutral player to write their opinion from their phone. They stay on the jury.</p><div class="cands">' + (G.cur.witCands || []).map(id => '<button class="cand" data-act="pickWitness" data-pid="' + id + '">' + avatar(P(id), 44) + '<b>' + esc(P(id).name) + '</b></button>').join('') + '</div><button class="btn ghost" data-act="closeModal">Cancel</button>';
    }
    return '<div class="ov" data-act="ovClose"><div class="dlg" role="dialog" aria-modal="true">' + body + '</div></div>';
  }

  function hostOnlyView() {
    const note = '<section class="card pass"><h2>You’re the host</h2><p class="muted">You’re not playing this game. You follow the players and move the game between stages.</p></section>';
    if (G.phase === 'perks') return note + progBox('Picking perks') + hostNext('Continue', 'perksNext');
    if (G.phase === 'qwrite') return note + progBox('Writing questions') + hostNext('Show the group’s questions', 'qwriteNext');
    if (G.phase === 'answers') return note + progBox('Secret answers') + hostNext(G.ansReturn === 'start' ? 'Start the questions' : 'Continue the question', 'answersNext');

  }
  function gameView() {
    if (!inRoom(ME_ID) && isHost() && (G.phase === 'perks' || G.phase === 'qwrite' || G.phase === 'answers')) return hostOnlyView();
    switch (G.phase) {
      case 'lobby': return lobbyView();
      case 'perks': return perksView();
      case 'qwrite': return qwriteView();
      case 'qreview': return qreviewView();
      case 'answers': return answersView();
      case 'nocase': return nocaseView();
      case 'addq': return addqView();
      case 'case': return caseView();
      case 'final': return finalView();

    return '';
  }

  /* ---------- render ---------- */
  function render() {
    let html;
    if (U.notice) html = noticeView();
    else if (U.splash) html = splashView();
    else {
      html = topbar();
      if (!U.code || U.view === 'home') html += homeView();
      else if (!G) html += '<section class="card pass"><div class="spin" aria-hidden="true"></div><h2>Connecting to room ' + esc(U.code) + '</h2></section><button class="btn ghost" data-act="leaveNow">Cancel</button>';
      else if (U.view === 'join') html += joinView();
      else if (U.view === 'wait') html += (G.phase === 'lobby' && !inRoom(ME_ID) && takenStop() ? joinView() : waitView());

      else if (U.view === 'kicked') html += kickedView();
      else html += gameView();
      html += modalView();

    if (html === U.lastHtml) return;
    const key = U.splash ? 'splash' : (G ? U.view + G.phase + G.caseNo + (G.cur ? G.cur.stage + (G.cur.vote ? G.cur.vote.key : '') : '') : U.view);
    const ae = document.activeElement, fid = ae && ae.id && app.contains(ae) ? ae.id : null;

    try { if (fid && ae.setSelectionRange) { ss = ae.selectionStart; se = ae.selectionEnd; } } catch (e) { }

  }

  /* ---------- actions ---------- */
  const ACT = {};
  const H = fn => (...a) => { if (!isHost()) return false; const r = fn(...a); if (r !== false) publish(); return r; };

  ACT.enter = () => { U.splash = false; };
  ACT.noticeOk = () => { U.notice = false; try { const m = (location.hash || '').match(/^#room-([A-Za-z0-9]{4,6})$/); if (m) sessionStorage.setItem('aq.notice.' + m[1].toUpperCase(), '1'); } catch (e) { } window.scrollTo(0, 0); };
  ACT.myGender = d => { U.gender = d.g; lsSet({ gender: d.g }); };

  ACT.askLeave = () => { U.modal = { type: 'leave' }; };
  ACT.askTake = () => { U.modal = { type: 'take' }; };
  ACT.askHand = () => { U.modal = { type: 'hand' }; };
  ACT.leaveNow = () => { leaveLocal(); U.err = ''; };
  ACT.leave = async () => {
    U.modal = null;
    if (isHost() && G) {
      const next = G.players.find(p => p.id !== ME_ID);
      if (G.phase === 'lobby') G.players = G.players.filter(p => p.id !== ME_ID);
      if (next) { G.host = next.id; hostOn = false; await flushDirect(); }
    } else if (G && G.phase === 'lobby' && ME) { ME.room = ''; ME.name = ''; await saveMe(); }
    leaveLocal(); render();
  };
  async function flushDirect() { try { G.rev = (G.rev || 0) + 1; G.sentAt = Date.now(); await db.doc(roomPath(G.code)).set(clone(G)); nudge('v'); } catch (e) { writeFailed(e); } }
  ACT.handTo = async d => { if (!isHost()) return; U.modal = null; G.host = d.id; hostOn = false; stopHost(); await flushDirect(); toast('Hosting handed over.'); render(); };
  ACT.takeHost = async () => {
    U.modal = null;
    try { const s = await db.doc(roomPath(U.code)).get(); if (s.exists) G = clone(s.data()); } catch (e) { }
    if (!G || !inRoom(ME_ID)) return;
    G.host = ME_ID; await flushDirect(); becomeHost(); toast('You’re the host now.'); render();
  };

  ACT.create = async () => {
    if (U.fromLink || isGuest()) return false;

    if (!name) { U.err = 'Type your name or nickname first.'; return; }
    if (U.busy) return false;
    U.busy = true; U.err = ''; render();
    try {
      let code = '';
      for (let i = 0; i < 6; i++) {
        code = Array.from({ length: 4 }, () => CODE_CH[Math.floor(Math.random() * CODE_CH.length)]).join('');
        const s = await db.doc(roomPath(code)).get();
        if (!s.exists) break;
      }
      G = freshRoom(code);
      G.players.push({ id: ME_ID, name, gender: U.gender, perks: [], score: 0, at: Date.now() });

      G.rev = 1; G.sentAt = Date.now();
      await db.doc(roomPath(code)).set(clone(G));

      await subscribe(code);

    } catch (e) { G = null; U.code = ''; writeFailed(e); }
    U.busy = false;
  };
  ACT.join = async () => {
    const code = String(U.draft.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 4) { U.err = 'Type the room code (4 characters).'; return; }
    if (!U.name.trim()) { U.err = 'Type your name or nickname first.'; return; }
    U.err = ''; U.busy = true; render();
    await openRoom(code, true);
    U.busy = false;
  };
  async function openRoom(code, autoJoin) {
    G = null; ME = null; U.view = 'connecting';
    U.code = code;
    await loadMe(code);
    await subscribe(code);
    if (autoJoin && U.name.trim()) {
      const waitG = () => new Promise(res => { let n = 0; const t = setInterval(() => { if (G || !U.code || ++n > 40) { clearInterval(t); res(); } }, 250); });
      await waitG();
      if (G && !inRoom(ME_ID) && G.phase === 'lobby') await sendJoin();

  }
  /* الاسم أي طول، بس ما يتكرر بنفس الغرفة */
  function normName(n) { return String(n || '').trim().replace(/\s+/g, ' ').toLowerCase(); }
  function nameTaken(n, id) { const k = normName(n); return !!(G && k && G.players.some(p => p.id !== id && normName(p.name) === k)); }
  function takenStop() { const nm = U.name.trim(); if (!nameTaken(nm, ME_ID)) return false; U.err = 'The name “' + nm + '” is already taken in this room. Pick another name.'; U.view = 'join'; try { if (typeof toast === 'function') toast(U.err); } catch (e) { } return true; }
  async function sendJoin() {
    if (takenStop()) { render(); return; }
    ME = Object.assign(ME && ME.room === U.code ? ME : blankMe(U.code), { room: U.code, name: U.name.trim(), gender: U.gender, at: Date.now() });

  ACT.sendJoin = async () => { if (!U.name.trim()) { U.err = 'Type your name or nickname.'; return; } U.err = ''; await sendJoin(); };
  ACT.copyLink = (d, el) => {

    return false;
  };
  function selectLink() { const i = document.getElementById('lnk'); if (i) { i.focus(); i.select(); } toast('Copy the link from the box.'); }

  /* lobby (host) */
  ACT.kick = H(d => { G.players = G.players.filter(p => p.id !== d.id); G.kicked[d.id] = true; });
  ACT.step = H(d => {
    const s = G.settings; if (G.phase !== 'lobby') return false;
    const L = { players: [3, 25], rounds: [1, 30], questions: [3, s.source === 'preset' ? PACKN : 60] }[d.k]; if (!L) return false;
    const old = s[d.k];
