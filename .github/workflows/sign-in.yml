name: AQNINI sign-in files v2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Google sign-in files
        run: |
          B=https://murafaat-1a91d.firebaseapp.com/__
          mkdir -p __/auth __/firebase
          get() { c=$(curl -sSL -w '%{http_code}' -o "$2" "$B/$1"); echo "$1 -> $c"; [ "$c" = 200 ] || rm -f "$2"; }
          get auth/handler __/auth/handler.html
          get auth/handler.js __/auth/handler.js
          get auth/experiments.js __/auth/experiments.js
          get auth/iframe __/auth/iframe.html
          get auth/iframe.js __/auth/iframe.js
          get firebase/init.json __/firebase/init.json
          [ -s __/firebase/init.json ] || printf '%s' '{"apiKey":"AIzaSyByoJGFA6WSH5IXgZ4rxbNITx2Oqnjai1A","authDomain":"aqnini.com","databaseURL":"https://murafaat-1a91d-default-rtdb.europe-west1.firebasedatabase.app","projectId":"murafaat-1a91d","storageBucket":"murafaat-1a91d.firebasestorage.app","messagingSenderId":"615464516120","appId":"1:615464516120:web:ec7d9c38154400ca58216d"}' > __/firebase/init.json
          touch .nojekyll
          ls -la __/auth __/firebase
          [ -s __/auth/handler.html ] && [ -s __/auth/handler.js ]
      - name: Save to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Google sign-in files on aqnini.com" || echo "no changes"
          git push
