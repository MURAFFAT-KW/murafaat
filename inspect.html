<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>أقنعني | المعاين</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#F3F5F9;color:#12203A;font:500 15px/1.45 "Readex Pro","Alexandria",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(40px + env(safe-area-inset-bottom))}

/* اختيار اللعبة */
.pick{padding-top:max(18px,env(safe-area-inset-top))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.top h1{margin:0;font-size:1.65rem;color:#0554A4;letter-spacing:-.3px}
.badge{background:#12203A;color:#fff;border-radius:99px;padding:4px 12px;font-weight:800;font-size:.82rem}
.sp1{flex:1}
.pill{border:1.5px solid #D5DBE5;background:#fff;border-radius:99px;padding:6px 14px;font-weight:700;font-size:.88rem}
.lead{color:#5B6578;margin:6px 0 16px;font-size:.95rem}
.seg{display:flex;background:#E6EAF1;border-radius:14px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{flex:1;border-radius:11px;padding:9px;font-weight:800;font-size:.9rem;color:#5B6578}
.seg button.on{background:#fff;color:#12203A;box-shadow:0 2px 8px rgba(18,32,58,.12)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.tile{width:calc((100% - 24px) / 3);aspect-ratio:1;border-radius:22px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:1rem;box-shadow:0 8px 18px rgba(18,32,58,.14)}
.tile .i{font-size:2rem;line-height:1}
.how{background:#fff;border-radius:18px;padding:14px 16px;margin-top:18px;box-shadow:0 2px 10px rgba(18,32,58,.05)}
.how b{display:block;margin-bottom:6px}
.how ol{margin:0;padding-inline-start:20px;color:#3B4659;font-size:.9rem;line-height:1.8}
a.lnk{display:block;text-align:center;margin-top:16px;color:#0554A4;font-weight:700;text-decoration:none}

/* التسجيل */
.recv{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:max(22px,env(safe-area-inset-top)) 16px 24px;text-align:center}
.recv h2{margin:6px 0 2px;font-size:1.35rem}
.recv p{margin:0;color:#5B6578;font-size:.92rem}
.ring{width:54px;height:54px;border-radius:50%;border:5px solid #DCE2EC;border-top-color:#FBC611;animation:s 1s linear infinite;margin-top:8px}
@keyframes s{to{transform:rotate(360deg)}}
.nums{display:flex;gap:10px;margin:14px 0}
.nums div{background:#fff;border-radius:14px;padding:8px 14px;min-width:92px;box-shadow:0 2px 8px rgba(18,32,58,.06)}
.nums b{display:block;font-size:1.3rem}
.nums small{color:#5B6578;font-weight:700;font-size:.75rem}
.phone{width:200px;height:433px;border-radius:26px;border:6px solid #12203A;overflow:hidden;background:#fff;position:relative;box-shadow:0 14px 30px rgba(18,32,58,.25)}
.btn{background:#12203A;color:#fff;border-radius:14px;padding:12px 18px;font-weight:800}
.btn.y{background:#FBC611;color:#12203A}
.btn.g{background:#fff;color:#12203A;border:1.5px solid #D5DBE5}

/* جهاز التسجيل (اللعبة الحقيقية) */
#rig{position:fixed;left:-6000px;top:0;width:390px;height:844px;overflow:hidden;background:#fff;direction:ltr}
#rig iframe{border:0;display:block;width:390px;height:844px;background:#fff;transform-origin:top left}
#rig.rec{left:auto;top:auto}
#rig.live{left:0;right:0;margin:0 auto;z-index:20;background:#E9EDF3}

/* الألبوم */
.ah{position:sticky;top:0;z-index:5;background:rgba(243,245,249,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:max(8px,env(safe-area-inset-top)) 14px 8px;margin:0 -14px;border-bottom:1px solid #E3E8F0}
.ar{display:flex;align-items:center;gap:8px}
.gname{flex:1;min-width:0;font-weight:800;font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:7px;vertical-align:middle}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid #D5DBE5;background:#fff;border-radius:99px;padding:5px 12px;font-weight:700;font-size:.83rem;white-space:nowrap}
.chip.on{background:#12203A;border-color:#12203A;color:#fff}
.chip.bad{border-color:#F2B8BE;color:#B0101F}
.chip.bad.on{background:#C81E1E;border-color:#C81E1E;color:#fff}
.sum{border-radius:20px;padding:16px;margin:14px 0 6px;color:#fff;box-shadow:0 10px 24px rgba(18,32,58,.16)}
.sum.ok{background:linear-gradient(135deg,#138A4A,#1FAF63)}
.sum.o{background:linear-gradient(135deg,#C96A00,#F08C0A)}
.sum.r{background:linear-gradient(135deg,#A80F1E,#DE2B3A)}
.sum h2{margin:0 0 4px;font-size:1.2rem}
.sum p{margin:0;opacity:.92;font-size:.9rem}
.sum .st{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sum .st span{background:rgba(255,255,255,.18);border-radius:10px;padding:5px 10px;font-weight:700;font-size:.82rem}
.sum .ac{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sum .ac button{background:#fff;color:#12203A;border-radius:12px;padding:8px 12px;font-weight:800;font-size:.85rem}
.warn{background:#FFF1F2;border:1.5px solid #F7C3C8;color:#8A0A17;border-radius:16px;padding:12px 14px;margin:10px 0;font-weight:700;font-size:.9rem}
.warn button{color:#C81E1E;text-decoration:underline;font-weight:800}
.stagehd{margin:20px 4px 8px;font-size:.85rem;font-weight:800;color:#5B6578;display:flex;align-items:center;gap:8px}
.stagehd::after{content:"";flex:1;height:1px;background:#DCE2EC}
.card{background:#fff;border-radius:20px;padding:12px;margin-bottom:12px;box-shadow:0 2px 12px rgba(18,32,58,.06);scroll-margin-top:120px;border:2px solid transparent}
.card.r{border-color:#F3B4BA}
.card.o{border-color:#F6CF9A}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.num{background:#12203A;color:#fff;border-radius:10px;min-width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex:none}
.tt{flex:1;min-width:0}
.tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.97rem}
.tt small{color:#7A8499;font-weight:700;font-size:.78rem}
.lv{flex:none;border-radius:99px;padding:3px 10px;font-weight:800;font-size:.78rem}
.lv.ok{background:#E3F6EC;color:#138A4A}
.lv.r{background:#FDE4E6;color:#B0101F}
.lv.o{background:#FFF0DC;color:#A85400}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin:0 -2px}
.strip::-webkit-scrollbar{display:none}
.th{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.tb{width:118px;height:255px;border-radius:16px;overflow:hidden;background:#EEF1F6;border:1.5px solid #E1E6EE;position:relative}
.tb iframe{position:absolute;left:0;top:0;width:390px;height:844px;border:0;transform:scale(.3026);transform-origin:top left;pointer-events:none;background:#fff}
.th.r .tb{border-color:#E0434F;box-shadow:0 0 0 2px #FDE4E6}
.th.o .tb{border-color:#F08C0A;box-shadow:0 0 0 2px #FFF0DC}
.th span{font-size:.76rem;font-weight:700;color:#3B4659;max-width:118px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th i{position:absolute;top:-5px;inset-inline-end:-5px;width:20px;height:20px;border-radius:50%;color:#fff;font:800 12px/20px system-ui;font-style:normal;text-align:center;z-index:2}
.th.r i{background:#C81E1E}.th.o i{background:#F08C0A}
.iss{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.iss li{border-radius:12px;padding:8px 10px;font-size:.84rem;font-weight:700}
.iss li.r{background:#FFF1F2;color:#8A0A17}
.iss li.o{background:#FFF6EA;color:#8A4500}
.iss li small{display:block;font-weight:500;opacity:.8;direction:ltr;text-align:left;font-family:ui-monospace,monospace;font-size:.75rem;word-break:break-word}
details.ts{margin-top:8px;font-size:.82rem;color:#5B6578}
details.ts summary{font-weight:700;cursor:pointer}
details.ts div{padding:4px 2px}
.empty{text-align:center;color:#5B6578;padding:30px 10px;font-weight:700}

/* عارض الشاشة */
.vw{position:fixed;inset:0;z-index:30;background:#0E1626;color:#fff;display:flex;flex-direction:column}
.vw[hidden]{display:none}
.vh{padding:max(10px,env(safe-area-inset-top)) 12px 8px;display:grid;gap:8px}
.vh .ar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1rem}
.vh small{opacity:.7;font-weight:700;font-size:.78rem}
.x{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);font-size:1.1rem;flex:none}
.tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border-radius:11px;background:rgba(255,255,255,.1);padding:7px 11px;font-weight:800;font-size:.84rem;white-space:nowrap;position:relative}
.tab.on{background:#fff;color:#12203A}
.tab.r::after,.tab.o::after{content:"";position:absolute;top:4px;inset-inline-end:4px;width:8px;height:8px;border-radius:50%;background:#FF4D5A}
.tab.o::after{background:#FFA227}
.vs{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;padding-top:4px}
.vf{position:relative;overflow:hidden;border-radius:18px;background:#fff;flex:none}
.vf iframe{position:absolute;left:0;top:0;width:390px;height:844px;border:0;transform-origin:top left;background:#fff}
.vi{max-height:22vh;overflow:auto;padding:8px 12px 0}
.vi .iss{margin:0}
.vb{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.vb button{border-radius:14px;padding:12px 10px;font-weight:800;background:rgba(255,255,255,.12)}
.vb .go{flex:1;background:#FBC611;color:#12203A}
.vb button:disabled{opacity:.3}

/* التجربة المباشرة */
.lb{position:fixed;left:0;right:0;top:0;z-index:25;background:#12203A;color:#fff;padding:max(8px,env(safe-area-inset-top)) 10px 8px;display:grid;gap:7px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.lb .b{border-radius:11px;background:rgba(255,255,255,.12);padding:7px 10px;font-weight:800;font-size:.85rem;white-space:nowrap;flex:none}
.lb .b.on{background:#fff;color:#12203A}
.lb .b.err{background:#C81E1E}
.lb .b:disabled{opacity:.35}
.lb .cur{flex:1;min-width:0;text-align:center;background:rgba(255,255,255,.12);border-radius:11px;padding:6px 8px}
.lb .cur small{display:block;font-size:.72rem;opacity:.75;font-weight:700}
.lb .cur span{display:block;font-weight:800;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .arr{width:44px;height:44px;font-size:1.15rem}
.lb .sc{overflow-x:auto;scrollbar-width:none}.lb .sc::-webkit-scrollbar{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#12203A;color:#fff;border-radius:14px;padding:10px 16px;font-weight:800;z-index:50;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.menu{position:fixed;inset:0;z-index:40;background:rgba(18,32,58,.45);display:flex;align-items:flex-end}
.menu .in{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.menu .it{display:flex;gap:10px;align-items:center;width:100%;text-align:start;border:1.5px solid #E6EAF0;border-radius:14px;padding:12px;margin-top:8px;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="rig"></div>
<div class="vw" id="vw" hidden></div>
<script>
(function () {
  'use strict';
  window.__AQ_SHELL = 1;
  var qs = new URLSearchParams(location.search);
  var S = { lang: qs.get('lang') === 'en' ? 'en' : 'ar', game: null, mode: 'pick', dark: false, filter: 'all', tv: false, timeRuns: false, vi: 0, vk: 'host' };
  try { S.dark = localStorage.getItem('aqnieni.theme') === 'dark'; } catch (e) { }
  var GAMES = [
    { f: 'murafaat', ar: 'المنصة', en: 'ALMANASSA', c: '#DE0921', i: '⚖️' },
    { f: 'mazad', ar: 'المزاد', en: 'ALMAZAD', c: '#0554A4', i: '$' },
    { f: 'nadik', ar: 'الرئيس', en: 'ALRAEES', c: '#E0A800', i: '⚽' },
    { f: 'azyaa', ar: 'الأزياء', en: 'ALAZYAA', c: '#7B2FBE', i: '🎀' },
    { f: 'aqar', ar: 'العقار', en: 'ALAQAR', c: '#1E8A4C', i: '🏠' }
  ];
  var PH = {
    start: ['صفحات البداية', 'Start pages'], lobby: ['غرفة الانتظار', 'Lobby'], final: ['النتائج', 'Results'], perks: ['المزايا', 'Perks'],
    qwrite: ['كتابة الأسئلة', 'Writing questions'], qreview: ['مراجعة الأسئلة', 'Reviewing questions'], addq: ['إضافة أسئلة', 'Adding questions'],
    answers: ['الإجابات السرية', 'Secret answers'], case: ['المرافعات', 'Debates'], nocase: ['ما في مرافعات', 'No debates'],
    items: ['المنتجات', 'Products'], round: ['جولات البيع', 'Selling rounds'],
    picks: ['التشكيلات', 'Squads'], tier: ['اختيار الفئة', 'Tier pick'], reveal: ['الكشف', 'Reveal'], market: ['سوق الانتقالات', 'Transfer market'], lineup: ['خماسي الكأس', 'Cup five'], cup: ['الكأس', 'Cup'],
    buy: ['الشراء', 'Buying'], design: ['التصميم', 'Design'], build: ['بناء المشروع', 'Building the project'], talk: ['الإقناع', 'Pitching'], shop: ['السوق', 'Market'], vote: ['التصويت', 'Voting'],
    setup: ['التجهيز', 'Setup'], pre: ['قبل الجولة', 'Before the round'], pitch: ['العرض', 'Pitch'], deals: ['الصفقات', 'Deals'], summary: ['ملخص الجولة', 'Round summary']
  };
  function T(ar, en) { return S.lang === 'en' ? en : ar; }
  function ph(k) { return PH[k] ? T(PH[k][0], PH[k][1]) : k; }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function n2(x) { return S.lang === 'en' ? String(x) : String(x).replace(/[0-9]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; }); }
  var $ = function (id) { return document.getElementById(id); };
  var frame = null, poll = null, io = null;
  function I() { try { return frame && frame.contentWindow && frame.contentWindow.__INSPECT; } catch (e) { return null; } }
  function G() { return GAMES.find(function (g) { return g.f === S.game; }); }
  function setDir() { document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === 'en' ? 'ltr' : 'rtl'; }
  function toast(m) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 1800); }

  /* ============ 1. اختيار اللعبة ============ */
  function renderPick() {
    S.mode = 'pick'; clearInterval(poll); killRig(); setDir(); $('vw').hidden = true;
    $('app').innerHTML = '<div class="wrap pick">' +
      '<div class="top"><h1>' + T('أقنعني', 'Aqnieni') + '</h1><span class="badge">🔍 ' + T('المعاين', 'Inspector') + '</span><span class="sp1"></span><button class="pill" data-a="lang">' + T('English', 'عربي') + '</button></div>' +
      '<p class="lead">' + T('اختر لعبة، والبوتات يلعبونها كاملة بروحهم. بعدها تطلع لك كل شاشات اللعبة بألبوم واحد، والشاشات اللي فيها مشكلة تنعلم بالأحمر.', 'Pick a game and bots play it start to finish. Then every screen appears in one album, and screens with a problem are marked in red.') + '</p>' +
      '<div class="seg"><button class="' + (S.dark ? '' : 'on') + '" data-a="theme" data-v="0">☀️ ' + T('صباحي', 'Light') + '</button><button class="' + (S.dark ? 'on' : '') + '" data-a="theme" data-v="1">🌙 ' + T('مسائي', 'Dark') + '</button></div>' +
      '<div class="tiles">' + GAMES.map(function (g) { return '<button class="tile" style="background:' + g.c + '" data-a="game" data-v="' + g.f + '"><span class="i">' + g.i + '</span>' + T(g.ar, g.en) + '</button>'; }).join('') + '</div>' +
      '<div class="how"><b>' + T('شلون يشتغل', 'How it works') + '</b><ol>' +
      T('<li>تختار اللعبة وتنطر تقريبًا دقيقة.</li><li>تنزل بالألبوم: كل شاشة تشوفها من عينك (المضيف) ومن عين كل لاعب جنب بعض.</li><li>اضغط أي شاشة عشان تكبر، و«جرّبها» عشان تضغط أزرارها بنفسك.</li><li>«انسخ التقرير» وألصقه لي بالمحادثة، وأصلّح كل المشاكل مرة وحدة.</li>',
        '<li>Pick a game and wait about a minute.</li><li>Scroll the album: each screen side by side as you (host) and as every player.</li><li>Tap a screen to enlarge it, and “Try it” to tap its buttons yourself.</li><li>“Copy report” and paste it to me in chat to fix everything at once.</li>') +
      '</ol></div>' +
      '<a class="lnk" href="dev.html' + (S.lang === 'en' ? '?lang=en' : '') + '">' + T('نسخة البوتات ←', '→ Bots version') + '</a></div>';
  }

  /* ============ 2. التسجيل ============ */
  function killRig() { if (io) { io.disconnect(); io = null; } window.__DEV = null; frame = null; $('rig').className = ''; $('rig').removeAttribute('style'); $('rig').innerHTML = ''; }
  function fileOf() { return G().f + (S.lang === 'en' ? '-en' : '') + '.html?dev=1&inspect=1&bots=3&speed=10&theme=' + (S.dark ? 'dark' : 'light'); }
  function record() {
    clearInterval(poll); killRig(); setDir(); $('vw').hidden = true;
    S.mode = 'rec'; S.filter = 'all'; S.t0 = Date.now();
    var g = G();
    $('app').innerHTML = '<div class="recv"><div class="ring"></div><h2><span class="dot" style="background:' + g.c + '"></span>' + T(g.ar, g.en) + '</h2><p>' + T('البوتات يلعبون اللعبة كاملة، وكل شاشة تنحفظ وتنفحص…', 'Bots are playing the whole game; every screen is saved and checked…') + '</p>' +
      '<div class="nums"><div><b id="rn">0</b><small>' + T('شاشة', 'screens') + '</small></div><div><b id="rt">0</b><small>' + T('ثانية', 'seconds') + '</small></div><div><b id="re">0</b><small>' + T('مشكلة', 'issues') + '</small></div></div>' +
      '<div class="phone" id="phone"></div>' +
      '<div style="margin-top:16px;display:flex;gap:8px"><button class="btn g" data-a="home">' + T('إلغاء', 'Cancel') + '</button><button class="btn y" data-a="stoprec">' + T('وقّف وورني اللي انحفظ', 'Stop and show what\'s saved') + '</button></div></div>';
    var rig = $('rig');
    rig.innerHTML = '<iframe id="fr" src="' + fileOf() + '"></iframe>';
    frame = $('fr');
    placeRig();
    poll = setInterval(tick, 400);
  }
  function placeRig() {
    var rig = $('rig'); if (!frame) return;
    if (S.mode === 'rec') {
      var ph = $('phone'); if (!ph) return; var r = ph.getBoundingClientRect(), sc = (r.width - 12) / 390;
      rig.className = 'rec'; rig.setAttribute('style', 'left:' + (r.left + 6 + scrollX) + 'px;top:' + (r.top + 6 + scrollY) + 'px;position:absolute;width:' + (390 * sc) + 'px;height:' + (844 * sc) + 'px;border-radius:20px;pointer-events:none');
      frame.style.transform = 'scale(' + sc + ')'; frame.style.width = '390px'; frame.style.height = '844px';
    } else if (S.mode === 'live') {
      var top = $('lb') ? $('lb').offsetHeight : 120, W = innerWidth, H = innerHeight - top;
      rig.className = 'live';
      if (S.tv) {
        var s = Math.min(1, W / 1280); rig.setAttribute('style', 'top:' + (top + 8) + 'px;width:' + (1280 * s) + 'px;height:' + (720 * s) + 'px;border-radius:10px');
        frame.style.width = '1280px'; frame.style.height = '720px'; frame.style.transform = 'scale(' + s + ')';
      } else {
        var w = Math.min(W, 430); rig.setAttribute('style', 'top:' + top + 'px;width:' + w + 'px;height:' + H + 'px');
        frame.style.width = w + 'px'; frame.style.height = H + 'px'; frame.style.transform = '';
      }
    } else { rig.className = ''; rig.removeAttribute('style'); frame.style.transform = ''; frame.style.width = '390px'; frame.style.height = '844px'; }
  }
  addEventListener('resize', function () { placeRig(); if (!$('vw').hidden) fitViewer(); });

  function tick() {
    var i = I(); if (!i) return;
    if (S.mode === 'rec') {
      var sn = i.snaps || [];
      if ($('rn')) $('rn').textContent = n2(sn.length);
      if ($('rt')) $('rt').textContent = n2(Math.round((Date.now() - S.t0) / 1000));
      if ($('re')) $('re').textContent = n2(model().bad);
      if (i.done) { S.mode = 'album'; placeRig(); renderAlbum(); }
    } else if (S.mode === 'live') renderLive();
  }

  /* ============ 3. تجميع المشاكل ============ */
  function whoName(w) {
    var i = I(); if (w === '👤') return T('أنت', 'You');
    var k = +String(w).replace(/\D/g, ''), p = i && i.players().find(function (x) { return x.k === k; });
    return p ? p.name : w;
  }
  function model() {
    var i = I(); if (!i) return { snaps: [], bad: 0 };
    var sn = i.snaps || [], errs = i.errors(), tsts = i.toasts ? i.toasts() : [];
    var out = sn.map(function (s, n) {
      var iss = [];
      (s.views || []).forEach(function (v) { (v.c && v.c.issues || []).forEach(function (x) { iss.push({ lv: x.lv, k: v.k, who: v.k === 'host' ? T('أنت', 'You') : v.name, m: x.m, d: x.d }); }); });
      errs.forEach(function (e) { var at = e.s == null || e.s < 0 ? 0 : e.s; if (at === n) iss.push({ lv: 'r', k: e.who === '👤' ? 'host' : +String(e.who).replace(/\D/g, ''), who: whoName(e.who), m: T('خطأ برمجي', 'Code error'), d: e.m }); });
      var lv = iss.some(function (x) { return x.lv === 'r'; }) ? 'r' : iss.length ? 'o' : 'ok';
      return { n: n, s: s, iss: iss, lv: lv, toasts: tsts.filter(function (t) { return t.s === n; }) };
    });
    return { snaps: out, bad: out.reduce(function (a, x) { return a + x.iss.length; }, 0) };
  }
  function viewLv(m, k) { var l = m.iss.filter(function (x) { return x.k === k; }); return l.some(function (x) { return x.lv === 'r'; }) ? 'r' : l.length ? 'o' : ''; }

  /* ============ 4. الألبوم ============ */
  function buildDoc(c) {
    var pool = I().pool();
    return c.html.replace(/<style data-p="(\d+)"><\/style>/g, function (_, id) { return '<style>' + pool[+id] + '</style>'; })
      .replace(/aq-pool:(\d+)/g, function (_, id) { return pool[+id]; })
      .replace(/<head>/i, '<head><style>html{scrollbar-width:none}::-webkit-scrollbar{display:none}</style>');
  }
  function mount(box, c, interactive) {
    var f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-same-origin'); f.setAttribute('scrolling', interactive ? 'yes' : 'no'); f.setAttribute('tabindex', '-1');
    f.onload = function () { try { f.contentWindow.scrollTo(0, c.sy || 0); } catch (e) { } };
    f.srcdoc = buildDoc(c); box.appendChild(f); return f;
  }
  function renderAlbum(keepScroll) {
    var y = keepScroll ? scrollY : 0;
    S.mode = 'album'; setDir(); placeRig();
    var i = I(), g = G(), M = model(), sn = M.snaps;
    var red = sn.filter(function (x) { return x.lv === 'r'; }).length, org = sn.filter(function (x) { return x.lv === 'o'; }).length;
    var nIss = M.bad, views = sn.reduce(function (a, x) { return a + (x.s.views || []).length; }, 0);
    var end = i.endReason(), cls = red ? 'r' : org ? 'o' : 'ok';
    var head = red || org
      ? T(n2(nIss) + ' مشكلة في ' + n2(red + org) + ' شاشة', n2(nIss) + ' issue' + (nIss > 1 ? 's' : '') + ' on ' + (red + org) + ' screen' + (red + org > 1 ? 's' : ''))
      : T('كل الشاشات سليمة ✨', 'Every screen looks fine ✨');
    var phases = [], seen = {};
    sn.forEach(function (x) { if (!seen[x.s.phase]) { seen[x.s.phase] = { n: 0, first: x.n }; phases.push(x.s.phase); } seen[x.s.phase].n++; });
    var list = sn.filter(function (x) { return S.filter === 'all' || x.lv !== 'ok'; });
    var html = '<div class="wrap"><div class="ah"><div class="ar"><button class="pill" data-a="home">' + T('→ الألعاب', '← Games') + '</button><div class="gname"><span class="dot" style="background:' + g.c + '"></span>' + T(g.ar, g.en) + '</div><button class="pill" data-a="menu">⋯</button></div>' +
      '<div class="chips"><button class="chip ' + (S.filter === 'all' ? 'on' : '') + '" data-a="filter" data-v="all">' + T('الكل', 'All') + ' ' + n2(sn.length) + '</button>' +
      '<button class="chip bad ' + (S.filter === 'bad' ? 'on' : '') + '" data-a="filter" data-v="bad">⚠️ ' + T('المشاكل', 'Issues') + ' ' + n2(red + org) + '</button>' +
      phases.map(function (p) { return '<button class="chip" data-a="jumpto" data-v="' + seen[p].first + '">' + esc(ph(p)) + '</button>'; }).join('') + '</div></div>' +
      '<div class="sum ' + cls + '"><h2>' + (cls === 'ok' ? '✅ ' : cls === 'r' ? '🔴 ' : '🟠 ') + head + '</h2><p>' + T('البوتات لعبوا ', 'Bots played ') + esc(T(g.ar, g.en)) + T(' كاملة وانفحصت كل شاشة من عين كل لاعب.', ' in full and every screen was checked from every player\'s view.') + '</p>' +
      '<div class="st"><span>📱 ' + n2(sn.length) + T(' شاشة', ' screens') + '</span><span>👀 ' + n2(views) + T(' منظر', ' views') + '</span><span>🔴 ' + n2(red) + '</span><span>🟠 ' + n2(org) + '</span><span>⏱ ' + n2(Math.round(i.recMs() / 1000)) + T(' ث', 's') + '</span><span>' + (S.dark ? '🌙' : '☀️') + '</span></div>' +
      '<div class="ac"><button data-a="report">📋 ' + T('انسخ التقرير', 'Copy report') + '</button><button data-a="rec">🔁 ' + T('سجّل لعبة جديدة', 'Record a new game') + '</button></div></div>';
    if (end === 'timeout') { var last = sn[sn.length - 1]; html += '<div class="warn">⛔ ' + T('اللعبة ما خلصت خلال ٤ دقايق: البوتات علقوا عند «', 'The game did not finish in 4 minutes: bots got stuck at “') + esc(last ? last.s.title || ph(last.s.phase) : '') + T('». ', '”. ') + (last ? '<button data-a="jumpto" data-v="' + last.n + '">' + T('روح لها', 'Go there') + '</button>' : '') + '</div>'; }
    else if (end === 'stopped') html += '<div class="warn" style="background:#F4F6F9;border-color:#DCE2EC;color:#3B4659">⏸ ' + T('وقّفت التسجيل قبل النهاية، فهذي الشاشات اللي انحفظت للحين بس.', 'You stopped early, so these are only the screens saved so far.') + '</div>';
    if (!list.length) html += '<div class="empty">' + (S.filter === 'bad' ? T('ما في ولا مشكلة 🎉', 'No issues 🎉') : T('ما انحفظت شاشات', 'No screens saved')) + '</div>';
    var lastPh = null;
    list.forEach(function (m) {
      var s = m.s;
      if (s.phase !== lastPh) { html += '<div class="stagehd">' + esc(ph(s.phase)) + '</div>'; lastPh = s.phase; }
      var cnt = m.iss.length;
      html += '<section class="card ' + (m.lv === 'ok' ? '' : m.lv) + '" id="c' + m.n + '"><div class="ch"><span class="num">' + n2(m.n + 1) + '</span><div class="tt"><b>' + esc(s.title || ph(s.phase)) + '</b><small>' + esc(ph(s.phase)) + (s.round ? ' · ' + T('جولة ', 'Round ') + n2(s.round) : '') + '</small></div>' +
        '<span class="lv ' + m.lv + '">' + (m.lv === 'ok' ? '✓ ' + T('سليمة', 'OK') : (m.lv === 'r' ? '🔴 ' : '🟠 ') + n2(cnt)) + '</span></div><div class="strip">' +
        (s.views || []).map(function (v) {
          var vl = viewLv(m, v.k), c = m.iss.filter(function (x) { return x.k === v.k; }).length;
          return '<button class="th ' + vl + '" data-a="open" data-i="' + m.n + '" data-v="' + v.k + '">' + (vl ? '<i>' + c + '</i>' : '') + '<div class="tb" data-i="' + m.n + '" data-v="' + v.k + '"></div><span>' + (v.k === 'host' ? '👑 ' + T('أنت', 'You') : '🤖 ' + esc(v.name)) + '</span></button>';
        }).join('') + '</div>' + issList(m.iss) +
        (m.toasts.length ? '<details class="ts"><summary>💬 ' + T('رسايل ظهرت للاعبين', 'Messages shown to players') + ' (' + n2(m.toasts.length) + ')</summary>' + m.toasts.map(function (t) { return '<div>' + esc(whoName(t.who)) + ': ' + esc(t.m) + '</div>'; }).join('') + '</details>' : '') +
        '</section>';
    });
    html += '</div>';
    $('app').innerHTML = html;
    lazy();
    scrollTo(0, y);
  }
  function issList(iss) {
    if (!iss.length) return '';
    return '<ul class="iss">' + iss.map(function (x) { return '<li class="' + x.lv + '">' + (x.k === 'host' ? '👑 ' : '🤖 ') + esc(x.who) + ' · ' + esc(x.m) + (x.d ? '<small>' + esc(x.d) + '</small>' : '') + '</li>'; }).join('') + '</ul>';
  }
  function viewOf(n, k) { var s = I().snaps[n]; return s && (s.views || []).find(function (v) { return String(v.k) === String(k); }); }
  function lazy() {
    if (io) io.disconnect();
    io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        var b = e.target;
        if (e.isIntersecting) { if (!b.firstChild) { var v = viewOf(+b.dataset.i, b.dataset.v); if (v && v.c) mount(b, v.c, false); else b.innerHTML = '<div style="padding:20px 6px;text-align:center;color:#8A93A6;font-size:.75rem">' + T('ما انحفظت', 'Not saved') + '</div>'; } }
        else if (b.firstChild) b.innerHTML = '';
      });
    }, { rootMargin: '900px 0px' });
    Array.prototype.forEach.call(document.querySelectorAll('.tb'), function (b) { io.observe(b); });
  }

  /* ============ 5. عارض الشاشة ============ */
  function openViewer(n, k) {
    S.vi = n; S.vk = k; var vw = $('vw'); vw.hidden = false; document.body.style.overflow = 'hidden'; renderViewer();
  }
  function renderViewer() {
    var M = model(), m = M.snaps[S.vi]; if (!m) return;
    var s = m.s, vs = s.views || [];
    if (!vs.some(function (v) { return String(v.k) === String(S.vk); })) S.vk = 'host';
    var v = viewOf(S.vi, S.vk), mine = m.iss.filter(function (x) { return String(x.k) === String(S.vk); });
    $('vw').innerHTML = '<div class="vh"><div class="ar"><button class="x" data-a="vclose">✕</button><div style="flex:1;min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(s.title || ph(s.phase)) + '</b><small>' + T('شاشة ', 'Screen ') + n2(S.vi + 1) + T(' من ', ' of ') + n2(M.snaps.length) + ' · ' + esc(ph(s.phase)) + (s.round ? ' · ' + T('جولة ', 'Round ') + n2(s.round) : '') + '</small></div></div>' +
      '<div class="tabs">' + vs.map(function (x) { return '<button class="tab ' + (String(x.k) === String(S.vk) ? 'on ' : '') + viewLv(m, x.k) + '" data-a="vtab" data-v="' + x.k + '">' + (x.k === 'host' ? '👑 ' + T('أنت', 'You') : '🤖 ' + esc(x.name)) + '</button>'; }).join('') + '</div></div>' +
      '<div class="vs" id="vs"><div class="vf" id="vf"></div></div>' +
      (mine.length ? '<div class="vi">' + issList(mine) + '</div>' : '') +
      '<div class="vb"><button data-a="vprev" ' + (S.vi <= 0 ? 'disabled' : '') + '>' + T('→ السابقة', '← Prev') + '</button><button class="go" data-a="live">▶ ' + T('جرّبها مباشرة', 'Try it live') + '</button><button data-a="vnext" ' + (S.vi >= M.snaps.length - 1 ? 'disabled' : '') + '>' + T('التالية ←', 'Next →') + '</button></div>';
    if (v && v.c) mount($('vf'), v.c, true);
    fitViewer();
  }
  function fitViewer() {
    var vs = $('vs'), vf = $('vf'); if (!vs || !vf) return;
    var sc = Math.min((vs.clientWidth - 20) / 390, (vs.clientHeight - 8) / 844, 1.2);
    vf.style.width = (390 * sc) + 'px'; vf.style.height = (844 * sc) + 'px';
    var f = vf.querySelector('iframe'); if (f) f.style.transform = 'scale(' + sc + ')';
  }
  function closeViewer() { $('vw').hidden = true; $('vw').innerHTML = ''; document.body.style.overflow = ''; }

  /* ============ 6. التجربة المباشرة ============ */
  function goLive(n, k) {
    var i = I(); if (!i) return;
    closeViewer(); S.mode = 'live'; S.timeRuns = false; S.lv = n;
    $('app').innerHTML = '<div class="lb" id="lb"></div>';
    renderLive(true);
    i.show(k === 'host' ? 'host' : +k); i.jump(n);
    setTimeout(placeRig, 30);
  }
  function renderLive(force) {
    var i = I(), lb = $('lb'); if (!lb) return;
    var sn = (i && i.snaps) || [], cur = i ? i.cur : S.lv, c = sn[cur], er = i ? i.errors().length : 0, players = (i && i.players()) || [], view = i ? i.view : 'host';
    var sig = [cur, view, er, players.length, S.tv, S.timeRuns, sn.length].join('|');
    if (!force && sig === lb._sig) return; lb._sig = sig;
    lb.innerHTML = '<div class="ar"><button class="b" data-a="album">' + T('→ الألبوم', '← Album') + '</button><div class="gname" style="font-size:.95rem">▶ ' + T('تجربة مباشرة', 'Live') + '</div>' + (er ? '<button class="b err" data-a="album">⚠️ ' + n2(er) + '</button>' : '') + '<button class="b" data-a="tv">' + (S.tv ? '📱' : '📺') + '</button></div>' +
      '<div class="ar sc"><button class="b ' + (view === 'host' ? 'on' : '') + '" data-a="lwho" data-v="host">👑 ' + T('أنت', 'You') + '</button>' + players.map(function (p) { return '<button class="b ' + (view === p.k ? 'on' : '') + '" data-a="lwho" data-v="' + p.k + '">🤖 ' + esc(p.name) + '</button>'; }).join('') + '</div>' +
      '<div class="ar"><button class="b arr" data-a="lprev" ' + (!cur ? 'disabled' : '') + '>' + T('▶', '◀') + '</button><div class="cur">' + (c ? '<small>' + n2(cur + 1) + ' / ' + n2(sn.length) + ' · ' + esc(ph(c.phase)) + '</small><span>' + esc(c.title || ph(c.phase)) + '</span>' : '') + '</div><button class="b arr" data-a="lnext" ' + (cur == null || cur >= sn.length - 1 ? 'disabled' : '') + '>' + T('◀', '▶') + '</button><button class="b ' + (S.timeRuns ? 'on' : '') + '" data-a="time">⏱</button></div>';
    placeRig();
  }

  /* ============ 7. التقرير ============ */
  function report() {
    var M = model(), g = G(), i = I(), L = [];
    L.push('تقرير المعاين — ' + g.ar + (S.lang === 'en' ? ' (EN)' : '') + ' — ' + (S.dark ? 'مسائي' : 'صباحي') + ' — ' + new Date().toLocaleString('en-GB'));
    L.push('الشاشات: ' + M.snaps.length + ' · النهاية: ' + ({ final: 'وصلت النتائج', timeout: 'علقت (ما خلصت)', stopped: 'وقّفتها أنا' }[i.endReason()] || '-'));
    var bad = M.snaps.filter(function (x) { return x.iss.length; });
    if (!bad.length) L.push('ما في مشاكل ✅');
    bad.forEach(function (m) {
      L.push(''); L.push('#' + (m.n + 1) + ' [' + m.s.phase + (m.s.round ? ' ج' + m.s.round : '') + '] ' + (m.s.title || ''));
      m.iss.forEach(function (x) { L.push('  ' + (x.lv === 'r' ? '🔴' : '🟠') + ' ' + x.who + ': ' + x.m + (x.d ? ' — ' + x.d : '')); });
    });
    var ts = (i.toasts ? i.toasts() : []); if (ts.length) { L.push(''); L.push('رسايل ظهرت للاعبين:'); ts.slice(-30).forEach(function (t) { L.push('  ' + whoName(t.who) + ': ' + t.m); }); }
    var txt = L.join('\n');
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { toast(T('انتسخ ✓ ألصقه لي بالمحادثة', 'Copied ✓ paste it to me in chat')); }, function () {
      var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(T('انتسخ ✓', 'Copied ✓')); } catch (e) { } ta.remove();
    });
  }
  function menu() {
    var d = document.createElement('div'); d.className = 'menu'; d.id = 'menu';

      '<button class="it" data-a="rec">🔁 ' + T('سجّل لعبة جديدة (نتايج مختلفة)', 'Record a new game (different results)') + '</button>' +
      '<button class="it" data-a="retheme">' + (S.dark ? '☀️ ' + T('سجّلها بالوضع الصباحي', 'Record in light mode') : '🌙 ' + T('سجّلها بالوضع المسائي', 'Record in dark mode')) + '</button>' +
      '<button class="it" data-a="relang">🌐 ' + T('نفس اللعبة بالإنجليزي', 'Same game in Arabic') + '</button>' +
      '<button class="it" data-a="report">📋 ' + T('انسخ تقرير المشاكل', 'Copy issue report') + '</button></div>';

  /* ============ الضغطات ============ */
  document.addEventListener('click', function (e) {
    var m = $('menu'); if (m && e.target === m) { m.remove(); return; }
    var t = e.target.closest('[data-a]'); if (!t || t.disabled) return;
    if (m) m.remove();
    var a = t.dataset.a, v = t.dataset.v, i = I();

    else if (a === 'theme') { S.dark = v === '1'; try { localStorage.setItem('aqnieni.theme', S.dark ? 'dark' : 'light'); } catch (x) { } renderPick(); }

    else if (a === 'home') { closeViewer(); renderPick(); }
    else if (a === 'stoprec') { if (i) i.stop(); }

    else if (a === 'vnext') { S.vi++; renderViewer(); }

    else if (a === 'album') { if (i) { i.setTime(false); i.show('host'); } S.mode = 'album'; renderAlbum(); if (S.lv != null) { var cc = $('c' + (i ? i.cur : S.lv)); if (cc) cc.scrollIntoView({ block: 'start' }); } }
    else if (a === 'lwho') { if (i) i.show(v === 'host' ? 'host' : +v); renderLive(true); }
    else if (a === 'lprev') { if (i && i.snaps[i.cur - 1]) i.jump(i.cur - 1); setTimeout(function () { renderLive(true); }, 60); }
    else if (a === 'lnext') { if (i && i.snaps[i.cur + 1]) i.jump(i.cur + 1); setTimeout(function () { renderLive(true); }, 60); }
    else if (a === 'time') { S.timeRuns = !S.timeRuns; if (i) i.setTime(S.timeRuns); renderLive(true); }

})();
