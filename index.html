<style>
:root{--ink:#121A2B;--muted:#5E6B80;--line:#E4E8F0;--bg:#FFFFFF;--soft:#F6F7FB;
--fd:'Alexandria','Readex Pro',Tahoma,sans-serif;--fb:'Readex Pro','Alexandria',Tahoma,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--fb);line-height:1.65}
body{padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));
background-image:radial-gradient(700px 360px at 85% -10%,rgba(242,96,29,.12),transparent 70%),radial-gradient(700px 360px at 10% 0%,rgba(30,111,217,.10),transparent 70%)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{text-align:center;display:grid;justify-items:center;gap:6px;padding:26px 8px 8px}
.hero svg{width:84px;height:84px;animation:pop .7s ease both}
.hero h1{font-family:var(--fd);font-weight:900;font-size:clamp(3.4rem,17vw,6rem);line-height:1.1;padding-bottom:6px;
background:linear-gradient(90deg,#DC1F2B,#F2601D 35%,#14A44D 65%,#1E6FD9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:1.1rem;color:var(--muted);max-width:30ch}
.label{font-family:var(--fd);font-size:1rem;color:var(--muted);margin-top:6px}
.game{position:relative;display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;padding:18px;border-radius:22px;color:#fff;text-decoration:none;overflow:hidden;box-shadow:0 14px 30px rgba(18,26,43,.14);transition:transform .15s ease}
.game:active{transform:scale(.98)}
.game:focus-visible{outline:4px solid #121A2B;outline-offset:3px}
.game::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.g1{background:linear-gradient(140deg,#FF8A1F,#F2601D 45%,#DC1F2B)}
.g2{background:linear-gradient(140deg,#22C55E,#14A44D 45%,#1E6FD9)}
.g3{background:linear-gradient(140deg,#E11D2E,#B4143B 40%,#1D4ED8)}
.ic{width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.ic svg{width:46px;height:46px}
.game h2{font-family:var(--fd);font-weight:800;font-size:1.7rem;line-height:1.2}
.game h2 small{font-size:.85rem;font-weight:600;opacity:.85;margin-inline-start:6px}
.game p{font-size:.98rem;opacity:.95;line-height:1.6;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;position:relative;z-index:1}
.meta span{font-size:.8rem;font-weight:600;background:rgba(255,255,255,.2);border-radius:99px;padding:3px 10px;white-space:nowrap}
.go{position:relative;z-index:1;justify-self:start;margin-top:12px;background:#fff;color:var(--ink);font-family:var(--fd);font-weight:800;border-radius:99px;padding:8px 22px;font-size:1rem}
.g1 .go{color:#DC1F2B}.g2 .go{color:#12924A}.g3 .go{color:#1D4ED8}
.g3 .ic{box-shadow:inset 0 0 0 2px #FFC93C}
.how{border:1px solid var(--line);border-radius:20px;padding:18px;background:var(--soft);display:grid;gap:10px}
.how h3{font-family:var(--fd);font-size:1.15rem}
.how ol{list-style:none;display:grid;gap:8px;counter-reset:n}
.how li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:.97rem}
.how li::before{counter-increment:n;content:counter(n);width:28px;height:28px;border-radius:50%;background:#121A2B;color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
footer{text-align:center;color:#8A94A8;font-size:.82rem;line-height:1.8}
@keyframes pop{from{transform:scale(.6) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.hero svg{animation:none}.game{transition:none}}
@media (min-width:700px){.game{grid-template-columns:88px minmax(0,1fr);padding:22px}.ic{width:88px;height:88px}}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}
.tiles .game{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;border-radius:24px;text-align:center}
.tiles .ic{width:58%;height:auto;aspect-ratio:1;border-radius:22%}
.tiles .ic svg{width:64%;height:64%}
.tiles .game h2{font-size:clamp(1rem,4.8vw,1.6rem);position:relative;z-index:1}
.wrap{min-height:calc(100svh - 60px);justify-content:center}
.hero{padding-top:0}
body{background:#fff!important;background-image:none!important}
.hero h1{background:none!important;color:#1D4ED8!important;-webkit-text-fill-color:#1D4ED8}
.g1{background:#DE0921!important}
.g2{background:#0554A4!important}
.g3{background:#FBC611!important;color:#1A1A1A!important}
.g3 h2{color:#1A1A1A}
.g3 .ic{box-shadow:none!important;background:rgba(0,0,0,.08)!important}
.tiles .game{box-shadow:0 10px 22px rgba(0,0,0,.12)}
.brandlogo{width:min(78vw,340px);height:auto;display:block;animation:pop .7s ease both}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
