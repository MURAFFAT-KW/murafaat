<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أقنعني! | الأزياء</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800;900&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --p:#7B2FBE;      /* اللون الرئيسي للعبة: بنفسجي (مؤقت) */
  --p2:#5A1E92;
  --pl:#F5EDFC;
  --red:#DE0921;    /* لون اسم اللعبة في صفحة المقدمة (نفس باقي ألعاب أقنعني) */
  --blue:#0554A4;
  --ink:#12203A; --mut:#5E6B80; --line:#E1E6EE;
  --gold:#D4A017; --silver:#A7A9AE; --bronze:#B87333;
  --font-d:'Alexandria','Readex Pro',Tahoma,sans-serif;
  --font:'Readex Pro','Alexandria','Segoe UI',Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font);line-height:1.65}
h2,h3,.btn,.gname,.tval,.nm,.stepper .v,.sname{font-family:var(--font-d)}
#app{max-width:620px;margin:0 auto;padding:10px 16px 120px}
#app.wide{max-width:980px}
button{font-family:inherit;color:inherit}
input,textarea{font-family:inherit;font-size:16px}
h2{font-size:1.6rem;margin:14px 0 4px;font-weight:700;line-height:1.3}
.sub{color:var(--mut);margin:0 0 10px;line-height:1.7;font-size:15px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.backbtn{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 14px;border-radius:12px;border:1.5px solid #E1E5EC;background:#fff;color:#111;font:700 .95rem/1 var(--font-d);cursor:pointer;text-decoration:none;white-space:nowrap}
.backbtn:focus-visible{outline:3px solid #FBC611;outline-offset:2px}
.aqfix{position:absolute;top:max(12px,env(safe-area-inset-top));inset-inline-start:12px;z-index:5}
.tag{font-size:13px;color:var(--p2);font-weight:800;background:var(--pl);padding:6px 12px;border-radius:999px}
.btn{display:block;width:100%;min-height:62px;border:1px solid var(--p);border-radius:14px;padding:10px 22px;font-size:1.12rem;font-weight:700;background:var(--p);color:#fff;cursor:pointer;margin-top:12px;box-shadow:0 6px 16px rgba(18,32,58,.12);transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:#fff;color:var(--p);border:1.5px solid var(--p);box-shadow:none}
.btn.end{background:var(--ink);border-color:var(--ink)}
.btn.end.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.02);background:var(--red)}}
.btn:disabled{opacity:.4;cursor:default}
.host-note{display:block;font-size:11px;font-weight:700;opacity:.7;margin-top:2px}
.card{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0;background:#fff;box-shadow:0 2px 10px rgba(18,32,58,.05)}
.card h3{margin:0 0 8px;font-size:17px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:12px;border:0;background:var(--pl);color:var(--p);font-size:22px;font-weight:900;cursor:pointer}
.stepper .v{min-width:58px;text-align:center;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:15px}
.chip.on{border-color:var(--p);background:var(--pl);color:var(--p2)}
.chip small{color:var(--mut);font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d9d3e2;cursor:pointer;position:relative;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--p)}
.sw.on::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;text-shadow:0 0 3px #000}
.swl{font-size:11px;color:var(--mut);text-align:center;margin-top:3px}
.swwrap{display:flex;flex-direction:column;align-items:center;width:52px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#FFF3D1;color:#875c00;vertical-align:middle}
.assume{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:#FFF3D1;color:#875c00;margin-inline-start:4px}
.timer{position:sticky;top:0;z-index:6;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);padding:8px 0 10px}
.trow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tlabel{font-weight:800;color:var(--mut);font-size:14px}
.tval{font-weight:900;font-size:22px;color:var(--p);font-variant-numeric:tabular-nums}
.tbar{height:8px;background:var(--pl);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--p);transition:width 1s linear;width:100%}
.timeup .tval{color:var(--red)} .timeup .tbar i{background:var(--red)}
.moneybar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.money{background:var(--pl);border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px;color:var(--p2)}
.money.alt{background:#EEF5FF;color:var(--blue)}
/* المقدمة */
.intro{text-align:center;min-height:calc(100svh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center}
.intro .logo svg{width:min(56vw,220px);height:auto;display:block}
.intro .aqlogo *{animation:none!important}
.gname{font-size:clamp(2.2rem,10vw,2.9rem);font-weight:800;color:var(--red);margin:6px 0 0}
.lead{max-width:34ch;color:var(--mut);font-size:1rem;line-height:1.9;margin:6px auto 0}
.intro .btn{margin-top:22px;max-width:320px;min-height:64px;font-size:1.3rem;font-weight:800;border-radius:99px}
.proto{margin-top:14px;font-size:12px;color:var(--mut)}
/* المزايا */
.perks{display:grid;gap:10px}
@media(min-width:720px){.perks{grid-template-columns:1fr 1fr}}
.perk{display:flex;align-items:center;gap:12px;text-align:start;border:2px solid var(--line);background:#fff;border-radius:18px;padding:12px;cursor:pointer}
.perk.on{border-color:var(--p);background:var(--pl)}
.perk .pi{font-size:26px}
.perk .pt{flex:1;display:flex;flex-direction:column;gap:2px}
.perk .pt small{color:var(--mut)}
.perk .pp{font-weight:800;font-size:14px;color:var(--p2);display:flex;flex-direction:column;align-items:flex-end}
.perk .pp small{font-size:10px;color:#875c00}
/* المتجر */
.store{border-radius:8px;border:7px solid;padding:10px;display:flex;flex-direction:column;align-items:center;aspect-ratio:1/1;cursor:pointer;position:relative;overflow:hidden}
.store .sname{font-weight:900;font-size:15px;text-align:center;line-height:1.3}
.store .sfeat{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
.store .sfeat svg{height:100%;max-height:140px;width:auto}
.store .sowner{font-size:12px;opacity:.85;font-weight:700}
.store .sbadges{position:absolute;top:6px;inset-inline-start:6px;font-size:13px}
.storebig{max-width:260px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
/* التصاميم */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.dcard{border:2px solid var(--line);background:#fff;border-radius:18px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.dcard.on{border-color:var(--p);background:var(--pl)}
.dcard svg{width:100%;height:120px}
.dcard b{font-size:14px} .dcard small{color:var(--mut);font-size:12px}
.preview{display:flex;justify-content:center;background:linear-gradient(180deg,#faf7fd,#f2ebf9);border-radius:22px;padding:10px;margin:8px 0}
.preview svg{height:230px;width:auto}
.field{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.field:focus{outline:2px solid var(--p);border-color:transparent}
.counter{font-size:12px;color:var(--mut);text-align:end;margin-top:4px}
.warn{background:#FFF0F1;color:#9b0616;border-radius:14px;padding:12px;font-weight:700;font-size:14px;margin:10px 0}
/* التحدث */
.speakers{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.spk{padding:6px 12px;border-radius:999px;background:#f3f1f5;font-weight:800;font-size:14px;color:var(--mut)}
.spk.now{background:var(--p);color:#fff}
.spk.done{text-decoration:line-through;opacity:.6}
.stage{text-align:center}
.stage .who{font-size:15px;color:var(--mut);font-weight:700}
.stage .who b{color:var(--ink);font-size:22px;display:block}
.desc{background:#faf8fc;border-radius:16px;padding:12px;line-height:1.8;font-size:15px;margin-top:10px}
/* النتائج */
.cat{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cat:last-child{border:0}
.cat .ci{font-size:26px;width:40px;text-align:center}
.cat .cn{flex:1} .cat .cn b{display:block} .cat .cn small{color:var(--mut)}
.cat .cp{font-weight:900;color:var(--p)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:20px 0 8px}
.pod{flex:1;max-width:120px;display:grid;justify-items:center;gap:4px;text-align:center;min-width:0}
.pod .md{font-size:2rem;line-height:1}
.pod .pn{font-weight:700;font-size:.95rem;overflow-wrap:anywhere}
.pod .ps{font-size:.85rem;color:#6B7489}
.pod .pb{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:center;font:800 1.5rem/1 system-ui,sans-serif;color:#fff}
.pod.g .pb{height:110px;background:linear-gradient(#F5C518,#D9A400)} .pod.s .pb{height:80px;background:linear-gradient(#CDD2DA,#9AA3AF)} .pod.b .pb{height:58px;background:linear-gradient(#DDA06B,#B0703C)}
.rest .row b{color:var(--p)}
/* عام */
.fab{position:fixed;bottom:16px;inset-inline-start:16px;z-index:8;border:0;border-radius:999px;padding:11px 16px;background:#FFF3D1;color:#6d4a00;font-weight:800;box-shadow:0 4px 18px rgba(0,0,0,.12);cursor:pointer;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(25,10,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px 28px}
@media(min-width:720px){.modal{align-items:center}.sheet{border-radius:24px}}
.sheet h3{margin:4px 0 10px;font-size:20px}
.sheet ol{padding-inline-start:20px;line-height:1.9;font-size:15px;margin:0}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:16px;padding:8px;margin:8px 0}
.item svg{width:70px;height:96px}
.item .in{flex:1}
.item .in small{color:var(--mut);display:block}
.item .buy{border:0;border-radius:12px;padding:10px 14px;font-weight:800;background:var(--p);color:#fff;cursor:pointer}
.item .buy:disabled{background:#ddd;color:#777}
.old{text-decoration:line-through;color:var(--mut);font-size:12px;margin-inline-start:4px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<button class="fab" onclick="openAssumptions()">📝 الافتراضات</button>
<style>#langsw{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;z-index:60;background:#fff;border:1.5px solid #D5DBE5;border-radius:99px;padding:5px 14px;font:700 .9rem/1.4 "Readex Pro","Alexandria",system-ui,sans-serif;color:#12203A;text-decoration:none;box-shadow:0 3px 10px rgba(18,32,58,.1)}#langsw[hidden]{display:none}</style><a id="langsw" href="azyaa-en.html" lang="en" onclick="try{localStorage.setItem('aqnieni.lang','en')}catch(x){}">English</a>

<script>

   ⚙️ الإعدادات القابلة للتعديل — كل الأرقام هنا مؤقتة وغير متفق عليها
   عدّل من هذا المكان فقط: الميزانية، الأسعار، النقاط، حدود العدادات.
   ===================================================================== */
const CONFIG = {
  currency: 'د.ك',               // افتراض: العملة
  startCapital: 100,             // افتراض: رأس المال (للمواد والمزايا)

  designsCount: 5,               // متفق عليه: ٥ تصاميم
  maxFabricColors: 2,            // متفق عليه: لونين خام
  maxFabricTypes: 2,             // متفق عليه: نوعين خام
  prices: {                      // افتراض: كل الأسعار مؤقتة
    clothingType: 8,             // سعر كل نوع ملابس
    fabricColor: 4,              // سعر كل لون خامة
    fabricType: 5,               // سعر كل نوع خامة
    storeBg: 6,                  // لون خلفية المتجر
    storeBorder: 4,              // لون إطار المتجر
    perk: 10                     // سعر كل ميزة (موحّد مؤقتًا)
  },
  salePrice: { min: 1, max: 20, def: 5 },   // افتراض: سعر بيع التصميم يحدده اللاعب

  extraTimeSec: 30,              // افتراض: مقدار ميزة الوقت الإضافي
  discountMax: 50,               // افتراض: أقصى نسبة تنزيلات
  brandNameMax: 24,
  brandDescMax: 120,             // افتراض: طول وصف البراند
  timer: { min: 30, max: 300, step: 30 },   // متفق عليه: من ٣٠ ثانية لين ٥ دقايق
  limits: {
    players: [3, 25],
    talkRounds: [1, 5],          // افتراض: أقصى عدد جولات
    speakers: [1, 5],            // متفق عليه: من ١ إلى ٥
    shopRounds: [1, 5]           // افتراض: أقصى عدد جولات
  },
  defaults: {
    players: 5, buyTime: 120, designTime: 300, buildTime: 120,
    talkRounds: 1, speakers: 2, talkTime: 60,
    shopRounds: 2, shopTime: 90, voteTime: 60
  },
  // متفق عليه: خمس فئات × ٢٠ نقطة = ١٠٠
  categories: [
    { id:'capital',   icon:'💰', name:'رأس المال',      points:20, hint:'أعلى رأس مال متبقي',              metric:p=>p.capital },
    { id:'wallet',    icon:'👛', name:'محفظة التسوق',   points:20, hint:'أعلى رصيد متبقي (افتراض)',         metric:p=>p.wallet },
    { id:'creative',  icon:'✨', name:'الإبداع',         points:20, hint:'أفضل مصمم وأفضل تصميم — بالتصويت', metric:p=>p.votes },
    { id:'purchases', icon:'🛍️', name:'أكثر مشتريات',   points:20, hint:'أكثر قطع انباعت من المتجر',        metric:p=>p.sales },
    { id:'visits',    icon:'🚶', name:'أكثر زيارات',    points:20, hint:'أكثر زيارات للمتجر',               metric:p=>p.visits }
  ],
  tieRule: 'split',              // افتراض: التعادل يقسم النقاط
  zeroNoAward: true              // افتراض: إذا أعلى قيمة صفر ما أحد ياخذ نقاط الفئة
};

// المزايا المسجلة للنقاش — كلها تجريبية وتفاصيلها غير نهائية
const PERKS = [
  {id:'expand',    icon:'🏬', name:'توسعة المتجر',           desc:'مساحة أكبر للمتجر.'},
  {id:'location',  icon:'📍', name:'موقع يجذب زوارًا',       desc:'مكان مميز في السوق.'},
  {id:'sale',      icon:'🏷️', name:'تنزيلات يحددها اللاعب',  desc:'تحدد نسبة خصم على تصاميمك.', live:true},
  {id:'fineSell',  icon:'🚫', name:'مخالفة بيع',             desc:'مخالفة على بيع منافس.'},
  {id:'fineShow',  icon:'⛔', name:'مخالفة عرض',             desc:'مخالفة على عرض منافس.'},
  {id:'extraTime', icon:'⏱️', name:'وقت إضافي للإقناع',      desc:'وقت زيادة وقت تتكلم.', live:true},
  {id:'taste',     icon:'🔍', name:'رصد ذوق الزبائن',        desc:'تعرف وش يحبون الزبائن.'},
  {id:'protect',   icon:'🛡️', name:'حماية المتجر',           desc:'حماية من المخالفات.'},
  {id:'exclusive', icon:'💎', name:'خامة حصرية',             desc:'خامة ما يملكها غيرك.'},
  {id:'vip',       icon:'👑', name:'زبون VIP افتراضي',       desc:'زبون افتراضي مميز.'}
];

const CLOTHES = [
  {id:'shirt',  name:'قميص',   zone:'top'},
  {id:'jacket', name:'جاكيت',  zone:'outer'},
  {id:'pants',  name:'بنطلون', zone:'bottom'},
  {id:'skirt',  name:'تنورة',  zone:'bottom'},
  {id:'dress',  name:'فستان',  zone:'full'},
  {id:'abaya',  name:'عباية',  zone:'outer'},
  {id:'scarf',  name:'وشاح',   zone:'acc'},
  {id:'bag',    name:'حقيبة',  zone:'acc'}
];
const ZORDER = {full:0, bottom:1, top:2, outer:3, acc:4};

const COLORS = [
  {id:'black', name:'أسود',  hex:'#1d1d1f'},
  {id:'white', name:'أبيض',  hex:'#f7f5f0'},
  {id:'beige', name:'بيج',   hex:'#d9c4a3'},
  {id:'red',   name:'أحمر',  hex:'#c81d25'},
  {id:'navy',  name:'كحلي',  hex:'#1f2a5a'},
  {id:'olive', name:'زيتي',  hex:'#5d6b2f'},
  {id:'pink',  name:'وردي',  hex:'#e9a3b8'},
  {id:'gold',  name:'ذهبي',  hex:'#c9a227'},
  {id:'purple',name:'بنفسجي',hex:'#7b2fbe'},
  {id:'sky',   name:'سماوي', hex:'#80c7e8'}
];

// أنواع الخامات (القائمة مؤقتة)
const FABRICS = [
  {id:'cotton', name:'قطن'}, {id:'silk', name:'حرير'}, {id:'leather', name:'جلد'}, {id:'velvet', name:'مخمل'},
  {id:'denim', name:'جينز'}, {id:'wool', name:'صوف'}, {id:'linen', name:'كتان'}, {id:'chiffon', name:'شيفون'}
];

const PATTERNS = [
  {id:'plain', name:'سادة'}, {id:'stripe', name:'مخطط'},
  {id:'dots',  name:'منقط'}, {id:'check',  name:'مربعات'}
];

// بيانات وهمية للتجربة
const BOT_NAMES = ['نورة','فهد','مريم','يوسف','سارة','خالد','دانة','عبدالله','ريم','بدر','هيا','ناصر','لولوة','حمد','شهد','سعود','العنود','مشاري','جود','طلال','غلا','راشد','منيرة','سلمان'];
const BRANDS = ['دار لُجين','أتيليه سَما','بيت الحرير','نُقطة','خيط ذهب','لمسة','مِرآة','وِشاح','غيمة','نسيم','لؤلؤة','مخمل','ياسمين','ظِل','قُطن','سِدرة','زُمرّد','كُحل','رِيشة','مرجان','فَيروز','نَقش','حرير الصباح','عِطر'];
const DESCS = ['قطع بسيطة تنلبس كل يوم وبألوان هادية.','فخامة بتفاصيل صغيرة تفرق.','ستايل جريء لأصحاب الذوق المختلف.','كلاسيك ما يطوف عليه الزمن.','ألوان الصيف كلها في متجر واحد.','تصاميم مريحة تمشي مع كل مناسبة.'];

const ASSUMPTIONS = [
  'اللون البنفسجي مؤقت.',

const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => `${Math.round(v*100)/100} ${CONFIG.currency}`;
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const colorHex = id => (COLORS.find(c=>c.id===id)||{hex:'#ddd'}).hex;
const fabric = id => FABRICS.find(f=>f.id===id) || {name:'—'};
const colorName = id => (COLORS.find(c=>c.id===id)||{name:'—'}).name;
const cloth = id => CLOTHES.find(c=>c.id===id);
const perk = id => PERKS.find(k=>k.id===id);
const isLight = hex => { const n=parseInt(hex.slice(1),16); const r=n>>16,g=(n>>8)&255,b=n&255; return (r*299+g*587+b*114)/1000 > 150; };
const pts = v => (Math.round(v*10)/10).toString();
const me = () => S.players[0];
const finalPrice = (p,d) => p.discount ? Math.max(1, Math.round(d.price*(1-p.discount/100))) : d.price;

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}

let PID = 0;
function fillFor(hex, pattern, defs){
  if(!pattern || pattern==='plain') return hex;
  const id = 'pt'+(++PID);
  const c = isLight(hex) ? 'rgba(0,0,0,.22)' : 'rgba(255,255,255,.38)';
  let inner = '';
  if(pattern==='stripe') inner = `<rect width="3" height="8" fill="${c}"/>`;
  if(pattern==='dots')   inner = `<circle cx="4" cy="4" r="1.6" fill="${c}"/>`;
  if(pattern==='check')  inner = `<rect width="4" height="4" fill="${c}"/><rect x="4" y="4" width="4" height="4" fill="${c}"/>`;
  defs.push(`<pattern id="${id}" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="${hex}"/>${inner}</pattern>`);
  return `url(#${id})`;
}
// لمسة بصرية خفيفة لنوع الخامة
function textureFor(f, defs){
  if(!f) return null;
  const id = 'tx'+(++PID);
  if(f==='leather' || f==='silk'){
    const a = f==='leather' ? .42 : .3;
    defs.push(`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".42" stop-color="#fff" stop-opacity="${a}"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="${f==='leather'?.18:0}"/></linearGradient>`);
  } else if(f==='velvet'){
    defs.push(`<radialGradient id="${id}" cx=".5" cy=".4" r=".7"><stop offset=".3" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>`);
  } else if(f==='denim'){
    defs.push(`<pattern id="${id}" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1" height="3" fill="#fff" fill-opacity=".16"/></pattern>`);
  } else if(f==='wool'){
    defs.push(`<pattern id="${id}" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#fff" fill-opacity=".22"/><circle cx="3" cy="3" r=".7" fill="#000" fill-opacity=".1"/></pattern>`);
  } else if(f==='chiffon'){
    defs.push(`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>`);
  } else return null;
  return `url(#${id})`;
}
function designSVG(d){
  if(!d) return `<svg viewBox="0 0 100 140"><rect x="12" y="10" width="76" height="120" rx="14" fill="none" stroke="#d8d2e0" stroke-dasharray="5 5"/><text x="50" y="76" text-anchor="middle" font-size="13" fill="#b3abbd" font-family="inherit">فاضي</text></svg>`;
  const defs = []; let body = '';
  const pieces = [d.base, d.extra].filter(x=>x && x.type).sort((a,b)=>ZORDER[cloth(a.type).zone]-ZORDER[cloth(b.type).zone]);
  pieces.forEach(p=>{
    const hex = colorHex(p.color);
    if(p.type==='bag') body += `<path d="M72 80 Q79 66 86 80" fill="none" stroke="${hex}" stroke-width="2.6"/>`;
    body += `<path d="${SHAPES[p.type]}" fill="${fillFor(hex,p.pattern,defs)}" stroke="rgba(0,0,0,.3)" stroke-width=".8" stroke-linejoin="round"/>`;
    const tx = textureFor(p.fabric, defs);
    if(tx) body += `<path d="${SHAPES[p.type]}" fill="${tx}" stroke="none" pointer-events="none"/>`;
  });
  return `<svg viewBox="0 0 100 140"><defs>${defs.join('')}</defs><circle cx="50" cy="13" r="9" fill="#ece4f3"/><rect x="46" y="20" width="8" height="8" fill="#ece4f3"/>${body}</svg>`;
}

/* ============================ الحالة ============================ */
let S;
function newState(keepSettings){
  S = {
    settings: keepSettings || { ...CONFIG.defaults, hostName:'' },
    players: [], history: [], screen:'intro', phase:null,
    draft:null, editIdx:null, talk:null, spoken:[], shop:null,
    visitedRound:{}, voteChoice:null, modal:null, results:null
  };
}
function newPlayer(id, name, isBot){
  return { id, name, isBot, capital:CONFIG.startCapital, wallet:CONFIG.shoppingWallet,
    perks:[], types:[], colors:[], fabrics:[], store:{bg:null, border:null},
    designs:Array(CONFIG.designsCount).fill(null), featured:null,
    brand:{name:'', desc:''}, discount:0, visits:0, sales:0, votes:0,
    bought:[], extraUsed:false, score:0, awards:[] };
}

/* ============================ المؤقت ============================ */
const T = { left:0, total:0, id:null };
const PHASES = {
  buy:   {name:'شراء المواد الأولية', key:'buyTime'},
  design:{name:'التصميم',            key:'designTime'},
  build: {name:'بناء المشروع',       key:'buildTime'},
  talk:  {name:'التحدث والإقناع',    key:'talkTime'},
  shop:  {name:'التسوق',             key:'shopTime'},
  vote:  {name:'التصويت',            key:'voteTime'}
};
function startTimer(sec){
  stopTimer(); T.total = sec; T.left = sec;
  T.id = setInterval(()=>{ T.left--; if(T.left<=0){ T.left=0; stopTimer(); } updTimer(); }, 1000);
  updTimer();
}
function stopTimer(){ if(T.id){ clearInterval(T.id); T.id=null; } }
function startPhaseTimer(){ stopTimer(); if(S.phase) startTimer(S.settings[PHASES[S.phase].key]); }
function addTime(sec){ T.left += sec; T.total += sec; if(!T.id) startTimer(T.left); updTimer(); }
function timerHTML(){
  return `<div class="timer" id="timerBox"><div class="trow"><span class="tlabel">⏳ ${PHASES[S.phase].name}</span><span class="tval" id="tval"></span></div><div class="tbar"><i id="tbar"></i></div></div>`;
}
function updTimer(){
  const v=$('tval'); if(!v) return;
  v.textContent = T.left>0 ? fmt(T.left) : 'انتهى الوقت ⏰';
  $('tbar').style.width = (T.total ? T.left/T.total*100 : 0) + '%';
  $('timerBox').classList.toggle('timeup', T.left<=0);
  const eb=$('endBtn'); if(eb) eb.classList.toggle('pulse', T.left<=0);
}

function go(screen, phase){
  S.history.push({screen:S.screen, phase:S.phase});
  S.screen = screen;
  if(phase !== undefined && phase !== S.phase){ S.phase = phase; startPhaseTimer(); }
  render(); window.scrollTo(0,0);
}
function back(){
  if(!S.history.length) return;
  const prev = S.history[S.history.length-1];
  const doBack = ()=>{
    S.history.pop(); S.screen = prev.screen; S.modal = null;
    if(prev.phase !== S.phase){ S.phase = prev.phase; startPhaseTimer(); }
    render(); window.scrollTo(0,0);
  };
  if(prev.phase !== S.phase && S.phase) askConfirm('ترجع الكل للمرحلة السابقة؟ (المضيف فقط)', doBack);
  else doBack();
}
function hdr(extra=''){
  const showBack = S.history.length && S.screen!=='results';
  return `<div class="top">${showBack?`<button class="backbtn" onclick="back()">→ رجوع</button>`:'<span></span>'}${extra}</div>`;
}

function bump(key, dir){
  const m = STEP_META[key];

  if(key==='players') S.settings.speakers = Math.min(S.settings.speakers, S.settings.players);
  render();
}

  return `<div class="row"><span>${m.label}</span><div class="stepper"><button onclick="bump('${key}',1)">+</button><span class="v">${m.time?fmt(v):v}</span><button onclick="bump('${key}',-1)">−</button></div></div>`;

function startGame(){
  const n = S.settings.players;
  const names = shuffle(BOT_NAMES).slice(0, n-1);
  const brands = shuffle(BRANDS);
  S.players = [newPlayer(0, S.settings.hostName.trim() || 'أنت', false), ...names.map((nm,i)=>newPlayer(i+1, nm, true))];
  S.players.slice(1).forEach((p,i)=>botBuild(p, brands[i % brands.length]));
  S.spoken = []; S.results = null; S.voteChoice = null;
  go('perks', 'buy');
}

function botBuild(p, brandName){
  const pr = CONFIG.prices;
  const tryBuy = (cost, fn) => { if(p.capital >= cost){ p.capital -= cost; fn(); } };
  shuffle(PERKS).slice(0, rand(0,2)).forEach(k=>tryBuy(pr.perk, ()=>p.perks.push(k.id)));
  tryBuy(pr.storeBg, ()=>p.store.bg = pick(COLORS).id);
  tryBuy(pr.storeBorder, ()=>p.store.border = pick(COLORS).id);
  shuffle(CLOTHES).slice(0, rand(2,4)).forEach(c=>tryBuy(pr.clothingType, ()=>p.types.push(c.id)));
  shuffle(COLORS).slice(0, rand(1,CONFIG.maxFabricColors)).forEach(c=>tryBuy(pr.fabricColor, ()=>p.colors.push(c.id)));
  shuffle(FABRICS).slice(0, rand(1,CONFIG.maxFabricTypes)).forEach(f=>tryBuy(pr.fabricType, ()=>p.fabrics.push(f.id)));
  if(p.types.length && p.colors.length && p.fabrics.length){
    for(let i=0;i<CONFIG.designsCount;i++){
      const bt = pick(p.types);
      const others = p.types.filter(t=>t!==bt);
      p.designs[i] = {
        name: 'تصميم ' + (i+1),
        base: {type:bt, color:pick(p.colors), fabric:pick(p.fabrics), pattern:pick(PATTERNS).id},
        extra: (others.length && Math.random()<.55) ? {type:pick(others), color:pick(p.colors), fabric:pick(p.fabrics), pattern:pick(PATTERNS).id} : null,
        price: rand(Math.max(CONFIG.salePrice.min,3), Math.min(CONFIG.salePrice.max,12))
      };
    }
    p.featured = rand(0, CONFIG.designsCount-1);
  }
  p.brand = { name: brandName, desc: pick(DESCS) };
  if(p.perks.includes('sale')) p.discount = rand(1,4)*10;
}

}

  go('talk','talk');
}

/* ---------- التحدث والإقناع ---------- */
function startTalkRound(r){
  const k = Math.min(S.settings.speakers, S.players.length);
  const all = S.players.map(p=>p.id);
  let picks = shuffle(all.filter(id=>!S.spoken.includes(id))).slice(0,k);
  if(picks.length < k){ S.spoken = []; picks = picks.concat(shuffle(all.filter(id=>!picks.includes(id))).slice(0, k-picks.length)); }
  S.spoken.push(...picks);
  S.talk = { round:r, speakers:picks, idx:0 };
}
function useExtraTime(){
  const sp = S.players[S.talk.speakers[S.talk.idx]];
  sp.extraUsed = true; addTime(CONFIG.extraTimeSec); toast(`+${CONFIG.extraTimeSec} ثانية لـ${sp.name}`); render();
}
function talkNextLabel(){
  const t = S.talk;
  if(t.idx < t.speakers.length-1) return 'الذهاب لإقناع ' + S.players[t.speakers[t.idx+1]].name;
  if(t.round < S.settings.talkRounds) return 'الذهاب لجولة التحدث ' + (t.round+1);
  return 'الذهاب للتسوق';
}
function endTalk(){
  const t = S.talk;
  if(t.idx < t.speakers.length-1){ t.idx++; startTimer(S.settings.talkTime); render(); window.scrollTo(0,0); return; }
  if(t.round < S.settings.talkRounds){ startTalkRound(t.round+1); startTimer(S.settings.talkTime); render(); window.scrollTo(0,0); return; }
  S.shop = { round:1 }; S.visitedRound = {}; S.modal = null;
  go('mall','shop');
}
SCREENS.talk = () => {
  const t = S.talk, sp = S.players[t.speakers[t.idx]];
  const feat = sp.featured!=null ? sp.designs[sp.featured] : null;
  return `
${hdr(`<span class="tag">جولة التحدث ${t.round} / ${S.settings.talkRounds}</span>`)}
${timerHTML()}
<div class="speakers">${t.speakers.map((id,i)=>`<span class="spk ${i===t.idx?'now':i<t.idx?'done':''}">${esc(S.players[id].name)}</span>`).join('')}</div>
<div class="stage">
  <div class="who">الحين يقنعكم<b>${esc(sp.name)}${sp.id===0?' (أنت)':''}</b></div>
  <div class="card">
    <div style="font-weight:900;font-size:20px">${esc(sp.brand.name)}</div>
    <div class="preview">${designSVG(feat)}</div>
    <div style="font-weight:800">⭐ ${feat?esc(feat.name)+' — '+money(finalPrice(sp,feat)):'ما في قطعة مميزة'}</div>
    ${sp.brand.desc?`<div class="desc">${esc(sp.brand.desc)}</div>`:''}
  </div>
  ${sp.perks.includes('extraTime') && !sp.extraUsed ? `<button class="btn ghost" onclick="useExtraTime()">⏱️ استخدم ميزة الوقت الإضافي (+${CONFIG.extraTimeSec} ث) <span class="assume">تجريبي</span></button>`:''}
</div>
${endBtn(talkNextLabel(),'endTalk()')}`;
};

/* ---------- التسوق ---------- */
function openStore(id){
  const p = S.players[id];
  if(!S.visitedRound[id]){ S.visitedRound[id] = true; p.visits++; }
  S.modal = {type:'store', id}; renderModal();
}
function buyDesign(sid, i){
  const s = S.players[sid], d = s.designs[i], b = me(), price = finalPrice(s,d), key = sid+':'+i;
  if(b.bought.includes(key)) return;
  if(b.wallet < price){ toast('محفظة التسوق ما تكفي'); return; }
  b.wallet -= price; b.bought.push(key); s.sales++;
  if(CONFIG.saleRevenueTo==='capital') s.capital += price;
  toast(`اشتريت «${d.name}» من ${s.brand.name}`);
  renderModal(); render();
}
function botsShop(){
  S.players.filter(p=>p.isBot).forEach(bot=>{
    const targets = shuffle(S.players.filter(p=>p.id!==bot.id)).slice(0, rand(1,3));
    targets.forEach(s=>{
      s.visits++;
      if(Math.random() < .4){
        const opts = s.designs.map((d,i)=>({d,i})).filter(o=>o.d && !bot.bought.includes(s.id+':'+o.i) && finalPrice(s,o.d) <= bot.wallet);
        if(opts.length){ const o = pick(opts), pr = finalPrice(s,o.d); bot.wallet -= pr; bot.bought.push(s.id+':'+o.i); s.sales++; if(CONFIG.saleRevenueTo==='capital') s.capital += pr; }
      }
    });
  });
}
function endShop(){
  botsShop(); S.modal = null;
  if(S.shop.round < S.settings.shopRounds){
    S.shop.round++; S.visitedRound = {}; startTimer(S.settings.shopTime);
    toast('بدت جولة التسوق ' + S.shop.round); render(); window.scrollTo(0,0); return;
  }
  S.voteChoice = null; go('vote','vote');
}
SCREENS.mall = () => { const p = me(); const others = S.players.filter(x=>x.id!==0); return `
${hdr(`<span class="tag">جولة التسوق ${S.shop.round} / ${S.settings.shopRounds}</span>`)}
${timerHTML()}
<h2>السوق</h2>
<p class="sub">ادخل المتاجر وشوف التشكيلات واشترِ من محفظة التسوق.</p>
${moneyBar()}
<div class="moneybar"><span class="money">🚶 زيارات متجرك: ${p.visits}</span><span class="money">🛍️ مبيعاتك: ${p.sales}</span></div>
<div class="grid">${others.map(s=>storeHTML(s,{onclick:`openStore(${s.id})`})).join('')}</div>
${endBtn(S.shop.round < S.settings.shopRounds ? 'الذهاب لجولة التسوق '+(S.shop.round+1) : 'الذهاب للتصويت','endShop()')}`; };

function storeModal(id){
  const s = S.players[id], b = me();
  const bg = s.store.bg?colorHex(s.store.bg):'#f6f4f8', bd = s.store.border?colorHex(s.store.border):'#d6d0de';
  return `<div style="border:7px solid ${bd};background:${bg};color:${isLight(bg)?'#1d1d1f':'#fff'};border-radius:10px;padding:12px;text-align:center">
    <div style="font-weight:900;font-size:20px">${esc(s.brand.name)}</div>
    <div style="font-size:13px;opacity:.85">${esc(s.name)} ${s.discount?` • 🏷️ تنزيلات ${s.discount}٪`:''}</div>
  </div>
  ${s.brand.desc?`<div class="desc">${esc(s.brand.desc)}</div>`:''}
  ${s.designs.map((d,i)=>{ if(!d) return `<div class="item">${designSVG(null)}<div class="in"><b>تصميم ناقص</b></div></div>`;
    const pr = finalPrice(s,d), owned = b.bought.includes(id+':'+i);
    return `<div class="item">${designSVG(d)}<div class="in"><b>${s.featured===i?'⭐ ':''}${esc(d.name)}</b>
      <small>${[d.base,d.extra].filter(Boolean).map(x=>cloth(x.type).name+' '+colorName(x.color)+(x.fabric?' '+fabric(x.fabric).name:'')).join(' + ')}</small>
      <b style="color:var(--p)">${money(pr)}</b>${pr!==d.price?`<span class="old">${money(d.price)}</span>`:''}</div>
      <button class="buy" ${owned||b.wallet<pr?'disabled':''} onclick="buyDesign(${id},${i})">${owned?'✓ اشتريته':'اشترِ'}</button></div>`; }).join('')}
  <button class="btn ghost" onclick="closeModal()">طلعة من المتجر</button>`;
}

/* ---------- التصويت ---------- */
function vote(id){ S.voteChoice = id; render(); }
function endVote(){
  if(S.voteChoice!==null) S.players[S.voteChoice].votes++;
  S.players.filter(p=>p.isBot).forEach(bot=>{ pick(S.players.filter(p=>p.id!==bot.id)).votes++; });
  computeScores();
  go('results', null);
}
SCREENS.vote = () => { const others = S.players.filter(x=>x.id!==0); return `
${hdr()}
${timerHTML()}
<h2>✨ صوّت للإبداع</h2>
<p class="sub">مين أكثر مصمم مبدع على التشكيلة كاملة وأفضل تصميم؟ صوت واحد، وما تقدر تصوت لنفسك.</p>
${others.map(s=>`<div class="card" style="cursor:pointer;${S.voteChoice===s.id?'border-color:var(--p);background:var(--pl)':''}" onclick="vote(${s.id})">
  <div class="row" style="border:0;padding:0 0 6px"><b>${esc(s.brand.name)} <small style="color:var(--mut)">— ${esc(s.name)}</small></b><span>${S.voteChoice===s.id?'✓ صوتك':''}</span></div>
  <div class="dgrid">${s.designs.map(d=>`<div class="dcard" style="cursor:inherit">${designSVG(d)}</div>`).join('')}</div>
</div>`).join('')}
${endBtn('الذهاب للنتائج','endVote()')}`; };

/* ---------- النتائج ---------- */
function computeScores(){
  S.players.forEach(p=>{ p.score = 0; p.awards = []; });
  S.results = CONFIG.categories.map(c=>{
    const max = Math.max(...S.players.map(c.metric));
    const winners = (CONFIG.zeroNoAward && max<=0) ? [] : S.players.filter(p=>c.metric(p)===max);
    const share = winners.length ? (CONFIG.tieRule==='split' ? c.points/winners.length : c.points) : 0;
    winners.forEach(w=>{ w.score += share; w.awards.push(c.name); });
    return { c, max, winners, share };
  });
}
SCREENS.results = () => {
  const ranked = [...S.players].sort((a,b)=>b.score-a.score);
  const [g,s,b] = ranked;
  const MED = {1:'🥇',2:'🥈',3:'🥉'};
  const pod = (p,cls,n) => p ? `<div class="pod ${cls}"><div class="md">${MED[n]}</div><div class="pn">${esc(p.name)}</div><div class="ps">${pts(p.score)} نقطة</div><div class="pb">${n}</div></div>` : '';
  const val = (c,v) => (c.id==='capital'||c.id==='wallet') ? money(v) : v;
  return `
${hdr('<span class="tag">النتائج</span>')}
<h2>🏆 النتائج</h2>
<div class="card">${S.results.map(r=>`<div class="cat"><span class="ci">${r.c.icon}</span>
  <span class="cn"><b>${r.c.name}</b><small>${r.winners.length ? r.winners.map(w=>esc(w.name)).join('، ')+' — '+val(r.c,r.max) : 'ما أحد ياخذها'} • ${r.c.hint}</small></span>
  <span class="cp">${r.winners.length?'+'+pts(r.share):'—'}</span></div>`).join('')}</div>
<div class="podium">${pod(s,'s',2)}${pod(g,'g',1)}${pod(b,'b',3)}</div>
${ranked.length>3?`<div class="card rest">${ranked.slice(3).map((p,i)=>`<div class="row"><span>${i+4}. ${esc(p.name)}</span><b>${pts(p.score)}</b></div>`).join('')}</div>`:''}
<button class="btn" onclick="newGame()">لعبة جديدة</button>`;
};
function newGame(){ stopTimer(); newState(S.settings); S.screen = 'setup'; render(); window.scrollTo(0,0); }

/* ============================ النوافذ ============================ */
let confirmFn = null;
function askConfirm(text, fn){ confirmFn = fn; S.modal = {type:'confirm', text}; renderModal(); }
function confirmYes(){ const f = confirmFn; confirmFn = null; closeModal(); if(f) f(); }
function openAssumptions(){ S.modal = {type:'assume'}; renderModal(); }
function closeModal(){ S.modal = null; renderModal(); }
function renderModal(){
  const root = $('modalRoot'), m = S.modal;
  if(!m){ root.innerHTML = ''; return; }
  let inner = '';
  if(m.type==='store') inner = storeModal(m.id);
  if(m.type==='assume') inner = `<h3>📝 افتراضات غير محسومة</h3><p class="sub">كلها قابلة للتعديل من CONFIG في أول السكربت.</p><ol>${ASSUMPTIONS.map(a=>`<li>${a}</li>`).join('')}</ol><button class="btn" onclick="closeModal()">تمام</button>`;
  if(m.type==='confirm') inner = `<h3>${m.text}</h3><button class="btn" onclick="confirmYes()">إيه، رجّع</button><button class="btn ghost" onclick="closeModal()">لا</button>`;
  root.innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${inner}</div></div>`;
}

/* ============================ العرض ============================ */
function render(){
  const app = $('app');
  app.className = (S.screen==='mall') ? 'wide' : '';
  app.innerHTML = SCREENS[S.screen]();
  const ls = $('langsw'); if(ls) ls.hidden = !(S.screen==='intro' || S.screen==='setup');
  updTimer();
  renderModal();
}

newState();
render();
</script>
</body>
</html>
