const CODE_CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const app = document.getElementById('app');

let db = null, ME_ID = null, G = null, ME = null, INP = {};
let skew = null, hostOn = false, unsubRoom = null, unsubInp = null, hostTick = null, seq = 0;
const U = { splash: true, ready: false, view: 'home', modal: null, draft: {}, err: '', lastKey: '', lastHtml: '',
  code: '', name: '', busy: false, offline: '', fromLink: false, notice: false, logN: -1, logG: -1 };

/* ---------- أدوات ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = p => p + (++seq) + Math.random().toString(36).slice(2, 7);
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const P = id => (G && (G.players.find(p => p.id === id) || (G.hostP && G.hostP.id === id && G.hostP))) || { id, name: L('لاعب', 'Player') };
const inRoom = id => !!(G && G.players.some(p => p.id === id));
const isHost = () => !!(G && ME_ID && G.host === ME_ID);
const nowH = () => (isHost() ? Date.now() : Date.now() - (skew || 0));
const inp = id => (id === ME_ID ? ME : INP[id]) || {};
const amPlayer = () => inRoom(ME_ID);
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
function lsGet() { try { return JSON.parse(localStorage.getItem(LSK_()) || '{}') || {}; } catch (e) { return {}; } }
function lsSet(o) { try { localStorage.setItem(LSK_(), JSON.stringify(Object.assign(lsGet(), o))); } catch (e) { } }

/* ---------- قفل فترة التجربة ---------- */
const isGuest = () => { try { return localStorage.getItem('aqnieni.guest') === '1'; } catch (e) { return false; } };
const markGuest = () => { try { localStorage.setItem('aqnieni.guest', '1'); } catch (e) { } document.documentElement.classList.add('aqguest'); };
if (isGuest()) document.documentElement.classList.add('aqguest');
const lockCard = () => `<section class="card" style="text-align:center"><h3>${L('فترة تجريبية', 'Trial period')}</h3><p class="sub">${L('ادخل عن طريق رابط الدعوة من المضيف.', 'Join using the host’s invite link.')}</p></section>`;

/* ---------- التخزين ---------- */
const roomPath = c => GAME.key + '/' + c;
const inpPath = (c, id) => GAME.key + '/' + c + '/inputs/' + id;
let pubBusy = false, pubDirty = false, pubT = null;
function publish() { if (!isHost() || !db) return; clearTimeout(pubT); pubT = setTimeout(flushRoom, 40); }
async function flushRoom() {
  if (!isHost() || !db) return;
  if (pubBusy) { pubDirty = true; return; }
  pubBusy = true;
  try { G.rev = (G.rev || 0) + 1; G.sentAt = Date.now(); await db.doc(roomPath(G.code)).set(clone(G)); U.offline = ''; }
  catch (e) { writeFailed(e); }
  pubBusy = false;
  if (pubDirty) { pubDirty = false; flushRoom(); }
}
async function flushDirect() { try { G.rev = (G.rev || 0) + 1; G.sentAt = Date.now(); await db.doc(roomPath(G.code)).set(clone(G)); } catch (e) { writeFailed(e); } }
let meBusy = false, meDirty = false, meT = null;
function saveMeSoon() { clearTimeout(meT); meT = setTimeout(saveMe, 350); }
async function saveMe() {
  if (!db || !ME || !U.code) return;
  if (meBusy) { meDirty = true; return; }
  meBusy = true;
  try { await db.doc(inpPath(U.code, ME_ID)).set(clone(ME)); U.offline = ''; } catch (e) { writeFailed(e); }
  meBusy = false;
  if (meDirty) { meDirty = false; saveMe(); }
  if (isHost()) hostStep();
}
function writeFailed() { U.offline = 'net'; toast(L('تعذر الحفظ، تأكد من الاتصال.', 'Couldn’t save — check your connection.')); render(); }

/* ---------- دورة الغرفة ---------- */
function freshRoom(code) {
  return Object.assign({ v: 1, code, host: ME_ID, rev: 0, sentAt: 0, gameNo: 0, phase: 'lobby', players: [], kicked: {}, reqSeen: {},
    settings: clone(GAME.defaults), log: [], hostP: null }, GAME.freshExtra ? GAME.freshExtra() : {});
}
function blankMe(code) { return { room: code, name: U.name.trim(), at: Date.now(), reqN: 0, reqs: [] }; }
function mine() { ME = ME || blankMe(U.code); if (G && ME.g !== G.gameNo) { GAME.resetMine && GAME.resetMine(ME); ME.g = G.gameNo; } return ME; }
async function subscribe(code) {
  unsubscribe();
  U.code = code;
  try { location.hash = 'room-' + code; } catch (e) { }
  lsSet({ code });
  const loading = setTimeout(() => { if (!G) { U.offline = 'net'; render(); } }, 10000);
  unsubRoom = db.doc(roomPath(code)).onSnapshot(s => { clearTimeout(loading); onRoomSnap(s); }, () => { clearTimeout(loading); U.offline = 'net'; render(); });
}
function unsubscribe() {
  if (unsubRoom) { try { unsubRoom(); } catch (e) { } unsubRoom = null; }
  if (unsubInp) { try { unsubInp(); } catch (e) { } unsubInp = null; }
  if (hostTick) { clearInterval(hostTick); hostTick = null; }
  hostOn = false; INP = {};
}
function onRoomSnap(s) {
  if (!s || !s.exists) { if (!G) { U.err = L('ما لقينا غرفة بهذا الرمز. تأكد من الرمز.', 'No room with that code. Check the code.'); leaveLocal(); render(); } return; }
  const d = s.data();
  if (!d || d.code !== U.code) return;
  if (d.sentAt && d.host !== ME_ID) { const o = Date.now() - d.sentAt; if (skew === null || o < skew) skew = o; }
  if (hostOn && G && G.host === ME_ID) {
    if (d.host !== ME_ID && d.rev > G.rev) { hostOn = false; G = clone(d); stopHost(); } else return;
  } else {
    if (G && G.code === d.code && (d.rev || 0) < (G.rev || 0)) return;
    G = clone(d);
  }
  if (G.host === ME_ID && !hostOn) becomeHost();
  decideView(); showLog(); render();
}
function decideView() {
  if (!G) return;
  if (inRoom(ME_ID) || (G.host === ME_ID)) U.view = 'game';
  else if (G.kicked && G.kicked[ME_ID]) U.view = 'kicked';
  else if (G.phase === 'lobby') U.view = ME && ME.room === G.code && ME.name ? 'wait' : 'join';
  else U.view = 'spect';
}
async function loadMe(code) {
  try { const s = await db.doc(inpPath(code, ME_ID)).get(); ME = s.exists ? clone(s.data()) : null; } catch (e) { ME = null; }
  if (ME && ME.room !== code) ME = null;
}
function becomeHost() {
  hostOn = true;
  if (unsubInp) { try { unsubInp(); } catch (e) { } }
  unsubInp = db.collection(GAME.key + '/' + G.code + '/inputs').onSnapshot(onInputs, () => { });
  if (!hostTick) hostTick = setInterval(() => { if (GAME.hostTick && GAME.hostTick()) publish(); }, 500);
  publish();
}
function stopHost() {
  if (unsubInp) { try { unsubInp(); } catch (e) { } unsubInp = null; }
  if (hostTick) { clearInterval(hostTick); hostTick = null; }
  INP = {};
}
function onInputs(snap) { const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); }); INP = m; hostStep(); }
function leaveLocal() {
  unsubscribe();
  G = null; ME = null; U.code = ''; U.view = 'home'; U.modal = null; skew = null; HIST.length = 0;
  lsSet({ code: '' });
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { try { location.hash = ''; } catch (e2) { } }
}
function uniqueName(n, id) {
  let base = String(n || '').trim().slice(0, 20) || L('لاعب', 'Player'), name = base, k = 2;
  while (G.players.some(p => p.id !== id && p.name === name)) name = base + ' ' + (k++);
  return name;
}

/* ---------- المضيف: الانضمام والطلبات ---------- */
function hostStep() {
  if (!isHost() || !G) return;
  let ch = false;
  Object.keys(INP).forEach(id => {
    const d = INP[id];
    if (!d || id === ME_ID) return;
    const p = G.players.find(x => x.id === id);
    if (G.phase === 'lobby' && p && (d.room !== G.code || !d.name)) { G.players = G.players.filter(x => x.id !== id); ch = true; return; }
    if (d.room !== G.code) return;
    if (G.phase === 'lobby' && !p && !G.kicked[id] && d.name && !nameTaken(d.name, id) && G.players.length < 26) { G.players.push({ id, name: uniqueName(d.name, id), at: d.at || 0 }); ch = true; }
    else if (G.phase === 'lobby' && p && d.at && d.at > (p.at || 0)) { p.name = uniqueName(d.name, id); p.at = d.at; ch = true; }
  });
  Object.keys(INP).forEach(id => {
    if (id === ME_ID || !inRoom(id)) return;
    (INP[id].reqs || []).forEach(r => {
      if (!r || !(r.n > (G.reqSeen[id] || 0))) return;
      G.reqSeen[id] = r.n; ch = true;
      try { GAME.applyReq(id, r); } catch (e) { console.error(e); }
    });
  });
  if (GAME.hostSync && GAME.hostSync()) ch = true;
  if (ch) publish();
  render();
}
function sendReq(r) {
  if (isHost()) { try { GAME.applyReq(ME_ID, r); } catch (e) { console.error(e); } publish(); render(); return; }
  const m = mine(); m.reqN = (m.reqN || 0) + 1; r.n = m.reqN; m.reqs = (m.reqs || []).concat([r]).slice(-40);
  saveMe(); render();
}
function addLog(text) { G.log = (G.log || []).concat([{ n: (G.log && G.log.length ? G.log[G.log.length - 1].n : 0) + 1, t: text }]).slice(-20); }
function showLog() {
  if (!G || !G.log || !G.log.length) return;
  const last = G.log[G.log.length - 1].n;
  if (U.logG !== G.gameNo || U.logN < 0) { U.logG = G.gameNo; U.logN = last; return; }
  G.log.filter(x => x.n > U.logN).forEach(x => toast(x.t));
  U.logN = last;
}

/* ---------- المؤقت (المضيف يحدده) ---------- */
function setTimer(sec) { G.dur = sec || 0; G.endsAt = sec ? Date.now() + sec * 1000 : 0; G.pz = 0; }
/* إيقاف مؤقت: الوقت المتبقي يتخزن في G.pz ونهاية المؤقت تنرفع لبعيد */
const isPz = () => !!(G && G.endsAt && G.pz > 0 && G.endsAt - Date.now() > 1e9);
const remain = () => (G && G.endsAt ? (isPz() ? G.pz : Math.max(0, (G.endsAt - nowH()) / 1000)) : 0);
function tCtl() {
  if (!isHost() || !G || !G.endsAt) return '';
  const p = isPz();
  return `<div class="tctl"><button class="btn ${p ? '' : 'ghost'}" data-act="tPause">${p ? L('▶️ متابعة', '▶️ Resume') : L('⏸️ إيقاف', '⏸️ Pause')}</button><button class="btn ghost" data-act="tRestart">${L('🔄 إعادة المؤقت', '🔄 Restart timer')}</button></div>`;
}
function clockBox(label) {
  return `<div class="timer" id="timerBox"><div class="trow"><span class="tlabel">⏳ ${label}</span><span class="tval" data-clock></span></div><div class="tbar"><i data-bar></i></div></div>`;
}
function tickUI() {
  if (!G || !G.endsAt) return;
  const r = remain(), d = G.dur || 1;
  const pz = isPz();
  document.querySelectorAll('[data-clock]').forEach(el => { el.textContent = pz ? fmt(r) + ' ⏸️ ' + L('متوقف', 'Paused') : (r > 0 ? fmt(r) : L('انتهى الوقت ⏰', 'Time’s up ⏰')); });
  document.querySelectorAll('[data-bar]').forEach(el => { el.style.width = Math.min(100, r / d * 100) + '%'; });
  const tb = $('timerBox'); if (tb) tb.classList.toggle('timeup', r <= 0);
  const eb = $('endBtn'); if (eb) eb.classList.toggle('pulse', r <= 0);
}
setInterval(tickUI, 250);
const endBtn = (label, act) => isHost() ? tCtl() + `<button class="btn end" id="endBtn" data-act="${act}">${L('إنهاء', 'End')} (${label})<span class="host-note">${L('يظهر للمضيف فقط', 'Host only')}</span></button>` : '';
const waitHost = () => isHost() ? '' : `<p class="sub" style="text-align:center">${L('بانتظار المضيف', 'Waiting for the host')} ${esc(P(G.host).name)} ${L('ينقل اللعبة للمرحلة الجاية…', 'to move to the next stage…')}</p>`;

/* ---------- رجوع المضيف للمرحلة السابقة ---------- */
const HIST = [];
function phaseTo(fn) { HIST.push(clone(G)); if (HIST.length > 15) HIST.shift(); fn(); }
function hostBack() {
  if (!isHost() || !HIST.length) return;
  const prev = HIST.pop(), keepRev = G.rev, players = G.players;
  G = prev; G.rev = keepRev; G.players = players; G.host = ME_ID;
  publish();
}

/* ---------- الشاشات المشتركة ---------- */
const BACK = L('→ رجوع', '← Back');
function topbar() {
  const inG = !!G && !!U.code;
  const back = inG && isHost() && HIST.length && G.phase !== 'lobby' ? `<button class="backbtn" data-act="askBack">${BACK}</button>` : (!U.code ? `<a class="backbtn hub" href="${HUB}">${BACK}</a>` : '');
  return `<header class="top">${back}<div class="brand"><img src="${ICON}" width="34" height="34" alt="" style="flex:none;border-radius:22%"><span>${N(GAME.name)}</span></div><div class="top-r">` +
    (inG ? `<span class="chip">${L('غرفة', 'Room')} <b dir="ltr">${esc(U.code)}</b></span><button class="mini" data-act="menu">${L('القائمة', 'Menu')}</button>` : '') + `</div></header>` +
    (U.offline === 'net' ? `<div class="warn">${L('الاتصال ضعيف. التحديثات بتوصل أول ما يرجع الاتصال.', 'Weak connection. Updates will arrive when it’s back.')}</div>` : '');
}
const errBox = () => (U.err ? `<div class="warn" role="alert">${esc(U.err)}</div>` : '');
function noticeView() {
  return `<section class="notice"><div class="nbox"><h2>${L('تنويه ودي قبل اللعب', 'A friendly note before you play')}</h2>` +
    L(`<p>يا هلا فيكم! هذي نسخة تجريبية من لعبة «أقنعني» بفروعها: المنصة، المزاد، الرئيس، الأزياء، العقار، من فكرة وتطوير عبدالرحمن الفهد، بتاريخ 26/11/26.</p><p>حبيت أشارككم التجربة قبل نشرها للناس، والهدف نستانس ونجرّبها مع بعض. حقوق محتوى اللعبة وتصميمها وموادها محفوظة، وأتمنى ما تنسخونها أو تعيدون نشرها أو تسوّون نسخة مشابهة منها حتى مع تغييرات بسيطة. وأي استخدام لمحتواها بدون إذن قد يضطرني لاتخاذ الإجراءات المناسبة.</p><p>استمتعوا، وملاحظاتكم تهمني!</p>`,
      `<p>Welcome, everyone! This is a trial version of “Aqnieni” and its games: ALMANASSA, ALMAZAD, ALRAEES, ALAZYAA and ALAQAR, created and developed by Abdulrahman Al-Fahad, dated 26/11/26.</p><p>I wanted to share it with you before releasing it to the public, so we can have fun and try it together. All rights to the game’s content, design and materials are reserved. Please don’t copy it, republish it, or make a similar version of it, even with small changes. Any use of its content without permission may force me to take appropriate action.</p><p>Enjoy, and your feedback matters to me!</p>`) +
    `<button class="nbtn" data-act="noticeOk">${L('أوعدك، يلا نلعب', 'I promise, let’s play')}</button></div></section>`;
}
function introArt() {
  const d = (t, c, fb, e, ec, ef) => ({ base: { type: t, color: c, fabric: fb, pattern: 'plain' }, extra: e ? { type: e, color: ec, fabric: ef, pattern: 'plain' } : null });
  return `<div class="intro-art fig">${designSVG(d('pants', 'black', 'leather', 'jacket', 'red', 'leather'))}${designSVG(d('dress', 'purple', 'velvet', 'bag', 'gold', 'leather'))}${designSVG(d('abaya', 'black', 'silk', 'scarf', 'gold', 'silk'))}</div>`;
}
function splashView() {
  return `<a class="backbtn aqfix" href="${HUB}">${BACK}</a><div class="intro"><div class="logo">${LOGO}</div><div class="gname">${N(GAME.name)}</div>
  ${introArt()}<p class="lead">${N(GAME.intro)}</p><button class="btn" data-act="enter">${L('فهمت', 'Got it')}</button></div>`;
}
function homeView() {
  if (!U.ready) return `<section class="card"><p class="sub">${L('جاري التحميل…', 'Loading…')}</p></section>`;
  if (!db) return `<section class="card"><p class="sub">${L('تعذر الاتصال. تأكد من الإنترنت وحدّث الصفحة.', 'Couldn’t connect. Check your internet and refresh.')}</p></section>`;
  const me = `<section class="card"><h3>${L('اسمك أو لقبك', 'Your name or nickname')}</h3><input class="field" id="nm" data-bind="name" value="${esc(U.name)}" maxlength="20" autocomplete="off" placeholder="${L('مثال: أبو فهد', 'e.g. Captain Fahad')}"></section>`;
  const join = `<section class="card"><h3>${L('انضم لغرفة', 'Join a room')}</h3><input class="field code-in" id="cd" data-bind="code" value="${esc(U.draft.code || '')}" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="${L('مثال: K7QX', 'e.g. K7QX')}" dir="ltr">
    <button class="btn ${U.fromLink ? '' : 'ghost'}" data-act="join">${L('انضمام', 'Join')}</button></section>`;
  const host = `<section class="card"><h3>${L('أنشئ غرفة جديدة', 'Create a new room')}</h3><p class="sub">${L('تكون أنت المضيف: تبدأ اللعبة وتنقلها بين المراحل، وباقي اللاعبين يدخلون برمز الغرفة من تلفوناتهم.', 'You’ll be the host: you start the game and move it between stages; the others join with the room code from their phones.')}</p>
    <button class="btn" data-act="create">${L('إنشاء غرفة', 'Create room')}</button></section>`;
  return `<section class="card hero"><div class="hlogo">${LOGO}</div><div class="hname">${N(GAME.name)}</div><p class="lead">${N(GAME.lead)}</p></section>` +
    me + errBox() + (U.fromLink ? join : (isGuest() ? lockCard() : host + join));
}
function joinView() {
  return `<section class="card" style="text-align:center"><span class="sub">${L('تنضم إلى الغرفة', 'Joining room')}</span><div class="bigcode" dir="ltr">${esc(U.code)}</div></section>
  <section class="card"><h3>${L('اسمك أو لقبك', 'Your name or nickname')}</h3><input class="field" id="nm" data-bind="name" value="${esc(U.name)}" maxlength="20" autocomplete="off"></section>${errBox()}
  <button class="btn" data-act="sendJoin">${L('دخول الغرفة', 'Enter the room')}</button><button class="btn ghost" data-act="leaveNow">${L('رجوع', 'Back')}</button>`;
}
const waitView = () => `<section class="card" style="text-align:center"><div class="spin"></div><h3>${L('بانتظار المضيف', 'Waiting for the host')}</h3><p class="sub">${L('أرسلنا اسمك للغرفة', 'We sent your name to room')} ${esc(U.code)}. ${L('بتظهر في قائمة اللاعبين خلال ثواني.', 'You’ll appear in the player list in a few seconds.')}</p></section><button class="btn ghost" data-act="leaveNow">${L('إلغاء والخروج', 'Cancel and leave')}</button>`;
const spectView = () => `<section class="card" style="text-align:center"><h3>${L('اللعبة بدأت', 'The game has started')}</h3><p class="sub">${L('هذه الغرفة بدأت اللعب بدونك. تقدر تنضم لما يرجع المضيف للردهة.', 'This room started without you. You can join when the host returns to the lobby.')}</p><button class="btn" data-act="leaveNow">${L('خروج', 'Leave')}</button></section>`;
const kickedView = () => `<section class="card" style="text-align:center"><h3>${L('خرجت من الغرفة', 'You left the room')}</h3><p class="sub">${L('المضيف أزالك من هذه الغرفة.', 'The host removed you from this room.')}</p><button class="btn" data-act="leaveNow">${L('رجوع', 'Back')}</button></section>`;

const stp = (k, min, max, show) => { const v = G.settings[k]; return `<div class="row"><span>${show.label}</span><div class="stepper"><button data-act="step" data-k="${k}" data-v="1" ${v >= max ? 'disabled' : ''}>+</button><span class="v">${show.fmt ? show.fmt(v) : v}</span><button data-act="step" data-k="${k}" data-v="-1" ${v <= min ? 'disabled' : ''}>−</button></div></div>`; };
const timeRow = (k, label) => stp(k, GAME.timer.min, GAME.timer.max, { label, fmt });
function lobbyView() {
  const s = G.settings, host = isHost(), link = ART_URL + '#room-' + G.code;
  const real = G.players.length - (s.hostPlays === 0 ? 1 : 0), tgt = s.players;
  const rows = G.players.map(p => `<div class="prow"><b>${esc(p.name)}${p.id === ME_ID ? ` <small>(${L('أنت', 'you')})</small>` : ''}</b>${p.id === G.host ? `<span class="chip on">${L('المضيف', 'Host')}</span>` : ''}${host && p.id !== ME_ID ? `<button class="x" data-act="kick" data-id="${p.id}">×</button>` : ''}</div>`).join('');

  resetMine(m) { Object.assign(m, { perks: [], types: [], colors: [], fabrics: [], store: { bg: null, border: null }, designs: Array(CONFIG.designsCount).fill(null), featured: null, brand: { name: '', desc: '' }, discount: 0, done: {}, vote: null }); },

    phaseTo(() => {
      Object.assign(G, GAME.freshExtra());

      G.phase = 'buy'; setTimer(G.settings.buyTime);
    });
  },
  hostSync() { return false; },
  applyReq(id, r) {
    if (r.g !== G.gameNo) return;
    if (r.type === 'extra' && G.phase === 'talk') {
      const sp = G.talk.speakers[G.talk.idx];
      if (sp === id && !G.extraUsed[id] && (stOf(id) || {}).perks && stOf(id).perks.includes('extraTime')) { G.extraUsed[id] = 1; if (isPz()) G.pz += CONFIG.extraTimeSec; else G.endsAt += CONFIG.extraTimeSec * 1000; G.dur += CONFIG.extraTimeSec; addLog(L(`+${CONFIG.extraTimeSec} ثانية لـ${P(id).name}`, `+${CONFIG.extraTimeSec}s for ${P(id).name}`)); }
    }
    if (G.phase !== 'shop') return;
    const k = G.shop.round;
    if (r.type === 'visit' && r.sid !== id && inRoom(r.sid)) {
      G.shop.seen = G.shop.seen || {}; const key = k + ':' + id + ':' + r.sid;
      if (!G.shop.seen[key]) { G.shop.seen[key] = 1; G.visits[r.sid] = (G.visits[r.sid] || 0) + 1; }
    }
    if (r.type === 'buy' && r.sid !== id) {
      const st = stOf(r.sid), d = st && st.designs[r.i]; if (!d) return;
      const key = r.sid + ':' + r.i, price = finalPrice(st, d);
      if ((G.bought[id] || []).includes(key) || walletOf(id) < price) return;
      G.wallet[id] = walletOf(id) - price; G.bought[id] = (G.bought[id] || []).concat([key]);
      G.sales[r.sid] = (G.sales[r.sid] || 0) + 1; G.salesMoney[r.sid] = (G.salesMoney[r.sid] || 0) + price;
      addLog(L(`🛍️ ${P(id).name} اشترى من ${st.brand.name}`, `🛍️ ${P(id).name} bought from ${st.brand.name}`));
    }
  },
  view() {

    let h = G.phase !== 'final' ? clockBox(lbl) : '';

      if (host) h += progBox(L('مين خلص', 'Who’s done'), done) + endBtn({ buy: L('الذهاب للتصميم', 'go to Designing'), design: L('الذهاب لبناء المشروع', 'go to Building'), build: L('الذهاب لجولات التحدث', 'go to the talk rounds') }[G.phase], 'next');
      else h += waitHost();
    }
    if (G.phase === 'talk') h += talkView();
    if (G.phase === 'shop') h += mallView();
    if (G.phase === 'vote') h += voteView();
    if (G.phase === 'final') h += finalView();
    return h;
  },
  modalView(m) {

    return '';
  },
  bind(b, el) {
    const m = mine();
    if (b === 'dname') { U.draft.name = el.value; }

    if (b === 'bdesc') { m.brand.desc = el.value; const c = $('dcount'); if (c) c.textContent = el.value.length; saveMeSoon(); }
  },
  assumptions: {
    ar: ['اللون البنفسجي مؤقت.', 'العملة «د.ك» ورأس المال ١٠٠ ومحفظة التسوق ٥٠ — أرقام مؤقتة.', 'كل الأسعار مؤقتة: نوع الملابس ٨، لون الخامة ٤، نوع الخامة ٥، خلفية المتجر ٦، إطار المتجر ٤، كل ميزة ١٠.', 'الخامات: لين لونين ولين نوعين.', 'المزايا تجريبية؛ مفعّل منها «وقت إضافي» (+٣٠ ث) و«تنزيلات». الباقي بدون تأثير.', 'الأنماط مجانية. كل تصميم = قطعة أساسية + إضافية اختيارية. سعر البيع من ١ إلى ٢٠.', 'فلوس المبيعات تنضاف لرأس المال.', 'الزيارة تنحسب مرة لكل زائر لكل متجر بكل جولة تسوق.', 'كل لاعب يشتري التصميم مرة، وما يشتري من متجره.', '«محفظة التسوق»: ياخذها أعلى رصيد متبقي.', 'التصويت: صوت واحد لأكثر مصمم إبداعًا، وما يصوت لنفسه.', 'التعادل يقسم النقاط، وإذا الأعلى صفر ما أحد ياخذها.', 'إذا خلص الوقت ما تنتقل اللعبة تلقائيًا؛ المضيف يضغط «إنهاء».'],
    en: ['Purple is temporary.', 'Currency “KD”, capital 100, shopping wallet 50 — temporary.', 'All prices temporary: clothing type 8, fabric colour 4, fabric type 5, store background 6, frame 4, each perk 10.', 'Fabrics: up to two colours and two types.', 'Perks are trial; active: “Extra time” (+30 s) and “Sale”. The rest have no effect yet.', 'Patterns are free. Each design = main piece + optional extra. Price 1–20.', 'Sales money is added to capital.', 'A visit counts once per visitor per store per shopping round.', 'Each player buys a design once, never from their own store.', '“Shopping wallet” goes to the highest remaining balance.', 'Voting: one vote for the most creative designer, no self-votes.', 'Ties split points; if the top value is zero nobody scores.', 'When time runs out nothing moves on by itself; the host presses “End”.']

/* ---------- انتقال المراحل (المضيف) ---------- */
ACT.next = H(() => {
  phaseTo(() => {
    if (G.phase === 'buy') { G.phase = 'design'; setTimer(G.settings.designTime); }
    else if (G.phase === 'design') { G.phase = 'build'; setTimer(G.settings.buildTime); }
    else if (G.phase === 'build') {
      G.stores = {};
      G.players.forEach(p => {
        const m = inp(p.id), ok = m.g === G.gameNo;
        const designs = ok ? (m.designs || []).slice(0, CONFIG.designsCount) : Array(CONFIG.designsCount).fill(null);
        let feat = ok ? m.featured : null; if (feat == null || !designs[feat]) { const i = designs.findIndex(Boolean); feat = i >= 0 ? i : null; }
        G.stores[p.id] = { brand: { name: (ok && m.brand && m.brand.name.trim()) || L('متجر ', '') + p.name + L('', '’s store'), desc: ok && m.brand ? m.brand.desc : '' },
          store: ok ? m.store : {}, designs, featured: feat, discount: ok && (m.perks || []).includes('sale') ? (m.discount || 0) : 0, perks: ok ? (m.perks || []) : [], spent: ok ? spentOf(m) : 0 };
      });
      G.spoken = []; startTalk(1);
    }
  });
});
/* كل جولة: إقناع وبعدها تسوق. عدد جولات الإقناع = عدد جولات التسوق */
function RND() { const s = G.settings; return +s.rounds || +s.talkRounds || 1; }
function startTalk(r) {
  const k = Math.min(G.settings.speakers, G.players.length), all = G.players.map(p => p.id);
  let picks = shuffle(all.filter(id => !G.spoken.includes(id))).slice(0, k);
  if (picks.length < k) { G.spoken = []; picks = picks.concat(shuffle(all.filter(id => !picks.includes(id))).slice(0, k - picks.length)); }
  G.spoken = G.spoken.concat(picks);
  G.talk = { round: r, speakers: picks, idx: 0 }; G.phase = 'talk'; setTimer(G.settings.talkTime);
}
ACT.talkNext = H(() => {
  phaseTo(() => {
    const t = G.talk;
    if (t.idx < t.speakers.length - 1) { t.idx++; setTimer(G.settings.talkTime); }
    else { G.phase = 'shop'; G.shop = { round: t.round, seen: {} }; setTimer(G.settings.shopTime); addLog(L('بدت جولة التسوق ', 'Shopping round ') + t.round); }
  });
});
ACT.shopNext = H(() => {
  phaseTo(() => {
    if (G.shop.round < RND()) startTalk(G.shop.round + 1);
    else { G.phase = 'vote'; setTimer(G.settings.voteTime); }
  });
});
ACT.voteEnd = H(() => {
  phaseTo(() => {
    G.votes = {}; G.players.forEach(p => { G.votes[p.id] = 0; });
    G.players.forEach(p => { const v = inp(p.id).vote; if (v && v.g === G.gameNo && v.v !== p.id && inRoom(v.v)) G.votes[v.v]++; });
    const metric = { capital: id => capitalOf(id), wallet: id => walletOf(id), creative: id => G.votes[id] || 0, purchases: id => G.sales[id] || 0, visits: id => G.visits[id] || 0 };
    const score = {}; G.players.forEach(p => { score[p.id] = 0; });
    G.results = CONFIG.categories.map(c => {
      const vals = G.players.map(p => ({ id: p.id, v: metric[c.id](p.id) }));
      const max = Math.max(...vals.map(x => x.v));
      const win = max <= 0 ? [] : vals.filter(x => x.v === max).map(x => x.id);
      const share = win.length ? c.points / win.length : 0; win.forEach(id => { score[id] += share; });
      return { id: c.id, max, win, share };
    });
    G.score = score; G.phase = 'final'; G.endsAt = 0;
  });
});

}
ACT.feat = d => { mine().featured = +d.i; saveMe(); };
ACT.disc = d => { const m = mine(); m.discount = Math.min(CONFIG.discountMax, Math.max(0, (m.discount || 0) + (+d.v) * 5)); saveMe(); };
function buildView() {
  const m = mine(), done = m.designs.map((d, i) => d ? i : null).filter(i => i !== null);
  return `<h2>${L('بناء المشروع', 'Building the project')}</h2><p class="sub">${L('سمّ البراند، اكتب وصف قصير، واختر القطعة المميزة.', 'Name your brand, write a short description and pick your signature piece.')}</p>
  <div class="storebig">${storeHTML({ store: m.store, designs: m.designs, featured: m.featured, brand: m.brand, discount: m.perks.includes('sale') ? m.discount : 0 }, P(ME_ID).name)}</div>
  <div class="card"><h3>${L('اسم البراند', 'Brand name')}</h3><input class="field" id="bname" data-bind="bname" maxlength="${CONFIG.brandNameMax}" value="${esc(m.brand.name)}"></div>
  <div class="card"><h3>${L('وصف البراند', 'Brand description')}</h3><textarea class="field" id="bdesc" data-bind="bdesc" rows="3" maxlength="${CONFIG.brandDescMax}">${esc(m.brand.desc)}</textarea><div class="counter"><span id="dcount">${m.brand.desc.length}</span> / ${CONFIG.brandDescMax}</div></div>
  <div class="card"><h3>⭐ ${L('القطعة المميزة', 'Signature piece')}</h3>${done.length ? `<div class="dgrid">${done.map(i => `<button class="dcard ${m.featured === i ? 'on' : ''}" data-act="feat" data-i="${i}">${designSVG(m.designs[i])}<b>${esc(m.designs[i].name)}</b></button>`).join('')}</div>` : `<div class="warn">${L('ما عندك تصاميم جاهزة.', 'No finished designs.')}</div>`}</div>
  ${m.perks.includes('sale') ? `<div class="card"><div class="row"><span>🏷️ ${L('نسبة التنزيلات', 'Sale %')}</span><div class="stepper"><button data-act="disc" data-v="1">+</button><span class="v">${m.discount || 0}%</span><button data-act="disc" data-v="-1">−</button></div></div></div>` : ''}${doneBtn()}`;
}
function talkView() {
  const t = G.talk, sp = t.speakers[t.idx], st = stOf(sp) || {}, feat = st.featured != null ? st.designs[st.featured] : null;
  const nxt = t.idx < t.speakers.length - 1 ? L('الذهاب لإقناع ', 'go to ') + P(t.speakers[t.idx + 1]).name + L('', '’s pitch') : L('الذهاب لجولة التسوق ', 'go to shopping round ') + t.round;
  return `<span class="tag">${L('الجولة', 'Round')} ${t.round} / ${RND()} · ${L('الإقناع', 'Pitching')}</span>
  <div class="speakers">${t.speakers.map((id, i) => `<span class="spk ${i === t.idx ? 'now' : i < t.idx ? 'done' : ''}">${esc(P(id).name)}</span>`).join('')}</div>
  <div class="stage"><div class="who">${L('الحين يقنعكم', 'Now pitching')}<b>${esc(P(sp).name)}${sp === ME_ID ? L(' (أنت)', ' (you)') : ''}</b></div>
  <div class="card"><div class="ptitle">${esc(st.brand ? st.brand.name : '')}</div><div class="preview">${designSVG(feat)}</div>
  <div>⭐ ${feat ? esc(feat.name) + ' — ' + money(finalPrice(st, feat)) : L('ما في قطعة مميزة', 'No signature piece')}</div>${st.brand && st.brand.desc ? `<div class="desc">${esc(st.brand.desc)}</div>` : ''}</div>
  ${sp === ME_ID && (st.perks || []).includes('extraTime') && !G.extraUsed[ME_ID] ? `<button class="btn ghost" data-act="extra">⏱️ ${L('استخدم الوقت الإضافي', 'Use extra time')} (+${CONFIG.extraTimeSec}s)</button>` : ''}</div>
  ${endBtn(nxt, 'talkNext')}${waitHost()}`;
}
ACT.extra = () => sendReq({ type: 'extra', g: G.gameNo });
function mallView() {
  const others = G.players.filter(p => p.id !== ME_ID);
  return `<span class="tag">${L('الجولة', 'Round')} ${G.shop.round} / ${RND()} · ${L('التسوق', 'Shopping')}</span><h2>${L('السوق', 'The market')}</h2>
  ${amPlayer() ? capBar() + `<div class="moneybar"><span class="money">🚶 ${L('زيارات متجرك', 'Your visits')}: ${G.visits[ME_ID] || 0}</span><span class="money">🛍️ ${L('مبيعاتك', 'Your sales')}: ${G.sales[ME_ID] || 0}</span></div>` : ''}
  <div class="grid">${others.map(p => storeHTML(stOf(p.id) || {}, p.name, `data-act="openStore" data-id="${p.id}"`)).join('')}</div>
  ${endBtn(G.shop.round < RND() ? L('الذهاب لجولة الإقناع ', 'go to pitching round ') + (G.shop.round + 1) : L('الذهاب للتصويت', 'go to Voting'), 'shopNext')}${waitHost()}`;
}
ACT.openStore = d => { U.modal = { type: 'store', id: d.id }; if (amPlayer()) sendReq({ type: 'visit', sid: d.id, g: G.gameNo }); };
ACT.buy = d => { sendReq({ type: 'buy', sid: d.sid, i: +d.i, g: G.gameNo }); };
function storeModal(id) {
  const st = stOf(id); if (!st) return '';
  const bg = st.store && st.store.bg ? colorHex(st.store.bg) : '#f6f4f8', bd = st.store && st.store.border ? colorHex(st.store.border) : '#d6d0de', mineB = G.bought[ME_ID] || [];
  return `<div style="border:7px solid ${bd};background:${bg};color:${isLight(bg) ? '#1d1d1f' : '#fff'};border-radius:10px;padding:12px;text-align:center"><div class="ptitle">${esc(st.brand.name)}</div><small>${esc(P(id).name)}${st.discount ? ` • 🏷️ ${st.discount}%` : ''}</small></div>
  ${st.brand.desc ? `<div class="desc">${esc(st.brand.desc)}</div>` : ''}
  ${st.designs.map((d, i) => { if (!d) return `<div class="item">${designSVG(null)}<div class="in"><b>${L('تصميم ناقص', 'Unfinished design')}</b></div></div>`; const pr = finalPrice(st, d), owned = mineB.includes(id + ':' + i);
    return `<div class="item">${designSVG(d)}<div class="in"><b>${st.featured === i ? '⭐ ' : ''}${esc(d.name)}</b><small>${[d.base, d.extra].filter(Boolean).map(x => N(cloth(x.type).name) + ' ' + N(byId(COLORS, x.color).name) + (x.fabric ? ' ' + N(byId(FABRICS, x.fabric).name) : '')).join(' + ')}</small><b style="color:var(--p)">${money(pr)}</b>${pr !== d.price ? `<span class="old">${money(d.price)}</span>` : ''}</div>
    ${amPlayer() ? `<button class="buy" data-act="buy" data-sid="${id}" data-i="${i}" ${owned || walletOf(ME_ID) < pr ? 'disabled' : ''}>${owned ? '✓ ' + L('اشتريته', 'Bought') : L('اشترِ', 'Buy')}</button>` : ''}</div>`; }).join('')}
  <button class="btn ghost" data-act="closeModal">${L('طلعة من المتجر', 'Leave store')}</button>`;
}
function voteView() {
  const v = mine().vote, done = G.players.filter(p => { const x = inp(p.id).vote; return x && x.g === G.gameNo; }).map(p => p.id);
  return `<h2>✨ ${L('صوّت للإبداع', 'Vote for creativity')}</h2><p class="sub">${L('مين أكثر مصمم مبدع على التشكيلة كاملة وأفضل تصميم؟ صوت واحد، وما تقدر تصوت لنفسك.', 'Who is the most creative designer overall? One vote, not for yourself.')}</p>
  ${amPlayer() ? G.players.filter(p => p.id !== ME_ID).map(p => { const st = stOf(p.id) || { designs: [] }, on = v && v.g === G.gameNo && v.v === p.id; return `<div class="card votecard ${on ? 'on' : ''}" data-act="vote" data-id="${p.id}"><div class="row" style="border:0;padding:0 0 6px"><b>${esc(st.brand ? st.brand.name : p.name)} <small>— ${esc(p.name)}</small></b><span>${on ? '✓ ' + L('صوتك', 'Your vote') : ''}</span></div><div class="dgrid">${st.designs.map(d => `<div class="dcard">${designSVG(d)}</div>`).join('')}</div></div>`; }).join('') : ''}
  ${isHost() ? progBox(L('مين صوّت', 'Who voted'), done) : ''}${endBtn(L('الذهاب للنتائج', 'go to Results'), 'voteEnd')}${waitHost()}`;
}
ACT.vote = d => { mine().vote = { g: G.gameNo, v: d.id }; saveMe(); };
function finalView() {
  const list = G.players.map(p => ({ name: p.name, pts: Math.round((G.score[p.id] || 0) * 10) / 10 })).sort((a, b) => b.pts - a.pts);
  const val = (id, c) => ({ capital: capitalOf(id), wallet: walletOf(id) }[c.id]);
  return `<h2>🏆 ${L('النتائج', 'Results')}</h2>` + podium(list) +
    `<div class="card">${G.results.map(r => { const c = byId(CONFIG.categories, r.id); return `<div class="cat"><span class="ci">${c.icon}</span><span class="cn"><b>${N(c.name)}</b><small>${r.win.length ? r.win.map(id => esc(P(id).name)).join(L('، ', ', ')) + ' — ' + (c.money ? money(r.max) : r.max) : L('ما أحد ياخذها', 'Nobody takes it')} • ${N(c.hint)}</small></span><span class="cp">${r.win.length ? '+' + pts(r.share) : '—'}</span></div>`; }).join('')}</div>` +
    (isHost() ? `<button class="btn" data-act="rematch">${L('لعبة جديدة بنفس اللاعبين', 'New game, same players')}</button><button class="btn ghost" data-act="toLobby">${L('رجوع للردهة', 'Back to the lobby')}</button>` : '');
}
ACT.rematch = H(() => { G.gameNo++; G.log = []; HIST.length = 0; GAME.start(); });

init();
</script>
