<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أقنعني! | العقار</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800;900&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --p:#1E8A4C;      /* لون العقار: أخضر */
  --p2:#14653A;
  --pl:#EAF6EF;
  --red:#DE0921;    /* لون اسم اللعبة في صفحة المقدمة (نفس باقي ألعاب أقنعني) */
  --blue:#0554A4;
  --ink:#12203A; --mut:#5E6B80; --line:#E1E6EE;
  --gold:#D4A017; --silver:#A7A9AE; --bronze:#B87333;
  --font-d:'Alexandria','Readex Pro',Tahoma,sans-serif;
  --font:'Readex Pro','Alexandria','Segoe UI',Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font);line-height:1.65}
h2,h3,.btn,.gname,.tval,.nm,.stepper .v,.sname{font-family:var(--font-d)}
#app{max-width:620px;margin:0 auto;padding:10px 16px 120px}
#app.wide{max-width:980px}
button{font-family:inherit;color:inherit}
input,textarea{font-family:inherit;font-size:16px}
h2{font-size:1.6rem;margin:14px 0 4px;font-weight:700;line-height:1.3}
.sub{color:var(--mut);margin:0 0 10px;line-height:1.7;font-size:15px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.backbtn{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 14px;border-radius:12px;border:1.5px solid #E1E5EC;background:#fff;color:#111;font:700 .95rem/1 var(--font-d);cursor:pointer;text-decoration:none;white-space:nowrap}
.backbtn:focus-visible{outline:3px solid #FBC611;outline-offset:2px}
.aqfix{position:absolute;top:max(12px,env(safe-area-inset-top));inset-inline-start:12px;z-index:5}
.tag{font-size:13px;color:var(--p2);font-weight:800;background:var(--pl);padding:6px 12px;border-radius:999px}
.btn{display:block;width:100%;min-height:62px;border:1px solid var(--p);border-radius:14px;padding:10px 22px;font-size:1.12rem;font-weight:700;background:var(--p);color:#fff;cursor:pointer;margin-top:12px;box-shadow:0 6px 16px rgba(18,32,58,.12);transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:#fff;color:var(--p);border:1.5px solid var(--p);box-shadow:none}
.btn.end{background:var(--ink);border-color:var(--ink)}
.btn.end.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.02);background:var(--red)}}
.btn:disabled{opacity:.4;cursor:default}
.host-note{display:block;font-size:11px;font-weight:700;opacity:.7;margin-top:2px}
.card{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0;background:#fff;box-shadow:0 2px 10px rgba(18,32,58,.05)}
.card h3{margin:0 0 8px;font-size:17px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:12px;border:0;background:var(--pl);color:var(--p);font-size:22px;font-weight:900;cursor:pointer}
.stepper .v{min-width:58px;text-align:center;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:15px}
.chip.on{border-color:var(--p);background:var(--pl);color:var(--p2)}
.chip small{color:var(--mut);font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d9d3e2;cursor:pointer;position:relative;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--p)}
.sw.on::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;text-shadow:0 0 3px #000}
.swl{font-size:11px;color:var(--mut);text-align:center;margin-top:3px}
.swwrap{display:flex;flex-direction:column;align-items:center;width:52px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#FFF3D1;color:#875c00;vertical-align:middle}
.assume{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:#FFF3D1;color:#875c00;margin-inline-start:4px}
.timer{position:sticky;top:0;z-index:6;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);padding:8px 0 10px}
.trow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tlabel{font-weight:800;color:var(--mut);font-size:14px}
.tval{font-weight:900;font-size:22px;color:var(--p);font-variant-numeric:tabular-nums}
.tbar{height:8px;background:var(--pl);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--p);transition:width 1s linear;width:100%}
.timeup .tval{color:var(--red)} .timeup .tbar i{background:var(--red)}
.moneybar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.money{background:var(--pl);border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px;color:var(--p2)}
.money.alt{background:#EEF5FF;color:var(--blue)}
/* المقدمة */
.intro{text-align:center;min-height:calc(100svh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center}
.intro .logo svg{width:min(56vw,220px);height:auto;display:block}
.intro .aqlogo *{animation:none!important}
.gname{font-size:clamp(2.2rem,10vw,2.9rem);font-weight:800;color:var(--red);margin:6px 0 0}
.lead{max-width:34ch;color:var(--mut);font-size:1rem;line-height:1.9;margin:6px auto 0}
.intro .btn{margin-top:22px;max-width:320px;min-height:64px;font-size:1.3rem;font-weight:800;border-radius:99px}
.proto{margin-top:14px;font-size:12px;color:var(--mut)}
/* المزايا */
.perks{display:grid;gap:10px}
@media(min-width:720px){.perks{grid-template-columns:1fr 1fr}}
.perk{display:flex;align-items:center;gap:12px;text-align:start;border:2px solid var(--line);background:#fff;border-radius:18px;padding:12px;cursor:pointer}
.perk.on{border-color:var(--p);background:var(--pl)}
.perk .pi{font-size:26px}
.perk .pt{flex:1;display:flex;flex-direction:column;gap:2px}
.perk .pt small{color:var(--mut)}
.perk .pp{font-weight:800;font-size:14px;color:var(--p2);display:flex;flex-direction:column;align-items:flex-end}
.perk .pp small{font-size:10px;color:#875c00}
/* المتجر */
.store{border-radius:8px;border:7px solid;padding:10px;display:flex;flex-direction:column;align-items:center;aspect-ratio:1/1;cursor:pointer;position:relative;overflow:hidden}
.store .sname{font-weight:900;font-size:15px;text-align:center;line-height:1.3}
.store .sfeat{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
.store .sfeat svg{height:100%;max-height:140px;width:auto}
.store .sowner{font-size:12px;opacity:.85;font-weight:700}
.store .sbadges{position:absolute;top:6px;inset-inline-start:6px;font-size:13px}
.storebig{max-width:260px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
/* التصاميم */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.dcard{border:2px solid var(--line);background:#fff;border-radius:18px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.dcard.on{border-color:var(--p);background:var(--pl)}
.dcard svg{width:100%;height:120px}
.dcard b{font-size:14px} .dcard small{color:var(--mut);font-size:12px}
.preview{display:flex;justify-content:center;background:linear-gradient(180deg,#faf7fd,#f2ebf9);border-radius:22px;padding:10px;margin:8px 0}
.preview svg{height:230px;width:auto}
.field{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.field:focus{outline:2px solid var(--p);border-color:transparent}
.counter{font-size:12px;color:var(--mut);text-align:end;margin-top:4px}
.warn{background:#FFF0F1;color:#9b0616;border-radius:14px;padding:12px;font-weight:700;font-size:14px;margin:10px 0}
/* التحدث */
.speakers{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.spk{padding:6px 12px;border-radius:999px;background:#f3f1f5;font-weight:800;font-size:14px;color:var(--mut)}
.spk.now{background:var(--p);color:#fff}
.spk.done{text-decoration:line-through;opacity:.6}
.stage{text-align:center}
.stage .who{font-size:15px;color:var(--mut);font-weight:700}
.stage .who b{color:var(--ink);font-size:22px;display:block}
.desc{background:#faf8fc;border-radius:16px;padding:12px;line-height:1.8;font-size:15px;margin-top:10px}
/* النتائج */
.cat{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cat:last-child{border:0}
.cat .ci{font-size:26px;width:40px;text-align:center}
.cat .cn{flex:1} .cat .cn b{display:block} .cat .cn small{color:var(--mut)}
.cat .cp{font-weight:900;color:var(--p)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:20px 0 8px}
.pod{flex:1;max-width:120px;display:grid;justify-items:center;gap:4px;text-align:center;min-width:0}
.pod .md{font-size:2rem;line-height:1}
.pod .pn{font-weight:700;font-size:.95rem;overflow-wrap:anywhere}
.pod .ps{font-size:.85rem;color:#6B7489}
.pod .pb{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:center;font:800 1.5rem/1 system-ui,sans-serif;color:#fff}
.pod.g .pb{height:110px;background:linear-gradient(#F5C518,#D9A400)} .pod.s .pb{height:80px;background:linear-gradient(#CDD2DA,#9AA3AF)} .pod.b .pb{height:58px;background:linear-gradient(#DDA06B,#B0703C)}
.rest .row b{color:var(--p)}
/* عام */
.fab{position:fixed;bottom:16px;inset-inline-start:16px;z-index:8;border:0;border-radius:999px;padding:11px 16px;background:#FFF3D1;color:#6d4a00;font-weight:800;box-shadow:0 4px 18px rgba(0,0,0,.12);cursor:pointer;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(25,10,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px 28px}
@media(min-width:720px){.modal{align-items:center}.sheet{border-radius:24px}}
.sheet h3{margin:4px 0 10px;font-size:20px}
.sheet ol{padding-inline-start:20px;line-height:1.9;font-size:15px;margin:0}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:16px;padding:8px;margin:8px 0}
.item svg{width:70px;height:96px}
.item .in{flex:1}
.item .in small{color:var(--mut);display:block}
.item .buy{border:0;border-radius:12px;padding:10px 14px;font-weight:800;background:var(--p);color:#fff;cursor:pointer}
.item .buy:disabled{background:#ddd;color:#777}
.old{text-decoration:line-through;color:var(--mut);font-size:12px;margin-inline-start:4px}

html[dir=ltr] .stepper{flex-direction:row-reverse}
.money.link{border:0;cursor:pointer;font:inherit;font-weight:800}
.house{width:100%;height:auto;display:block}
.preview .house{height:170px;width:auto}
.prop{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:16px;padding:8px;margin:8px 0 4px;background:#fff}
.prop .pv{width:88px;flex:none;background:#F4FAF6;border-radius:12px;padding:4px}
.prop .pi2{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.prop .pi2 b{font-family:var(--font-d);font-size:.98rem}
.prop .pi2 small{color:var(--mut);font-size:.82rem}
.askbox{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.askbox small{color:var(--mut);font-size:.75rem}
.stepper.sm button{width:30px;height:30px;font-size:18px;border-radius:9px}
.stepper.sm .v{min-width:64px;font-size:.88rem}
.pbadges{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.pbadges span{font-size:.72rem;font-weight:700;background:#FFF3D1;color:#875c00;border-radius:99px;padding:2px 8px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.mini{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font:700 .85rem var(--font);cursor:pointer;color:var(--ink)}
.mini.ok{background:var(--p);border-color:var(--p);color:#fff}
.mini:disabled{opacity:.4;cursor:default}
.deal{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:8px;margin:8px 0}
.deal.mine{border-color:var(--p);background:var(--pl)}
.deal .dv{width:64px;flex:none}
.deal .di{flex:1;min-width:0;display:flex;flex-direction:column}
.deal .di small{color:var(--mut)}
.deal .da{display:flex;flex-direction:column;gap:6px;flex:none}
.shield{font-size:.8rem;font-weight:800;color:#0554A4}
.note{background:#F4FAF6;border:1px solid #D3EBDD;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.92rem;line-height:1.7}
.note .mini{margin-inline-start:6px}
.empty{color:var(--mut);font-size:.92rem;padding:6px 0}
.total{margin:12px 0 0;font-size:1.05rem}
.total b{color:var(--p);font-family:var(--font-d);font-size:1.2rem}
.perkrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.perkrow:last-child{border:0}
.perkrow .pi{font-size:24px}
.perkrow .pt{flex:1;display:flex;flex-direction:column}
.perkrow .pt small{color:var(--mut);font-size:.82rem}
.perkrow.used{opacity:.5}
.usedtag{font-size:.8rem;font-weight:800;color:var(--mut)}
.where{font-size:.75rem;color:var(--mut);max-width:110px;text-align:end}
.votebtn{display:block;width:100%;text-align:start;border:2px solid var(--line);background:#fff;border-radius:16px;padding:16px;margin:8px 0;font:700 1.05rem var(--font-d);cursor:pointer}
.votebtn.on{border-color:var(--p);background:var(--pl);color:var(--p2)}
.orow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.lbl{display:block;font-weight:700;margin:10px 0 6px}
select.field{appearance:auto}
.ptitle{font-family:var(--font-d);font-weight:800;font-size:1.25rem}
.card.big{text-align:center}
.preview{background:linear-gradient(180deg,#F6FBF8,#E9F5EE)!important}
</style>
</head>

const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => `${Math.round(v)} ${N(CONFIG.currency)}`;
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const byId = (arr,id) => arr.find(x=>x.id===id);
const roundTo = v => Math.max(CONFIG.priceStep, Math.round(v/CONFIG.priceStep)*CONFIG.priceStep);
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ============================ العقار ============================ */
function specValue(sp){
  let v = (byId(CONFIG.areas,sp.area)||{price:0}).price + (byId(CONFIG.lands,sp.land)||{price:0}).price
        + sp.floors*CONFIG.floorPrice + (byId(CONFIG.styles,sp.style)||{price:0}).price;
  sp.extras.forEach(e=>{ v += (byId(CONFIG.extras,e)||{price:0}).price; });
  return v;
}
const value = pr => specValue(pr);
const owned = p => S.props.filter(x=>x.owner===p.id);
const wealth = p => p.budget + owned(p).reduce((a,x)=>a+value(x),0);
const pname = id => S.players[id].name;
const office = id => L('مكتب ','') + S.players[id].name + L('','’s office');
function propTitle(pr){ return `${N(byId(CONFIG.areas,pr.area).name)} • ${N(byId(CONFIG.lands,pr.land).name)}`; }
function propSpecs(pr){
  return `${pr.floors} ${L(pr.floors===1?'دور':'أدوار', pr.floors===1?'floor':'floors')} • ${N(byId(CONFIG.styles,pr.style).name)}${pr.extras.length?' • '+pr.extras.map(e=>byId(CONFIG.extras,e).icon).join(' '):''}`;
}

// رسمة بيت بسيطة حسب المواصفات
function houseSVG(sp){
  const STY = {modern:{wall:'#E9EDF1',roof:'flat',win:'#2B3A4A'}, classic:{wall:'#EAD9B8',roof:'pitch',win:'#5B4A2E'},
               heritage:{wall:'#D8B98A',roof:'crenel',win:'#6B4E2A'}, minimal:{wall:'#FAFAFA',roof:'flat',win:'#9AA5B1'}};
  const st = STY[sp.style] || STY.modern;
  const f = Math.max(1, Math.min(CONFIG.maxFloors, sp.floors||1));
  const fh = 18, w = 70, x = 45, base = 112, top = base - f*fh;
  let s = `<rect x="0" y="${base}" width="160" height="8" fill="#CFE6D6"/>`;
  s += `<rect x="${x}" y="${top}" width="${w}" height="${f*fh}" fill="${st.wall}" stroke="#12203A" stroke-width="1.6"/>`;
  for(let i=0;i<f;i++){ const y=top+i*fh+5; s += `<rect x="${x+9}" y="${y}" width="11" height="9" fill="${st.win}"/><rect x="${x+w-20}" y="${y}" width="11" height="9" fill="${st.win}"/>`; if(i<f-1) s+=`<rect x="${x+w/2-5}" y="${y}" width="10" height="9" fill="${st.win}"/>`; }
  s += `<rect x="${x+w/2-6}" y="${base-14}" width="12" height="14" fill="#1E8A4C"/>`;
  if(st.roof==='pitch') s += `<path d="M${x-6} ${top} L${x+w/2} ${top-20} L${x+w+6} ${top} Z" fill="#B5543A" stroke="#12203A" stroke-width="1.6" stroke-linejoin="round"/>`;
  else if(st.roof==='crenel'){ for(let i=0;i<5;i++) s += `<rect x="${x+2+i*14}" y="${top-6}" width="8" height="6" fill="${st.wall}" stroke="#12203A" stroke-width="1.4"/>`; }
  else s += `<rect x="${x-4}" y="${top-4}" width="${w+8}" height="4" fill="#12203A"/>`;
  if(sp.extras.includes('garden')) s += `<circle cx="22" cy="${base-10}" r="10" fill="#3FA65F"/><rect x="20.5" y="${base-4}" width="3" height="5" fill="#7A5230"/><circle cx="34" cy="${base-6}" r="6" fill="#56B873"/>`;
  if(sp.extras.includes('pool')) s += `<rect x="122" y="${base-5}" width="32" height="7" rx="3" fill="#5BC0EB" stroke="#2F8FC0"/>`;
  if(sp.extras.includes('elevator')) s += `<rect x="${x+w-4}" y="${top}" width="6" height="${f*fh}" fill="#C9D2DC" stroke="#12203A" stroke-width="1"/>`;
  if(sp.extras.includes('parking')) s += `<rect x="124" y="${base-20}" width="24" height="11" rx="3" fill="#E4572E"/><circle cx="130" cy="${base-8}" r="2.5" fill="#12203A"/><circle cx="142" cy="${base-8}" r="2.5" fill="#12203A"/>`;
  return `<svg viewBox="0 0 160 122" class="house">${s}</svg>`;
}

const T = {left:0,total:0,id:null};
const PHASES = {
  setup:{name:{ar:'تجهيز المكتب',en:'Office setup'}, key:'setupTime'},

function startTimer(sec){ stopTimer(); T.total=sec; T.left=sec; T.id=setInterval(()=>{ T.left--; if(T.left<=0){T.left=0;stopTimer();} updTimer(); },1000); updTimer(); }
function stopTimer(){ if(T.id){clearInterval(T.id);T.id=null;} }
function startPhaseTimer(){ stopTimer(); if(S.phase) startTimer(S.settings[PHASES[S.phase].key]); }
const timerHTML = () => `<div class="timer" id="timerBox"><div class="trow"><span class="tlabel">⏳ ${N(PHASES[S.phase].name)}</span><span class="tval" id="tval"></span></div><div class="tbar"><i id="tbar"></i></div></div>`;
function updTimer(){
  const v=$('tval'); if(!v) return;
  v.textContent = T.left>0 ? fmt(T.left) : L('انتهى الوقت ⏰','Time’s up ⏰');
  $('tbar').style.width = (T.total? T.left/T.total*100 : 0)+'%';
  $('timerBox').classList.toggle('timeup', T.left<=0);
  const eb=$('endBtn'); if(eb) eb.classList.toggle('pulse', T.left<=0);
}
const endBtn = (label, fn) => `<button class="btn end" id="endBtn" onclick="${fn}">${L('إنهاء','End')} (${label})<span class="host-note">${L('يظهر للمضيف فقط','Host only')}</span></button>`;

/* ============================ التنقل ============================ */
function go(screen, phase){
  S.history.push({screen:S.screen, phase:S.phase});
  S.screen = screen;
  if(phase!==undefined && phase!==S.phase){ S.phase=phase; startPhaseTimer(); }
  render(); window.scrollTo(0,0);
}
function back(){
  if(!S.history.length) return;
  const prev = S.history[S.history.length-1];
  const doBack = ()=>{ S.history.pop(); S.screen=prev.screen; S.modal=null; if(prev.phase!==S.phase){ S.phase=prev.phase; startPhaseTimer(); } render(); window.scrollTo(0,0); };
  if(prev.screen!==S.screen && S.screen!=='setup' && S.screen!=='perks') askConfirm(L('ترجع الكل للمرحلة السابقة؟ (المضيف فقط)','Take everyone back to the previous stage? (host only)'), doBack);
  else doBack();
}
const BACK = L('→ رجوع','← Back');
function hdr(extra=''){ const show = S.history.length && S.screen!=='results'; return `<div class="top">${show?`<button class="backbtn" onclick="back()">${BACK}</button>`:'<span></span>'}${extra}</div>`; }
function myBar(){
  const p = me(), left = p.perks.filter(k=>!p.used.includes(k)).length;
  return `<div class="moneybar"><span class="money">💰 ${L('ميزانيتك','Your budget')}: ${money(p.budget)}</span><span class="money alt">🏠 ${owned(p).length}</span><span class="money alt">✨ ${L('مزايا باقية','Perks left')}: ${left}</span><button class="money link" onclick="openOffices()">📊 ${L('المكاتب','Offices')}</button></div>`;
}

function bump(key,dir){
  const m=STEP_META[key];
  const min=m.time?CONFIG.timer.min:m.min(), max=m.time?CONFIG.timer.max:m.max(), step=m.time?CONFIG.timer.step:m.step();
  S.settings[key]=Math.min(max,Math.max(min,S.settings[key]+dir*step));
  if(key==='players') S.settings.presenters=Math.min(S.settings.presenters,S.settings.players);
  render();
}
const stepRow = key => { const m=STEP_META[key], v=S.settings[key];
  return `<div class="row"><span>${N(m.label)}</span><div class="stepper"><button onclick="bump('${key}',1)">+</button><span class="v">${m.time?fmt(v):m.money?money(v):v}</span><button onclick="bump('${key}',-1)">−</button></div></div>`; };

function startGame(){
  const n=S.settings.players, names=shuffle(BOT_NAMES[LANG]).slice(0,n-1);
  PROPID=0; S.props=[]; S.deals=[]; S.offers=[]; S.holds=[]; S.rentals=[]; S.round=0; S.spoken=[]; S.presentedIds=[]; S.suspended={}; S.protectedRound={}; S.results=null;
  S.players=[newPlayer(0, S.settings.hostName.trim()||L('أنت','You'), false), ...names.map((nm,i)=>newPlayer(i+1,nm,true))];
  S.players.slice(1).forEach(botSetup);
  S.draft = {area:CONFIG.areas[0].id, land:CONFIG.lands[0].id, floors:1, style:CONFIG.styles[0].id, extras:[]};
  go('perks','setup');
}
function botSetup(p){
  shuffle(PERKS).slice(0, rand(1,CONFIG.maxPerks)).forEach(k=>{ if(p.budget>=CONFIG.perkPrice){ p.budget-=CONFIG.perkPrice; p.perks.push(k.id); } });
  const count = rand(1, CONFIG.maxPropsAtStart);
  for(let i=0;i<count;i++){
    const sp = {area:pick(CONFIG.areas).id, land:pick(CONFIG.lands).id, floors:rand(1,CONFIG.maxFloors), style:pick(CONFIG.styles).id, extras:shuffle(CONFIG.extras).slice(0,rand(0,2)).map(e=>e.id)};
    const v = specValue(sp);
    if(p.budget >= v){ p.budget -= v; const pr=newProp(p.id,sp); pr.asking = roundTo(v*(1+rand(0,30)/100)); S.props.push(pr); }
  }
}

function togglePerk(id){
  const p=me(), i=p.perks.indexOf(id);
  if(i>=0){ p.perks.splice(i,1); p.budget+=CONFIG.perkPrice; }
  else if(p.perks.length>=CONFIG.maxPerks) toast(L(`تقدر تختار ${CONFIG.maxPerks} مزايا بس`,`You can pick only ${CONFIG.maxPerks} perks`));
  else if(p.budget<CONFIG.perkPrice) toast(L('الميزانية ما تكفي','Not enough budget'));
  else { p.budget-=CONFIG.perkPrice; p.perks.push(id); }
  render();
}

function buyProp(){
  const p=me(), v=specValue(S.draft);

function startRound(r){
  S.round=r; S.offers=[]; S.roundDone=[];
  // الإيجار: تنخصم الأجرة بداية كل جولة
  S.rentals.forEach(x=>{ if(x.left>0 && x.startRound<r){ const rn=S.players[x.renter], ow=S.players[byId(S.props,x.propId)?.owner ?? x.owner]; const amt=Math.min(rn.budget,x.per); rn.budget-=amt; ow.budget+=amt; x.left--; } });
  go('pre', null);
}

function startPitches(){
  const eligible = S.players.filter(p=>!isSusp(p.id) && owned(p).length).map(p=>p.id);
  const k = Math.min(S.settings.presenters, eligible.length);
  let pool = eligible.filter(id=>!S.spoken.includes(id));
  let picks = shuffle(pool).slice(0,k);
  if(picks.length<k){ S.spoken=S.spoken.filter(id=>!eligible.includes(id)); picks=picks.concat(shuffle(eligible.filter(id=>!picks.includes(id))).slice(0,k-picks.length)); }
  S.spoken.push(...picks);
  S.presenters = picks.map(id=>({id, prop: id===0 ? null : pick(owned(S.players[id])).id}));
  S.pIdx = 0; S.negotiatorRound = null;
  if(!picks.length){ toast(L('ما أحد عنده عقار يعرضه — نروح للصفقات','Nobody has a property to pitch — going to deals')); startDeals(); return; }
  picks.forEach(id=>{ if(!S.presentedIds.includes(id)) S.presentedIds.push(id); });
  go('pitch','pitch');
}

      if(pr.owner===0){ if(!S.offers.find(o=>o.propId===pr.id)) S.offers.push({id:Date.now()+Math.random(), propId:pr.id, buyer:b.id, price:roundTo(pr.asking*(0.85+Math.random()*0.2))}); }

}

function endDeals(){
  // العربون اللي ما انشرى: يروح للبايع
  S.holds.filter(h=>h.round===S.round-1).forEach(h=>{ S.players[h.seller].budget+=h.amount; });
  S.holds=S.holds.filter(h=>h.round>=S.round);
  const done=[];
  S.deals.filter(d=>d.status==='pending').forEach(d=>{
    const pr=byId(S.props,d.propId), b=S.players[d.buyer], s=S.players[d.seller];
    const pay = d.price-(d.credit||0);

    b.budget-=pay; s.budget+=d.price; // العربون (إن وجد) ينحسب من السعر ويوصل للبايع

    pr.owner=b.id; pr.cost=d.price; pr.asking=b.isBot?roundTo(d.price*1.15):d.price;

const PERK_WHERE = {budgetUp:'any', budgetDown:'any', protect:'any', addons:'any', violation:'pre', negotiator:'pitch', outbid:'row', glitch:'row', hijack:'row', deposit:'row', rent:'row'};

    else if(w==='any' || (w==='pre'&&ctx==='pre')) ctl=`<button class="mini ok" onclick="usePerk('${id}')">${L('استخدم','Use')}</button>`;
    else ctl=`<small class="where">${w==='pre'?L('قبل بداية الجولة','before a round'):w==='pitch'?L('وقت عرضك','during your pitch'):id==='hijack'?L('من ملخص الجولة','from the round summary'):L('من قائمة الصفقات/السوق','from deals/market')}</small>`;
    return `<div class="perkrow ${used?'used':''}"><span class="pi">${k.icon}</span><span class="pt"><b>${N(k.name)}</b><small>${k.effect()}</small></span>${ctl}</div>`;
  }).join('')}</div>`;
}
function usePerk(id, target){
  const k=byId(PERKS,id), p=me();
  if(!perkLeft(p,id)) return;
  let inputs='';
  const others = S.players.filter(x=>x.id!==0);
  if(id==='budgetDown' || id==='violation') inputs = `<label class="lbl">${L('اختر المكتب','Choose the office')}</label><select id="pt" class="field">${others.map(o=>`<option value="${o.id}">${esc(office(o.id))} — ${money(o.budget)}</option>`).join('')}</select>`;
  if(id==='addons'){
    if(!owned(p).length){ toast(L('ما عندك عقار','You have no property')); return; }
    inputs = `<label class="lbl">${L('العقار','Property')}</label><select id="pt" class="field">${owned(p).map(pr=>`<option value="${pr.id}">${propTitle(pr)}</option>`).join('')}</select>
      <label class="lbl">${L('التجهيز','Fitting')}</label><select id="px" class="field">${CONFIG.extras.map(e=>`<option value="${e.id}">${e.icon} ${N(e.name)} — ${money(e.price)}</option>`).join('')}</select>`;
  }
  if(id==='outbid' || id==='hijack'){
    const d=S.deals.find(x=>x.id===target); S.perkPrice=roundTo(d.price+CONFIG.priceStep);
    inputs = `<div class="note">${propTitle(byId(S.props,d.propId))} — ${L('السعر الحالي','current price')} ${money(d.price)}</div><label class="lbl">${L('عرضك','Your offer')}</label><div class="stepper"><button onclick="S.perkPrice+=CONFIG.priceStep;$('ppv').textContent=money(S.perkPrice)">+</button><span class="v" id="ppv">${money(S.perkPrice)}</span><button onclick="S.perkPrice=Math.max(${roundTo(d.price+CONFIG.priceStep)},S.perkPrice-CONFIG.priceStep);$('ppv').textContent=money(S.perkPrice)">−</button></div>`;
  }
  if(id==='glitch'){ const d=S.deals.find(x=>x.id===target); inputs=`<div class="note">${propTitle(byId(S.props,d.propId))} — ${esc(pname(d.seller))} ${L('←','→')} ${esc(pname(d.buyer))} • ${money(d.price)}</div>`; }
  if(id==='deposit'||id==='rent'){ const pr=byId(S.props,target); inputs=`<div class="note">${propTitle(byId(S.props,target))} — ${esc(office(pr.owner))} • ${money(pr.asking)}</div>`; }
  S.modal={type:'perk', id, target, inputs}; renderModal();
}
function applyPerk(){
  const m=S.modal, id=m.id, p=me(), sel=$('pt')?.value, sel2=$('px')?.value;
  const consume=()=>{ p.used.push(id); };
  if(id==='budgetUp'){ p.budget+=CONFIG.budgetUpAmount; consume(); toast(L(`+${money(CONFIG.budgetUpAmount)} لميزانيتك`,`+${money(CONFIG.budgetUpAmount)} to your budget`)); }
  if(id==='budgetDown'){ const o=S.players[+sel]; o.budget=Math.max(0,o.budget-CONFIG.budgetDownAmount); consume(); toast(L(`نقصت ميزانية ${o.name}`,`${o.name}’s budget was cut`)); }
  if(id==='violation'){ S.suspended[+sel]=S.round; consume(); toast(L(`${office(+sel)} موقوف هالجولة`,`${office(+sel)} is suspended this round`)); }
  if(id==='protect'){ S.protectedRound[0]=S.round; consume(); toast(L('أنت محمي هالجولة 🛡','You are protected this round 🛡')); }
  if(id==='negotiator'){ S.negotiatorRound=0; consume(); toast(L('المفاوض معك 🧑‍💼','The negotiator is with you 🧑‍💼')); }
  if(id==='addons'){ const pr=byId(S.props,+sel), e=byId(CONFIG.extras,sel2);
    if(pr.extras.includes(e.id)){ toast(L('العقار فيه هالتجهيز','Already has this fitting')); return; }
    if(p.budget<e.price){ toast(L('الميزانية ما تكفي','Not enough budget')); return; }
    p.budget-=e.price; pr.extras.push(e.id); pr.cost+=e.price; consume(); toast(L(`انضاف ${N(e.name)} — زادت القيمة`,`${N(e.name)} added — value up`)); }
  if(id==='glitch'){ const d=S.deals.find(x=>x.id===m.target); d.status='cancelled'; consume(); toast(L('انلغت البيعة ورجع العقار لصاحبه','Deal cancelled; property back with its owner')); }
  if(id==='outbid'){ const d=S.deals.find(x=>x.id===m.target);
    if(S.perkPrice>p.budget){ toast(L('الميزانية ما تكفي','Not enough budget')); return; }
    d.buyer=0; d.price=S.perkPrice; consume();
    const rival = S.players.find(b=>b.isBot && b.id!==d.seller && !isSusp(b.id) && b.budget>=d.price+CONFIG.priceStep && Math.random()<.3);
    if(rival){ d.buyer=rival.id; d.price+=CONFIG.priceStep; toast(L(`${rival.name} زاد عليك بـ ${money(d.price)}`,`${rival.name} raised to ${money(d.price)}`)); }
    else toast(L('البيعة صارت لك بالسعر الجديد','The deal is now yours at the new price')); }
  if(id==='hijack'){ const d=S.deals.find(x=>x.id===m.target), pr=byId(S.props,d.propId), first=S.players[d.buyer], s=S.players[d.seller];
    if(S.perkPrice>p.budget){ toast(L('الميزانية ما تكفي','Not enough budget')); return; }
    p.budget-=S.perkPrice; s.budget+=S.perkPrice; s.budget-=d.price; first.budget+=d.price; // تعويض مؤقت
    s.profit += S.perkPrice-d.price; first.deals=Math.max(0,first.deals-1); p.deals++;
    pr.owner=0; pr.cost=S.perkPrice; pr.asking=S.perkPrice; d.buyer=0; d.price=S.perkPrice; consume();
    toast(L('خطفت الصفقة — العقار صار لك','Deal hijacked — the property is yours')); }
  if(id==='deposit'){ const pr=byId(S.props,m.target);
    if(p.budget<CONFIG.depositAmount){ toast(L('الميزانية ما تكفي','Not enough budget')); return; }
    p.budget-=CONFIG.depositAmount; S.holds.push({propId:pr.id, holder:0, seller:pr.owner, amount:CONFIG.depositAmount, price:pr.asking, round:S.round}); consume();
    toast(L('دفعت العربون — بالجولة الجاية تشتريه أو تخسره','Deposit paid — buy next round or lose it')); }
  if(id==='rent'){ const pr=byId(S.props,m.target); consume();
    if(Math.random()<.4) toast(L(`${pname(pr.owner)} رفض الإيجار — راحت الميزة`,`${pname(pr.owner)} refused — the perk is lost`));
    else { S.rentals.push({propId:pr.id, renter:0, owner:pr.owner, per:CONFIG.rentPerRound, left:CONFIG.rentRounds, startRound:S.round}); toast(L('تم الإيجار 🔑','Rent agreed 🔑')); } }
  closeModal(); render();
}

/* ---------- التصويت ---------- */
function vote(id){ S.voteChoice=id; render(); }
function endVote(){
  if(S.voteChoice!==null) S.players[S.voteChoice].votes++;
  S.players.filter(b=>b.isBot).forEach(b=>{ const c=S.presentedIds.filter(id=>id!==b.id); if(c.length) S.players[pick(c)].votes++; });
  computeScores(); go('results', null);
}
SCREENS.vote = () => { const cands=S.presentedIds.filter(id=>id!==0); return `
${hdr()}
${timerHTML()}
<h2>🎤 ${L('صوّت لأفضل إقناع','Vote for the best pitch')}</h2>
<p class="sub">${L('مين أفضل واحد عرض وسوّق؟ صوت واحد، وما تقدر تصوت لنفسك.','Who pitched and marketed best? One vote, and not for yourself.')}</p>
${cands.length?cands.map(id=>`<button class="votebtn ${S.voteChoice===id?'on':''}" onclick="vote(${id})">${esc(office(id))}${S.voteChoice===id?' ✓':''}</button>`).join(''):`<div class="empty">${L('ما في أحد غيرك عرض.','Nobody else pitched.')}</div>`}
${endBtn(L('الذهاب للنتائج','go to Results'),'endVote()')}`; };

/* ---------- النتائج ---------- */
function computeScores(){
  S.players.forEach(p=>{p.score=0;});
  S.results = CATS.map(c=>{
    const rows = S.players.map(p=>({p, v:c.metric(p)})).sort((a,b)=>b.v-a.v);
    rows.forEach(r=>{ const rank = 1 + rows.filter(o=>o.v>r.v).length; r.rank=rank; r.pts = CONFIG.rankPoints[rank-1]||0; r.p.score+=r.pts; });
    return {c, rows};
  });
}
SCREENS.results = () => {
  const ranked=[...S.players].sort((a,b)=> b.score-a.score || wealth(b)-wealth(a));
  const [g,s,b]=ranked, MED={1:'🥇',2:'🥈',3:'🥉'};
  const pod=(p,cls,n)=>p?`<div class="pod ${cls}"><div class="md">${MED[n]}</div><div class="pn">${esc(p.name)}</div><div class="ps">${p.score} ${L('نقطة','pts')}</div><div class="pb">${n}</div></div>`:'';
  const fv=(c,v)=>c.money?money(v):v;
  return `
${hdr(`<span class="tag">${L('النتائج','Results')}</span>`)}
<h2>🏆 ${L('النتائج','Results')}</h2>
<div class="podium">${pod(s,'s',2)}${pod(g,'g',1)}${pod(b,'b',3)}</div>
${ranked.length>3?`<div class="card rest">${ranked.slice(3).map((p,i)=>`<div class="row"><span>${i+4}. ${esc(p.name)}</span><b>${p.score}</b></div>`).join('')}</div>`:''}
<p class="sub">${L('التعادل بالمجموع: يفوز صاحب الثروة النهائية الأعلى.','Tie on total: higher final wealth wins.')}</p>
${S.results.map(r=>`<div class="card"><h3>${r.c.icon} ${N(r.c.name)} <small style="color:var(--mut)">— ${N(r.c.hint)}</small></h3>
  ${r.rows.map(x=>`<div class="row"><span>${x.rank}. ${esc(x.p.name)} <small style="color:var(--mut)">${fv(r.c,x.v)}</small></span><b>+${x.pts}</b></div>`).join('')}</div>`).join('')}
<button class="btn" onclick="newGame()">${L('لعبة جديدة','New game')}</button>`;
};
function newGame(){ stopTimer(); newState(S.settings); S.screen='setup'; render(); window.scrollTo(0,0); }

/* ============================ النوافذ ============================ */
let confirmFn=null;
function askConfirm(text,fn){ confirmFn=fn; S.modal={type:'confirm',text}; renderModal(); }
function confirmYes(){ const f=confirmFn; confirmFn=null; closeModal(); if(f) f(); }
function openAssumptions(){ S.modal={type:'assume'}; renderModal(); }
function openOffices(){ S.modal={type:'offices'}; renderModal(); }
function closeModal(){ S.modal=null; renderModal(); }
function renderModal(){
  const root=$('modalRoot'), m=S.modal;
  if(!m){ root.innerHTML=''; return; }
  let inner='';
  if(m.type==='assume') inner=`<h3>📝 ${L('افتراضات وقرارات تحتاج اعتماد','Assumptions & decisions to approve')}</h3><p class="sub">${L('كلها تتعدل من CONFIG في أول السكربت.','All editable in CONFIG at the top of the script.')}</p><ol>${ASSUMPTIONS[LANG].map(a=>`<li>${a}</li>`).join('')}</ol><button class="btn" onclick="closeModal()">${L('تمام','OK')}</button>`;
  if(m.type==='confirm') inner=`<h3>${m.text}</h3><button class="btn" onclick="confirmYes()">${L('إيه، رجّع','Yes, go back')}</button><button class="btn ghost" onclick="closeModal()">${L('لا','No')}</button>`;
  if(m.type==='offices') inner=`<h3>📊 ${L('المكاتب','Offices')}</h3><div class="otable">${S.players.map(p=>`<div class="orow"><b>${esc(office(p.id))}${p.id===0?L(' (أنت)',' (you)'):''}${isSusp(p.id)?' ⛔':''}${isProt(p.id)?' 🛡':''}</b>
    <span>💰 ${money(p.budget)}</span><span>🏠 ${owned(p).length}</span><span>✨ ${p.perks.filter(k=>!p.used.includes(k)).length}/${p.perks.length}</span></div>`).join('')}</div>
    <p class="sub">${L('✨ = المزايا الباقية. أنواع مزايا الباقين سرية.','✨ = perks left. Others’ perk types stay secret.')}</p><button class="btn" onclick="closeModal()">${L('تمام','OK')}</button>`;
  if(m.type==='offer'){ const pr=byId(S.props,m.pid); inner=`<h3>🤝 ${L('سجّل العرض المتفق عليه','Record the agreed offer')}</h3>
    <div class="preview">${houseSVG(pr)}</div><div class="note">${propTitle(pr)} — ${esc(office(pr.owner))} • ${L('السعر المطلوب','asking')} ${money(pr.asking)}</div>
    <div class="row"><span>${L('عرضك','Your offer')}</span><div class="stepper"><button onclick="bumpOffer(1)">+</button><span class="v">${money(m.price)}</span><button onclick="bumpOffer(-1)">−</button></div></div>
    <button class="btn" onclick="sendOffer()">${L('أرسل العرض','Send offer')}</button><button class="btn ghost" onclick="closeModal()">${L('إلغاء','Cancel')}</button>`; }
  if(m.type==='perk'){ const k=byId(PERKS,m.id); inner=`<h3>${k.icon} ${L('تأكيد استخدام','Confirm')}: ${N(k.name)}</h3>
    <div class="note"><b>${L('الأثر','Effect')}:</b> ${k.effect()}</div>
    <div class="note"><b>${L('سعرها','Price')}:</b> ${money(CONFIG.perkPrice)} ${L('(مدفوع وقت الشراء) — تُستخدم مرة وحدة بس','(paid when bought) — single use only')}</div>
    ${m.inputs}
    <button class="btn" onclick="applyPerk()">${L('أكّد واستخدمها','Confirm & use')}</button><button class="btn ghost" onclick="closeModal()">${L('إلغاء','Cancel')}</button>`; }
  root.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${inner}</div></div>`;
}

/* ============================ العرض ============================ */
function render(){
  $('app').innerHTML = SCREENS[S.screen]();
  const ls=$('langsw'); if(ls) ls.hidden = !(S.screen==='intro'||S.screen==='setup');
  updTimer(); renderModal();
}
newState(); render();

</script>
</body>
