<style>
:root{

  --p2:#14653A;
  --pl:#EAF6EF;
  --red:#DE0921;    /* لون اسم اللعبة في صفحة المقدمة (نفس باقي ألعاب أقنعني) */

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font);line-height:1.65}
h2,h3,.btn,.gname,.tval,.nm,.stepper .v,.sname{font-family:var(--font-d)}

button{font-family:inherit;color:inherit}
input,textarea{font-family:inherit;font-size:16px}
h2{font-size:1.6rem;margin:14px 0 4px;font-weight:700;line-height:1.3}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}

.aqfix{position:absolute;top:max(12px,env(safe-area-inset-top));inset-inline-start:12px;z-index:5}
.tag{font-size:13px;color:var(--p2);font-weight:800;background:var(--pl);padding:6px 12px;border-radius:999px}
.btn{display:block;width:100%;min-height:62px;border:1px solid var(--p);border-radius:14px;padding:10px 22px;font-size:1.12rem;font-weight:700;background:var(--p);color:#fff;cursor:pointer;margin-top:12px;box-shadow:0 6px 16px rgba(18,32,58,.12);transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:#fff;color:var(--p);border:1.5px solid var(--p);box-shadow:none}
.tctl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tctl .btn{min-height:52px;font-size:1rem;padding:8px 10px}
.btn.end{background:var(--ink);border-color:var(--ink)}
.btn.end.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.02);background:var(--red)}}
.btn:disabled{opacity:.4;cursor:default}
.host-note{display:block;font-size:11px;font-weight:700;opacity:.7;margin-top:2px}
.card{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0;background:#fff;box-shadow:0 2px 10px rgba(18,32,58,.05)}
.card h3{margin:0 0 8px;font-size:17px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}

.stepper button{width:38px;height:38px;border-radius:12px;border:0;background:var(--pl);color:var(--p);font-size:22px;font-weight:900;cursor:pointer}

.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d9d3e2;cursor:pointer;position:relative;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--p)}

.sticky{position:sticky;top:0;z-index:6;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin:0 -16px 8px;padding:6px 16px 8px;box-shadow:0 6px 14px -10px rgba(18,32,58,.25)}
.sticky .timer{position:static;padding:2px 0 6px;background:none;backdrop-filter:none}
.dock{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.dock .dk{border:1.5px solid #D5DBE5;background:#fff;border-radius:14px;padding:5px 2px 4px;font:700 11.5px/1.25 var(--font);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}

const CODE_CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const app = document.getElementById('app');

let db = null, ME_ID = null, G = null, ME = null, INP = {};
let skew = null, hostOn = false, unsubRoom = null, unsubInp = null, hostTick = null, seq = 0;
const U = { splash: true, ready: false, view: 'home', modal: null, draft: {}, err: '', lastKey: '', lastHtml: '',
  code: '', name: '', busy: false, offline: '', fromLink: false, notice: false, logN: -1, logG: -1 };

/* ---------- أدوات ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = p => p + (++seq) + Math.random().toString(36).slice(2, 7);
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const P = id => (G && (G.players.find(p => p.id === id) || (G.hostP && G.hostP.id === id && G.hostP))) || { id, name: L('لاعب', 'Player') };
const inRoom = id => !!(G && G.players.some(p => p.id === id));
const isHost = () => !!(G && ME_ID && G.host === ME_ID);
const nowH = () => (isHost() ? Date.now() : Date.now() - (skew || 0));
const inp = id => (id === ME_ID ? ME : INP[id]) || {};
const amPlayer = () => inRoom(ME_ID);
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
function lsGet() { try { return JSON.parse(localStorage.getItem(LSK_()) || '{}') || {}; } catch (e) { return {}; } }
function lsSet(o) { try { localStorage.setItem(LSK_(), JSON.stringify(Object.assign(lsGet(), o))); } catch (e) { } }

/* ---------- قفل فترة التجربة ---------- */
const isGuest = () => { try { return localStorage.getItem('aqnieni.guest') === '1'; } catch (e) { return false; } };
const markGuest = () => { try { localStorage.setItem('aqnieni.guest', '1'); } catch (e) { } document.documentElement.classList.add('aqguest'); };
if (isGuest()) document.documentElement.classList.add('aqguest');
const lockCard = () => `<section class="card" style="text-align:center"><h3>${L('فترة تجريبية', 'Trial period')}</h3><p class="sub">${L('ادخل عن طريق رابط الدعوة من المضيف.', 'Join using the host’s invite link.')}</p></section>`;

/* ---------- التخزين ---------- */
const roomPath = c => GAME.key + '/' + c;
const inpPath = (c, id) => GAME.key + '/' + c + '/inputs/' + id;
let pubBusy = false, pubDirty = false, pubT = null;
function publish() { if (!isHost() || !db) return; clearTimeout(pubT); pubT = setTimeout(flushRoom, 40); }
async function flushRoom() {
  if (!isHost() || !db) return;
  if (pubBusy) { pubDirty = true; return; }
  pubBusy = true;
  try { G.rev = (G.rev || 0) + 1; G.sentAt = Date.now(); await db.doc(roomPath(G.code)).set(clone(G)); U.offline = ''; }
  catch (e) { writeFailed(e); }
  pubBusy = false;
  if (pubDirty) { pubDirty = false; flushRoom(); }
}
async function flushDirect() { try { G.rev = (G.rev || 0) + 1; G.sentAt = Date.now(); await db.doc(roomPath(G.code)).set(clone(G)); } catch (e) { writeFailed(e); } }
let meBusy = false, meDirty = false, meT = null;
function saveMeSoon() { clearTimeout(meT); meT = setTimeout(saveMe, 350); }
async function saveMe() {
  if (!db || !ME || !U.code) return;
  if (meBusy) { meDirty = true; return; }
  meBusy = true;
  try { await db.doc(inpPath(U.code, ME_ID)).set(clone(ME)); U.offline = ''; } catch (e) { writeFailed(e); }
  meBusy = false;
  if (meDirty) { meDirty = false; saveMe(); }
  if (isHost()) hostStep();
}
function writeFailed() { U.offline = 'net'; toast(L('تعذر الحفظ، تأكد من الاتصال.', 'Couldn’t save — check your connection.')); render(); }

/* ---------- دورة الغرفة ---------- */
function freshRoom(code) {
  return Object.assign({ v: 1, code, host: ME_ID, rev: 0, sentAt: 0, gameNo: 0, phase: 'lobby', players: [], kicked: {}, reqSeen: {},
    settings: clone(GAME.defaults), log: [], hostP: null }, GAME.freshExtra ? GAME.freshExtra() : {});
}
function blankMe(code) { return { room: code, name: U.name.trim(), at: Date.now(), reqN: 0, reqs: [] }; }
function mine() { ME = ME || blankMe(U.code); if (G && ME.g !== G.gameNo) { GAME.resetMine && GAME.resetMine(ME); ME.g = G.gameNo; } return ME; }
async function subscribe(code) {
  unsubscribe();
  U.code = code;
  try { location.hash = 'room-' + code; } catch (e) { }
  lsSet({ code });
  const loading = setTimeout(() => { if (!G) { U.offline = 'net'; render(); } }, 10000);
  unsubRoom = db.doc(roomPath(code)).onSnapshot(s => { clearTimeout(loading); onRoomSnap(s); }, () => { clearTimeout(loading); U.offline = 'net'; render(); });
}
function unsubscribe() {
  if (unsubRoom) { try { unsubRoom(); } catch (e) { } unsubRoom = null; }
  if (unsubInp) { try { unsubInp(); } catch (e) { } unsubInp = null; }
  if (hostTick) { clearInterval(hostTick); hostTick = null; }
  hostOn = false; INP = {};
}
function onRoomSnap(s) {
  if (!s || !s.exists) { if (!G) { U.err = L('ما لقينا غرفة بهذا الرمز. تأكد من الرمز.', 'No room with that code. Check the code.'); leaveLocal(); render(); } return; }
  const d = s.data();
  if (!d || d.code !== U.code) return;
  if (d.closed) { if (d.host !== ME_ID) { leaveLocal(); U.err = L('المضيف أنهى اللعبة وسكّر الغرفة.', 'The host ended the game and closed the room.'); render(); } return; }
  if (d.sentAt && d.host !== ME_ID) { const o = Date.now() - d.sentAt; if (skew === null || o < skew) skew = o; }
  if (hostOn && G && G.host === ME_ID) {
    if (d.host !== ME_ID && d.rev > G.rev) { hostOn = false; G = clone(d); stopHost(); } else return;
  } else {
    if (G && G.code === d.code && (d.rev || 0) < (G.rev || 0)) return;
    G = clone(d);
  }
  if (G.host === ME_ID && !hostOn) becomeHost();
  decideView(); showLog(); render();
}
function decideView() {
  if (!G) return;
    if (G.kicked && G.kicked[ME_ID] && G.host !== ME_ID) { U.view = 'kicked'; return; }
  if (inRoom(ME_ID) || (G.host === ME_ID)) U.view = 'game';
  
  else if (G.phase === 'lobby') U.view = ME && ME.room === G.code && ME.name ? 'wait' : 'join';
  else U.view = 'spect';
}
async function loadMe(code) {
  try { const s = await db.doc(inpPath(code, ME_ID)).get(); ME = s.exists ? clone(s.data()) : null; } catch (e) { ME = null; }
  if (ME && ME.room !== code) ME = null;
}
function becomeHost() {
  hostOn = true;
  if (unsubInp) { try { unsubInp(); } catch (e) { } }
  unsubInp = db.collection(GAME.key + '/' + G.code + '/inputs').onSnapshot(onInputs, () => { });
  if (!hostTick) hostTick = setInterval(() => { if (GAME.hostTick && GAME.hostTick()) publish(); }, 500);
  publish();
}
function stopHost() {
  if (unsubInp) { try { unsubInp(); } catch (e) { } unsubInp = null; }
  if (hostTick) { clearInterval(hostTick); hostTick = null; }
  INP = {};
}
function onInputs(snap) { const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); }); INP = m; hostStep(); }
function leaveLocal() {
  unsubscribe();
  G = null; ME = null; U.code = ''; U.view = 'home'; U.modal = null; skew = null; HIST.length = 0;
  lsSet({ code: '' });
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { try { location.hash = ''; } catch (e2) { } }
}
function uniqueName(n, id) {
  let base = String(n || '').trim().slice(0, 20) || L('لاعب', 'Player'), name = base, k = 2;
  while (G.players.some(p => p.id !== id && p.name === name)) name = base + ' ' + (k++);
  return name;
}

/* ---------- المضيف: الانضمام والطلبات ---------- */
function hostStep() {
  if (!isHost() || !G) return;
  let ch = false;
  Object.keys(INP).forEach(id => {
    const d = INP[id];
    if (!d || id === ME_ID) return;
    const p = G.players.find(x => x.id === id);
    if (G.phase === 'lobby' && p && (d.room !== G.code || !d.name)) { G.players = G.players.filter(x => x.id !== id); ch = true; return; }
    if (d.room !== G.code) return;
    if (G.phase === 'lobby' && !p && !G.kicked[id] && d.name && !nameTaken(d.name, id) && G.players.length < 26) { G.players.push({ id, name: uniqueName(d.name, id), at: d.at || 0 }); ch = true; }
    else if (G.phase === 'lobby' && p && d.at && d.at > (p.at || 0)) { p.name = uniqueName(d.name, id); p.at = d.at; ch = true; }
  });
  Object.keys(INP).forEach(id => {
    if (id === ME_ID || !inRoom(id)) return;
    (INP[id].reqs || []).forEach(r => {
      if (!r || !(r.n > (G.reqSeen[id] || 0))) return;
      G.reqSeen[id] = r.n; ch = true;
      try { GAME.applyReq(id, r); } catch (e) { console.error(e); }
    });
  });
  if (GAME.hostSync && GAME.hostSync()) ch = true;
  if (ch) publish();
  render();
}
function sendReq(r) {
  if (isHost()) { try { GAME.applyReq(ME_ID, r); } catch (e) { console.error(e); } publish(); render(); return; }
  const m = mine(); m.reqN = (m.reqN || 0) + 1; r.n = m.reqN; m.reqs = (m.reqs || []).concat([r]).slice(-40);
  saveMe(); render();
}
function addLog(text) { G.log = (G.log || []).concat([{ n: (G.log && G.log.length ? G.log[G.log.length - 1].n : 0) + 1, t: text }]).slice(-20); }
function showLog() {
  if (!G || !G.log || !G.log.length) return;
  const last = G.log[G.log.length - 1].n;
  if (U.logG !== G.gameNo || U.logN < 0) { U.logG = G.gameNo; U.logN = last; return; }
  G.log.filter(x => x.n > U.logN).forEach(x => toast(x.t));
  U.logN = last;
}

/* ---------- المؤقت (المضيف يحدده) ---------- */
function setTimer(sec) { G.dur = sec || 0; G.endsAt = sec ? Date.now() + sec * 1000 : 0; G.pz = 0; }
/* إيقاف مؤقت: الوقت المتبقي يتخزن في G.pz ونهاية المؤقت تنرفع لبعيد */
const isPz = () => !!(G && G.endsAt && G.pz > 0 && G.endsAt - Date.now() > 1e9);
const remain = () => (G && G.endsAt ? (isPz() ? G.pz : Math.max(0, (G.endsAt - nowH()) / 1000)) : 0);
function tCtl() {
  if (!isHost() || !G || !G.endsAt) return '';
  const p = isPz();
  return `<div class="tctl"><button class="btn ${p ? '' : 'ghost'}" data-act="tPause">${p ? L('▶️ متابعة', '▶️ Resume') : L('⏸️ إيقاف', '⏸️ Pause')}</button><button class="btn ghost" data-act="tRestart">${L('🔄 إعادة المؤقت', '🔄 Restart timer')}</button></div>`;
}
function clockBox(label) {
  return `<div class="timer" id="timerBox"><div class="trow"><span class="tlabel">⏳ ${label}</span><span class="tval" data-clock></span></div><div class="tbar"><i data-bar></i></div></div>`;
}
function tickUI() {
  if (!G || !G.endsAt) return;
  const r = remain(), d = G.dur || 1;
  const pz = isPz();
  document.querySelectorAll('[data-clock]').forEach(el => { el.textContent = pz ? fmt(r) + ' ⏸️ ' + L('متوقف', 'Paused') : (r > 0 ? fmt(r) : L('انتهى الوقت ⏰', 'Time’s up ⏰')); });
  document.querySelectorAll('[data-bar]').forEach(el => { el.style.width = Math.min(100, r / d * 100) + '%'; });
  const tb = $('timerBox'); if (tb) tb.classList.toggle('timeup', r <= 0);
  const eb = $('endBtn'); if (eb) eb.classList.toggle('pulse', r <= 0);
}
setInterval(tickUI, 250);
function hostBar(main) {
  const t = G && G.endsAt ? (isPz() ? `<button class="btn ic" data-act="tPause" aria-label="${L('متابعة', 'Resume')}">▶️</button>` : `<button class="btn ghost ic" data-act="tPause" aria-label="${L('إيقاف', 'Pause')}">⏸️</button>`) + (G.dur ? `<button class="btn ghost ic" data-act="tRestart" aria-label="${L('إعادة المؤقت', 'Restart timer')}">🔄</button>` : '') : '';
  return `<div class="hostbar"><div class="hb">${t}${main}</div></div>`;
}
const endBtn = (label, act) => isHost() ? hostBar(`<button class="btn end" id="endBtn" data-act="${act}">${L('إنهاء', 'End')} (${label})<span class="host-note">${L('يظهر للمضيف فقط', 'Host only')}</span></button>`) : '';
const hostGo = (label, act) => isHost() ? hostBar(`<button class="btn main" data-act="${act}">${label}<span class="host-note">${L('يظهر للمضيف فقط', 'Host only')}</span></button>`) : '';
const waitHost = () => isHost() ? '' : `<p class="sub" style="text-align:center">${L('بانتظار المضيف', 'Waiting for the host')} ${esc(P(G.host).name)} ${L('ينقل اللعبة للمرحلة الجاية…', 'to move to the next stage…')}</p>`;

/* ---------- رجوع المضيف للمرحلة السابقة ---------- */
const HIST = [];
function phaseTo(fn) { HIST.push(clone(G)); if (HIST.length > 15) HIST.shift(); fn(); }
function hostBack() {
  if (!isHost() || !HIST.length) return;
  const prev = HIST.pop(), keepRev = G.rev, players = G.players;
  G = prev; G.rev = keepRev; G.players = players; G.host = ME_ID;
  publish();
}

/* ---------- الشاشات المشتركة ---------- */
const BACK = L('→ رجوع', '← Back');
function topbar() {
  const inG = !!G && !!U.code;
  const back = inG && isHost() && HIST.length && G.phase !== 'lobby' ? `<button class="backbtn" data-act="askBack">${BACK}</button>` : (!U.code ? `<a class="backbtn hub" href="${HUB}">${BACK}</a>` : '');
  return `<header class="top">${back}<div class="brand"><img src="${ICON}" width="34" height="34" alt="" style="flex:none;border-radius:22%"><span>${N(GAME.name)}</span></div><div class="top-r">` +
    (inG ? `<span class="chip">${L('غرفة', 'Room')} <b dir="ltr">${esc(U.code)}</b></span><button class="mini" data-act="menu">${L('القائمة', 'Menu')}</button>` : '') + `</div></header>` +
    (U.offline === 'net' ? `<div class="warn">${L('الاتصال ضعيف. التحديثات بتوصل أول ما يرجع الاتصال.', 'Weak connection. Updates will arrive when it’s back.')}</div>` : '');
}
const errBox = () => (U.err ? `<div class="warn" role="alert">${esc(U.err)}</div>` : '');
function noticeView() {
  return `<section class="notice"><div class="nbox"><h2>${L('تنويه ودي قبل اللعب', 'A friendly note before you play')}</h2>` +
    L(`<p>يا هلا فيكم! هذي نسخة تجريبية من لعبة «أقنعني» بفروعها: المنصة، المزاد، الرئيس، الأزياء، العقار، من فكرة وتطوير عبدالرحمن الفهد، بتاريخ 26/11/26.</p><p>حبيت أشارككم التجربة قبل نشرها للناس، والهدف نستانس ونجرّبها مع بعض. حقوق محتوى اللعبة وتصميمها وموادها محفوظة، وأتمنى ما تنسخونها أو تعيدون نشرها أو تسوّون نسخة مشابهة منها حتى مع تغييرات بسيطة. وأي استخدام لمحتواها بدون إذن قد يضطرني لاتخاذ الإجراءات المناسبة.</p><p>استمتعوا، وملاحظاتكم تهمني!</p>`,
      `<p>Welcome, everyone! This is a trial version of “Aqnieni” and its games: MANASSA, MAZAD, RAEES, AZYAA and AQAR, created and developed by Abdulrahman Al-Fahad, dated 26/11/26.</p><p>I wanted to share it with you before releasing it to the public, so we can have fun and try it together. All rights to the game’s content, design and materials are reserved. Please don’t copy it, republish it, or make a similar version of it, even with small changes. Any use of its content without permission may force me to take appropriate action.</p><p>Enjoy, and your feedback matters to me!</p>`) +
    `<button class="nbtn" data-act="noticeOk">${L('أوعدك، يلا نلعب', 'I promise, let’s play')}</button></div></section>`;
}
function introArt() {

}
function splashView() {

  ${introArt()}<p class="lead">${N(GAME.intro)}</p><button class="btn" data-act="enter">${L('فهمت', 'Got it')}</button></div>`;
}
function homeView() {
  if (!U.ready) return `<section class="card"><p class="sub">${L('جاري التحميل…', 'Loading…')}</p></section>`;
  if (!db) return `<section class="card"><p class="sub">${L('تعذر الاتصال. تأكد من الإنترنت وحدّث الصفحة.', 'Couldn’t connect. Check your internet and refresh.')}</p></section>`;
  const me = `<section class="card"><h3>${L('اسمك أو لقبك', 'Your name or nickname')}</h3><input class="field" id="nm" data-bind="name" value="${esc(U.name)}" maxlength="20" autocomplete="off" placeholder="${L('مثال: أبو فهد', 'e.g. Captain Fahad')}"></section>`;
  const join = `<section class="card"><h3>${L('انضم لغرفة', 'Join a room')}</h3><input class="field code-in" id="cd" data-bind="code" value="${esc(U.draft.code || '')}" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="${L('مثال: K7QX', 'e.g. K7QX')}" dir="ltr">

  const host = `<section class="card"><h3>${L('أنشئ غرفة جديدة', 'Create a new room')}</h3><p class="sub">${L('تكون أنت المضيف: تبدأ اللعبة وتنقلها بين المراحل، وباقي اللاعبين يدخلون برمز الغرفة من تلفوناتهم.', 'You’ll be the host: you start the game and move it between stages; the others join with the room code from their phones.')}</p>
    <button class="btn" data-act="create">${L('إنشاء غرفة', 'Create room')}</button></section>`;

function joinView() {
  return `<section class="card" style="text-align:center"><span class="sub">${L('تنضم إلى الغرفة', 'Joining room')}</span><div class="bigcode" dir="ltr">${esc(U.code)}</div></section>
  <section class="card"><h3>${L('اسمك أو لقبك', 'Your name or nickname')}</h3><input class="field" id="nm" data-bind="name" value="${esc(U.name)}" maxlength="20" autocomplete="off"></section>${errBox()}
  <button class="btn" data-act="sendJoin">${L('دخول الغرفة', 'Enter the room')}</button><button class="btn ghost" data-act="leaveNow">${L('رجوع', 'Back')}</button>`;
}
const waitView = () => `<section class="card" style="text-align:center"><div class="spin"></div><h3>${L('بانتظار المضيف', 'Waiting for the host')}</h3><p class="sub">${L('أرسلنا اسمك للغرفة', 'We sent your name to room')} ${esc(U.code)}. ${L('بتظهر في قائمة اللاعبين خلال ثواني.', 'You’ll appear in the player list in a few seconds.')}</p></section><button class="btn ghost" data-act="leaveNow">${L('إلغاء والخروج', 'Cancel and leave')}</button>`;
const spectView = () => `<section class="card" style="text-align:center"><h3>${L('اللعبة بدأت', 'The game has started')}</h3><p class="sub">${L('هذه الغرفة بدأت اللعب بدونك. تقدر تنضم لما يرجع المضيف للردهة.', 'This room started without you. You can join when the host returns to the lobby.')}</p><button class="btn" data-act="leaveNow">${L('خروج', 'Leave')}</button></section>`;
const kickedView = () => `<section class="card" style="text-align:center"><h3>${L('خرجت من الغرفة', 'You left the room')}</h3><p class="sub">${L('المضيف أزالك من هذه الغرفة.', 'The host removed you from this room.')}</p><button class="btn" data-act="leaveNow">${L('رجوع', 'Back')}</button></section>`;

const stp = (k, min, max, show) => { const v = G.settings[k]; return `<div class="row"><span>${show.label}</span><div class="stepper"><button data-act="step" data-k="${k}" data-v="1" ${v >= max ? 'disabled' : ''}>+</button><span class="v">${show.fmt ? show.fmt(v) : v}</span><button data-act="step" data-k="${k}" data-v="-1" ${v <= min ? 'disabled' : ''}>−</button></div></div>`; };
const timeRow = (k, label) => stp(k, GAME.timer.min, GAME.timer.max, { label, fmt });
function lobbyView() {

  start() { phaseTo(() => { Object.assign(G, GAME.freshExtra()); G.phase = 'setup'; setTimer(G.settings.setupTime); }); },
  applyReq(id, r) {
    if (r.g !== G.gameNo) return;
    const ph = G.phase;
    if (r.type === 'perk') return applyPerk(id, r);
    if (r.type === 'ask' && ['pre', 'pitch', 'deals', 'summary'].includes(ph)) { const pr = byId(G.props, r.propId); if (pr && pr.owner === id) pr.asking = Math.max(CONFIG.priceStep, +r.price || pr.asking); return; }
    if (r.type === 'pitchProp' && ph === 'pitch') { const cur = G.presenters[G.pIdx]; const pr = byId(G.props, r.propId); if (cur && cur.id === id && pr && pr.owner === id) cur.prop = pr.id; return; }
    if (ph !== 'deals') return;
    if (isSusp(id)) return;
    if (r.type === 'offer') {

        G.dealsList.push({ id: uid('d'), propId: pr.id, seller: id, buyer: o.buyer, price: o.price, status: 'pending', round: G.round });
        addLog(L(`🤝 ${P(id).name} قبل عرض ${P(o.buyer).name} — البيعة قيد الإتمام`, `🤝 ${P(id).name} accepted ${P(o.buyer).name}’s offer — deal pending`));

      G.dealsList.push({ id: uid('d'), propId: pr.id, seller: h.seller, buyer: id, price: h.price, credit: h.amount, status: 'pending', round: G.round });

      if (r.ok) { G.rentals.push({ propId: q.propId, renter: q.renter, owner: id, per: CONFIG.rentPerRound, left: CONFIG.rentRounds, startRound: G.round }); addLog(L(`🔑 ${P(id).name} وافق على إيجار ${P(q.renter).name}`, `🔑 ${P(id).name} agreed to rent to ${P(q.renter).name}`)); }
      else addLog(L(`🔑 ${P(id).name} رفض الإيجار — راحت ميزة ${P(q.renter).name}`, `🔑 ${P(id).name} refused — ${P(q.renter).name} loses the perk`));
    }
  },
  view() {

    let h = head ? `<div class="sticky">${head}</div>` : '';
    if (G.phase === 'setup') h += setupView();

    if (G.phase === 'deals') h += dealsView();
    if (G.phase === 'summary') h += summaryView();

  },

  },

/* ---------- المزايا على المضيف ---------- */
function applyPerk(id, r) {
  const k = r.id;
  if (!perkLeft(id, k) || !(PERK_WHEN[k] || []).includes(G.phase)) return;
  if (isSusp(id) && k !== 'budgetUp') return;
  const use = () => { G.used[id] = (G.used[id] || []).concat([k]); };
  const nm = P(id).name, pk = N(byId(PERKS, k).name);
  if (k === 'budgetUp') { G.budget[id] += CONFIG.budgetUpAmount; use(); addLog(`➕ ${nm}: ${pk}`); }
  if (k === 'budgetDown') { const t = r.target; if (!inRoom(t) || t === id) return; G.budget[t] = Math.max(0, G.budget[t] - CONFIG.budgetDownAmount); use(); addLog(`➖ ${nm} → ${P(t).name}: ${pk}`); }
  if (k === 'violation') { const t = r.target; if (!inRoom(t) || t === id) return; G.suspended[t] = G.round; use(); addLog(`⛔ ${office(t)} ${L('موقوف هالجولة', 'is suspended this round')}`); }
  if (k === 'inspect') { G.inspect = G.inspect || {}; G.inspect[id] = G.round; use(); addLog(`🔍 ${nm}: ${pk}`); }
  if (k === 'protect') { G.protectedRound[id] = G.round; use(); addLog(`🛡️ ${nm} ${L('محمي هالجولة', 'is protected this round')}`); }
  if (k === 'negotiator') { const cur = G.presenters[G.pIdx]; if (!cur || cur.id !== id) return; G.negotiator[id] = G.round; use(); addLog(`🧑‍💼 ${nm}: ${pk}`); }
  if (k === 'addons') { const pr = byId(G.props, r.target), e = byId(CONFIG.extras, r.target2); if (!pr || pr.owner !== id || !e || pr.extras.includes(e.id) || G.budget[id] < e.price) return; G.budget[id] -= e.price; pr.extras.push(e.id); pr.cost += e.price; use(); addLog(`🏗️ ${nm}: ${N(e.name)}`); }
  if (k === 'glitch') { const d = G.dealsList.find(x => x.id === r.target && x.status === 'pending'); if (!d) return; d.status = 'cancelled'; use(); addLog(`⚠️ ${nm}: ${L('انلغت بيعة', 'cancelled a deal')} (${P(d.seller).name} ${L('←', '→')} ${P(d.buyer).name})`); }
  if (k === 'outbid') { const d = G.dealsList.find(x => x.id === r.target && x.status === 'pending'); const price = +r.price; if (!d || d.buyer === id || d.seller === id || isProt(d.buyer) || !(price > d.price) || G.budget[id] < price) return; const old = d.buyer; d.buyer = id; d.price = price; use(); addLog(`⬆️ ${nm} ${L('زايد على', 'outbid')} ${P(old).name}: ${money(price)}`); }
  if (k === 'hijack') {
    const d = G.roundDone.find(x => x.id === r.target); const price = +r.price; if (!d) return;
    const pr = byId(G.props, d.propId); if (!pr || pr.owner !== d.buyer || d.buyer === id || d.seller === id || isProt(d.buyer) || !(price > d.price) || G.budget[id] < price) return;
    const first = d.buyer;
    G.budget[id] -= price; G.budget[d.seller] += price - d.price; G.budget[first] += d.price;   // تعويض مؤقت
    G.profit[d.seller] = (G.profit[d.seller] || 0) + price - d.price; G.dealsN[first] = Math.max(0, (G.dealsN[first] || 0) - 1); G.dealsN[id] = (G.dealsN[id] || 0) + 1;
    pr.owner = id; pr.cost = price; pr.asking = price; d.buyer = id; d.price = price; use();
    addLog(`🦅 ${nm} ${L('خطف الصفقة من', 'hijacked the deal from')} ${P(first).name}`);
  }
  if (k === 'deposit') { const pr = byId(G.props, r.target); if (!pr || pr.owner === id || lockedProp(pr.id) || isSusp(pr.owner) || G.budget[id] < CONFIG.depositAmount) return; G.budget[id] -= CONFIG.depositAmount; G.holds.push({ propId: pr.id, holder: id, seller: pr.owner, amount: CONFIG.depositAmount, price: pr.asking, round: G.round }); G.offers = G.offers.filter(o => o.propId !== pr.id); use(); addLog(`🧾 ${nm} ${L('دفع عربون على عقار', 'paid a deposit on a property of')} ${P(pr.owner).name}`); }
  if (k === 'rent') { const pr = byId(G.props, r.target); if (!pr || pr.owner === id || isSusp(pr.owner)) return; use(); G.rentReqs.push({ id: uid('r'), propId: pr.id, renter: id, owner: pr.owner }); addLog(`🔑 ${nm} ${L('طلب يستأجر من', 'asked to rent from')} ${P(pr.owner).name}`); }
}

/* ---------- انتقال المراحل (المضيف) ---------- */
ACT.setupEnd = H(() => phaseTo(() => {
  G.props = []; let n = 0;
  G.players.forEach(p => {
    const m = inp(p.id), ok = m.g === G.gameNo;
    G.perks[p.id] = ok ? (m.perks || []).slice(0, CONFIG.maxPerks) : []; G.used[p.id] = [];
    let b = G.settings.budget - G.perks[p.id].length * CONFIG.perkPrice;
    (ok ? m.props || [] : []).slice(0, MAXH()).forEach(sp => { const v = specValue(sp); if (b >= v) { b -= v; G.props.push({ id: ++n, owner: p.id, area: sp.area, land: sp.land, floors: sp.floors, style: sp.style, basement: !!sp.basement, color: sp.color || 'white', extras: (sp.extras || []).slice(), cost: v, asking: sp.asking || v }); } });
    G.budget[p.id] = b; G.profit[p.id] = 0; G.dealsN[p.id] = 0; G.votes[p.id] = 0;
  });
  G.nextProp = n + 1; startRound(1);
}));
function startRound(r) {
  G.round = r; G.offers = []; G.roundDone = []; G.rentReqs = [];
  G.rentals.forEach(x => { if (x.left > 0 && x.startRound < r) { const pr = byId(G.props, x.propId), ow = pr ? pr.owner : x.owner, amt = Math.min(G.budget[x.renter] || 0, x.per); G.budget[x.renter] -= amt; G.budget[ow] = (G.budget[ow] || 0) + amt; x.left--; } });
  G.phase = 'pre'; G.endsAt = 0;
}
ACT.startPitches = H(() => phaseTo(() => {
  const eligible = G.players.filter(p => !isSusp(p.id) && owned(p.id).length).map(p => p.id), k = Math.min(G.settings.presenters, eligible.length);
  let picks = shuffle(eligible.filter(id => !G.spoken.includes(id))).slice(0, k);
  if (picks.length < k) { G.spoken = G.spoken.filter(id => !eligible.includes(id)); picks = picks.concat(shuffle(eligible.filter(id => !picks.includes(id))).slice(0, k - picks.length)); }
  G.spoken = G.spoken.concat(picks);
  G.presenters = picks.map(id => ({ id, prop: owned(id)[0].id })); G.pIdx = 0;
  picks.forEach(id => { if (!G.presentedIds.includes(id)) G.presentedIds.push(id); });
  if (!picks.length) { addLog(L('ما أحد عنده عقار يعرضه', 'Nobody has a property to pitch')); G.phase = 'deals'; setTimer(G.settings.dealTime); return; }
  G.phase = 'pitch'; setTimer(G.settings.pitchTime);
}));
ACT.pitchNext = H(() => phaseTo(() => {
  if (G.pIdx < G.presenters.length - 1) { G.pIdx++; setTimer(G.settings.pitchTime); }
  else { G.phase = 'deals'; setTimer(G.settings.dealTime); }
}));
ACT.dealsEnd = H(() => phaseTo(() => {
  G.holds.filter(h => h.round === G.round - 1).forEach(h => { G.budget[h.seller] += h.amount; addLog(L(`🧾 ${P(h.holder).name} خسر العربون`, `🧾 ${P(h.holder).name} lost the deposit`)); });
  G.holds = G.holds.filter(h => h.round >= G.round);
  const done = [];
  G.dealsList.filter(d => d.status === 'pending').forEach(d => {
    const pr = byId(G.props, d.propId), pay = d.price - (d.credit || 0);
    if (!pr || pr.owner !== d.seller || G.budget[d.buyer] < pay) { d.status = 'cancelled'; return; }
    G.budget[d.buyer] -= pay; G.budget[d.seller] += d.price;
    G.profit[d.seller] = (G.profit[d.seller] || 0) + d.price - pr.cost; G.dealsN[d.seller]++; G.dealsN[d.buyer]++;
    pr.owner = d.buyer; pr.cost = d.price; pr.asking = d.price; d.status = 'done'; done.push(d);
  });
  G.roundDone = done; G.offers = []; G.rentReqs = []; G.phase = 'summary'; G.endsAt = 0;
}));
ACT.summaryNext = H(() => phaseTo(() => { if (G.round < G.settings.rounds) startRound(G.round + 1); else { G.phase = 'vote'; setTimer(G.settings.voteTime); } }));
ACT.voteEnd = H(() => phaseTo(() => {
  G.votes = {}; G.players.forEach(p => { G.votes[p.id] = 0; });
  G.players.forEach(p => { const v = inp(p.id).vote; if (v && v.g === G.gameNo && v.v !== p.id && inRoom(v.v)) G.votes[v.v]++; });
  const score = {}; G.players.forEach(p => { score[p.id] = 0; });
  G.results = CATS.map(c => {
    const rows = G.players.map(p => ({ id: p.id, v: c.metric(p.id) })).sort((a, b) => b.v - a.v);
    rows.forEach(x => { x.rank = 1 + rows.filter(o => o.v > x.v).length; x.pts = CONFIG.rankPoints[x.rank - 1] || 0; score[x.id] += x.pts; });
    return { id: c.id, rows };
  });
  G.score = score; G.wealthEnd = {}; G.players.forEach(p => { G.wealthEnd[p.id] = wealth(p.id); });
  G.phase = 'final'; G.endsAt = 0;
}));
ACT.rematch = H(() => { G.gameNo++; G.log = []; HIST.length = 0; GAME.start(); });

/* ---------- واجهات ---------- */
function dock() {
  if (!G || !['pre', 'pitch', 'deals', 'summary'].includes(G.phase)) return '';
  const pl = amPlayer(); let b = '';
  if (pl) b += `<span class="dk money"><i>💰</i><span>${money(G.budget[ME_ID] || 0)}</span></span>`;
  if (pl) b += `<button class="dk" data-act="panel" data-v="props"><i>🏠</i><span>${L('عقاراتي', 'Properties')} ${owned(ME_ID).length}</span></button>`;
  if (pl && (G.perks[ME_ID] || []).length && G.phase !== 'pre') { const left = G.perks[ME_ID].filter(k => !(G.used[ME_ID] || []).includes(k)).length; b += `<button class="dk" data-act="panel" data-v="perks"><i>✨</i><span>${L('مزاياي', 'Perks')} ${left}</span></button>`; }
  if ((G.props || []).some(p => p.owner)) b += `<button class="dk" data-act="panel" data-v="map"><i>🗺️</i><span>${L('الخريطة', 'Map')}</span></button>`;
  b += isInsp(ME_ID) ? `<button class="dk money" style="cursor:pointer" data-act="offices"><i>🔍</i><span>${L('التفتيش', 'Inspect')}</span></button>` : `<button class="dk" data-act="offices"><i>📊</i><span>${L('المكاتب', 'Offices')}</span></button>`;
  return `<div class="dock">${b}</div>`;
}

function inboxPing() {

ACT.offices = () => { U.modal = { type: 'offices' }; };

  return `<div class="deal ${mineIn ? 'mine' : ''}"><div class="dv">${houseSVG(pr, 1)}</div><div class="di"><b>${propTitle(pr)}</b><small>${esc(P(d.seller).name)} ${L('←', '→')} ${esc(P(d.buyer).name)} • <b>${money(d.price)}</b></small></div><div class="da">${acts}</div></div>`;
}
function mapCard() {
  const props = (G.props || []).filter(p => p.owner);
  if (!props.length) return '';
  const PAL = ['#DE0921', '#0554A4', '#E0A800', '#7B2FBE', '#1E8A4C', '#F97316', '#0EA5E9', '#DB2777', '#65A30D', '#475569', '#B45309', '#0F766E'];
  const ci = id => PAL[Math.max(0, G.players.findIndex(p => p.id === id)) % PAL.length];
  const Z = { coast: [22, 40, 276, 0], city: [118, 90, 84, 60], res: [22, 94, 76, 88], sub: [226, 94, 76, 88] };
  const used = {};
  const pins = props.map(pr => {
    const z = Z[pr.area] || Z.sub, k = (used[pr.area] = (used[pr.area] || 0) + 1) - 1;
    const h = ((pr.id * 2654435761) >>> 0) % 997 / 997, cols = Math.max(1, Math.floor(z[2] / 22)), cx = z[0] + 11 + (k % cols) * 22 + (h - .5) * 6, cy = z[1] + 24 + Math.floor(k / cols) * 24 + (h - .5) * 4;
    const mine = pr.owner === ME_ID;
    return `<g transform="translate(${cx.toFixed(1)} ${Math.min(z[1] + 24 + z[3], cy).toFixed(1)})"><ellipse cx="0" cy="1" rx="5" ry="1.8" fill="rgba(0,0,0,.2)"/><path d="M0 0 C-7 -8 -8 -13 -8 -16 A8 8 0 0 1 8 -16 C8 -13 7 -8 0 0Z" fill="${ci(pr.owner)}" stroke="${mine ? '#12203A' : '#fff'}" stroke-width="${mine ? 1.8 : 1.3}"/><text x="0" y="-13" text-anchor="middle" font-size="8" font-weight="800" fill="#fff" font-family="system-ui,sans-serif">${pr.id}</text></g>`;
  }).join('');
  const trees = [[30, 110], [60, 104], [86, 122], [40, 150], [74, 170], [28, 182], [92, 160]].map(t => `<circle cx="${t[0]}" cy="${t[1]}" r="5" fill="#9BCF9F"/>`).join('');
  const blocks = [0, 1, 2].map(r => [0, 1, 2].map(c => `<rect x="${122 + c * 27}" y="${96 + r * 17}" width="22" height="13" rx="2" fill="#D5DAE2"/>`).join('')).join('');
  const svg = `<svg viewBox="0 0 320 196" class="aqmap" role="img" aria-label="${L('خريطة العقارات', 'Property map')}">
    <rect width="320" height="196" rx="14" fill="#EEF3EA"/><path d="M0 14 Q0 0 14 0 H306 Q320 0 320 14 V40 Q240 50 160 42 T0 44 Z" fill="#8FD0EA"/><path d="M20 22 q8 -4 16 0 t16 0 M120 30 q8 -4 16 0 t16 0 M230 20 q8 -4 16 0 t16 0" stroke="#D3EEF8" stroke-width="1.6" fill="none"/>
    <path d="M0 44 Q80 40 160 42 T320 40 V52 Q240 58 160 54 T0 56 Z" fill="#F2E3BE"/>
    <rect x="18" y="92" width="84" height="98" rx="10" fill="#DCEFD9"/>${trees}
    <rect x="114" y="88" width="92" height="62" rx="8" fill="#E7EAF0"/>${blocks}
    <rect x="222" y="92" width="84" height="98" rx="10" fill="#F1EEE4"/><path d="M232 120 h20 M262 150 h28 M240 176 h22" stroke="#E2DCCB" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 80 H320 M108 80 V196 M212 80 V196 M160 150 V196" stroke="#FFFFFF" stroke-width="6"/><path d="M0 80 H320" stroke="#E3E6EC" stroke-width="1" stroke-dasharray="6 5"/>
    <g font-size="8.5" font-weight="700" fill="#5B6578" font-family="system-ui,sans-serif" text-anchor="middle"><text x="160" y="30" fill="#2B6F8F">${N(byId(CONFIG.areas, 'coast').name)}</text><text x="160" y="164">${N(byId(CONFIG.areas, 'city').name)}</text><text x="60" y="186">${N(byId(CONFIG.areas, 'res').name)}</text><text x="264" y="186">${N(byId(CONFIG.areas, 'sub').name)}</text></g>
    ${pins}</svg>`;
  const owners = G.players.filter(p => props.some(pr => pr.owner === p.id));
  return `<div class="card mapcard"><h3>🗺️ ${L('خريطة العقارات', 'Property map')}</h3>${svg}<div class="maplg">${owners.map(p => `<span><i data-aqkeep style="background:${ci(p.id)}"></i>${esc(p.name)}${p.id === ME_ID ? L(' (أنت)', ' (you)') : ''}</span>`).join('')}</div></div>`;
}
function dealsView() {
  const me = ME_ID, pl = amPlayer(), pend = G.dealsList.filter(d => d.status === 'pending');
  const inc = G.offers.filter(o => o.seller === me), outg = G.offers.filter(o => o.buyer === me), rq = G.rentReqs.filter(q => q.owner === me);
  const holds = G.holds.filter(h => h.holder === me && h.round === G.round - 1);
  const market = G.props.filter(pr => pr.owner !== me);
  return `<span class="tag">${L('الجولة', 'Round')} ${G.round} — ${L('الصفقات', 'Deals')}</span>
  <p class="sub">${L('تفاوضوا بالكلام، وسجّلوا هني السعر المتفق عليه. الصفقات تكتمل بنهاية الوقت.', 'Negotiate out loud, then record the agreed price. Deals complete when time ends.')}</p>${myNotes()}
  <div id="inbox">
  ${holds.map(h => { const pr = byId(G.props, h.propId); return pr ? `<div class="note">🧾 ${L('عربونك على', 'Your deposit on')} ${propTitle(pr)} — ${L('اشترِه بـ', 'buy it for')} ${money(h.price)} ${L('أو تخسر العربون', 'or lose it')} <button class="mini ok" data-act="buyHold" data-id="${pr.id}">${L('اشترِ الحين', 'Buy now')}</button></div>` : ''; }).join('')}
  ${rq.length ? `<div class="card"><h3>🔑 ${L('طلبات إيجار', 'Rent requests')}</h3>${rq.map(q => { const pr = byId(G.props, q.propId); return `<div class="deal"><div class="dv">${houseSVG(pr, 1)}</div><div class="di"><b>${esc(office(q.renter))}</b><small>${propTitle(pr)} • ${CONFIG.rentRounds} × ${money(CONFIG.rentPerRound)}</small></div><div class="da"><button class="mini ok" data-act="rentResp" data-id="${q.id}" data-ok="1">${L('موافق', 'Agree')}</button><button class="mini" data-act="rentResp" data-id="${q.id}" data-ok="0">${L('رفض', 'Refuse')}</button></div></div>`; }).join('')}</div>` : ''}
  ${inc.length ? `<div class="card"><h3>📩 ${L('عروض على عقاراتك', 'Offers on your properties')}</h3>${inc.map(o => { const pr = byId(G.props, o.propId); return `<div class="deal"><div class="dv">${houseSVG(pr, 1)}</div><div class="di"><b>${esc(office(o.buyer))}</b><small>${propTitle(pr)} • <b>${money(o.price)}</b> (${L('طلبك', 'you ask')} ${money(pr.asking)})</small></div><div class="da"><button class="mini ok" data-act="offerResp" data-id="${o.id}" data-ok="1">${L('قبول', 'Accept')}</button><button class="mini" data-act="offerResp" data-id="${o.id}" data-ok="0">${L('رفض', 'Reject')}</button></div></div>`; }).join('')}</div>` : ''}
  </div>
  <div class="card"><h3>🏘️ ${L('السوق', 'Market')}</h3>${market.length ? market.map(pr => { const lock = lockedProp(pr.id), sus = isSusp(pr.owner) || isSusp(me); return propRow(pr, false, pl ? `
    <button class="mini ok" ${lock || sus ? 'disabled' : ''} data-act="openOffer" data-id="${pr.id}">🤝 ${L('سجّل عرض', 'Make offer')}</button>
    ${perkLeft(me, 'deposit') ? `<button class="mini" ${lock || sus ? 'disabled' : ''} data-act="perk" data-id="deposit" data-t="${pr.id}">🧾 ${L('عربون', 'Deposit')}</button>` : ''}
    ${perkLeft(me, 'rent') ? `<button class="mini" ${sus ? 'disabled' : ''} data-act="perk" data-id="rent" data-t="${pr.id}">🔑 ${L('إيجار', 'Rent')}</button>` : ''}` : ''); }).join('') : `<div class="empty">${L('السوق فاضي.', 'The market is empty.')}</div>`}</div>
  ${outg.length ? `<div class="card"><h3>⏳ ${L('عروضك بانتظار الرد', 'Your offers awaiting reply')}</h3>${outg.map(o => `<div class="note">${propTitle(byId(G.props, o.propId))} — ${esc(office(o.seller))} • ${money(o.price)}</div>`).join('')}</div>` : ''}
  <div class="card"><h3>⏳ ${L('صفقات قيد الإتمام', 'Pending deals')}</h3>${pend.length ? pend.map(d => dealRow(d, 'pending')).join('') : `<div class="empty">${L('ما في صفقات للحين.', 'No deals yet.')}</div>`}</div>
  ${endBtn(L('إتمام الصفقات', 'complete the deals'), 'dealsEnd')}${waitHost()}`;
}
function summaryView() {
  const last = G.round >= G.settings.rounds;
  return `<span class="tag">${L('الجولة', 'Round')} ${G.round} / ${G.settings.rounds}</span><h2>${L('ملخص الجولة', 'Round summary')} ${G.round}</h2>
  <p class="sub">${L('هذي الصفقات اللي اكتملت. هذا وقت «خطف الصفقة».', 'These deals completed. Time for “Deal hijack”.')}</p>${myNotes()}
  <div class="card"><h3>✅ ${L('صفقات مكتملة', 'Completed deals')}</h3>${G.roundDone.length ? G.roundDone.map(d => dealRow(d, 'done')).join('') : `<div class="empty">${L('ما اكتملت صفقات هالجولة.', 'No deals completed this round.')}</div>`}</div>
  ${isHost() ? hostGo((last ? L('الذهاب للتصويت', 'Go to voting') : L('الجولة', 'Round') + ' ' + (G.round + 1)) + ' ←', 'summaryNext') : waitHost()}`;
}
function voteView() {
  const v = mine().vote, cands = G.presentedIds.filter(id => id !== ME_ID && inRoom(id));
  const done = G.players.filter(p => { const x = inp(p.id).vote; return x && x.g === G.gameNo; }).map(p => p.id);
  return `<h2>🎤 ${L('صوّت لأفضل إقناع', 'Vote for the best pitch')}</h2><p class="sub">${L('مين أفضل واحد عرض وسوّق؟ صوت واحد، وما تقدر تصوت لنفسك.', 'Who pitched best? One vote, not for yourself.')}</p>
  ${amPlayer() ? (cands.length ? cands.map(id => `<button class="votebtn ${v && v.g === G.gameNo && v.v === id ? 'on' : ''}" data-act="vote" data-id="${id}">${esc(office(id))}${v && v.g === G.gameNo && v.v === id ? ' ✓' : ''}</button>`).join('') : `<div class="empty">${L('ما في أحد غيرك عرض.', 'Nobody else pitched.')}</div>`) : ''}
  ${isHost() ? progBox(L('مين صوّت', 'Who voted'), done) : ''}${endBtn(L('الذهاب للنتائج', 'go to Results'), 'voteEnd')}${waitHost()}`;
}
ACT.vote = d => { mine().vote = { g: G.gameNo, v: d.id }; saveMe(); };
function finalView() {
  const list = G.players.map(p => ({ id: p.id, name: p.name, pts: G.score[p.id] || 0, w: G.wealthEnd[p.id] || 0 })).sort((a, b) => b.pts - a.pts || b.w - a.w);
  return `<h2>🏆 ${L('النتائج', 'Results')}</h2>${podium(list)}<p class="sub">${L('التعادل بالمجموع: يفوز صاحب الثروة النهائية الأعلى.', 'Tie on total: higher final wealth wins.')}</p>
  ${G.results.map(r => { const c = byId(CATS, r.id); return `<div class="card"><h3>${c.icon} ${N(c.name)} <small>— ${N(c.hint)}</small></h3>${r.rows.map(x => `<div class="row"><span>${x.rank}. ${esc(P(x.id).name)} <small>${c.money ? money(x.v) : x.v}</small></span><b>+${x.pts}</b></div>`).join('')}</div>`; }).join('')}
  ${isHost() ? `<button class="btn" data-act="rematch">${L('لعبة جديدة بنفس اللاعبين', 'New game, same players')}</button><button class="btn ghost" data-act="toLobby">${L('رجوع للردهة', 'Back to the lobby')}</button>` : ''}`;
}

init();
</script>
</body>
