<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أقنعني! | ناديك</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800;900&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --bg-2:#F4F6FB; --panel:#FFFFFF; --panel-2:#FFFFFF; --line:#D5DCEA; --line-soft:#E6EBF4;
  --text:#0E1630; --muted:#5A6580; --blue:#1D4ED8; --cyan:#1D4ED8; --gold:#E11D2E; --yel:#FFC93C; --gold-ink:#FFFFFF; --ink:#FFFFFF;
  --ok:#17935A; --bad:#D32F2F; --warn:#D97706;
  --grad:linear-gradient(135deg,#2563EB 0%,#1D4ED8 55%,#1E3A8A 100%);
  --r:16px;
  --font-d:'Alexandria','Readex Pro',Tahoma,sans-serif;
  --font-b:'Readex Pro','Alexandria','Segoe UI',Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  background-color:var(--bg);
  background-image:radial-gradient(900px 420px at 50% -8%,rgba(29,78,216,.10),transparent 70%);
  color:var(--text); font-family:var(--font-b); font-size:16px; line-height:1.65; direction:rtl;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px; min-height:100%;
}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--font-d);font-weight:700;text-wrap:balance;line-height:1.3}
.wrap{max-width:880px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 4px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--font-d);font-size:1.35rem;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:.85rem;letter-spacing:.08em}
.top-r{display:flex;align-items:center;gap:10px}
.saved{color:var(--muted);font-size:.8rem;white-space:nowrap}
@media(max-width:480px){.brand span,.saved{display:none}}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;
  border:1px solid var(--line);border-radius:14px;background:var(--panel-2);color:var(--text);
  font-weight:600;font-size:1rem;cursor:pointer;text-align:center;transition:transform .08s,border-color .15s,background .15s;
}
.btn:hover{border-color:var(--cyan)}
.btn:active{transform:scale(.985)}
.btn:focus-visible,.chipbtn:focus-visible,.perk:focus-visible,.vopt:focus-visible,.seg button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(29,78,216,.28)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.xl{min-height:62px;font-size:1.12rem;width:100%}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.9rem;border-radius:12px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}
.btn-row>.btn{flex:1 1 200px}

/* surfaces */
.card{background:var(--panel);box-shadow:0 10px 30px rgba(14,22,48,.07);border:1px solid var(--line-soft);border-radius:var(--r);padding:20px;min-width:0}
.card h2{font-size:1.35rem;margin-bottom:6px}
.card h3{font-size:1.1rem}
.sect-title{font-family:var(--font-d);font-size:1.05rem;color:var(--cyan);margin-bottom:10px}
.alert{border:1px solid var(--bad);background:rgba(211,47,47,.1);color:#9E1219;border-radius:12px;padding:12px 16px}
.note{border:1px solid var(--line);background:var(--bg-2);border-radius:12px;padding:12px 16px;color:var(--muted);font-size:.93rem}
.note b{color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);font-size:.82rem;font-weight:600;white-space:nowrap}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.chip.live{border-color:var(--cyan);color:var(--cyan)}
.chip.ok{border-color:var(--ok);color:var(--ok)}

/* stepper */
.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.steps li{padding:2px 12px;border-radius:99px;border:1px solid var(--line-soft);color:var(--muted);font-size:.82rem}
.steps li.on{border-color:var(--cyan);color:var(--cyan);background:rgba(29,78,216,.08)}
.steps li.done{color:var(--text)}

/* home */
.hero{padding:34px 22px 26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.hero h1{font-size:clamp(2.6rem,9vw,4rem);font-weight:800;background:linear-gradient(90deg,#E11D2E 0 50%,#1D4ED8 50% 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .en{font-family:var(--font-d);letter-spacing:.32em;color:var(--cyan);font-size:.95rem}
.hero p.lead{max-width:34rem;color:var(--muted);font-size:1.08rem}
.hero .btn-row{width:100%;max-width:520px;margin-top:6px}
.howto{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:12px}
.howto li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.howto li::before{counter-increment:s;content:counter(s);width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:700}

/* players */
.prow{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;padding:12px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}
.prow .fields{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.prow input{flex:1 1 150px;min-width:0}
.field{background:var(--bg);border:1px solid var(--line);border-radius:12px;min-height:50px;padding:8px 14px;width:100%}
textarea.field{min-height:92px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 16px;min-height:46px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--blue);color:#fff}
.seg-wide{display:flex;flex-wrap:wrap;gap:10px}
.seg-wide button{flex:1 1 90px;min-height:50px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);cursor:pointer;font-weight:600}
.seg-wide button.on{border-color:var(--cyan);color:var(--ink);background:var(--cyan)}
.x{width:46px;height:46px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;font-size:1.3rem;line-height:1}
.x:hover{border-color:var(--bad);color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.opt-card{border:1px solid var(--line);border-radius:14px;background:var(--bg-2);padding:14px 16px;cursor:pointer;text-align:start;min-height:70px}
.opt-card.on{border-color:var(--cyan);background:rgba(29,78,216,.1)}
.opt-card b{display:block}
.labelled{display:flex;flex-direction:column;gap:8px}
.labelled>label,.lbl{font-weight:600;color:var(--text)}

/* pass-the-device */
.pass{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 20px}
.pass h2{font-size:2rem;margin:0}
.pass .kick{color:var(--cyan);font-weight:600}
.pass .btn{max-width:420px}

/* perk picking */
.perk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.perk-pick{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:start;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);padding:14px 16px;cursor:pointer;min-height:92px}
.perk-pick b{font-family:var(--font-d);font-size:1.05rem}
.perk-pick span.d{grid-column:1/-1;color:var(--muted);font-size:.9rem}
.perk-pick.on{border-color:var(--gold);background:rgba(225,29,46,.09)}
.perk-pick.off{opacity:.5}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.on .tick{border-color:var(--gold);background:var(--gold);color:var(--gold-ink)}

/* answers */
.qa{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}
.qa .qt{font-weight:600}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.qlist li{padding:12px 16px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg-2)}

/* case */
.casehead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.qcard{text-align:center;padding:24px 18px}
.qcard .qlabel{color:var(--gold);font-weight:600;font-size:.9rem;letter-spacing:.04em}
.qcard h2{font-size:clamp(1.4rem,4.6vw,2rem);margin-top:6px}
.parties{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.parties{grid-template-columns:1fr 1fr}}
.party{border:1px solid var(--line-soft);background:var(--panel);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.party.speaking{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.ptop{display:flex;gap:8px;flex-wrap:wrap}
.pid{display:flex;align-items:center;gap:12px;min-width:0}
.pid h3{overflow-wrap:anywhere}
.defend{border-radius:12px;background:var(--bg-2);padding:10px 14px;border:1px dashed var(--line)}
.defend strong{display:block;font-size:1.15rem;color:var(--gold);overflow-wrap:anywhere}
.helper{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--muted)}
.perks{display:flex;flex-wrap:wrap;gap:8px}
.perk{min-height:44px;padding:6px 14px;border-radius:12px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-weight:600;font-size:.92rem;cursor:pointer}
.perk.na{border-color:var(--line);color:var(--muted)}
.perk.used{border-color:var(--line-soft);color:var(--muted);text-decoration:line-through;cursor:not-allowed}
.perk.set{background:var(--gold);color:var(--gold-ink)}
.witness{border:1px solid var(--blue);border-radius:14px;background:rgba(29,78,216,.1);padding:14px 16px}
.witness b{color:var(--cyan)}
.timerbox{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media(max-width:520px){.timerbox{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .bg{stroke:var(--line-soft)}
.ring .fg{stroke:var(--cyan);transition:stroke-dashoffset .25s linear}
.ring.low .fg{stroke:var(--bad)}
.ring.ended .fg{stroke:var(--bad)}
.clock{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-size:2.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.tcontrols{display:flex;flex-direction:column;gap:10px;min-width:0;width:100%}
.timeup{border:1px solid var(--bad);color:#9E1219;background:rgba(211,47,47,.12);border-radius:12px;padding:10px 14px;font-weight:700;text-align:center}
.notes{display:grid;gap:6px;font-size:.92rem;color:var(--muted)}

/* voting */
.vkind{display:flex;flex-direction:column;gap:6px;border-radius:14px;padding:14px 16px;border:1px solid var(--cyan);background:rgba(29,78,216,.08)}
.vkind.appeal{border-color:var(--gold);background:rgba(225,29,46,.09)}
.vkind b{font-family:var(--font-d);font-size:1.15rem}
.vopts{display:grid;gap:14px}
.vopt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;min-height:78px;padding:12px 16px;border:2px solid var(--line);border-radius:16px;background:var(--bg-2);cursor:pointer;text-align:start}
.vopt.on{border-color:var(--cyan);background:rgba(29,78,216,.12)}
.vopt .vt{display:flex;flex-direction:column;min-width:0}
.vopt .vt b{font-size:1.1rem;overflow-wrap:anywhere}
.vopt .vt span{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.vopt.none{grid-template-columns:1fr auto;border-style:dashed}
.radio{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.on .radio{border-color:var(--cyan);background:var(--cyan);color:var(--ink)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:130px 1fr 36px;align-items:center;gap:10px}
@media(max-width:520px){.bar{grid-template-columns:90px 1fr 30px}}
.bar .track{height:16px;border-radius:99px;background:var(--bg);border:1px solid var(--line-soft);overflow:hidden}
.bar .fill{height:100%;background:var(--blue);border-radius:99px}
.bar.lead .fill{background:var(--gold)}
.bar .nm{overflow-wrap:anywhere;font-weight:600}
.verdict{text-align:center;padding:22px 16px;border:1px solid var(--gold);background:rgba(225,29,46,.08);border-radius:var(--r)}
.verdict h2{color:var(--gold);font-size:1.6rem}
.jrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg-2)}

/* scoreboard */
.rank{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank li{display:grid;grid-template-columns:40px auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}
.rank li.win{border-color:var(--gold);background:rgba(225,29,46,.1)}
.rank .pos{font-family:var(--font-d);font-size:1.3rem;color:var(--muted);text-align:center}
.rank .win .pos{color:var(--gold)}
.rank .pts{font-family:var(--font-d);font-size:1.4rem;color:var(--gold);font-variant-numeric:tabular-nums}
.winner{text-align:center;padding:26px 16px;border:1px solid var(--gold);border-radius:var(--r);background:rgba(225,29,46,.09);display:flex;flex-direction:column;align-items:center;gap:8px}
.winner h2{font-size:clamp(1.8rem,6vw,2.6rem);color:var(--gold)}
.cases{display:grid;gap:12px}
.cr{border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2);padding:14px 16px;display:grid;gap:6px}
.cr .q{font-weight:700}
.cr .v{display:flex;flex-wrap:wrap;gap:8px}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(14,22,48,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0;overflow:auto}
@media(min-width:640px){.ov{align-items:center;padding:20px}}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px;direction:rtl}
@media(min-width:640px){.dlg{border-radius:20px}}
.dlg h2{font-size:1.4rem}
.cands{display:grid;gap:10px}
.cand{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);cursor:pointer;text-align:start;width:100%}
.cand:hover{border-color:var(--cyan)}
#toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50;padding-inline:16px}
#toast span{background:#0F2233;color:#fff!important;border:1px solid var(--cyan);color:var(--text);padding:12px 18px;border-radius:14px;max-width:520px;box-shadow:0 8px 30px rgba(14,22,48,.25);opacity:0;transform:translateY(8px);transition:.2s}
#toast.show span{opacity:1;transform:none}
/* splash */
.splash{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:40px 8px;position:relative}
.splash .blob{position:fixed;inset:auto;width:520px;height:520px;border-radius:50%;filter:blur(70px);opacity:.32;z-index:-1;pointer-events:none}
.splash .b1{background:#E11D2E;top:-180px;inset-inline-start:-160px}
.splash .b2{background:#1D4ED8;bottom:-200px;inset-inline-end:-180px}
.splash .lg{animation:up .7s ease both;margin-bottom:8px}
.splash .big{font-family:var(--font-d);font-weight:900;font-size:clamp(4rem,19vw,8rem);line-height:1.1;background:linear-gradient(90deg,#E11D2E 0 50%,#1D4ED8 50% 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-inline:.1em;animation:up .7s .1s ease both}
.splash .ar{font-family:var(--font-d);font-weight:700;font-size:clamp(1.6rem,6vw,2.2rem);color:var(--text);margin-top:6px;animation:up .7s .25s ease both}
.splash .en{font-family:var(--font-d);font-weight:600;letter-spacing:.42em;color:var(--cyan);font-size:.95rem;padding-inline-start:.42em;animation:up .7s .35s ease both}
.splash .go{margin-top:34px;width:100%;max-width:320px;min-height:64px;font-size:1.3rem;font-weight:800;border-radius:99px;animation:up .7s .5s ease both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* online rooms */
.bigcode{font-family:var(--font-d);font-weight:900;font-size:clamp(2.6rem,13vw,3.6rem);letter-spacing:.18em;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-inline-start:.18em}
.roomcard{text-align:center;display:grid;gap:8px;justify-items:center}
.linkrow{display:flex;gap:8px;width:100%;flex-wrap:wrap}
.linkrow .field{flex:1 1 220px;font-size:.85rem;min-height:46px;text-align:left}
.linkrow .btn{flex:0 0 auto;min-height:46px}
.code-in{font-family:var(--font-d);font-size:1.4rem;letter-spacing:.3em;text-align:center;text-transform:uppercase}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 4px;border-radius:99px;border:1px solid var(--line-soft);background:var(--bg-2);color:var(--muted);font-size:.9rem}
.pchip.ok{border-color:var(--ok);color:var(--ok);background:rgba(23,147,90,.07)}
.party.mine{box-shadow:0 0 0 2px var(--gold) inset}
.card.action{border:2px solid var(--cyan);background:#F2F8FF}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line-soft);border-top-color:var(--cyan);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
input.field{font-size:16px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}



.hero .sub{font-family:var(--font-d);font-weight:700;font-size:1.5rem;color:var(--gold);margin-top:-6px}
.wallet{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wallet div{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(14,22,48,.06)}
.wallet span{font-size:.78rem;color:var(--muted)}
.wallet b{font-family:var(--font-d);font-size:1.05rem;color:var(--cyan)}
.wallet div:last-child b{color:var(--gold)}
.parties .price{font-family:var(--font-d);font-size:1.5rem;font-weight:800;color:var(--gold)}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper .btn{width:64px;min-height:64px;font-size:1.8rem;padding:0;border-radius:50%}
.bigprice{font-family:var(--font-d);font-weight:900;font-size:4rem;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;min-width:120px}
.bigprice small{font-size:1rem;margin-inline-start:6px;-webkit-text-fill-color:var(--muted)}
.tbl{display:grid;gap:6px}
.tr{display:grid;grid-template-columns:18px minmax(0,1fr) 36px 42px 38px 46px;gap:4px;align-items:center;padding:8px 10px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg-2);font-size:.92rem}
.tr.th{background:transparent;border-color:transparent;color:var(--muted);font-size:.78rem;padding-block:0}
.tr span{text-align:center}
.tr .nm{display:flex;align-items:center;gap:6px;text-align:start;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.tr .tot{font-family:var(--font-d);font-weight:800;color:var(--gold)}
.tr.win{border-color:var(--gold);background:rgba(225,29,46,.08)}
.tr.me{box-shadow:0 0 0 2px var(--cyan) inset}
.award{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.award b{font-family:var(--font-d);font-size:1.3rem;color:var(--cyan)}
.qcard h2{color:var(--cyan)}

.perk-pick{grid-template-columns:1fr}
.perk-pick span{color:var(--muted);font-size:.9rem;line-height:1.5}
.perk-pick em{font-style:normal;font-size:.78rem;color:var(--cyan);font-weight:600}
.perk-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:56px;padding:8px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);cursor:pointer;text-align:start;font:inherit}
.perk-btn b{font-family:var(--font-d);font-size:.98rem;color:var(--text)}
.perk-btn span{font-size:.8rem}
.perk-btn.ready{border-color:var(--gold);background:rgba(225,29,46,.09);color:var(--gold)}
.perk-btn.ready b{color:var(--gold)}
.perk-btn.used{opacity:.55;text-decoration:line-through}
.perk-btn[aria-disabled=true]{cursor:not-allowed}
.perk-btn:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.perklog{display:grid;gap:6px;border:1px solid var(--cyan);background:rgba(29,78,216,.07);border-radius:14px;padding:10px 14px;font-size:.92rem;font-weight:600;color:var(--text)}
.chip.bad{border-color:var(--bad);color:var(--bad);background:rgba(211,47,47,.08)}

.splash .b3{background:#FFC93C;top:40%;inset-inline-end:-220px;width:380px;height:380px}
body{background-image:linear-gradient(180deg,rgba(29,78,216,.07),transparent 260px)}
.hero .sub{font-family:var(--font-d);font-weight:800;font-size:1.6rem;color:var(--gold);margin-top:-6px}
.top .brand span{color:var(--gold)}
.row-b{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:#C3CADB;flex:none;display:inline-block;box-shadow:0 0 0 3px #fff}
.dot.on{background:#16A34A}
.prow{display:flex;align-items:center;gap:10px;border:1px solid var(--line-soft);border-radius:12px;padding:10px 12px;background:var(--bg-2)}
/* stepper */
.steps{display:flex;gap:4px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.st{flex:1 0 auto;display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:99px;background:var(--bg-2);color:var(--muted);font-size:.76rem;white-space:nowrap}
.st i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);font-size:.7rem}
.st.done{color:var(--blue)}.st.done i{background:var(--blue);color:#fff;border-color:var(--blue)}
.st.on{background:var(--blue);color:#fff;font-weight:700}.st.on i{background:var(--yel);color:#0E1630;border-color:var(--yel)}
.st b{font-weight:inherit}
/* picks */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.slot{border:2px dashed var(--line);border-radius:14px;padding:10px 12px;background:#fff;display:flex;flex-direction:column;gap:2px;text-align:start;cursor:pointer;min-height:64px}
.slot span{font-size:.8rem;color:var(--muted)}
.slot.set{border-style:solid;border-color:var(--blue);background:rgba(29,78,216,.05)}
.slot.set:first-child{border-color:var(--gold);background:rgba(225,29,46,.05)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:inset 0 -3px 0 var(--yel)}
.tcard{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line-soft);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.tcard b{font-family:var(--font-d)}
.pkbtns{display:flex;gap:6px}
.pkbtns .btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pkbtns .btn.on:first-child{background:var(--gold);border-color:var(--gold)}
.src{font-size:.78rem;color:var(--muted);text-align:center;line-height:1.6}
/* tier */
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tier{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;border:2px solid var(--line);border-radius:16px;padding:16px 10px;background:#fff;cursor:pointer}
.tier .big{font-family:var(--font-d);font-size:1.7rem;font-weight:800}
.tier.s .big{color:var(--gold)}.tier.w .big{color:var(--blue)}
.tier.on.s{border-color:var(--gold);background:rgba(225,29,46,.06)}
.tier.on.w{border-color:var(--blue);background:rgba(29,78,216,.06)}
/* reveal & pitch */
.reveal{text-align:center;display:grid;gap:6px;justify-items:center;border-top:5px solid var(--yel)}
.big2{font-size:clamp(2rem,9vw,3rem);font-weight:800;color:var(--blue)}
.pitch{background:linear-gradient(180deg,#1F8A4C,#17733F);border-radius:16px;padding:14px 8px;display:grid;gap:12px;position:relative;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 2px #17733F}
.pitch::before{content:"";position:absolute;inset:50% 8px auto;height:2px;background:rgba(255,255,255,.35)}
.pitch .line{display:flex;justify-content:space-around;gap:4px;position:relative}
.pp{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;flex:1;max-width:96px}
.pp i{font-style:normal;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:.8rem;border:2px solid var(--yel)}
.pp b{font-size:.72rem;color:#fff;text-align:center;line-height:1.25;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pitch.mini{padding:10px 4px;gap:8px}
.pitch.mini .pp i{width:24px;height:24px;font-size:.7rem}
.pitch.mini .pp b{font-size:.64rem}
.teamhead h2{color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpis div{border:1px solid var(--line-soft);border-radius:12px;padding:8px;text-align:center;display:flex;flex-direction:column;background:var(--bg-2)}
.kpis span{font-size:.76rem;color:var(--muted)}
.kpis b{font-family:var(--font-d);color:var(--blue);font-size:1rem}
.rtable{display:grid;gap:6px}
.rr{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line-soft);border-radius:12px;padding:8px 10px;background:#fff}
.rr[role=button]{cursor:pointer}
.rr .nb{width:30px;height:30px;border-radius:8px;background:var(--bg-2);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.rr.xi .nb{background:rgba(29,78,216,.1);color:var(--blue)}
.rr .nm{display:flex;flex-direction:column;min-width:0}
.rr .nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .nm small{color:var(--muted);font-size:.74rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .vl{font-size:.8rem;color:var(--muted);white-space:nowrap}
.rr.sel{border-color:var(--gold);background:rgba(225,29,46,.05);box-shadow:inset 4px 0 0 var(--gold)}
.rr .ask{grid-column:1/-1;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.askin{width:84px;min-height:40px;text-align:center;padding:4px}
.btn.sm{min-height:40px}
/* market */
.mkhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:3px solid var(--yel);padding-bottom:10px}
.mkhead h2{margin-top:6px}
.kpi1{display:flex;flex-direction:column;align-items:flex-end}
.kpi1 span{font-size:.78rem;color:var(--muted)}
.kpi1 b{font-family:var(--font-d);color:var(--blue);font-size:1.2rem;white-space:nowrap}
.lgrid{display:grid;gap:8px}
.lcard{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;display:grid;gap:8px}
.lcard.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(29,78,216,.15)}
.lc-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.lc-top .nm{display:flex;flex-direction:column;min-width:0}
.lc-top .nm small{color:var(--muted);font-size:.74rem}
.pos{font-size:.72rem;font-weight:700;border-radius:8px;padding:4px 8px;color:#fff;white-space:nowrap}
.pos.GK{background:#F59E0B}.pos.DF{background:#1D4ED8}.pos.MF{background:#16A34A}.pos.FW{background:#E11D2E}
.ref{display:flex;flex-direction:column;align-items:flex-end}
.ref span{font-size:.7rem;color:var(--muted)}
.ref b{white-space:nowrap}
.lc-bid{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bidctl{display:flex;align-items:center;gap:4px}
.deals{display:grid;gap:6px}
.deal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;border:1px solid var(--line-soft);border-radius:12px;padding:8px 12px}
.deal .muted{grid-column:1}
.deal .price{grid-row:1/3;grid-column:2;align-self:center;color:var(--gold);white-space:nowrap;font-family:var(--font-d)}
.deal.me{border-color:var(--blue);background:rgba(29,78,216,.04)}
.chip.ok{border-color:#16A34A;color:#16A34A}.chip.bad{border-color:var(--gold);color:var(--gold)}
/* cup */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs .side h3{text-align:center;margin-bottom:6px;color:var(--blue)}
.vs .side:last-child h3{color:var(--gold)}
.bracket{display:flex;gap:10px;overflow-x:auto}
.bround{display:flex;flex-direction:column;gap:8px;min-width:130px;justify-content:space-around}
.bm{border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;font-size:.84rem;background:#fff}
.bm .w{font-weight:800;color:var(--blue)}.bm .l{color:var(--muted);text-decoration:line-through}
.bm.live{border-color:var(--yel);box-shadow:0 0 0 2px var(--yel)}
.tr{grid-template-columns:18px minmax(0,1fr) 34px 34px 40px 34px 46px!important}

.vs{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:6px;padding:10px}
.vs .side{min-width:0}
.vs .pitch{padding:8px 2px;gap:6px;border-width:2px}
.vs .pitch .line{gap:1px}
.vs .pp{max-width:none}
.vs .pp i{width:20px;height:20px;font-size:.6rem;border-width:1px}
.vs .pp b{font-size:.56rem;word-break:break-word;white-space:normal}
.steps{flex-wrap:nowrap}
.wrap{overflow-x:clip}
</style>

  function decideView() {

  async function loadMe(code) {

  function onInputs(snap) {

  /* heartbeat: lets the host show who is connected */

  /* ---------- host engine ---------- */
  function hostStep() {
    if (!isHost() || !G) return;
    let ch = false;
    SEEN[ME_ID] = Date.now();
    Object.keys(INP).forEach(id => {
      const d = INP[id];
      if (!d || id === ME_ID) return;
      const p = G.players.find(x => x.id === id);
      if (G.phase === 'lobby' && p && (d.room !== G.code || !d.name)) { G.players = G.players.filter(x => x.id !== id); ch = true; return; }
      if (d.room !== G.code) return;
      if (G.phase === 'lobby' && !p && !G.kicked[id] && d.name && G.players.length < 16) {
        G.players.push({ id, name: uniqueName(d.name, id), at: d.at || 0 }); ch = true;
      } else if (G.phase === 'lobby' && p && d.at && d.at > (p.at || 0)) { p.name = uniqueName(d.name, id); p.at = d.at; ch = true; }
    });
    if (botsAct()) ch = true;
    const on = G.players.filter(p => isBot(p.id) || SEEN[p.id] && Date.now() - SEEN[p.id] < (TEST ? 10000 : 50000)).map(p => p.id);
    if (JSON.stringify(on) !== JSON.stringify(G.online || [])) { G.online = on; ch = true; }
    const pr = progList();
    if (JSON.stringify(pr) !== JSON.stringify(G.prog || [])) { G.prog = pr; ch = true; }
    if (G.phase === 'market' && G.mk && G.mk.stage === 'bid') {
      const top = {};
      Object.keys(G.mk.lst).forEach(l => { const bs = bidsOn(l); if (bs.length) top[l] = [Math.max(...bs.map(b => b.a)), bs.length]; });
      if (JSON.stringify(top) !== JSON.stringify(G.mk.top || {})) { G.mk.top = top; ch = true; }
    }
    if (autoStep(false)) ch = true;
    if (ch) publish();

  }
  /* test bots: the host plays them so one person can try the whole game */
  function botsAct() {
    const bots = G.players.filter(p => isBot(p.id)); if (!bots.length) return false;
    const g = G.gameNo, mk = G.mk, cup = G.cup, rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    bots.forEach(p => {
      const b = BOT[p.id] = BOT[p.id] || {};
      if (G.phase === 'picks' && !(b.picks && b.picks.g === g)) { const t = shuffle(TEAMS.map(x => x.id)); b.picks = { g, s: t[0], w: t[1] }; }
      if (G.phase === 'tier' && !(b.tier && b.tier.g === g)) b.tier = { g, v: Math.random() < .5 ? 's' : 'w' };
      if (G.phase === 'reveal') b.ready = { k: 'reveal' + g };
      if (G.phase === 'market' && mk) {
        if (mk.stage === 'list' && !(b.list && b.list.key === mk.key)) {
          const r = shuffle(roster(p.id)).slice(0, rnd(1, 2)), items = {};
          r.forEach(k => { items[k] = Math.max(1, Math.round(val(k)) + rnd(0, 6)); });
          if (r.length) b.list = { key: mk.key, items };
        }
        if (mk.stage === 'bid' && !(b.bids && b.bids.key === mk.key)) {
          const bb = {}; let money = bal(p.id);
          shuffle(Object.keys(mk.lst)).forEach(l => {
            const L = mk.lst[l]; if (L.seller === p.id || Object.keys(bb).length >= 3 || Math.random() < .45) return;
            const a = L.ask + rnd(0, 5); if (a <= money) { bb[l] = a; money -= a; }
          });
          b.bids = { key: mk.key, b: bb, done: true };
        }
        if (mk.stage === 'review') b.ready = { k: mk.key };
      }
      if (G.phase === 'lineup' && !(b.xi && b.xi.g === g && validXI(p.id, b.xi.list))) b.xi = { g, list: suggestXI(p.id) };
      if (G.phase === 'cup' && cup && cup.stage === 'vote' && !(b.vote && b.vote.key === cup.key)) b.vote = { key: cup.key, v: Math.random() < .5 ? 'a' : 'b' };
    });
    return false;
  }
  function uniqueName(n, id) {
    let base = String(n || '').trim().slice(0, 20) || 'لاعب', name = base, k = 2;
    while (G.players.some(p => p.id !== id && norm(p.name) === norm(name))) name = base + ' ' + (k++);
    return name;
  }
  const ids = () => G.players.map(p => p.id);
  function progList() {
    const g = G.gameNo, mk = G.mk, cup = G.cup;
    if (G.phase === 'picks') return ids().filter(id => { const x = inp(id).picks; return x && x.g === g && x.s && x.w; });
    if (G.phase === 'tier') return ids().filter(id => { const x = inp(id).tier; return x && x.g === g && x.v; });
    if (G.phase === 'reveal') return ids().filter(id => { const x = inp(id).ready; return x && x.k === 'reveal' + g; });
    if (G.phase === 'market' && mk) {
      if (mk.stage === 'list') return ids().filter(id => { const x = inp(id).list; return x && x.key === mk.key; });
      if (mk.stage === 'bid') return ids().filter(id => { const x = inp(id).bids; return x && x.key === mk.key && x.done; });
      if (mk.stage === 'review') return ids().filter(id => { const x = inp(id).ready; return x && x.k === mk.key; });
    }
    if (G.phase === 'lineup') return ids().filter(id => { const x = inp(id).xi; return x && x.g === g && validXI(id, x.list); });
    if (G.phase === 'cup' && cup && cup.stage === 'vote') { const m = curMatch(); return voters(m).filter(id => { const x = inp(id).vote; return x && x.key === cup.key; }); }
    return [];
  }
  function hostTickFn() {
    if (!isHost() || !G) return;
    if (G.players.some(p => isBot(p.id))) hostStep();
    const t = G.phase === 'market' && G.mk ? G.mk.endsAt : (G.phase === 'cup' && G.cup ? G.cup.endsAt : 0);
    if (t && Date.now() >= t) { beep(); if (autoStep(true)) { publish(); render(); } }
  }
  /* moves timed stages on when time is up (or force), and untimed ones when everyone is ready */
  function autoStep(force) {
    const n = G.players.length, done = progList().length;
    if (G.phase === 'market' && G.mk) {
      const mk = G.mk, up = force || (mk.endsAt && Date.now() >= mk.endsAt);
      if (mk.stage === 'list' && (up || done >= n)) { openBidding(); return true; }

      if (mk.stage === 'review' && (up || done >= n)) { nextMarket(); return true; }
    }
    if (G.phase === 'cup' && G.cup && G.cup.stage === 'vote') {

    }
    return false;
  }

  /* phase transitions */
  function startGame() {
    G.gameNo = (G.gameNo || 0) + 1;
    ['picks', 'tier', 'team', 'note', 'own', 'val', 'bal', 'start', 'stats', 'xi'].forEach(k => { G[k] = {}; });
    G.mk = null; G.hist = []; G.cup = null; G.prog = [];
    G.phase = 'picks';
  }
  function lockPicks() {
    G.players.forEach(p => {
      const x = inp(p.id).picks;
      G.picks[p.id] = x && x.g === G.gameNo && TM[x.s] && TM[x.w] && x.s !== x.w ? { s: x.s, w: x.w } : null;
    });
    G.phase = 'tier'; G.prog = [];
  }
  function assignTeams() {
    const pl = ids();
    pl.forEach(id => { const x = inp(id).tier; G.tier[id] = x && x.g === G.gameNo && (x.v === 's' || x.v === 'w') ? x.v : 'w'; });
    const own = id => { const k = G.picks[id]; return k ? [k.s, k.w] : []; };
    const poolFor = (id, tier) => {
      let pool = [];
      pl.forEach(o => { if (o !== id && G.picks[o]) pool.push(G.picks[o][tier]); });
      pool = pool.filter(t => !own(id).includes(t));
      return pool;
    };
    let best = null;
    for (let tries = 0; tries < 300; tries++) {
      const used = new Set(), res = {}, note = {};
      let dup = 0;
      shuffle(pl).forEach(id => {
        const t = G.tier[id];
        let pool = poolFor(id, t), why = '';
        if (!pool.length) { pool = poolFor(id, t === 's' ? 'w' : 's'); why = 'other'; }
        if (!pool.length) { pool = TEAMS.map(x => x.id).filter(x => !own(id).includes(x)); why = 'lib'; }
        const fresh = pool.filter(x => !used.has(x));
        const pickFrom = fresh.length ? fresh : pool;
        if (!fresh.length) dup++;
        const tid = pickFrom[Math.floor(Math.random() * pickFrom.length)];
        used.add(tid); res[id] = tid; note[id] = why;

      if (!best || dup < best.dup) best = { dup, res, note };
      if (!dup) break;
    }

    pl.forEach(id => {
      const tid = best.res[id];
      G.team[id] = tid; G.note[id] = best.note[id];
      TM[tid].pl.forEach((r, i) => { G.own[tid + '.' + i + (best.dup ? '.' + id.slice(-4) : '')] = id; });

  }
  function startMarket(no) {
    G.phase = 'market';
    G.mk = { no, key: uid('m'), stage: 'list', endsAt: Date.now() + G.settings.listSec * 1000, dur: G.settings.listSec, lst: {}, top: {}, res: [], auto: [] };
    G.prog = [];
  }
  function openBidding() {
    const mk = G.mk;
    mk.lst = {}; mk.auto = [];
    G.players.forEach(p => {
      const r = roster(p.id); if (!r.length) return;
      const x = inp(p.id).list;
      let items = x && x.key === mk.key && x.items ? Object.keys(x.items).filter(k => G.own[k] === p.id).slice(0, 10) : [];
      if (!items.length) {
        const k = r[Math.floor(Math.random() * r.length)];
        items = [k]; mk.auto.push(p.id);
        mk.lst[uid('l')] = { pk: k, seller: p.id, ask: val(k) };
      } else items.forEach(k => { const a = Math.round(+x.items[k] || 0); mk.lst[uid('l')] = { pk: k, seller: p.id, ask: Math.min(MAXP, Math.max(1, a || val(k))) }; });
    });

  }
  function bidsOn(lid) {
    const mk = G.mk, L = mk.lst[lid], out = [];

  function resolveMarket() {
    const mk = G.mk, res = [];

    const buys = {};
    shuffle(lids).sort((a, b) => tops[b] - tops[a]).forEach(lid => {
      const L = mk.lst[lid], P_ = PL(L.pk);

      const left = roster(L.seller).filter(k => k !== L.pk);
      if (left.length < 11 || !gkCount(left)) { res.push({ pk: L.pk, seller: L.seller, ask: L.ask, price: 0, buyer: null, why: 'keep11' }); return; }

  /* lineup & cup */
  function validXI(id, list) {
    if (!Array.isArray(list) || list.length !== 11) return false;

  function suggestXI(id) {

  function startCup() {
    G.players.forEach(p => { const x = inp(p.id).xi; G.xi[p.id] = x && x.g === G.gameNo && validXI(p.id, x.list) ? x.list : suggestXI(p.id); });

    for (let i = 0; i < size / 2; i++) {

  function closeVote() {
    const c = G.cup, m = curMatch();

    // votes are stored by screen side; map back to players
    const left = c.flip ? m.b : m.a, right = c.flip ? m.a : m.b;
    const va = t.a, vb = t.b;
    m.votes = { [left]: va, [right]: vb };

    c.stage = 'result'; c.endsAt = 0; c.dur = 0; G.prog = [];
  }

  /* ---------- scoring ---------- */
  function scores() {
    if (!G || !G.players.length) return [];
    const n = G.players.length, pl = ids();
    const rankPts = (key, max) => {
      const v = id => (G.stats[id] || {})[key] || 0;
      return id => { const x = v(id); if (!x) return 0; const rank = 1 + pl.filter(o => v(o) > x).length; return Math.round(max * (n - rank + 1) / n * 10) / 10; };
    };
    const sp = rankPts('sold', 10), bp = rankPts('bought', 10);
    const growth = id => { const s = G.start[id] || 1; return (assets(id) - s) / s; };
    const gmax = Math.max(0, ...pl.map(growth));
    const c = G.cup, R = c ? c.R : 1;
    const cupPts = id => {
      if (!c) return 0;
      if (c.champ === id) return 50;
      const k = c.out[id]; if (!k) return 0;
      return Math.round(10 + (k - 1) * 40 / R);
    };
    return pl.map(id => {
      const g = growth(id);
      const r = { id, sold: sp(id), bought: bp(id), port: g > 0 && gmax > 0 ? Math.round(30 * g / gmax * 10) / 10 : 0, cup: cupPts(id), growth: g, assets: assets(id) };
      r.market = Math.round((r.sold + r.bought + r.port) * 10) / 10;
      r.total = Math.round((r.market + r.cup) * 10) / 10;
      return r;
    });
  }

  /* ---------- views ---------- */
  const STEPS = [['lobby', 'الغرفة'], ['picks', 'التشكيلات'], ['tier', 'الفئة'], ['reveal', 'فريقك'], ['market', 'السوق'], ['lineup', 'التشكيلة'], ['cup', 'الكأس'], ['final', 'النتائج']];
  function stepper() {
    if (!G) return '';
    const i = STEPS.findIndex(s => s[0] === G.phase);
    return '<nav class="steps" aria-label="مراحل اللعبة">' + STEPS.map((s, k) => '<span class="st ' + (k < i ? 'done' : k === i ? 'on' : '') + '"><i>' + (k + 1) + '</i><b>' + s[1] + '</b></span>').join('') + '</nav>';
  }
  function topbar() {
    const inG = !!G && !!U.code;

    if (!G || !inRoom(ME_ID)) return;
    G.host = ME_ID; await flushDirect(); becomeHost(); toast('صرت المضيف.'); render();
  };
  ACT.create = async () => {
    const name = U.name.trim();
    if (!name) { U.err = 'اكتب اسمك أو لقبك أول.'; return; }
    if (U.busy) return false;
    U.busy = true; U.err = ''; render();
    try {
      let code = '';
      for (let i = 0; i < 6; i++) {
        code = Array.from({ length: 4 }, () => CODE_CH[Math.floor(Math.random() * CODE_CH.length)]).join('');
        const s = await db.doc(roomPath(code)).get();
        if (!s.exists) break;
      }
      G = freshRoom(code);
      G.players.push({ id: ME_ID, name, at: Date.now() });
      ME = blankMe(code); U.code = code;
      await db.doc(inpPath(code, ME_ID)).set(clone(ME));
      G.rev = 1; G.sentAt = Date.now();
      await db.doc(roomPath(code)).set(clone(G));
      hostOn = false;
      await subscribe(code);
      U.view = 'game';
      becomeHost();
    } catch (e) { G = null; U.code = ''; writeFailed(e); }
    U.busy = false;
  };
  ACT.join = async () => {
    const code = String(U.draft.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 4) { U.err = 'اكتب رمز الغرفة (٤ أحرف).'; return; }
    if (!U.name.trim()) { U.err = 'اكتب اسمك أو لقبك أول.'; return; }
    U.err = ''; U.busy = true; render();
    await openRoom(code, true);
    U.busy = false;
  };
  async function openRoom(code, autoJoin) {
    G = null; ME = null; U.view = 'connecting'; U.code = code;
    await loadMe(code);
    await subscribe(code);
    if (autoJoin && U.name.trim()) {
      await new Promise(res => { let n = 0; const t = setInterval(() => { if (G || !U.code || ++n > 40) { clearInterval(t); res(); } }, 250); });
      if (G && !inRoom(ME_ID) && G.phase === 'lobby') await sendJoin();
    }
  }
  async function sendJoin() {
    ME = Object.assign(ME && ME.room === U.code ? ME : blankMe(U.code), { room: U.code, name: U.name.trim(), at: Date.now(), hb: Date.now() });
    lsSet({ name: U.name.trim() });
    U.view = 'wait';
    await saveMe(); render();
  }
  ACT.sendJoin = async () => { if (!U.name.trim()) { U.err = 'اكتب اسمك أو لقبك.'; return; } U.err = ''; await sendJoin(); };
  ACT.copyLink = () => {
    const link = ART_URL + '#room-' + G.code;
    try { navigator.clipboard.writeText(link).then(() => toast('نسخنا رابط الدعوة.'), () => selectLink()); } catch (e) { selectLink(); }
    return false;
  };
  function selectLink() { const i = document.getElementById('lnk'); if (i) { i.focus(); i.select(); } toast('انسخ الرابط من الخانة.'); }

  /* host controls */
  ACT.kick = H(d => { G.players = G.players.filter(p => p.id !== d.id); G.kicked[d.id] = true; delete BOT[d.id]; });
  ACT.addBot = H(() => {
    if (G.phase !== 'lobby' || G.players.length >= 8) return false;
    const used = G.players.filter(p => isBot(p.id)).length;
    const nm = ['بوت الهلال', 'بوت النجم', 'بوت الصقر', 'بوت الريان', 'بوت الشبح', 'بوت الكابتن', 'بوت المدرب'][used % 7];
    G.players.push({ id: 'bot' + Math.random().toString(36).slice(2, 8), name: uniqueName(nm, ''), at: Date.now() });
    setTimeout(hostStep, 50);
  });
  ACT.set = H(d => { G.settings[d.k] = +d.v; });
  ACT.startGame = H(() => { if (G.players.length < 3) { U.err = 'تحتاج ٣ لاعبين على الأقل.'; return false; } U.err = ''; startGame(); });
  ACT.picksNext = H(() => {
    if (G.phase !== 'picks') return false;
    const done = progList();
    if (done.length < 2) { toast('لازم لاعبَين على الأقل يكملون اختياراتهم.'); return false; }
    if (done.length < G.players.length && !U.forceOk) { U.forceOk = true; toast('فيه لاعبين ما كملوا. اضغط مرة ثانية للمتابعة بدونهم.'); return false; }
    U.forceOk = false; lockPicks();
  });
  ACT.tierNext = H(() => {
    if (G.phase !== 'tier') return false;
    if (progList().length < G.players.length && !U.forceOk) { U.forceOk = true; toast('فيه لاعبين ما اختاروا. اللي ما يختار ياخذ «الأضعف». اضغط مرة ثانية للمتابعة.'); return false; }
    U.forceOk = false; assignTeams();
  });
  ACT.revealNext = H(() => { if (G.phase !== 'reveal') return false; startMarket(1); });
  ACT.skip = H(() => { if (!autoStep(true)) return false; });
  ACT.cupStart = H(() => { if (G.phase !== 'lineup') return false; startCup(); });
  ACT.cupNext = H(() => { if (!G.cup || G.cup.stage !== 'result') return false; nextMatch(); });
  ACT.rematch = H(() => { startGame(); });
  ACT.toLobby = H(() => { G.phase = 'lobby'; G.mk = null; G.cup = null; G.prog = []; });

  /* my inputs */
  function mine() { ME = ME || blankMe(U.code); return ME; }
  ACT.lg = d => { U.lg = d.v; };
  ACT.pickTeam = d => { const o = d.k === 's' ? 'w' : 's'; if (U.pk[o] === d.id) U.pk[o] = null; U.pk[d.k] = d.id; };
  ACT.clearPick = d => { U.pk[d.k] = null; };
  ACT.sendPicks = async () => { if (!U.pk.s || !U.pk.w) return false; mine().picks = { g: G.gameNo, s: U.pk.s, w: U.pk.w }; render(); await saveMe(); };
  ACT.tierPick = d => { U.tierPick = d.v; };
  ACT.sendTier = async () => { if (!U.tierPick) return false; mine().tier = { g: G.gameNo, v: U.tierPick }; render(); await saveMe(); };
  ACT.ready = async d => { mine().ready = { k: d.k }; render(); await saveMe(); };
  ACT.toggleList = (d, el, ev) => {
    if (ev.target.closest('[data-stop]')) return false;
    if (d.k in U.lst) delete U.lst[d.k];
    else { if (Object.keys(U.lst).length >= 10) { toast('بحد أقصى ١٠ لاعبين.'); return false; } U.lst[d.k] = Math.round(val(d.k)) || G.settings.base; }
  };
  ACT.askAdj = d => { U.lst[d.k] = Math.min(MAXP, Math.max(1, (+U.lst[d.k] || 1) + (+d.v))); };
  ACT.sendList = async () => {
    const mk = G.mk; if (!mk || mk.stage !== 'list') return false;
    const items = {}; Object.keys(U.lst).forEach(k => { if (G.own[k] === ME_ID) items[k] = Math.min(MAXP, Math.max(1, Math.round(+U.lst[k] || 1))); });
    if (!Object.keys(items).length) { toast('اختر لاعب واحد على الأقل.'); return false; }
    mine().list = { key: mk.key, items }; render(); await saveMe();
  };
  ACT.bidNew = d => {
    const mk = G.mk; if (!mk || mk.stage !== 'bid') return false;
    if (Object.keys(U.bids).length >= 10) { toast('بحد أقصى ١٠ عروض بالسوق.'); return false; }
    const L = mk.lst[d.l], top = mk.top && mk.top[d.l];
    U.bids[d.l] = Math.max(L.ask, top ? top[0] + 1 : L.ask);
    pushBids(false);
  };
  ACT.bidAdj = d => { const L = G.mk.lst[d.l]; U.bids[d.l] = Math.min(MAXP, Math.max(L.ask, (+U.bids[d.l] || L.ask) + (+d.v))); pushBids(false); };
  ACT.bidDel = d => { delete U.bids[d.l]; pushBids(false); };
  ACT.sendBids = () => pushBids(true);
  ACT.bidEdit = () => { mine().bids = Object.assign({}, ME.bids, { done: false }); render(); saveMe(); };
  let bidT = null;
  function pushBids(done) {
    const mk = G.mk; if (!mk || mk.stage !== 'bid') return false;
    const b = {}; Object.keys(U.bids).forEach(l => { const L = mk.lst[l]; if (L && L.seller !== ME_ID) b[l] = Math.min(MAXP, Math.max(L.ask, Math.round(+U.bids[l] || L.ask))); });
    mine().bids = { key: mk.key, b, done: !!done };
    render();
    clearTimeout(bidT); bidT = setTimeout(saveMe, 250);
  }
  ACT.xiToggle = d => {
    const i = U.xi.indexOf(d.k);
    if (i >= 0) U.xi.splice(i, 1);
    else { if (U.xi.length >= 11) { toast('عندك ١١ لاعب. شيل واحد أول.'); return false; } U.xi.push(d.k); }
  };
  ACT.xiAuto = () => { U.xi = suggestXI(ME_ID); };
  ACT.sendXI = async () => { if (!validXI(ME_ID, U.xi)) return false; mine().xi = { g: G.gameNo, list: U.xi.slice() }; render(); await saveMe(); };
  ACT.pick = d => { U.pick = d.v; };
  ACT.sendVote = async () => {
    const c = G.cup; if (!c || c.stage !== 'vote') return false;
    if (!U.pick) { toast('اختر فريق أول.'); return false; }
    mine().vote = { key: c.key, v: U.pick }; render(); await saveMe();
  };


  /* ---------- events ---------- */
  app.addEventListener('click', async e => {
    const el = e.target.closest('[data-act]');
    if (!el || !ACT[el.dataset.act]) return;
    if (el.dataset.act === 'ovClose' && e.target !== el) return;
    if (el.getAttribute('aria-disabled') === 'true' && el.dataset.act !== 'ovClose') return;
    const r = await ACT[el.dataset.act](el.dataset, el, e);
    if (r !== false) render();
  });
  app.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); } });
  app.addEventListener('input', e => {
    const el = e.target, b = el.dataset && el.dataset.bind;
    if (!b) return;
    if (b === 'name') { U.name = el.value; lsSet({ name: el.value.trim() }); }
    else if (b === 'code') U.draft.code = el.value.toUpperCase();
    else if (b === 'ask') U.lst[el.dataset.k] = Math.min(MAXP, Math.max(1, Math.round(+el.value.replace(/[^\d]/g, '') || 1)));
    else if (b === 'bid') { const L = G.mk && G.mk.lst[el.dataset.l]; if (L) { U.bids[el.dataset.l] = Math.round(+el.value.replace(/[^\d]/g, '') || 0); } }
  });
  app.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset && el.dataset.bind === 'bid') { const L = G.mk && G.mk.lst[el.dataset.l]; if (L) { U.bids[el.dataset.l] = Math.max(L.ask, +U.bids[el.dataset.l] || L.ask); pushBids(false); } }
    if (el.dataset && el.dataset.bind === 'ask') render();
  });
  window.addEventListener('hashchange', () => {
    const h = (location.hash || '').match(/^#room-([A-Za-z0-9]{4,6})$/);
    if (h && h[1].toUpperCase() !== U.code && db && U.ready) { U.draft.code = h[1].toUpperCase(); U.fromLink = true; if (!U.code) render(); }
  });

  /* ---------- start ---------- */
  async function init() {
    const saved = lsGet();
    U.name = saved.name || '';
    const h = (location.hash || '').match(/^#room-([A-Za-z0-9]{4,6})$/);
    if (h) { U.draft.code = h[1].toUpperCase(); U.fromLink = true; }
    if (saved.code && !h) U.splash = false;
    render();
    const cl = !EXT ? window.claude : null;
    let user = null;
    if (cl) {
      try { db = await cl.use('db'); } catch (e) { db = null; }
      try { user = await cl.use('user'); } catch (e) { user = null; }
      try { roomCap = await cl.use('room'); } catch (e) { roomCap = null; }
    }
    if (!db && window.__MZ_DB) db = window.__MZ_DB;
    let id = null;
    try { id = user && user.id ? await user.id() : null; } catch (e) { id = null; }
    if (!id) { id = saved.uid || ('l' + Math.random().toString(36).slice(2, 12)); lsSet({ uid: id }); }
    ME_ID = 'u' + String(id).replace(/[^A-Za-z0-9_\-~:@+]/g, '_').slice(0, 120);
    U.ready = true;
    const code = h ? h[1].toUpperCase() : (saved.code || '');
    if (db && code) {
      await loadMe(code);
      if (!h || (ME && ME.room === code)) { U.splash = false; await subscribe(code); }
      else U.code = '';
    }
    render();
  }
  if (TEST) window.__mz = () => ({ G, ME, ME_ID, U, host: isHost(), INP, ACT, scores, roster, assets, setInputs: m => { INP = m; hostStep(); } });
  init();
})();

</script>
</body>
</html>
