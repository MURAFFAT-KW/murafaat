<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أقنعني! | نادييك</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800;900&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --bg-2:#F4F6FB; --panel:#FFFFFF; --panel-2:#FFFFFF; --line:#D5DCEA; --line-soft:#E6EBF4;
  --text:#0E1630; --muted:#5A6580; --blue:#1D4ED8; --cyan:#1D4ED8; --gold:#E11D2E; --yel:#FFC93C; --gold-ink:#FFFFFF; --ink:#FFFFFF;
  --ok:#17935A; --bad:#D32F2F; --warn:#D97706;
  --grad:linear-gradient(135deg,#2563EB 0%,#1D4ED8 55%,#1E3A8A 100%);
  --r:16px;
  --font-d:'Alexandria','Readex Pro',Tahoma,sans-serif;
  --font-b:'Readex Pro','Alexandria','Segoe UI',Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  background-color:var(--bg);
  background-image:radial-gradient(900px 420px at 50% -8%,rgba(29,78,216,.10),transparent 70%);
  color:var(--text); font-family:var(--font-b); font-size:16px; line-height:1.65; direction:rtl;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px; min-height:100%;
}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--font-d);font-weight:700;text-wrap:balance;line-height:1.3}
.wrap{max-width:880px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 4px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--font-d);font-size:1.35rem;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:.85rem;letter-spacing:.08em}
.top-r{display:flex;align-items:center;gap:10px}
.saved{color:var(--muted);font-size:.8rem;white-space:nowrap}
@media(max-width:480px){.brand span,.saved{display:none}}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;
  border:1px solid var(--line);border-radius:14px;background:var(--panel-2);color:var(--text);
  font-weight:600;font-size:1rem;cursor:pointer;text-align:center;transition:transform .08s,border-color .15s,background .15s;
}
.btn:hover{border-color:var(--cyan)}
.btn:active{transform:scale(.985)}
.btn:focus-visible,.chipbtn:focus-visible,.perk:focus-visible,.vopt:focus-visible,.seg button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(29,78,216,.28)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.xl{min-height:62px;font-size:1.12rem;width:100%}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.9rem;border-radius:12px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}
.btn-row>.btn{flex:1 1 200px}

/* surfaces */
.card{background:var(--panel);box-shadow:0 10px 30px rgba(14,22,48,.07);border:1px solid var(--line-soft);border-radius:var(--r);padding:20px;min-width:0}
.card h2{font-size:1.35rem;margin-bottom:6px}
.card h3{font-size:1.1rem}
.sect-title{font-family:var(--font-d);font-size:1.05rem;color:var(--cyan);margin-bottom:10px}
.alert{border:1px solid var(--bad);background:rgba(211,47,47,.1);color:#9E1219;border-radius:12px;padding:12px 16px}
.note{border:1px solid var(--line);background:var(--bg-2);border-radius:12px;padding:12px 16px;color:var(--muted);font-size:.93rem}
.note b{color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);font-size:.82rem;font-weight:600;white-space:nowrap}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.chip.live{border-color:var(--cyan);color:var(--cyan)}
.chip.ok{border-color:var(--ok);color:var(--ok)}

/* stepper */
.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.steps li{padding:2px 12px;border-radius:99px;border:1px solid var(--line-soft);color:var(--muted);font-size:.82rem}
.steps li.on{border-color:var(--cyan);color:var(--cyan);background:rgba(29,78,216,.08)}
.steps li.done{color:var(--text)}

/* home */
.hero{padding:34px 22px 26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.hero h1{font-size:clamp(2.6rem,9vw,4rem);font-weight:800;background:linear-gradient(90deg,#E11D2E 0 50%,#1D4ED8 50% 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .en{font-family:var(--font-d);letter-spacing:.32em;color:var(--cyan);font-size:.95rem}
.hero p.lead{max-width:34rem;color:var(--muted);font-size:1.08rem}
.hero .btn-row{width:100%;max-width:520px;margin-top:6px}
.howto{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:12px}
.howto li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.howto li::before{counter-increment:s;content:counter(s);width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:700}

/* players */
.prow{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;padding:12px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}
.prow .fields{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.prow input{flex:1 1 150px;min-width:0}
.field{background:var(--bg);border:1px solid var(--line);border-radius:12px;min-height:50px;padding:8px 14px;width:100%}
textarea.field{min-height:92px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 16px;min-height:46px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--blue);color:#fff}
.seg-wide{display:flex;flex-wrap:wrap;gap:10px}
.seg-wide button{flex:1 1 90px;min-height:50px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);cursor:pointer;font-weight:600}
.seg-wide button.on{border-color:var(--cyan);color:var(--ink);background:var(--cyan)}
.x{width:46px;height:46px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;font-size:1.3rem;line-height:1}
.x:hover{border-color:var(--bad);color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.opt-card{border:1px solid var(--line);border-radius:14px;background:var(--bg-2);padding:14px 16px;cursor:pointer;text-align:start;min-height:70px}
.opt-card.on{border-color:var(--cyan);background:rgba(29,78,216,.1)}
.opt-card b{display:block}
.labelled{display:flex;flex-direction:column;gap:8px}
.labelled>label,.lbl{font-weight:600;color:var(--text)}

/* pass-the-device */
.pass{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 20px}
.pass h2{font-size:2rem;margin:0}
.pass .kick{color:var(--cyan);font-weight:600}
.pass .btn{max-width:420px}

/* perk picking */
.perk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.perk-pick{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:start;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);padding:14px 16px;cursor:pointer;min-height:92px}
.perk-pick b{font-family:var(--font-d);font-size:1.05rem}
.perk-pick span.d{grid-column:1/-1;color:var(--muted);font-size:.9rem}
.perk-pick.on{border-color:var(--gold);background:rgba(225,29,46,.09)}
.perk-pick.off{opacity:.5}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.on .tick{border-color:var(--gold);background:var(--gold);color:var(--gold-ink)}

/* answers */
.qa{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}
.qa .qt{font-weight:600}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.qlist li{padding:12px 16px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg-2)}

/* case */
.casehead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.qcard{text-align:center;padding:24px 18px}
.qcard .qlabel{color:var(--gold);font-weight:600;font-size:.9rem;letter-spacing:.04em}
.qcard h2{font-size:clamp(1.4rem,4.6vw,2rem);margin-top:6px}
.parties{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.parties{grid-template-columns:1fr 1fr}}
.party{border:1px solid var(--line-soft);background:var(--panel);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.party.speaking{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.ptop{display:flex;gap:8px;flex-wrap:wrap}
.pid{display:flex;align-items:center;gap:12px;min-width:0}
.pid h3{overflow-wrap:anywhere}
.defend{border-radius:12px;background:var(--bg-2);padding:10px 14px;border:1px dashed var(--line)}
.defend strong{display:block;font-size:1.15rem;color:var(--gold);overflow-wrap:anywhere}
.helper{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--muted)}
.perks{display:flex;flex-wrap:wrap;gap:8px}
.perk{min-height:44px;padding:6px 14px;border-radius:12px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-weight:600;font-size:.92rem;cursor:pointer}
.perk.na{border-color:var(--line);color:var(--muted)}
.perk.used{border-color:var(--line-soft);color:var(--muted);text-decoration:line-through;cursor:not-allowed}
.perk.set{background:var(--gold);color:var(--gold-ink)}
.witness{border:1px solid var(--blue);border-radius:14px;background:rgba(29,78,216,.1);padding:14px 16px}
.witness b{color:var(--cyan)}
.timerbox{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media(max-width:520px){.timerbox{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .bg{stroke:var(--line-soft)}
.ring .fg{stroke:var(--cyan);transition:stroke-dashoffset .25s linear}
.ring.low .fg{stroke:var(--bad)}
.ring.ended .fg{stroke:var(--bad)}
.clock{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-size:2.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.tcontrols{display:flex;flex-direction:column;gap:10px;min-width:0;width:100%}
.timeup{border:1px solid var(--bad);color:#9E1219;background:rgba(211,47,47,.12);border-radius:12px;padding:10px 14px;font-weight:700;text-align:center}
.notes{display:grid;gap:6px;font-size:.92rem;color:var(--muted)}

/* voting */
.vkind{display:flex;flex-direction:column;gap:6px;border-radius:14px;padding:14px 16px;border:1px solid var(--cyan);background:rgba(29,78,216,.08)}
.vkind.appeal{border-color:var(--gold);background:rgba(225,29,46,.09)}
.vkind b{font-family:var(--font-d);font-size:1.15rem}
.vopts{display:grid;gap:14px}
.vopt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;min-height:78px;padding:12px 16px;border:2px solid var(--line);border-radius:16px;background:var(--bg-2);cursor:pointer;text-align:start}
.vopt.on{border-color:var(--cyan);background:rgba(29,78,216,.12)}
.vopt .vt{display:flex;flex-direction:column;min-width:0}
.vopt .vt b{font-size:1.1rem;overflow-wrap:anywhere}
.vopt .vt span{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.vopt.none{grid-template-columns:1fr auto;border-style:dashed}
.radio{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.on .radio{border-color:var(--cyan);background:var(--cyan);color:var(--ink)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:130px 1fr 36px;align-items:center;gap:10px}
@media(max-width:520px){.bar{grid-template-columns:90px 1fr 30px}}
.bar .track{height:16px;border-radius:99px;background:var(--bg);border:1px solid var(--line-soft);overflow:hidden}
.bar .fill{height:100%;background:var(--blue);border-radius:99px}
.bar.lead .fill{background:var(--gold)}
.bar .nm{overflow-wrap:anywhere;font-weight:600}
.verdict{text-align:center;padding:22px 16px;border:1px solid var(--gold);background:rgba(225,29,46,.08);border-radius:var(--r)}
.verdict h2{color:var(--gold);font-size:1.6rem}
.jrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg-2)}

/* scoreboard */
.rank{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank li{display:grid;grid-template-columns:40px auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2)}
.rank li.win{border-color:var(--gold);background:rgba(225,29,46,.1)}
.rank .pos{font-family:var(--font-d);font-size:1.3rem;color:var(--muted);text-align:center}
.rank .win .pos{color:var(--gold)}
.rank .pts{font-family:var(--font-d);font-size:1.4rem;color:var(--gold);font-variant-numeric:tabular-nums}
.winner{text-align:center;padding:26px 16px;border:1px solid var(--gold);border-radius:var(--r);background:rgba(225,29,46,.09);display:flex;flex-direction:column;align-items:center;gap:8px}
.winner h2{font-size:clamp(1.8rem,6vw,2.6rem);color:var(--gold)}
.cases{display:grid;gap:12px}
.cr{border:1px solid var(--line-soft);border-radius:14px;background:var(--bg-2);padding:14px 16px;display:grid;gap:6px}
.cr .q{font-weight:700}
.cr .v{display:flex;flex-wrap:wrap;gap:8px}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(14,22,48,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0;overflow:auto}
@media(min-width:640px){.ov{align-items:center;padding:20px}}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px;direction:rtl}
@media(min-width:640px){.dlg{border-radius:20px}}
.dlg h2{font-size:1.4rem}
.cands{display:grid;gap:10px}
.cand{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);cursor:pointer;text-align:start;width:100%}
.cand:hover{border-color:var(--cyan)}
#toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50;padding-inline:16px}
#toast span{background:#0F2233;color:#fff!important;border:1px solid var(--cyan);color:var(--text);padding:12px 18px;border-radius:14px;max-width:520px;box-shadow:0 8px 30px rgba(14,22,48,.25);opacity:0;transform:translateY(8px);transition:.2s}
#toast.show span{opacity:1;transform:none}
/* splash */
.splash{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:40px 8px;position:relative}
.splash .blob{position:fixed;inset:auto;width:520px;height:520px;border-radius:50%;filter:blur(70px);opacity:.32;z-index:-1;pointer-events:none}
.splash .b1{background:#E11D2E;top:-180px;inset-inline-start:-160px}
.splash .b2{background:#1D4ED8;bottom:-200px;inset-inline-end:-180px}
.splash .lg{animation:up .7s ease both;margin-bottom:8px}
.splash .big{font-family:var(--font-d);font-weight:900;font-size:clamp(4rem,19vw,8rem);line-height:1.1;background:linear-gradient(90deg,#E11D2E 0 50%,#1D4ED8 50% 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-inline:.1em;animation:up .7s .1s ease both}
.splash .ar{font-family:var(--font-d);font-weight:700;font-size:clamp(1.6rem,6vw,2.2rem);color:var(--text);margin-top:6px;animation:up .7s .25s ease both}
.splash .en{font-family:var(--font-d);font-weight:600;letter-spacing:.42em;color:var(--cyan);font-size:.95rem;padding-inline-start:.42em;animation:up .7s .35s ease both}
.splash .go{margin-top:34px;width:100%;max-width:320px;min-height:64px;font-size:1.3rem;font-weight:800;border-radius:99px;animation:up .7s .5s ease both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* online rooms */
.bigcode{font-family:var(--font-d);font-weight:900;font-size:clamp(2.6rem,13vw,3.6rem);letter-spacing:.18em;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-inline-start:.18em}
.roomcard{text-align:center;display:grid;gap:8px;justify-items:center}
.linkrow{display:flex;gap:8px;width:100%;flex-wrap:wrap}
.linkrow .field{flex:1 1 220px;font-size:.85rem;min-height:46px;text-align:left}
.linkrow .btn{flex:0 0 auto;min-height:46px}
.code-in{font-family:var(--font-d);font-size:1.4rem;letter-spacing:.3em;text-align:center;text-transform:uppercase}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 4px;border-radius:99px;border:1px solid var(--line-soft);background:var(--bg-2);color:var(--muted);font-size:.9rem}
.pchip.ok{border-color:var(--ok);color:var(--ok);background:rgba(23,147,90,.07)}
.party.mine{box-shadow:0 0 0 2px var(--gold) inset}
.card.action{border:2px solid var(--cyan);background:#F2F8FF}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line-soft);border-top-color:var(--cyan);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
input.field{font-size:16px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}



.hero .sub{font-family:var(--font-d);font-weight:700;font-size:1.5rem;color:var(--gold);margin-top:-6px}
.wallet{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wallet div{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(14,22,48,.06)}
.wallet span{font-size:.78rem;color:var(--muted)}
.wallet b{font-family:var(--font-d);font-size:1.05rem;color:var(--cyan)}
.wallet div:last-child b{color:var(--gold)}
.parties .price{font-family:var(--font-d);font-size:1.5rem;font-weight:800;color:var(--gold)}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper .btn{width:64px;min-height:64px;font-size:1.8rem;padding:0;border-radius:50%}
.bigprice{font-family:var(--font-d);font-weight:900;font-size:4rem;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;min-width:120px}
.bigprice small{font-size:1rem;margin-inline-start:6px;-webkit-text-fill-color:var(--muted)}
.tbl{display:grid;gap:6px}
.tr{display:grid;grid-template-columns:18px minmax(0,1fr) 36px 42px 38px 46px;gap:4px;align-items:center;padding:8px 10px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg-2);font-size:.92rem}
.tr.th{background:transparent;border-color:transparent;color:var(--muted);font-size:.78rem;padding-block:0}
.tr span{text-align:center}
.tr .nm{display:flex;align-items:center;gap:6px;text-align:start;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.tr .tot{font-family:var(--font-d);font-weight:800;color:var(--gold)}

    G.prog = [];
  }
  function openBidding() {
    const mk = G.mk;
    mk.lst = {}; mk.auto = [];
    G.players.forEach(p => {
      const r = roster(p.id); if (!r.length) return;
      const x = inp(p.id).list;
      let items = x && x.key === mk.key && x.items ? Object.keys(x.items).filter(k => G.own[k] === p.id).slice(0, 10) : [];
      if (!items.length) {
        const k = r[Math.floor(Math.random() * r.length)];
        items = [k]; mk.auto.push(p.id);
        mk.lst[uid('l')] = { pk: k, seller: p.id, ask: val(k) };
      } else items.forEach(k => { const a = Math.round(+x.items[k] || 0); mk.lst[uid('l')] = { pk: k, seller: p.id, ask: Math.min(MAXP, Math.max(1, a || val(k))) }; });
    });
    mk.stage = 'bid'; mk.endsAt = Date.now() + G.settings.mkSec * 1000; mk.dur = G.settings.mkSec;
    G.prog = [];
  }
  function bidsOn(lid) {
    const mk = G.mk, L = mk.lst[lid], out = [];
    G.players.forEach(p => {
      if (p.id === L.seller) return;
      const x = inp(p.id).bids;
      if (!x || x.key !== mk.key || !x.b) return;
      const a = Math.round(+x.b[lid] || 0);
      if (a >= L.ask) out.push({ id: p.id, a });
    });
    return out;
  }
  function resolveMarket() {
    const mk = G.mk, res = [];
    const lids = Object.keys(mk.lst);
    /* each listing goes to its highest bid (ties by draw); if that buyer can't take him, the next bidder gets a chance */
    const ranked = {}; lids.forEach(l => { ranked[l] = shuffle(bidsOn(l)).sort((a, b) => b.a - a.a); });
    const out = {}, dead = {};
    const pick = l => (dead[l] ? null : ranked[l].find(b => !(out[l] && out[l][b.id])) || null);
    const deals = () => lids.map(l => { const w = pick(l); return w ? { l, pk: mk.lst[l].pk, seller: mk.lst[l].seller, buyer: w.id, price: w.a } : null; }).filter(Boolean);
    /* sale money counts in the same market; every squad keeps a full five and never goes above NSQ players */
    for (let guard = 0; guard < 800; guard++) {
      const D = deals(), sq = {}, money = {};
      ids().forEach(id => { sq[id] = roster(id); money[id] = bal(id); });
      D.forEach(d => { sq[d.seller] = sq[d.seller].filter(k => k !== d.pk); sq[d.buyer].push(d.pk); money[d.seller] += d.price; money[d.buyer] -= d.price; });
      let id = ids().find(x => D.some(d => d.seller === x) && !canFill(sq[x]));
      if (id) {
        const s5 = D.filter(d => d.seller === id).sort((x, y) => x.price - y.price);
        const fx = s5.find(d => canFill(sq[id].concat([d.pk]))) || s5[0];
        dead[fx.l] = 'keep5'; continue;
      }
      id = ids().find(x => money[x] < 0 && D.some(d => d.buyer === x));
      if (id) {
        const d = D.filter(z => z.buyer === id).sort((x, y) => y.price - x.price)[0];
        (out[d.l] = out[d.l] || {})[id] = 'nomoney'; continue;
      }
      id = ids().find(x => sq[x].length > NSQ && D.some(d => d.buyer === x));
      if (id) {
        const d = D.filter(z => z.buyer === id).sort((x, y) => x.price - y.price)[0];
        (out[d.l] = out[d.l] || {})[id] = 'full'; continue;
      }
      break;
    }
    const D = deals();
    lids.forEach(l => {
      const L = mk.lst[l], base = { pk: L.pk, seller: L.seller, ask: L.ask, price: 0, buyer: null };
      const d = D.find(x => x.l === l);
      if (d) { res.push(Object.assign(base, { price: d.price, buyer: d.buyer, n: ranked[l].length, tie: ranked[l].some(b => b.id !== d.buyer && b.a === d.price) })); return; }
      if (dead[l]) { res.push(Object.assign(base, { why: dead[l] })); return; }
      if (!ranked[l].length) { res.push(Object.assign(base, { why: 'nobid' })); return; }
      res.push(Object.assign(base, { why: Object.values(out[l] || {}).includes('nomoney') ? 'nomoney' : 'full' }));
    });
    res.sort((x, y) => y.price - x.price);
    res.forEach(r => {
      if (!r.buyer) return;
      G.bal[r.buyer] -= r.price; G.bal[r.seller] += r.price;
      G.own[r.pk] = r.buyer; G.val[r.pk] = r.price;
      G.stats[r.buyer].bought++; G.stats[r.seller].sold++;
      r.pos = PL(r.pk).pos;
    });
    mk.res = res;
    G.hist.push({ no: mk.no, deals: res.filter(r => r.buyer).map(r => ({ pk: r.pk, s: r.seller, b: r.buyer, p: r.price })) });
    mk.stage = 'review'; mk.endsAt = Date.now() + G.settings.revSec * 1000; mk.dur = G.settings.revSec;
    G.prog = [];
  }
  function nextMarket() {
    const total = G.settings.seasons * 2;

  }

  /* lineup & cup */
  function validXI(id, list) {
    if (!Array.isArray(list) || list.length !== 5 || !list.every(Boolean)) return false;
    if (new Set(list).size !== 5) return false;
    return list.every((k, i) => G.own[k] === id && fits(PL(k).ps, i));
  }
  const suggestXI = id => bestFive(roster(id));
  function startCup() {
    G.players.forEach(p => { const x = inp(p.id).xi; G.xi[p.id] = x && x.g === G.gameNo && validXI(p.id, x.list) ? x.list : suggestXI(p.id); });
    const pl = shuffle(ids());
    let size = 1; while (size < pl.length) size *= 2;
    const R = Math.round(Math.log2(size));
    const byes = size - pl.length;
    const r1 = [];
    // spread the byes: a bye is a match with a single player
    const seeds = pl.slice();
    for (let i = 0; i < size / 2; i++) {
      if (i < byes) r1.push({ a: seeds.shift(), b: null, w: null });
      else r1.push({ a: seeds.shift(), b: seeds.shift(), w: null });
    }
    G.cup = { R, rounds: [shuffle(r1)], r: 0, m: -1, stage: 'idle', key: '', endsAt: 0, dur: 0, flip: false, out: {} };
    G.phase = 'cup'; G.prog = [];
    nextMatch();
  }
  const roundName = (r, R) => { const left = R - r; return left === 1 ? 'النهائي' : left === 2 ? 'نصف النهائي' : left === 3 ? 'ربع النهائي' : left === 4 ? 'دور الـ16' : 'الدور ' + (r + 1); };
  function curMatch() { const c = G.cup; return c && c.m >= 0 ? c.rounds[c.r][c.m] : null; }
  function voters(m) { return m ? ids().filter(id => id !== m.a && id !== m.b) : []; }
  function nextMatch() {
    const c = G.cup;
    for (; ;) {
      const rd = c.rounds[c.r];
      const i = rd.findIndex(m => !m.w);
      if (i >= 0) {
        const m = rd[i];
        if (!m.b) { m.w = m.a; m.bye = true; continue; }
        c.m = i; c.stage = 'vote'; c.key = uid('v'); c.flip = Math.random() < .5;
        c.endsAt = Date.now() + G.settings.voteSec * 1000; c.dur = G.settings.voteSec;
        G.prog = [];
        return;
      }
      const winners = rd.map(m => m.w);
      if (winners.length === 1) { c.champ = winners[0]; c.stage = 'done'; c.m = -1; G.phase = 'final'; return; }
      const nx = [];
      for (let k = 0; k < winners.length; k += 2) nx.push({ a: winners[k], b: winners[k + 1], w: null });
      c.rounds.push(nx); c.r++;

  }
  function closeVote() {
    const c = G.cup, m = curMatch();
    const t = { a: 0, b: 0 };
    voters(m).forEach(id => { const x = inp(id).vote; if (x && x.key === c.key && (x.v === 'a' || x.v === 'b')) t[x.v]++; });
    // votes are stored by screen side; map back to players
    const left = c.flip ? m.b : m.a, right = c.flip ? m.a : m.b;
    const va = t.a, vb = t.b;
    m.votes = { [left]: va, [right]: vb };
    if (va === vb) { m.w = Math.random() < .5 ? left : right; m.draw = true; }
    else m.w = va > vb ? left : right;
    const loser = m.w === m.a ? m.b : m.a;
    c.out[loser] = c.r + 1;
    c.stage = 'result'; c.endsAt = 0; c.dur = 0; G.prog = [];
  }

  /* ---------- scoring ---------- */
  function scores() {
    if (!G || !G.players.length) return [];
    const n = G.players.length, pl = ids();
    const rankPts = (key, max) => {
      const v = id => (G.stats[id] || {})[key] || 0;
      return id => { const x = v(id); if (!x) return 0; const rank = 1 + pl.filter(o => v(o) > x).length; return Math.round(max * (n - rank + 1) / n * 10) / 10; };
    };
    const sp = rankPts('sold', 20), bp = rankPts('bought', 20);
    /* rank by a value: first gets 20, then less step by step; ties share */
    const rankBy = fn => id => { const x = fn(id), rank = 1 + pl.filter(o => fn(o) > x + 1e-9).length; return Math.round(20 * (n - rank + 1) / n * 10) / 10; };
    const wdiff = id => bal(id) - ((G.startBal || {})[id] != null ? G.startBal[id] : (TIER[G.tier[id]] || TIER.w).bal);

    const cupPts = id => {
      if (!c) return 0;
      if (c.champ === id) return 20;
      const k = c.out[id]; if (!k) return 0;
      return Math.round(4 + (k - 1) * 16 / R);
    };
    return pl.map(id => {
      const g = growth(id);
      const r = { id, sold: sp(id), bought: bp(id), port: wp(id), pv: ap(id), cup: cupPts(id), growth: g, assets: assets(id), wdiff: wdiff(id), pval: pval(id) };
      r.market = Math.round((r.sold + r.bought + r.port + r.pv) * 10) / 10;
      r.total = Math.round((r.market + r.cup) * 10) / 10;
      return r;
    });
  }

        (done ? '<section class="card pass"><h3>ثبّت عروضك ✓</h3><p class="muted small">تقدر تعدل لين يخلص الوقت.</p><button class="btn" data-act="bidEdit">تعديل</button></section>' : '<button class="btn xl primary" data-act="sendBids">' + (nb ? 'ثبّت عروضي' : 'ما أبي أشتري') + '</button>') +

    if (U.xiKey !== key) { U.xiKey = key; U.xi = sent ? x.list.slice() : suggestXI(me); }

  function bracket() {

      const live = ri === c.r && mi === c.m;

      return '<div class="bm' + (live ? ' live' : '') + '">' + nm(m.a) + nm(m.b) + '</div>';
    }).join('') + '</div>').join('') + '</div></section>';
  }
  function cupView() {
    const c = G.cup, m = curMatch();
    if (!m) return bracket();
    const left = c.flip ? m.b : m.a, right = c.flip ? m.a : m.b;
    const side = (id, lab) => { return '<div class="side"><h3>' + lab + '</h3>' + pitch(G.xi[id] || [], '', true) + '</div>'; };
    const head = '<section class="mkhead"><div><span class="chip gold">' + roundName(c.r, c.R) + '</span><h2>مواجهة</h2></div></section>';
    const vs = '<section class="card vs">' + side(left, 'الفريق أ') + side(right, 'الفريق ب') + '</section>';
    const iAmIn = m.a === ME_ID || m.b === ME_ID;
    if (c.stage === 'vote') {
      const x = inp(ME_ID).vote, voted = x && x.key === c.key;
      if (U.pickKey !== c.key) { U.pickKey = c.key; U.pick = null; }
      let body;
      if (!inRoom(ME_ID)) body = '<section class="card pass"><h2>أنت المضيف</h2><p class="muted">تتابع المواجهة بس، وما تصوّت.</p></section>';
      else if (iAmIn) body = '<section class="card pass"><h2>فريقك بهالمواجهة</h2><p class="muted">أقنع الجمهور بصوتك! ما تقدر تصوّت بمواجهتك.</p></section>';
      else if (voted) body = '<section class="card pass"><h2>وصل صوتك ✓</h2></section>';
      else body = '<section class="card action"><h2 style="margin:0 0 8px">مين الأقوى؟</h2><div class="seg-wide"><button class="' + (U.pick === 'a' ? 'on' : '') + '" data-act="pick" data-v="a">الفريق أ</button><button class="' + (U.pick === 'b' ? 'on' : '') + '" data-act="pick" data-v="b">الفريق ب</button></div><button class="btn xl primary" data-act="sendVote" style="margin-top:10px">صوّت</button><p class="muted small">صوت واحد لكل متفرج، والأسماء ما تنكشف إلا بعد التصويت.</p></section>';
      return head + vs + body + clockBox('وقت التصويت', c.endsAt, c.dur, 'الذهاب لنتيجة المواجهة') + progBox('مين صوّت', voters(m)) + bracket();
    }
    if (c.stage === 'result') {

      return head + '<section class="verdict"><h2>' + esc(P(m.w).name) + ' تأهل!</h2><p>' + esc(P(left).name) + ' (الفريق أ): ' + (v[left] || 0) + ' صوت · ' + esc(P(right).name) + ' (الفريق ب): ' + (v[right] || 0) + ' صوت' + (m.draw ? ' · تعادل وانحسمت بالقرعة' : '') + '</p></section>' + vs +
        hostBtn(G.cup.rounds[c.r].every(x => x.w) && G.cup.rounds[c.r].length === 1 ? 'إعلان النتائج' : 'المواجهة التالية', 'cupNext') + bracket();
    }
    return bracket();
  }

      '<p class="muted small" style="margin-top:8px">كل قسم ٢٠ نقطة. البيع والشراء: حسب الترتيب بعدد الصفقات. المحفظة: حسب الفرق بين رصيدك بالنهاية وبالبداية. الأصول: حسب مجموع قيمة لاعبينك (أساسي واحتياط). الكأس: من ٤ نقاط لأول دور لين ٢٠ للبطل. التعادل: الأصول الأعلى، ثم بطل الكأس. (الرقم بين القوسين = فرق الرصيد)</p></section>' +
      '<section class="card"><h3 style="margin-bottom:8px">المحافظ النهائية</h3><div class="deals">' + tot.map(r => '<div class="deal"><b>' + tdot(r.id) + esc(P(r.id).name) + '</b><span class="muted small">' + esc(sqLbl(r.id)) + ' · ' + roster(r.id).length + ' لاعب · الرصيد ' + mil(bal(r.id)) + ' · ' + (G.stats[r.id] || {}).sold + ' بيع / ' + (G.stats[r.id] || {}).bought + ' شراء</span><b class="num price">' + mil(r.assets) + ' <small>(' + (r.wdiff >= 0 ? '+' : '') + Math.round(r.wdiff * 10) / 10 + ' بالرصيد)</small></b></div>').join('') + '</div></section>' +
      bracket() + srcNote() +
      (isHost() ? '<div class="btn-row"><button class="btn xl primary" data-act="rematch">لعبة جديدة بنفس اللاعبين</button><button class="btn xl" data-act="toLobby">رجوع للغرفة</button></div>' : waitHost());

        (!host && G && inRoom(ME_ID) ? '<button class="btn" data-act="askTake">المضيف ما يرد؟ استلم الاستضافة</button>' : '') +
        (host && others.length ? '<button class="btn" data-act="askHand">نقل الاستضافة للاعب آخر</button>' : '') +

    } else if (m.type === 'leave') {

  function hostOnlyView() {

    const mk = G.mk;

      case 'picks': return note + progBox('مين خلّص') + hostBtn('التالي: اختيار الفئة', 'picksNext');
      case 'tier': return note + progBox('مين اختار الفئة') + hostBtn('اكشف الفرق', 'tierNext');
      case 'reveal': return note + progBox('مين جاهز') + hostBtn('افتح السوق الأول', 'revealNext');
      case 'market': {
        if (!mk) return note;

        const last = mk.no >= G.settings.seasons * 2, deals = mk.res.filter(r => r.buyer);
        return head + '<section class="card"><h2 style="margin-bottom:10px">نتائج السوق</h2>' + (deals.length ? '<div class="deals">' + deals.map(r => { const p = PL(r.pk); return '<div class="deal"><b>' + esc(p.name) + '</b><span class="muted small">' + posL(p) + ' · انتقل لفريق ثاني</span><b class="num price">' + mil(r.price) + '</b></div>'; }).join('') + '</div>' : '<p class="muted">ما تمت أي صفقة بهالسوق.</p>') + '</section>' +
          clockBox(last ? 'مراجعة قبل الكأس' : 'مراجعة قبل السوق الجاي', mk.endsAt, mk.dur, last ? 'الذهاب لاختيار خماسي الكأس' : 'الذهاب لـ' + mkLabel(mk.no + 1)) + progBox('مين جاهز');

  function gameView() {
    if (!inRoom(ME_ID) && isHost() && G.phase !== 'lobby') return hostOnlyView();

      case 'lobby': return lobbyView();
      case 'picks': return picksView();
      case 'tier': return tierView();
      case 'reveal': return revealView();
      case 'market': return G.mk ? marketView() : '';

  /* ---------- render ---------- */
  function render() {
    let html;
    if (U.notice) html = noticeView();
    else if (U.splash) html = splashView();
    else {
      html = topbar();
      if (!U.code || U.view === 'home') html += homeView();
      else if (!G) html += '<section class="card pass"><div class="spin" aria-hidden="true"></div><h2>جاري الاتصال بالغرفة ' + esc(U.code) + '</h2></section><button class="btn ghost" data-act="leaveNow">إلغاء</button>';
      else if (U.view === 'join') html += joinView();
      else if (U.view === 'wait') html += waitView();
      else if (U.view === 'spect') html += spectView();
      else if (U.view === 'kicked') html += kickedView();
      else html += gameView();
      html += modalView();

    if (h && h[1].toUpperCase() !== U.code && db && U.ready) { U.draft.code = h[1].toUpperCase(); U.fromLink = true; if (!U.code) render(); }
  });

  /* ---------- start ---------- */
  async function init() {
    const saved = lsGet();
    U.name = saved.name || '';
    const h = (location.hash || '').match(/^#room-([A-Za-z0-9]{4,6})$/);
    if (h) { U.draft.code = h[1].toUpperCase(); U.fromLink = true; }
    if (h) { try { U.notice = !sessionStorage.getItem('aq.notice.' + h[1].toUpperCase()); } catch (e) { U.notice = true; } }
    if (saved.code && !h) U.splash = false;
    render();
    const cl = !EXT ? window.claude : null;
    let user = null;
    if (cl) {
      try { db = await cl.use('db'); } catch (e) { db = null; }
      try { user = await cl.use('user'); } catch (e) { user = null; }
      try { roomCap = await cl.use('room'); } catch (e) { roomCap = null; }
    }
    if (!db && window.__MZ_DB) db = window.__MZ_DB;
    let id = null;
    try { id = user && user.id ? await user.id() : null; } catch (e) { id = null; }
    if (!id) { id = saved.uid || ('l' + Math.random().toString(36).slice(2, 12)); lsSet({ uid: id }); }
    ME_ID = 'u' + String(id).replace(/[^A-Za-z0-9_\-~:@+]/g, '_').slice(0, 120);
    U.ready = true;
    const code = h ? h[1].toUpperCase() : (saved.code || '');
    if (db && code) {
      await loadMe(code);
      if (!h || (ME && ME.room === code)) { U.splash = false; await subscribe(code); }
      else U.code = '';
    }
    render();
  }
  if (TEST) window.__mz = () => ({ G, ME, ME_ID, U, host: isHost(), INP, ACT, scores, roster, assets, setInputs: m => { INP = m; hostStep(); } });
  init();
})();

</script>
