<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#12203A;font:500 16px/1.8 "Readex Pro","Alexandria",system-ui,-apple-system,sans-serif}

<script>
var C={"ar": {"t": "سياسة الخصوصية", "u": "آخر تحديث: ٢٧ نوفمبر ٢٠٢٦", "f": "© أقنعني — فكرة وتطوير عبدالرحمن الفهد. جميع الحقوق محفوظة.<br><a href=\"privacy.html\">سياسة الخصوصية</a> · <a href=\"terms.html\">شروط الاستخدام</a>", "b": "<div class=\"box\">باختصار: اللي ينشئ الغرفة يسجّل دخوله بحساب Google أو بالإيميل، واللي ينضم برابط دعوة ما يحتاج حساب. ما نطلب رقمك ولا موقعك، وما فيها إعلانات ولا تتبع، وتقدر تحذف حسابك بأي وقت من الإعدادات.</div><h2>شنو المعلومات اللي نستخدمها؟</h2><ul><li><b>بيانات الحساب</b> إذا سجّلت دخولك: اسمك وإيميلك (وصورتك لو دخلت بحساب Google)، عشان نعرّفك ونحمي غرفك. كلمة المرور ما نشوفها، تتعامل معها Google Firebase بشكل مشفّر.</li><li><b>اسم اللاعب</b> اللي تكتبه بالغرفة (أي اسم أو لقب تختاره).</li><li><b>بيانات اللعب</b> مثل إجاباتك، اختياراتك، أسعارك، تصاميمك وتصويتك داخل الغرفة.</li><li><b>ملاحظاتك</b> إذا اخترت ترسلها من زر الملاحظات بآخر اللعبة.</li><li><b>إعدادات على جهازك بس</b> مثل اللغة، الصوت، الوضع الصباحي/المسائي، وإحصائياتك وشاراتك. هذي تنحفظ بتلفونك وما توصلنا.</li></ul><h2>وين تنحفظ؟</h2><p>بيانات الحساب تنحفظ في Google Firebase Authentication، وبيانات الغرف تنحفظ في قاعدة بيانات Google Firebase (خوادم بأوروبا) عشان كل اللاعبين بنفس الغرفة يشوفون اللعبة مع بعض. نستخدمها بس لتشغيل اللعبة وتحسينها.</p><h2>شنو اللي ما نسويه؟</h2><ul><li>ما نبيع ولا نشارك بياناتك مع أحد.</li><li>ما نعرض إعلانات ولا نستخدم أدوات تتبع أو تحليلات إعلانية.</li><li>ما نطلب إذن الكاميرا ولا الموقع ولا جهات الاتصال.</li></ul><h2>خدمات خارجية</h2><p>اللعبة تستخدم Google Firebase لقاعدة البيانات، وخطوط Google Fonts. هذي الخدمات ممكن تشوف معلومات تقنية عادية مثل عنوان الـIP وقت الاتصال، حسب سياساتها.</p><h2>الأطفال</h2><p>أقنعني لعبة جماعية للعائلة والأصدقاء، وما نجمع معلومات شخصية غير حساب منشئ الغرفة. ننصح إن الصغار يلعبون مع الكبار.</p><h2>حذف البيانات</h2><p>تقدر تحذف حسابك نهائياً بأي وقت من <b>الإعدادات ← حذف الحساب</b>، وينحذف اسمك وإيميلك من عندنا. وتقدر تمسح إعداداتك وإحصائياتك من جهازك بمسح بيانات الموقع أو حذف التطبيق. ولو تبي نحذف ملاحظة أرسلتها أو بيانات غرفة، تواصل معنا.</p><h2>التغييرات</h2><p>لو غيرنا هالسياسة بنحدّث التاريخ فوق.</p><div class=\"box\"><b>للتواصل:</b> [اكتب هني إيميل التواصل قبل النشر]</div>"}, "en": {"t": "Privacy Policy", "u": "Last updated: 27 November 2026", "f": "© AQNINI — idea and development by Abdulrahman Al-Fahad. All rights reserved.<br><a href=\"privacy.html?lang=en\">Privacy Policy</a> · <a href=\"terms.html?lang=en\">Terms of Use</a>", "b": "<div class=\"box\">In short: whoever creates a room signs in with Google or email, and players joining through an invite link need no account. We do not ask for your number or location, there are no ads or tracking, and you can delete your account anytime from Settings.</div><h2>What we use</h2><ul><li><b>Account data</b> if you sign in: your name and email (and photo if you use Google), to identify you and protect your rooms. We never see your password; Google Firebase handles it securely.</li><li><b>Player name</b> you type in a room (any name or nickname you like).</li><li><b>Game data</b> such as your answers, choices, prices, designs and votes inside the room.</li><li><b>Your feedback</b> if you choose to send it from the feedback button at the end of a game.</li><li><b>On-device settings only</b> such as language, sound, light/dark mode, and your stats and badges. These stay on your phone and never reach us.</li></ul><h2>Where it is stored</h2><p>Account data is stored in Google Firebase Authentication, and room data in the Google Firebase database (servers in Europe) so everyone in the same room sees the game together. It is used only to run and improve the game.</p><h2>What we never do</h2><ul><li>We do not sell or share your data.</li><li>We show no ads and use no tracking or ad analytics.</li><li>We do not ask for camera, location or contacts permission.</li></ul><h2>Third-party services</h2><p>The game uses Google Firebase for its database and Google Fonts for typefaces. These services may see standard technical information such as your IP address when connecting, under their own policies.</p><h2>Children</h2><p>AQNINI is a group game for families and friends and collects no personal information beyond the host's account. We recommend young children play with adults.</p><h2>Deleting data</h2><p>You can permanently delete your account anytime from <b>Settings → Delete account</b>, which removes your name and email. You can clear your settings and stats by clearing the site data or deleting the app. To have a feedback message or room data deleted, contact us.</p><h2>Changes</h2><p>If we change this policy we will update the date above.</p><div class=\"box\"><b>Contact:</b> [add the contact email here before publishing]</div>"}};
var L=/[?&]lang=en/.test(location.search)?'en':'ar';
